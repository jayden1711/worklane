# Copy to wrangler.toml, create the KV namespace (`wrangler kv namespace create INTAKE`), put its id below,
# set the secrets, then `wrangler deploy`. See docs/intake.md, "What needs the owner's hands".
#   wrangler secret put TWILIO_AUTH_TOKEN
#   wrangler secret put RELAY_SECRET
name = "intake-relay"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "INTAKE"
id = "<your KV namespace id>"

[vars]
PREFIXES = '["bug:"]'
