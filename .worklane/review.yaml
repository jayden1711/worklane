# Risk-based review levels, computed by code. The highest matching rule wins;
# a failed or uncertain evaluator verdict bumps the level up one.
version: 1
categories:
  # The engine itself, its setup scripts and templates, CI, dependencies and this
  # folder: always the owner's call (owner's choice: broad).
  engine: [src/**, scripts/**, templates/**, .github/**, package.json, package-lock.json, .worklane/**]
  # Whose signed tag release.yml stages on npm, and the check that enforces it: the owner's alone. Also locked in
  # code (src/review.ts self-modification, "who may sign a release"), so dropping it here changes nothing.
  release-signing: [.github/release-signers, scripts/verify-release-tag*]
  # The guards' own tests, the denylist and secret-scan config, the git hooks and the release and design rules. Locked in
  # code since v0.5.3 (src/review.ts self-modification); listed here so an engine that predates it (it reads this file
  # from main) already holds them. A tests-only or docs-only change to any of them is otherwise L0 and merges itself.
  engine-guards:
    - test/review.test.ts
    - test/merge-policy.test.ts
    - test/guardrails.test.ts
    - test/push-check.test.ts
    - test/push-guard.test.ts
    - test/push-hook-guard.test.ts
    - test/push-gate.test.ts
    - test/push-gate-hook.test.ts
    - test/main-watch.test.ts
    - test/main-watch-coordinator.test.ts
    - test/denylist.test.ts
    - test/dco.test.ts
    - test/package-files.test.ts
    - test/managed-apps.test.ts
    # Listed here only, not locked in code: the tests' own machine (every test runs inside it), the check that engine
    # code never writes a slot-directory file in place, and the tests that assert the agents' tool guard denies a call.
    - test/isolate.ts
    - test/isolate.test.ts
    - test/slot-dir-writes.test.ts
    - test/eval-roles.test.ts
    - test/research.test.ts
    - test/discord-chat.test.ts
    - test/experiments-coordinator.test.ts
    - test/intake-coordinator.test.ts
    - test/domain-runner.test.ts
    - .denylist*
    - .gitleaks*
    - .githooks/**
    - docs/releasing.md
    - docs/design.md
    - docs/design/**  # the architecture docs (#698): listed here only, not locked in code
levels:
  L0_auto:      { when: [docs-only, tests-only, comments, copy], max_lines: 200 }
  L1_evaluator: { when: [ui, app-non-money], max_lines: 400, max_files: 10 }
  L2_notify:    { when: [app-non-money-large, dependency, test-machinery] }
  # self-modification is built in and locked (src/review.ts): listed here so this file says it, not to define it.
  L3_human:     { when: [engine, release-signing, engine-guards, self-modification, money-path, migration, auth, secrets, deploy-config, release-config, harness-config, guardrail-config, deletes-data], over_lines: 800 }

# Which ready PRs the harness merges itself, where the instance policy's auto_merge is on.
# Everything under `engine` waits for the owner; web/, docs/, test/ and the rest may merge
# under the normal rules (evaluator confidence high, no doubt signals, within the limits).
merge:
  auto: true
  max_lines: 800
  max_files: 20
  wait_categories: [engine, release-signing, engine-guards, self-modification]

# Agent PRs over this many changed lines (lockfiles and generated files not counted) go back to the worker to be
# split, unless mechanical (only renames, moves and formatting). src/pr-rules.ts.
max_pr_lines: 600
# Docs-only PRs (only *.md and docs/**): the harness's merge call waits on just these light checks. GitHub's
# ruleset still requires every required check before the merge goes through.
docs_only_checks: [denylist, dco, push-gate, scan]
