# Project settings. Validated at startup; unknown keys are errors.
version: 1
project:
  name: worklane
  repo: jayden1711/worklane
  default_branch: main
mode: local
backlog: github
runner: local
agent_runtime:
  kind: cli
  max_concurrency: 2        # this harness's cap; the instance policy and the machine-wide slot cap still apply
  run_windows: []
land_mode: pr
# The jobs that gate a merge, as GitHub names them (ci.yml and gitleaks.yml).
# Exactly the checks every pull request runs (the main ruleset requires the same): dco runs on pull requests
# only; scan is gitleaks.yml's job. The slow jobs (ci-slow.yml: bootstrap, real systemd, real users) gate the engine
# updater on main instead, run there in batches (ci-batch.yml); a PR runs them only when it touches what they
# test, or with the full-ci label.
required_checks:
  - test (ubuntu-latest, 22)
  - test (ubuntu-latest, 24)
  - desktop
  - agentshield
  - push-gate
  - denylist
  - dco
  - scan
  - new-deps
# #727: each required check pinned to the workflow file that posts it (doctor's block, read 2026-10-19 against
# main's tip 0b294b53): a same-name check from any other App or workflow counts as missing.
required_check_sources:
  "test (ubuntu-latest, 22)": { workflow: ".github/workflows/ci.yml" }  # confirmed: its run on main's tip 0b294b53 is from .github/workflows/ci.yml
  "test (ubuntu-latest, 24)": { workflow: ".github/workflows/ci.yml" }  # confirmed: its run on main's tip 0b294b53 is from .github/workflows/ci.yml
  "desktop": { workflow: ".github/workflows/ci.yml" }  # confirmed: its run on main's tip 0b294b53 is from .github/workflows/ci.yml
  "agentshield": { workflow: ".github/workflows/ci.yml" }  # confirmed: its run on main's tip 0b294b53 is from .github/workflows/ci.yml
  "push-gate": { workflow: ".github/workflows/ci.yml" }  # confirmed: its run on main's tip 0b294b53 is from .github/workflows/ci.yml
  "denylist": { workflow: ".github/workflows/ci.yml" }  # confirmed: its run on main's tip 0b294b53 is from .github/workflows/ci.yml
  "dco": { workflow: ".github/workflows/ci.yml" }  # confirmed: its run on main's tip 0b294b53 is from .github/workflows/ci.yml
  "scan": { workflow: ".github/workflows/gitleaks.yml" }  # confirmed: its run on main's tip 0b294b53 is from .github/workflows/gitleaks.yml
  "new-deps": { workflow: ".github/workflows/new-deps.yml" }  # from the workflow files only: main's tip 0b294b53 has no run of it
os: auto
owners:
  default: jayden1711
  writers: [jayden1711]
  areas: []
reports:
  times: ["08:00", "18:00"]
  to: [jayden1711]
