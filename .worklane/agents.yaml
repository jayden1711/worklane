# Roster. Workers build; the evaluator independently reproduces and judges. Models are aliases or full IDs.
daily_budget_usd: 40        # usage guard on estimated cost; the instance policy's budget must allow it
roles:
  workers:   { enabled: true, count: 4, max: 4, model: sonnet, hard_issues_model: opus }
  evaluator: { enabled: true, model: opus }
  # When a required check fails on a PR the harness opened, a fix run on that branch. Off: the owner is asked.
  ci_repair: { enabled: false, model: sonnet, max_fixes_per_pr: 2 }
# A change to the agents' own instructions is evaluated before it lands (see the template's notes).
instruction_evals: { enabled: true, cap_usd: 5, samples: 1 }
eval_routing: { cheap_model: sonnet, cheap_levels: [L0], escalate: true }
