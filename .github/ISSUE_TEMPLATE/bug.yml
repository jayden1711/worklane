name: Bug report
description: Something behaves differently from the docs or your expectation
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal config and commands. Redact secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (`worklane --version`) and OS
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant event log or doctor output
      render: text
