name: ci slow
# The slow checks: the bootstrap on each OS, the test-run sandbox and add-project on real systemd, and the Claude
# sign-in probe with real users. Not on every push to main (ci.yml runs the fast checks there):
#   - on main, in batches: ci-batch.yml starts this workflow (workflow_dispatch on main, job=all) on main's newest
#     commit at most every 30 minutes, when that commit hasn't had a batch. A workflow_dispatch run's check runs
#     land on the commit it ran on, under the job names below, which the engine updater requires
#     (UPDATE_DEFAULT_CHECKS in scripts/setup/lib.sh; test/update-checks.test.ts keeps them in step). So the
#     updater installs only a batched commit: a main commit the batch skipped never gets these checks.
#   - one bisect step: when a batch goes red, ci-batch.yml runs the failing job on one older main commit at a time
#     (job=<key>, sha=<commit>), dispatched on a ci-bisect/<commit> branch so the check runs land on that commit,
#     not on main's tip.
#   - on a pull request that touches what they exercise, or one labelled full-ci (the scope job decides).
on:
  pull_request:
    # labeled: adding full-ci to a PR reruns it with every slow job.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      job:
        description: The slow job to run (all of them for a batch)
        type: choice
        options: [all, bootstrap, bootstrap-windows, testrun-real-systemd, add-project-real-systemd, auth-probe-real-users]
        default: all
      sha:
        description: The commit to test; empty for the commit the run is on. A bisect step names it, and the run refuses any other.
        type: string
        default: ''
# One batch at a time on main (a second waits; ci-batch.yml never queues a third), and one per bisect branch. A new
# push to a PR cancels that PR's run in progress; nothing else is ever cancelled (the updater refuses a commit with a
# cancelled check).
concurrency:
  group: ci-slow-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    # Which slow jobs this run runs (scripts/ci/slow-jobs.sh): on a dispatch, the one asked for or all of them; on a PR,
    # those whose paths it touches.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          JOB: ${{ inputs.job }}
          WANT_SHA: ${{ inputs.sha }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/slow-jobs.sh

  bootstrap:
    # A fresh install in local mode, end to end (scripts/bootstrap.sh, then `worklane init --mode local`): on a clean
    # runner, this commit's engine packed as a release ships it, set up in a scratch copy of examples/basic, through
    # init's checklist and ending at doctor green, which shows that checklist and what local mode can't do; run twice,
    # the second changing nothing; on macOS, the coordinator as a launchd service (worklane up / down); then the demo
    # from the installed package. No GitHub: stand-in gh and claude (scripts/ci/stand-ins), and no token. macOS is
    # not a required check (the owner decides). Batched on main, and in the updater's list.
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' bootstrap ') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Mac runner's own Node is older than 22.13; the bootstrap would take it from Homebrew, which is slow here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'macOS'
        with:
          node-version: '24'
          cache: npm
      - name: pack this commit's engine (dist/ and the web UI built, as in a release)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build && npm run build:web
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          ls "$RUNNER_TEMP"/*.tgz
      - name: the Docker image (the same bootstrap, with the pinned release engine)
        if: runner.os == 'Linux'
        run: |
          docker build -t worklane-trial .
          docker run --rm worklane-trial worklane --version
          docker run --rm worklane-trial sh -c 'gitleaks version && claude --version && node --version'
      - name: no GitHub from here on (a stand-in gh, signed in, that reaches nothing; a stand-in claude, signed in)
        run: echo "$GITHUB_WORKSPACE/scripts/ci/stand-ins" >> "$GITHUB_PATH"
      - name: bootstrap in local mode, three times, each ending with the same one wizard URL that answers
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          ex="$RUNNER_TEMP/example"
          cp -r examples/basic "$ex" && git -C "$ex" init -q
          git -C "$ex" remote add origin https://github.com/example-org/example-shop.git
          tgz="$(ls "$RUNNER_TEMP"/*.tgz)"
          bash scripts/bootstrap.sh --dry-run --mode local --engine "$tgz" "$ex"
          # Unattended (--yes): init's checklist here, then the dashboard and its URL.
          bash scripts/bootstrap.sh --mode local --yes --engine "$tgz" "$ex" | tee "$RUNNER_TEMP/first.log"
          # Each step's result line ("   done: ...") can follow what the step printed doing it: count them, not neighbours.
          [ "$(grep -cE '^   done: ' "$RUNNER_TEMP/first.log")" = 5 ] || { echo "not every required step was done" >&2; exit 1; }
          grep -q 'all 6 steps done or skipped' "$RUNNER_TEMP/first.log"
          grep -q 'started in the background' "$RUNNER_TEMP/first.log"
          kf="$(sed -n 's/^  the page asks once for the dashboard key: it is in \(.*\) (only you can read it)$/\1/p' "$RUNNER_TEMP/first.log")"
          [ "$(ls -l "$kf" | cut -c1-10)" = '-rw-------' ] || { ls -l "$kf"; echo "the key file isn't 0600" >&2; exit 1; }
          u1="$(bash scripts/ci/wizard-url.sh "$RUNNER_TEMP/first.log" "$kf" /api/first-run | tail -n 1)"
          # The second run, the one command as a person runs it: no --mode and no terminal (local, said so); no checklist
          # in the terminal, nothing installed, the dashboard already running: the same URL.
          bash scripts/bootstrap.sh --engine "$tgz" "$ex" < /dev/null | tee "$RUNNER_TEMP/second.log"
          if grep -E 'added [0-9]+ package|would download|installed [a-z]+ [0-9]|kept .worklane/|init --mode|started in the background' "$RUNNER_TEMP/second.log"; then echo "the second run did something again" >&2; exit 1; fi
          grep -q 'no --mode, and no terminal to ask on: local mode' "$RUNNER_TEMP/second.log"
          grep -q 'already running; nothing changed' "$RUNNER_TEMP/second.log"
          u2="$(bash scripts/ci/wizard-url.sh "$RUNNER_TEMP/second.log" "$kf" /api/first-run | tail -n 1)"
          # The dashboard stopped (a reboot, say): the third run, unattended from a config file (the wizard's steps as
          # key=value lines), redoes no step, starts the dashboard again, and ends at the same URL.
          pkill -f 'dashboard --service --root' && sleep 2
          printf 'mode=local\n' > "$RUNNER_TEMP/setup.conf"
          bash scripts/bootstrap.sh --config "$RUNNER_TEMP/setup.conf" --engine "$tgz" "$ex" < /dev/null | tee "$RUNNER_TEMP/third.log"
          grep -q 'resuming: 6 of 6 steps done earlier' "$RUNNER_TEMP/third.log"
          grep -q 'started in the background' "$RUNNER_TEMP/third.log"
          u3="$(bash scripts/ci/wizard-url.sh "$RUNNER_TEMP/third.log" "$kf" /api/first-run | tail -n 1)"
          [ "$u1" = "$u2" ] && [ "$u2" = "$u3" ] || { echo "the URL changed: $u1 / $u2 / $u3" >&2; exit 1; }
          echo "every run ended with $u1"
      - name: doctor shows the checklist, and what local mode can't do
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          worklane doctor --root "$RUNNER_TEMP/example" | tee "$RUNNER_TEMP/doctor.log"
          for id in tools claude github repo-config protection discord; do grep -Eq "^ok +setup $id: " "$RUNNER_TEMP/doctor.log"; done
          grep -Eq '^off +not in local mode: separate OS users: ' "$RUNNER_TEMP/doctor.log"
          grep -Eq '^off +not in local mode: root-run add-project: ' "$RUNNER_TEMP/doctor.log"
          # As a server would see it (its steps aren't done here, so it fails; only the list matters): nothing missing.
          worklane doctor --root "$RUNNER_TEMP/example" --mode server > "$RUNNER_TEMP/doctor-server.log" || true
          grep -q '^FAIL  setup github: ' "$RUNNER_TEMP/doctor-server.log"
          if grep -E '^off ' "$RUNNER_TEMP/doctor-server.log"; then echo "server mode lists something it can't do" >&2; exit 1; fi
      - name: the coordinator as a launchd service (worklane up, then down)
        if: runner.os == 'macOS'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          label=dev.worklane.example-shop
          plist="$HOME/Library/LaunchAgents/$label.plist"
          worklane up --root "$RUNNER_TEMP/example"
          test -f "$plist"
          launchctl print "gui/$(id -u)/$label" | head -n 20
          worklane down --root "$RUNNER_TEMP/example"
          if [ -e "$plist" ]; then echo "down left $plist" >&2; exit 1; fi
          if launchctl print "gui/$(id -u)/$label" > /dev/null 2>&1; then echo "down left $label loaded" >&2; exit 1; fi
      - name: the demo, from the installed package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          worklane --version
          worklane demo "$RUNNER_TEMP/demo"

  bootstrap-windows:
    # Windows' documented route, local mode inside WSL2 (Ubuntu 24.04, systemd on), end to end as the bootstrap job
    # runs it: this commit's engine packed inside the distro, then, as a plain user, the bootstrap
    # (which fetches its own Node; nothing of ours is preinstalled), init's checklist, doctor green and naming the OS as
    # WSL, `worklane up` / `down` as a systemd --user unit, and the demo. No GitHub: the same stand-ins. Not a
    # required check on PRs; batched on main, and one of the updater's checks. WSL setup: Vampire/setup-wsl
    # (Apache-2.0), used as an action, nothing copied. #214 (closed) explored the Windows side.
    name: bootstrap (windows-wsl)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' bootstrap-windows ') }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WSL2, Ubuntu 24.04, systemd on
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: xz-utils
          wsl-conf: |
            [boot]
            systemd=true
      - name: a plain user to install as (local mode runs as you), with a systemd --user manager
        run: |
          [ "$(ps -p 1 -o comm=)" = systemd ] || { echo "PID 1 is $(ps -p 1 -o comm=), not systemd" >&2; exit 1; }
          uname -r; grep -i microsoft /proc/version
          useradd -m -s /bin/bash wl
          loginctl enable-linger wl
          for _ in $(seq 30); do systemctl is-active --quiet user@"$(id -u wl)".service && break; sleep 1; done
          systemctl is-active user@"$(id -u wl)".service
      - name: pack this commit's engine inside WSL (dist/ and the web UI built, as in a release), with a Node that's gone after
        run: |
          ws="$(wslpath -u '${{ github.workspace }}')" home="$(getent passwd wl | cut -d: -f6)"
          # The bootstrap's own pinned Node, in a scratch place off every PATH, removed once the tarball is made.
          v="$(sed -n 's/^NODE_VERSION=//p' "$ws/scripts/bootstrap.sh")"
          sum="$(sed -n 's/^NODE_SHA256_LINUX_X64=//p' "$ws/scripts/bootstrap.sh")"
          curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/$v/node-$v-linux-x64.tar.xz"
          echo "$sum  /tmp/node.tar.xz" | sha256sum -c -
          mkdir -p /opt/pack-node && tar -xJf /tmp/node.tar.xz -C /opt/pack-node --strip-components 1
          mkdir -p /root/src && tar -C "$ws" --exclude=./.git -cf - . | tar -C /root/src -xf -
          (
            export PATH="/opt/pack-node/bin:$PATH"
            cd /root/src
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build && npm run build:web
            npm pack --pack-destination "$home" > /dev/null
          )
          rm -rf /opt/pack-node /tmp/node.tar.xz /root/src
          chown wl: "$home"/*.tgz && ls -l "$home"/*.tgz
      - name: no GitHub from here on (a stand-in gh, signed in, that reaches nothing; a stand-in claude, signed in)
        run: |
          ws="$(wslpath -u '${{ github.workspace }}')" h="$(getent passwd wl | cut -d: -f6)" uid="$(id -u wl)"
          install -d -o wl -g wl "$h/stand-ins" && install -o wl -g wl -m 0755 "$ws"/scripts/ci/stand-ins/* "$h/stand-ins/"
          # What every later step sources first: it stops the step unless it runs as wl.
          {
            echo '[ "$(id -un)" = wl ] || { echo "this step runs as $(id -un), not wl" >&2; exit 1; }'
            echo "H=$h WS=$ws"
            echo "export PATH=\"$h/stand-ins:$h/.local/bin:\$PATH\""
            echo "export XDG_RUNTIME_DIR=/run/user/$uid DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus"
            echo 'echo "as $(id -un), HOME=$HOME"'
          } > /etc/wl-ci.env
          cat /etc/wl-ci.env
      - name: the next steps run as that user (a wsl-sudo shell)
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-shell-command: sudo -iu wl bash -euo pipefail
      - name: as wl, no Node yet (the bootstrap fetches its own)
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          if command -v node; then echo "node is already here; the bootstrap must fetch its own" >&2; exit 1; fi
      - name: bootstrap in local mode, twice, each ending with the same one wizard URL that answers
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          ex="$H/example"
          cp -r "$WS/examples/basic" "$ex" && git -C "$ex" init -q
          git -C "$ex" remote add origin https://github.com/example-org/example-shop.git
          tgz="$(ls "$H"/*.tgz)"
          bash "$WS/scripts/bootstrap.sh" --dry-run --mode local --engine "$tgz" "$ex"
          bash "$WS/scripts/bootstrap.sh" --mode local --yes --engine "$tgz" "$ex" | tee "$H/first.log"
          [ "$(grep -cE '^   done: ' "$H/first.log")" = 5 ] || { echo "not every required step was done" >&2; exit 1; }
          grep -q 'all 6 steps done or skipped' "$H/first.log"
          kf="$(sed -n 's/^  the page asks once for the dashboard key: it is in \(.*\) (only you can read it)$/\1/p' "$H/first.log")"
          [ "$(stat -c %a "$kf")" = 600 ]
          u1="$(bash "$WS/scripts/ci/wizard-url.sh" "$H/first.log" "$kf" /api/first-run | tail -n 1)"
          bash "$WS/scripts/bootstrap.sh" --engine "$tgz" "$ex" < /dev/null | tee "$H/second.log"
          if grep -E 'added [0-9]+ package|would download|installed [a-z]+ [0-9]|kept .worklane/|init --mode|started in the background' "$H/second.log"; then echo "the second run did something again" >&2; exit 1; fi
          grep -q 'no --mode, and no terminal to ask on: local mode' "$H/second.log"
          grep -q 'already running; nothing changed' "$H/second.log"
          u2="$(bash "$WS/scripts/ci/wizard-url.sh" "$H/second.log" "$kf" /api/first-run | tail -n 1)"
          [ "$u1" = "$u2" ] || { echo "the URL changed: $u1 / $u2" >&2; exit 1; }
          pkill -f 'dashboard --service --root' || true
      - name: doctor shows the checklist, the OS as WSL, and what local mode can't do
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          worklane doctor --root "$H/example" | tee "$H/doctor.log"
          for id in tools claude github repo-config protection discord; do grep -Eq "^ok +setup $id: " "$H/doctor.log"; done
          grep -Eq '^ok +os: windows-wsl$' "$H/doctor.log"
          grep -Eq '^off +not in local mode: separate OS users: ' "$H/doctor.log"
          grep -Eq '^off +not in local mode: root-run add-project: ' "$H/doctor.log"
      - name: the coordinator as a systemd --user service (worklane up, then down)
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          label=dev.worklane.example-shop
          unit="$H/.config/systemd/user/$label.service"
          worklane up --root "$H/example"
          test -f "$unit"
          systemctl --user is-enabled "$label.service"
          systemctl --user status "$label.service" --no-pager | head -n 20 || true
          worklane down --root "$H/example"
          if [ -e "$unit" ]; then echo "down left $unit" >&2; exit 1; fi
          if systemctl --user is-enabled "$label.service" > /dev/null 2>&1; then echo "down left $label enabled" >&2; exit 1; fi
      - name: the demo, from the installed package
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          worklane --version
          worklane demo "$H/demo"

  testrun-real-systemd:
    # The test-run sandbox on a real host, no mocks: test-user.sh install (rootless Docker, the helper, its check),
    # then the coordinator's own sandbox host, as the coordinator user through its real sudoers rule, against real
    # systemd-run (the other jobs stand in for sudo and the helper). scripts/ci/testrun-real-systemd.mjs has the
    # assertions; its log shows systemd-run's raw summary, the text test/fixtures/systemd-run-255/ holds.
    name: test-run sandbox (real systemd)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' testrun-real-systemd ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash # -eo pipefail: a failed install isn't hidden by its tee
    env:
      # The second instance's name is as long as the helper takes (21), so a run's paths are the longest a host has.
      I2: ci2-sandbox-long-name
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - name: the host
        run: |
          systemd-run --version | head -1
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          nproc
      - name: a coordinator user and the full-run lock (what instance.sh and the machine script make)
        run: |
          # Two instances, so each test user's check also proves it can't reach the other's state.
          for u in wl-ci "wl-$I2"; do
            sudo useradd --create-home --shell /bin/bash "$u"
            sudo chmod 0750 "$(getent passwd "$u" | cut -d: -f6)"
          done
          sudo install -o root -g root -m 0644 /dev/null /run/lock/worklane-full-run.lock
      - name: a coordinator checkout's pre-push hook refuses the default branch (checkout.sh's hook step)
        run: |
          # A remote with a main, cloned as checkout.sh clones (origin/HEAD set), then the hook step checkout.sh runs.
          t="$(mktemp -d)"
          id=(-c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false)
          git init -q --bare -b main "$t/remote.git"
          git init -q -b main "$t/seed" && git -C "$t/seed" "${id[@]}" commit -q --allow-empty -m init && git -C "$t/seed" push -q "$t/remote.git" main
          git clone -q "$t/remote.git" "$t/checkout"
          git -C "$t/checkout" "${id[@]}" commit -q --allow-empty -m change
          (cd "$t/checkout" && node "$GITHUB_WORKSPACE/dist/src/cli.js" install --root . --git-hooks-only)
          sudo chown -R root:root "$t/checkout/.git/hooks" && sudo chmod 0755 "$t/checkout/.git/hooks"
          if [ -w "$t/checkout/.git/hooks/pre-push" ]; then echo "the hook is writable by the checkout's user" >&2; exit 1; fi
          for spec in HEAD:main HEAD:refs/heads/main +HEAD:main; do
            if git -C "$t/checkout" push origin "$spec" 2> "$RUNNER_TEMP/push.log"; then echo "pushed $spec through the hook" >&2; exit 1; fi
            grep -q 'refusing to push refs/heads/main, the default branch' "$RUNNER_TEMP/push.log"
          done
          [ "$(git -C "$t/remote.git" rev-parse main)" = "$(git -C "$t/seed" rev-parse HEAD)" ] || { echo "main moved" >&2; exit 1; }
          git -C "$t/checkout" push -q origin HEAD:refs/heads/worklane/issue-1
          echo "main refused, a task branch pushed"
      - name: test-user.sh install, in full
        run: |
          n="$(nproc)"
          sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/install.log"
          tail -n 5 "$RUNNER_TEMP/install.log" | grep -qx 'OK: all checks passed'
          # An older install's Docker unit, still running: install must restart it into the new layout by itself.
          u=/etc/systemd/system/worklane-test-ci-docker.service
          sudo sed -i -e '/^DelegateSubgroup=/d' -e 's/^Delegate=.*/Delegate=yes/' "$u"
          sudo systemctl daemon-reload && sudo systemctl restart worklane-test-ci-docker.service
          if sudo bash scripts/setup/test-user.sh check ci > "$RUNNER_TEMP/old.log"; then echo "check passed on the old layout" >&2; exit 1; fi
          grep -q '^FAIL Docker' "$RUNNER_TEMP/old.log"
          # With a run in progress, install refuses to restart Docker under it, and says why.
          sudo sed -i -e '/^DelegateSubgroup=/d' "$u"; sudo install -d -o root -g root -m 0700 /var/lib/worklane-test/ci/runs/fast-inprogress
          if sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G > "$RUNNER_TEMP/busy.log" 2>&1; then echo "install restarted Docker under a run" >&2; exit 1; fi
          grep -q 'test runs of ci are in progress' "$RUNNER_TEMP/busy.log"
          sudo rmdir /var/lib/worklane-test/ci/runs/fast-inprogress
          # No run in progress: the re-run restarts Docker and check passes, with no manual restart.
          sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/reinstall.log"
          grep -q '^restarted worklane-test-ci-docker.service' "$RUNNER_TEMP/reinstall.log"
          tail -n 5 "$RUNNER_TEMP/reinstall.log" | grep -qx 'OK: all checks passed'
          # A second instance's test user, then both checks again: each must be shut out of the other's state.
          sudo bash scripts/setup/test-user.sh install "$I2" --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/install2.log"
          tail -n 5 "$RUNNER_TEMP/install2.log" | grep -qx 'OK: all checks passed'
          for i in ci "$I2"; do
            sudo bash scripts/setup/test-user.sh check "$i" | tee "$RUNNER_TEMP/check-$i.log"
            grep -q "PASS wl-test-$i can't reach /var/lib/worklane-test/$([ "$i" = ci ] && echo "$I2" || echo ci)" "$RUNNER_TEMP/check-$i.log"
            tail -n 1 "$RUNNER_TEMP/check-$i.log" | grep -qx 'OK: all checks passed'
          done
      - name: systemd-run leaves a command's ${...} to bash, on this systemd (the flag) and as an older one needs it ($$)
        run: |
          # The helper's own systemd_command, against real systemd-run. Unescaped, systemd blanks a shell-only ${x}
          # (the bug); with the version this host has, and with the $$ escapes a systemd older than 254 gets, bash sees it.
          eval "$(sed -n '/^systemd_command() {/,/^}/p' scripts/machine/worklane-testrun.sh)"
          die() { echo "$*" >&2; exit 2; }
          v="$(systemd-run --version | sed -n '1s/^systemd \([0-9][0-9]*\).*/\1/p')"
          echo "systemd $v"
          cmd='x=hello; echo "got ${x} ${x%lo} $x"'
          run() { local out flag c; out="$(systemd_command "$1" "$cmd")"; flag="${out%%$'\n'*}"; c="${out#*$'\n'}"; sudo systemd-run --wait --pipe --quiet ${flag:+"$flag"} /bin/bash -c "$c"; }
          bug="$(sudo systemd-run --wait --pipe --quiet /bin/bash -c "$cmd")"
          echo "unescaped, as before: $bug"
          [ "$bug" != 'got hello hel hello' ] || { echo "systemd didn't expand it: the bug can't be shown here" >&2; exit 1; }
          for ver in "$v" 253; do
            out="$(run "$ver")"
            echo "as systemd $ver gets it: $out"
            [ "$out" = 'got hello hel hello' ]
          done
      - name: an outdated helper is replaced by the updater (and by update-helper), as root, with sudoers unchanged
        run: |
          H=/usr/local/libexec/worklane-testrun
          need="$(sed -n 's/^PROTOCOL=\([0-9][0-9]*\)$/\1/p' scripts/machine/worklane-testrun.sh)"
          sudo sha256sum /etc/sudoers.d/worklane-test-ci "/etc/sudoers.d/worklane-test-$I2" > "$RUNNER_TEMP/sudoers.before"
          old() {
            # The helper as a machine had it before db-start took max_connections: no version command.
            sudo install -o root -g root -m 0755 test/fixtures/testrun-helper-protocol-1.sh "$H"
            if out="$(sudo -u wl-ci sudo -n "$H" ci version 2>&1)"; then echo "the old helper answered version: $out" >&2; exit 1; fi
            grep -q 'unknown command version' <<<"$out"
            echo "old helper in place; as wl-ci, version says: $out"
          }
          in_step() {
            sudo cmp "$H" scripts/machine/worklane-testrun.sh
            [ "$(stat -c '%U:%G %a' "$H")" = 'root:root 755' ] || { stat -c '%U:%G %a' "$H" >&2; exit 1; }
            [ "$(sudo -u wl-ci sudo -n "$H" ci version)" = "$need" ]
            sudo sha256sum -c "$RUNNER_TEMP/sudoers.before"
            if sudo ls -A "$(dirname "$H")" | grep -q '^\.'; then echo "a temp file was left" >&2; sudo ls -la "$(dirname "$H")" >&2; exit 1; fi
          }
          # The updater's own function, as root, from an engine tree as it installs one: root-owned, under /opt.
          old
          E="$(sudo mktemp -d /opt/wl-engine-XXXXXX)"
          sudo cp -r scripts "$E/"
          sudo chown -R root:root "$E"
          sync_helpers() { sudo "$(command -v node)" -e 'console.log(JSON.stringify(require(process.argv[1]).syncHelpers(process.argv[2])))' "$PWD/scripts/machine/worklane-update.cjs" "$E"; }
          sync_helpers | tee "$RUNNER_TEMP/sync1.json"
          jq -e --arg h "$H" 'map(select(.path == $h))[0].state == "updated"' "$RUNNER_TEMP/sync1.json"
          in_step
          sync_helpers | tee "$RUNNER_TEMP/sync2.json"
          jq -e --arg h "$H" 'map(select(.path == $h))[0].state == "same"' "$RUNNER_TEMP/sync2.json"
          # And the admin's fix the engine names: update-helper, nothing else.
          old
          sudo bash scripts/setup/test-user.sh update-helper | tee "$RUNNER_TEMP/update-helper.log"
          grep -q "^installed $H (protocol $need)" "$RUNNER_TEMP/update-helper.log"
          in_step
          sudo bash scripts/setup/test-user.sh check ci | tail -n 1 | grep -qx 'OK: all checks passed'
          sudo rm -rf "$E"
      - name: a sandboxed run with the longest instance name and run id binds Chrome's SingletonSocket under its TMPDIR, and Chrome runs
        run: |
          # Regression: with TMPDIR under the run's directory, Chrome died with "Socket path too long". The run's TMPDIR is
          # /tmp/wlt-<8 hex>, the test user's own, 0700; a socket where Chrome puts one binds, and headless Chrome runs.
          H=/usr/local/libexec/worklane-testrun
          id="fast-$(printf 'c%.0s' $(seq 43))"
          [ "${#I2}" -eq 21 ] && [ "${#id}" -eq 48 ]
          as2() { sudo -u "wl-$I2" sudo -n "$H" "$I2" "$@"; }
          r="$(mktemp -d)"
          id_=(-c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false)
          git init -q "$r" && date > "$r/f" && git -C "$r" add f && git -C "$r" "${id_[@]}" commit -q -m probe
          for x in head base; do git -C "$r" update-ref "refs/worklane/test-run/$id/$x" HEAD; done
          git -C "$r" bundle create --quiet "$r/b" "refs/worklane/test-run/$id/head" "refs/worklane/test-run/$id/base"
          sha="$(git -C "$r" rev-parse HEAD)"
          as2 create "$id" main "refs/worklane/test-run/$id/head" "refs/worklane/test-run/$id/base" "$sha" "$sha" < "$r/b"
          t="/tmp/wlt-$(printf '%s/%s' "$I2" "$id" | sha256sum | cut -c1-8)"
          echo "the run's TMPDIR on the host: $t, $(sudo stat -c '%U %a' "$t")"
          [ "$(sudo stat -c '%U %a' "$t")" = "wl-test-$I2 700" ]
          # Where Chrome binds: mkdtemp under TMPDIR, then SingletonSocket in it. And, for contrast, the old place.
          probe='import os, socket, tempfile
          d = tempfile.mkdtemp(prefix="org.chromium.Chromium.")
          p = os.path.join(d, "SingletonSocket")
          s = socket.socket(socket.AF_UNIX); s.bind(p); s.close()
          print("TMPDIR", os.environ["TMPDIR"], "TMP", os.environ["TMP"], "TEMP", os.environ["TEMP"])
          print("bound", p, len(p.encode()), "bytes")
          old = os.path.join(os.path.dirname(os.getcwd()), "tmp", "org.chromium.Chromium.abcdef")
          os.makedirs(old)
          try:
              socket.socket(socket.AF_UNIX).bind(os.path.join(old, "SingletonSocket")); print("old place bound")
          except OSError as e:
              print("old place:", len(os.path.join(old, "SingletonSocket").encode()), "bytes:", e)'
          out="$(as2 exec "$id" 120 -- "python3 -c '$probe' && google-chrome --headless=new --no-sandbox --disable-gpu --no-first-run --user-data-dir=\"\$TMPDIR/profile\" --dump-dom about:blank | head -c 200")"
          echo "$out"
          grep -qx "TMPDIR $t TMP $t TEMP $t" <<<"$out"
          grep -q "^bound $t/org.chromium.Chromium.[A-Za-z0-9_]*/SingletonSocket " <<<"$out"
          grep -q '^old place: .*AF_UNIX path too long' <<<"$out"
          grep -q '<html><head></head><body></body></html>' <<<"$out"
          as2 wipe "$id"
          if sudo test -e "$t"; then echo "$t is still there after the wipe" >&2; exit 1; fi
          echo "wiped: $t is gone"
          rm -rf "$r"
      - name: a red main tip doesn't block the updater, as root (the newest green first-parent commit; its verdict memo root-owned)
        run: sudo "$(command -v node)" scripts/ci/updater-lookback-root.mjs "$PWD/scripts/machine/worklane-update.cjs"
      - name: the database image, pinned to the digest it has today
        run: |
          docker pull -q postgres:17-alpine
          echo "DB_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' postgres:17-alpine)" >> "$GITHUB_ENV"
      - name: the coordinator's sandbox host, as wl-ci, against real systemd-run
        run: |
          # What wl-ci runs, world-readable: the build, its one dependency, node, the driver and the fixtures.
          t="$(mktemp -d /tmp/wl-ci-XXXXXX)"
          mkdir -p "$t/node_modules" "$t/fixtures"
          cp -r dist package.json "$t/"
          cp -r node_modules/zod "$t/node_modules/"
          cp "$(command -v node)" "$t/node"
          cp scripts/ci/testrun-real-systemd.mjs "$t/"
          cp test/fixtures/systemd-run-255/* "$t/fixtures/"
          chmod -R a+rX "$t"
          echo "T=$t" >> "$GITHUB_ENV"
          sudo install -o wl-ci -g wl-ci -m 0644 /dev/null "$t/ids"
          sudo install -o wl-ci -g wl-ci -m 0644 /dev/null "$t/ids.db"
          sudo -u wl-ci env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-ci | cut -d: -f6)" LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec "$1/node" "$1/testrun-real-systemd.mjs" "$1/dist" ci "$2" "$1/fixtures" "$1/ids"' _ "$t" "$DB_IMAGE"
      - name: the database container's processes are in a cgroup of their own, inside worklane-test.slice
        run: |
          c="$(cat "$T/ids.db")"
          [ -n "$c" ] || { echo "the driver named no container" >&2; exit 1; }
          pid="$(sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker inspect --format '{{.State.Pid}}' "$c")"
          echo "container $c, main pid $pid"
          cat "/proc/$pid/cgroup"
          cg="$(sed -n 's/^0:://p' "/proc/$pid/cgroup")"
          unit="$(systemctl show worklane-test-ci-docker.service -p ControlGroup --value)"
          echo "the container's cgroup: $cg"
          echo "its controllers: $(cat "/sys/fs/cgroup$cg/cgroup.controllers")"
          case "$cg" in /worklane.slice/worklane-test.slice/*) ;; *) echo "not inside /worklane.slice/worklane-test.slice/" >&2; exit 1 ;; esac
          case "$cg" in "$unit"/daemon | "$unit"/daemon/*) echo "in the daemon's own cgroup, not one of its own" >&2; exit 1 ;; "$unit"/*) ;; *) echo "not inside $unit" >&2; exit 1 ;; esac
          for k in cpu io memory pids; do grep -qw "$k" "/sys/fs/cgroup$cg/cgroup.controllers" || { echo "no $k controller in its cgroup" >&2; exit 1; }; done
          echo "CG=$cg" >> "$GITHUB_ENV"
      - name: the run's Postgres has the max_connections db-start was given (250), asked inside the database
        run: |
          c="$(cat "$T/ids.db")"
          got="$(sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker exec "$c" psql -U postgres -d test -tAc 'SHOW max_connections')"
          echo "SHOW max_connections in $c: $got"
          [ "$got" = 250 ] || { echo "expected 250" >&2; exit 1; }
      - name: wipe, as wl-ci
        run: |
          sudo -u wl-ci env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-ci | cut -d: -f6)" LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec "$1/node" "$1/testrun-real-systemd.mjs" --wipe "$1/dist" ci "$1/ids"' _ "$T"
      - name: nothing left of the run, seen as root
        run: |
          if [ -e "/sys/fs/cgroup$CG" ]; then echo "the container's cgroup $CG is still there" >&2; exit 1; fi
          echo "the container's cgroup $CG is gone"
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if sudo test -e "/var/lib/worklane-test/ci/runs/$id"; then echo "run $id's directory is still there" >&2; exit 1; fi
            if [ -n "$(systemctl list-units --all --plain --no-legend "worklane-test-ci-$id-*")" ]; then echo "run $id has units left" >&2; exit 1; fi
          done < "$T/ids"
          sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker ps -aq --filter label=worklane.test-run > "$RUNNER_TEMP/left"
          if [ -s "$RUNNER_TEMP/left" ]; then echo "containers left:" >&2; cat "$RUNNER_TEMP/left" >&2; exit 1; fi
          echo "nothing left"
      - name: the sandbox's units and Docker, on failure
        if: failure()
        run: |
          sudo systemctl --no-pager status worklane-test.slice worklane-test-ci-docker.service || true
          sudo journalctl --no-pager -n 100 -u worklane-test-ci-docker.service || true
          sudo journalctl --no-pager -n 50 _SYSTEMD_UNIT=init.scope -g worklane-test || true

  add-project-real-systemd:
    # scripts/setup/add-project.sh end to end on a real host, as root, against a fake GitHub (test/fake-github.ts, the
    # manifest flow's, served by scripts/ci/fake-github.mjs): a first run stops at the App step (no hub yet) naming its
    # retry; the App by hand (credentials.sh github-app), then the rerun goes on from there with a stand-in Claude
    # token: the checkout cloned through the App's credential helper, the coordinator's service active, the machine
    # helper and the dashboards. A third run, through the machine helper as the coordinator, skips every step.
    name: add-project (real systemd)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' add-project-real-systemd ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      GH_FAKE: http://127.0.0.1:8999
      HELPER: /usr/local/libexec/worklane-machine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && npm run build:web
      - name: the machine (machine.sh) and this commit's engine, root-owned, as engine.sh installs it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q acl
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          sudo bash scripts/setup/machine.sh
          sha="$(git rev-parse HEAD)"
          # The runner's /opt is open to all (0777); on a server it is root's 0755, and the machine helper refuses to run
          # add-project.sh from under a directory anyone may write.
          sudo chmod 0755 /opt
          sudo install -d -m 0755 /opt/worklane
          sudo cp -a "$GITHUB_WORKSPACE" "/opt/worklane/$sha"
          sudo chown -R root:root "/opt/worklane/$sha" && sudo chmod -R a+rX,go-w "/opt/worklane/$sha"
          sudo ln -sfn "/opt/worklane/$sha" /opt/worklane/current
          sudo chmod 0755 "/opt/worklane/$sha/dist/src/cli.js"
          sudo ln -sfn /opt/worklane/current/dist/src/cli.js /usr/local/bin/worklane
          worklane --version
      - name: a fake GitHub, with the repo (examples/basic) behind the App's installation token
        run: |
          f="$RUNNER_TEMP/fake" && mkdir -p "$f/git/example"
          git init -q --bare -b main "$f/git/example/alpha.git"
          cp -r examples/basic "$f/seed"
          # Its .worklane/ for example/alpha, within the default policy add-project writes ($20/day, 2 workers).
          sed -i -e 's|^  repo: example-org/example-shop |  repo: example/alpha |' "$f/seed/.worklane/config.yaml"
          sed -i -e 's|^daily_budget_usd: 40 |daily_budget_usd: 20 |' -e 's|count: 1, max: 4,|count: 1, max: 2,|' "$f/seed/.worklane/agents.yaml"
          grep -q '^  repo: example/alpha ' "$f/seed/.worklane/config.yaml" && grep -q '^daily_budget_usd: 20 ' "$f/seed/.worklane/agents.yaml" && grep -q 'max: 2,' "$f/seed/.worklane/agents.yaml"
          git -C "$f/seed" init -q -b main && git -C "$f/seed" add -A
          git -C "$f/seed" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q -m init
          git -C "$f/seed" push -q "$f/git/example/alpha.git" main
          nohup node scripts/ci/fake-github.mjs "$GITHUB_WORKSPACE/dist" 8999 "$f/git" example/alpha "$f/requests.log" > "$f/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf "$GH_FAKE/repos/example/alpha" >/dev/null && break; sleep 1; done
          curl -sf "$GH_FAKE/repos/example/alpha"
          # The App's key, as one would download it (the fake checks the JWT's App id, not its signature).
          openssl genrsa -traditional -out "$f/app.pem" 2048 2>/dev/null || openssl genrsa -out "$f/app.pem" 2048
          echo "F=$f" >> "$GITHUB_ENV"
          # The fake is reached through these, as the engine reads them: kept through sudo, and set for the units.
          printf 'Defaults env_keep += "WORKLANE_GITHUB_API WORKLANE_GITHUB_WEB"\n' > "$f/sudoers" && sudo visudo -cf "$f/sudoers" && sudo install -m 0440 "$f/sudoers" /etc/sudoers.d/ci-fake-github
          for u in worklane-ci worklane-dashboard-ci worklane-dashboard-hub; do
            sudo install -d "/etc/systemd/system/$u.service.d"
            printf '[Service]\nEnvironment=WORKLANE_GITHUB_API=%s WORKLANE_GITHUB_WEB=%s\n' "$GH_FAKE" "$GH_FAKE" | sudo tee "/etc/systemd/system/$u.service.d/fake-github.conf" >/dev/null
          done
          # The dashboard sign-in App's secrets (credentials.sh dashboard-signin), for the hub dashboards.sh starts.
          printf 'cisigninclientsecret0123456789\n' | sudo bash scripts/setup/credentials.sh dashboard-signin
      - name: first run, no hub yet; stops at the App step and names the retry
        run: |
          # The stand-in token: in a file of the runner's only, masked in case anything prints it; never in the env.
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/claude-token"); unset t
          set +e
          sudo env WORKLANE_GITHUB_API="$GH_FAKE" WORKLANE_GITHUB_WEB="$GH_FAKE" bash scripts/setup/add-project.sh ci example/alpha --client-id Iv1.cisignin0001 --public-url https://hub.example.test < /dev/null > "$F/run1.jsonl" 2> "$F/run1.err"
          rc=$?
          set -e
          cat "$F/run1.jsonl"; tail -n 20 "$F/run1.err"
          [ "$rc" = 1 ] || { echo "expected exit 1, got $rc" >&2; exit 1; }
          jq -e 'select(.step=="instance" and .state=="done")' "$F/run1.jsonl" >/dev/null
          last="$(tail -n 1 "$F/run1.jsonl")"
          jq -e '.step=="app" and .state=="failed" and (.detail|test("no dashboard hub")) and (.retry|test("add-project.sh ci example/alpha .*credentials.sh ci github-app"))' <<<"$last"
          id wl-ci && id wl-ci-agent
      - name: the App by hand (the manual way), then the rerun goes on from the App step to the end
        run: |
          echo n | sudo env WORKLANE_GITHUB_API="$GH_FAKE" bash scripts/setup/credentials.sh ci github-app 91 4242 "$F/app.pem" example/alpha
          cat "$F/claude-token" | sudo env WORKLANE_GITHUB_API="$GH_FAKE" WORKLANE_GITHUB_WEB="$GH_FAKE" bash scripts/setup/add-project.sh ci example/alpha --client-id Iv1.cisignin0001 --public-url https://hub.example.test > "$F/run2.jsonl" 2> "$F/run2.err" || { cat "$F/run2.jsonl"; tail -n 60 "$F/run2.err"; exit 1; }
          cat "$F/run2.jsonl"
          for s in instance app; do jq -se --arg s "$s" 'map(select(.step==$s and .state=="done")) | length == 1' "$F/run2.jsonl"; done
          [ "$(jq -sc 'map(select(.state=="started") | .step)' "$F/run2.jsonl")" = '["instance","app","claude-token","checkout","policy","service","test-user","machine-helper","dashboards"]' ]
          jq -se 'map(select(.state=="failed")) | length == 0' "$F/run2.jsonl"
          jq -se 'map(select(.step=="claude-token" and .state=="ask" and .ask.kind=="paste_secret")) | length == 1' "$F/run2.jsonl"
          jq -se 'map(select(.step=="policy" and .state=="done" and (.detail|startswith("auto_merge off, $20/day, 2 workers")))) | length == 1' "$F/run2.jsonl"
          if grep -qFf "$F/claude-token" "$F/run1.jsonl" "$F/run1.err" "$F/run2.jsonl" "$F/run2.err"; then echo "the token was echoed" >&2; exit 1; fi
      - name: the instance, the token for the agent only, the checkout through the App, the services, the helper
        run: |
          sudo test -f "$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci/instance.yaml"
          c="$(getent passwd wl-ci-agent | cut -d: -f6)/.claude/.credentials.json"
          [ "$(sudo stat -c '%U %a' "$c")" = "wl-ci-agent 600" ]
          sudo grep -qFf "$F/claude-token" "$c"
          if sudo -u wl-ci test -r "$c"; then echo "the coordinator can read the agent's Claude login" >&2; exit 1; fi
          d=/srv/worklane/ci/alpha
          sudo test -f "$d/.worklane/config.yaml"
          [ "$(sudo git -C "$d" config --get remote.origin.url)" = "$GH_FAKE/example/alpha.git" ]
          sudo git -C "$d" config --get-all credential.helper | grep -qx '!/usr/local/bin/worklane git-credential --instance ci'
          grep -q '^git as x-access-token: POST /example/alpha.git/git-upload-pack$' "$F/requests.log"
          if grep '^git as ' "$F/requests.log" | grep -v '^git as x-access-token:'; then echo "git authenticated as someone else" >&2; exit 1; fi
          grep -q "^POST /app/installations/4242/access_tokens$" "$F/requests.log"
          for u in worklane-ci worklane-dashboard-ci worklane-dashboard-hub; do systemctl is-active "$u.service"; done
          sleep 15 && systemctl is-active worklane-ci.service
          sudo -n -l -U wl-ci "$HELPER" add-project beta example/beta
          if sudo -n -l -U wl-ci "$HELPER" add-project beta example/beta extra; then echo "the rule passes extra arguments" >&2; exit 1; fi
          if sudo -n -l -U wl-dash "$HELPER" add-project beta example/beta; then echo "wl-dash may add a project" >&2; exit 1; fi
      - name: through the machine helper, as the coordinator, every step is skipped as done
        run: |
          sudo -u wl-ci sudo -n "$HELPER" add-project ci example/alpha < /dev/null > "$F/run3.jsonl" 2> "$F/run3.err" || { cat "$F/run3.jsonl" "$F/run3.err"; exit 1; }
          cat "$F/run3.jsonl"
          jq -se 'length == 18 and (map(select(.state=="done")) | length == 9) and (map(select(.state=="ask" or .state=="failed")) | length == 0)' "$F/run3.jsonl"
          sudo grep -q '"what":"add-project".*"to":"ci example/alpha"' /var/lib/worklane/machine-changes.jsonl
          if sudo -u wl-ci sudo -n "$HELPER" add-project 'ci;id' example/alpha 2>/dev/null; then echo "a bad name ran" >&2; exit 1; fi
      - name: "claude-account: a stand-in claude, and a second instance (beta, with an eval user) whose coordinator finishes its run on SIGTERM"
        run: |
          # claude auth status as each user: signed in when that user's own login holds a setup token (scripts/ci/).
          sudo install -m 0755 scripts/ci/claude-stand-in.cjs /usr/local/bin/claude
          sudo bash scripts/setup/instance.sh beta --eval
          sudo install -m 0755 scripts/ci/coordinator-stand-in.cjs /usr/local/lib/ci-coordinator-stand-in.cjs
          printf '[Service]\nUser=wl-beta\nExecStart=/usr/local/bin/node /usr/local/lib/ci-coordinator-stand-in.cjs 5000\nRestart=on-failure\nKillMode=control-group\nTimeoutStopSec=60\n' | sudo tee /etc/systemd/system/worklane-beta.service >/dev/null
          sudo systemctl daemon-reload && sudo systemctl start worklane-beta.service
          # The machine helper's rule names both instances, as add-project.sh keeps it.
          sudo bash scripts/setup/machine-helper.sh ci beta
          sudo -n -l -U wl-beta "$HELPER" claude-account switch
          if sudo -n -l -U wl-dash "$HELPER" claude-account switch 2>/dev/null; then echo "wl-dash may switch the account" >&2; exit 1; fi
          # The new account's tokens: in files of the runner's only, masked; never in the env.
          for n in 2 3; do t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/claude-token$n"); done; unset t
          systemctl is-active worklane-ci.service worklane-beta.service
      - name: "claude-account switch across both: paused (runs finish), the token for every agent and eval user at 0600, checked as each, resumed"
        run: |
          sudo bash scripts/setup/claude-account.sh switch --json --timeout 4 < "$F/claude-token2" > "$F/switch1.jsonl" 2> "$F/switch1.err" || { cat "$F/switch1.jsonl" "$F/switch1.err"; exit 1; }
          cat "$F/switch1.jsonl"
          for n in ci beta; do
            jq -se --arg n "$n" 'map(select(.step=="pause" and .instance==$n and .state=="done")) | length == 1' "$F/switch1.jsonl"
            # The coordinator drained (SIGTERM to its main process; its runs finished) rather than being stopped at the timeout.
            jq -se --arg n "$n" 'map(select(.step=="wait" and .instance==$n and (.detail|test("its runs have finished")))) | length == 1' "$F/switch1.jsonl"
            jq -se --arg n "$n" 'map(select(.step=="resume" and .instance==$n and .state=="done")) | length == 1' "$F/switch1.jsonl"
            systemctl is-active "worklane-$n.service"
          done
          [ "$(jq -sc '[.[] | select(.step=="check" and .state=="done") | .user]' "$F/switch1.jsonl")" = '["wl-beta-agent","wl-beta-eval","wl-ci-agent"]' ]
          jq -se 'last | .step=="switch" and .state=="done"' "$F/switch1.jsonl"
          sudo journalctl --no-pager -u worklane-beta.service | grep -q 'stand-in coordinator: SIGTERM, finishing the run in flight'
          for u in wl-ci-agent wl-beta-agent wl-beta-eval; do
            c="$(getent passwd "$u" | cut -d: -f6)/.claude/.credentials.json"
            [ "$(sudo stat -c '%U %a' "$c")" = "$u 600" ] || { sudo stat -c '%U %a' "$c"; exit 1; }
            sudo grep -qFf "$F/claude-token2" "$c"
          done
          s=/var/lib/worklane/claude-account
          [ "$(sudo stat -c '%U %a' "$s/status.json")" = "root 644" ]
          sudo jq -e '[.users[] | select(.logged_in)] | length == 3' "$s/status.json"
          sudo jq -e '[.users[].token_id] | unique | length == 1' "$s/status.json"
          # Never echoed: not in the output, the progress or status files, or any unit's journal.
          if grep -qFf "$F/claude-token2" "$F/switch1.jsonl" "$F/switch1.err" || sudo grep -qFf "$F/claude-token2" "$s/switch.jsonl" "$s/status.json" || sudo journalctl --no-pager | grep -qFf "$F/claude-token2"; then echo "the token was echoed" >&2; exit 1; fi
      - name: "claude-account: an instance whose check fails is not resumed; the rerun resumes it; status"
        run: |
          echo wl-beta-eval | sudo tee /etc/ci-claude-fail >/dev/null
          set +e
          sudo bash scripts/setup/claude-account.sh switch --json --timeout 2 beta < "$F/claude-token2" > "$F/switch2.jsonl" 2> "$F/switch2.err"
          rc=$?
          set -e
          cat "$F/switch2.jsonl"
          [ "$rc" = 1 ]
          jq -se 'map(select(.step=="check" and .user=="wl-beta-eval" and .state=="failed")) | length == 1' "$F/switch2.jsonl"
          jq -se 'map(select(.step=="resume" and .instance=="beta" and .state=="failed")) | length == 1' "$F/switch2.jsonl"
          if systemctl is-active -q worklane-beta.service; then echo "beta was resumed with a failed check" >&2; exit 1; fi
          [ "$(cat /var/lib/worklane/claude-account/paused)" = beta ]
          sudo rm -f /etc/ci-claude-fail
          sudo bash scripts/setup/claude-account.sh switch --json --timeout 2 beta < "$F/claude-token2" > "$F/switch3.jsonl" 2> "$F/switch3.err" || { cat "$F/switch3.jsonl" "$F/switch3.err"; exit 1; }
          jq -se 'map(select(.step=="pause" and .instance=="beta" and (.detail|test("earlier switch")))) | length == 1' "$F/switch3.jsonl"
          jq -se 'map(select(.step=="resume" and .instance=="beta" and .state=="done")) | length == 1' "$F/switch3.jsonl"
          systemctl is-active worklane-beta.service
          sudo bash scripts/setup/claude-account.sh status | tee "$F/status.txt"
          [ "$(grep -c ' signed in ' "$F/status.txt")" = 3 ] && ! grep -q 'NOT signed in' "$F/status.txt"
          if grep -qFf "$F/claude-token2" "$F/switch2.jsonl" "$F/switch2.err" "$F/switch3.jsonl" "$F/switch3.err" "$F/status.txt"; then echo "the token was echoed" >&2; exit 1; fi
      - name: "claude-account from the dashboard: the coordinator starts it through the helper, in a unit of its own; the token from the instance's secrets"
        run: |
          sudo -u wl-ci sudo -n "$HELPER" claude-account switch < /dev/null | tee "$F/helper-switch.txt"
          grep -q 'started the Claude account switch as worklane-claude-account.service' "$F/helper-switch.txt"
          s=/var/lib/worklane/claude-account/switch.jsonl
          # The unit starts on its own: until it has, switch.jsonl is still the last switch's (its own token ask included).
          asked() { grep '"step":"token","state":"ask"' "$s" 2>/dev/null | grep -q "in ci's dashboard"; }
          for _ in $(seq 1 60); do asked && break; sleep 2; done
          asked || { cat "$s"; sudo journalctl --no-pager -u worklane-claude-account.service | tail -n 40; exit 1; }
          # What the dashboard does with a pasted token: the coordinator user's own file, 0400, renamed into place (src/console/secrets.ts).
          sudo -H -u wl-ci sh -c 'umask 077; d="$HOME/.config/ci-secrets"; mkdir -p "$d"; cat > "$d/.t.tmp"; chmod 0400 "$d/.t.tmp"; mv "$d/.t.tmp" "$d/claude-account-token"' < "$F/claude-token3"
          for _ in $(seq 1 150); do grep -q '"step":"switch","state":"\(done\|failed\)"' "$s" && break; sleep 2; done
          cat "$s"
          tail -n 1 "$s" | jq -e '.step=="switch" and .state=="done"'
          sudo test ! -e "$(getent passwd wl-ci | cut -d: -f6)/.config/ci-secrets/claude-account-token"
          for u in wl-ci-agent wl-beta-agent wl-beta-eval; do sudo grep -qFf "$F/claude-token3" "$(getent passwd "$u" | cut -d: -f6)/.claude/.credentials.json"; done
          systemctl is-active worklane-ci.service worklane-beta.service
          if sudo grep -qFf "$F/claude-token3" "$s" /var/lib/worklane/claude-account/status.json /var/lib/worklane/machine-changes.jsonl || sudo journalctl --no-pager | grep -qFf "$F/claude-token3"; then echo "the token was echoed" >&2; exit 1; fi
      # Server mode for a repo with no .worklane/ (the setup audit's B3-B7), a fresh instance (gamma) against a second
      # fake GitHub: the App by hand writes credentials.yaml itself; --after-credentials drafts the config through
      # auto-config (questions answered as the coordinator, then a setup PR) and reports "waiting", exit 3, until it
      # merges; a rerun reuses the PR; init says so and exits non-zero, with how the App was made; doctor as the
      # coordinator reads what init (root) recorded; once the PR merges, the rerun and init succeed.
      - name: "server mode, no .worklane/: a second fake GitHub, gitleaks, the instance, and the App by hand (B3)"
        env:
          GH_FAKE2: http://127.0.0.1:8998
        run: |
          f2="$RUNNER_TEMP/fake2" && mkdir -p "$f2/git/example" "$f2/seed"
          git init -q --bare -b main "$f2/git/example/gamma.git"
          printf 'gamma\n' > "$f2/seed/README.md"
          printf 'test:\n\t@echo ok\n' > "$f2/seed/Makefile"
          git -C "$f2/seed" init -q -b main && git -C "$f2/seed" add README.md Makefile
          git -C "$f2/seed" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q -m init
          git -C "$f2/seed" push -q "$f2/git/example/gamma.git" main
          nohup node scripts/ci/fake-github.mjs "$GITHUB_WORKSPACE/dist" 8998 "$f2/git" example/gamma "$f2/requests.log" > "$f2/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf "$GH_FAKE2/repos/example/gamma" >/dev/null && break; sleep 1; done
          curl -sf "$GH_FAKE2/repos/example/gamma"
          { echo "F2=$f2"; echo "GH_FAKE2=$GH_FAKE2"; } >> "$GITHUB_ENV"
          # gitleaks, pinned and checked as bootstrap.sh has it: the checkout's pre-commit secret scan runs it on the setup commit.
          v="$(sed -n 's/^GITLEAKS_VERSION=//p' scripts/bootstrap.sh)" && sum="$(sed -n 's/^GITLEAKS_SHA256_LINUX_X64=//p' scripts/bootstrap.sh)"
          curl -fsSL -o "$f2/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "$sum  $f2/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$f2/gitleaks.tgz" -C "$f2" gitleaks && sudo install -m 0755 "$f2/gitleaks" /usr/local/bin/gitleaks
          for u in worklane-gamma worklane-dashboard-gamma; do
            sudo install -d "/etc/systemd/system/$u.service.d"
            printf '[Service]\nEnvironment=WORKLANE_GITHUB_API=%s WORKLANE_GITHUB_WEB=%s\n' "$GH_FAKE2" "$GH_FAKE2" | sudo tee "/etc/systemd/system/$u.service.d/fake-github.conf" >/dev/null
          done
          sudo bash scripts/setup/instance.sh gamma
          # No instance home yet (the audit's first run): credentials.sh makes it and writes the App in, no hand edit.
          echo n | sudo env WORKLANE_GITHUB_API="$GH_FAKE2" bash scripts/setup/credentials.sh gamma github-app 91 4242 "$F/app.pem" example/gamma 2>&1 | tee "$f2/creds.log"
          if grep -q 'set in credentials.yaml' "$f2/creds.log"; then echo "credentials.sh still asks for a hand edit" >&2; exit 1; fi
          grep -q '^wrote .*/instances/gamma/credentials.yaml (github: App 91, installation 4242; the rest kept)$' "$f2/creds.log"
          h="$(getent passwd wl-gamma | cut -d: -f6)"
          sudo cat "$h/.local/state/worklane/instances/gamma/credentials.yaml"
          sudo node -e 'const y=require("/opt/worklane/current/node_modules/yaml");const g=y.parse(require("fs").readFileSync(process.argv[1],"utf8")).github;if(!(g.kind==="app"&&g.app_id===91&&g.installation_id===4242&&g.key_path===process.argv[2]))process.exit(1)' "$h/.local/state/worklane/instances/gamma/credentials.yaml" "$h/.config/gamma-app/private-key.pem"
          sudo -u wl-gamma test -r "$h/.local/state/worklane/instances/gamma/credentials.yaml"
          [ "$(sudo cat "$h/.config/gamma-app/made-by")" = by-hand ]
      - name: "--after-credentials: auto-config's questions, answered as the coordinator, then its setup PR; waiting (exit 3), never success (B4)"
        run: |
          boot() { set +e; sudo env WORKLANE_GITHUB_API="$GH_FAKE2" WORKLANE_GITHUB_WEB="$GH_FAKE2" bash scripts/bootstrap.sh --hardened --after-credentials --yes --machine-owner ci-owner gamma example/gamma > "$F2/$1.log" 2>&1; rc=$?; set -e; cat "$F2/$1.log"; echo "rc=$rc"; }
          boot boot1
          [ "$rc" = 3 ]
          grep -q '"kind":"questions"' "$F2/boot1.log"
          grep -q 'waiting for the repo config: no setup PR yet' "$F2/boot1.log"
          if grep -q 'POST /repos/example/gamma/pulls' "$F2/requests.log"; then echo "a PR was opened with a question open" >&2; exit 1; fi
          # The question, answered the way the line says: as the coordinator.
          sudo -H -u wl-gamma env WORKLANE_GITHUB_API="$GH_FAKE2" bash -c 'umask 0002; worklane instance auto-config gamma --answer one-test-file=none' | tee "$F2/answer.json"
          jq -e '.kind == "proposed" and .pr == "http://127.0.0.1:8998/example/gamma/pull/1"' "$F2/answer.json"
          [ "$(grep -c '^POST /repos/example/gamma/pulls$' "$F2/requests.log")" = 1 ]
          # The setup branch holds the drafted config: make test, checked as the agent user, within the instance policy.
          git -C "$F2/git/example/gamma.git" show worklane/setup:.worklane/tests.yaml | tee "$F2/tests.yaml"
          grep -q 'runner.full: make test  -> passed on' "$F2/tests.yaml"
          git -C "$F2/git/example/gamma.git" show worklane/setup:.worklane/agents.yaml | grep -q '^daily_budget_usd: 20'
          [ "$(git -C "$F2/git/example/gamma.git" rev-parse main)" = "$(git -C "$F2/seed" rev-parse HEAD)" ]
      - name: "rerun --after-credentials: no 'branch already exists', the same PR, still waiting (B5)"
        run: |
          set +e; sudo env WORKLANE_GITHUB_API="$GH_FAKE2" WORKLANE_GITHUB_WEB="$GH_FAKE2" bash scripts/bootstrap.sh --hardened --after-credentials --yes --machine-owner ci-owner gamma example/gamma > "$F2/boot2.log" 2>&1; rc=$?; set -e
          cat "$F2/boot2.log"
          [ "$rc" = 3 ]
          if grep -q 'already exists' "$F2/boot2.log"; then echo "the rerun tripped on the setup branch" >&2; exit 1; fi
          grep -q 'waiting for the setup PR http://127.0.0.1:8998/example/gamma/pull/1: the coordinator starts once it has merged' "$F2/boot2.log"
          [ "$(grep -c '^POST /repos/example/gamma/pulls$' "$F2/requests.log")" = 1 ]
      - name: "init --mode server: the true status, exit 1 while the setup PR waits, and how the App was made (B6); doctor as the coordinator reads it (B7)"
        run: |
          set +e; sudo env WORKLANE_GITHUB_API="$GH_FAKE2" WORKLANE_GITHUB_WEB="$GH_FAKE2" worklane init --mode server example/gamma --instance gamma --timeout 1 < "$F/claude-token" > "$F2/init1.log" 2>&1; rc=$?; set -e
          cat "$F2/init1.log"
          [ "$rc" = 1 ]
          if grep -q 'steps done or skipped' "$F2/init1.log"; then echo "init claimed it was done" >&2; exit 1; fi
          grep -q 'add-project service waiting: waiting for the setup PR http://127.0.0.1:8998/example/gamma/pull/1 to merge' "$F2/init1.log"
          grep -q 'GitHub App (made by hand (credentials.sh github-app))' "$F2/init1.log"
          if grep -q 'manifest flow' "$F2/init1.log"; then echo "init claimed the manifest flow" >&2; exit 1; fi
          grep -q 'stopped at Repo config' "$F2/init1.log"
          [ "$(sudo stat -c '%U %G %a' /var/lib/worklane/init/gamma.json)" = "root wl-gamma 640" ]
          if grep -qFf "$F/claude-token" "$F2/init1.log"; then echo "the token was echoed" >&2; exit 1; fi
          set +e; sudo -H -u wl-gamma worklane doctor --mode server --instance gamma --root /srv/worklane/gamma/gamma > "$F2/doctor1.log" 2>&1; set -e
          cat "$F2/doctor1.log"
          for s in tools claude github; do grep -q "^ok    setup $s: " "$F2/doctor1.log"; done
          grep -q '^FAIL  setup repo-config: Repo config (server mode): waiting for the setup PR http://127.0.0.1:8998/example/gamma/pull/1' "$F2/doctor1.log"
          if grep -E '^(ok|FAIL)  +setup (tools|claude|github)' "$F2/doctor1.log" | grep -q 'not reached yet'; then echo "doctor did not read init's record" >&2; exit 1; fi
      - name: "the setup PR merges: --after-credentials succeeds, the coordinator runs; init exits 0; doctor as the coordinator all ok"
        run: |
          git -C "$F2/git/example/gamma.git" update-ref refs/heads/main refs/heads/worklane/setup
          sudo env WORKLANE_GITHUB_API="$GH_FAKE2" WORKLANE_GITHUB_WEB="$GH_FAKE2" bash scripts/bootstrap.sh --hardened --after-credentials --yes --machine-owner ci-owner gamma example/gamma > "$F2/boot3.log" 2>&1 || { cat "$F2/boot3.log"; exit 1; }
          cat "$F2/boot3.log"
          sudo test -f /srv/worklane/gamma/gamma/.worklane/config.yaml
          systemctl is-active worklane-gamma.service
          sudo env WORKLANE_GITHUB_API="$GH_FAKE2" WORKLANE_GITHUB_WEB="$GH_FAKE2" worklane init --mode server example/gamma --instance gamma --timeout 1 < /dev/null > "$F2/init2.log" 2>&1 || { cat "$F2/init2.log"; exit 1; }
          cat "$F2/init2.log"
          grep -q 'all 8 steps done or skipped' "$F2/init2.log"
          set +e; sudo -H -u wl-gamma worklane doctor --mode server --instance gamma --root /srv/worklane/gamma/gamma > "$F2/doctor2.log" 2>&1; set -e
          cat "$F2/doctor2.log"
          for s in tools claude github repo-config coordinator protection; do grep -q "^ok    setup $s: " "$F2/doctor2.log"; done
      - name: "server: the install ends with one URL, the hub's wizard, no key in it; it answers 200, and the checklist given the hub's key; a rerun prints the same"
        run: |
          tail -n 12 "$F2/boot3.log"
          # The hub's key, root's to read: copied into a 0600 file of the runner's, never into an argument.
          hk="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/dashboard-token"
          (umask 077; sudo cat "$hk" > "$F2/hub-key")
          u1="$(bash scripts/ci/wizard-url.sh "$F2/boot3.log" "$F2/hub-key" /api/i/ci/first-run | tail -n 1)"
          # The sign-in App is set up here, but the machine has no public name (no Tailscale, no --public-url): the break-glass.
          [ "$u1" = http://127.0.0.1:4398/first-run ]
          grep -qF "asks once for the hub's key: it is in $hk" "$F2/boot3.log"
          sudo env WORKLANE_GITHUB_API="$GH_FAKE2" WORKLANE_GITHUB_WEB="$GH_FAKE2" bash scripts/bootstrap.sh --hardened --after-credentials --yes --machine-owner ci-owner gamma example/gamma > "$F2/boot4.log" 2>&1 || { cat "$F2/boot4.log"; exit 1; }
          u2="$(bash scripts/ci/wizard-url.sh "$F2/boot4.log" "$F2/hub-key" /api/i/ci/first-run | tail -n 1)"
          [ "$u1" = "$u2" ] || { echo "the URL changed: $u1 / $u2" >&2; exit 1; }
          rm -f "$F2/hub-key"
      - name: the units and the fake's log, on failure
        if: failure()
        run: |
          tail -n 80 "$F2"/*.log || true
          sudo journalctl --no-pager -n 60 -u worklane-gamma.service || true
          sudo systemctl --no-pager status worklane-ci.service worklane-dashboard-ci.service worklane-dashboard-hub.service worklane-beta.service || true
          sudo journalctl --no-pager -n 80 -u worklane-ci.service -u worklane-dashboard-ci.service -u worklane-dashboard-hub.service -u worklane-beta.service -u worklane-claude-account.service || true
          sudo cat /var/lib/worklane/claude-account/switch.jsonl || true
          tail -n 80 "$F/requests.log" "$F/server.log" || true
          tail -n 80 "$F"/run*.err || true

  auth-probe-real-users:
    # The watchdog's Claude sign-in probe on a real host: instance.sh's coordinator and agent users (separate homes,
    # 0700) and its real sudoers rule; the agent user signed in to a stand-in claude that reads the login under the
    # HOME it is given; the probe run as the coordinator through sudo, as its service runs it, finds it signed in.
    # scripts/ci/auth-probe-real-users.mjs has the assertions.
    name: Claude sign-in probe (real users)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' auth-probe-real-users ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - name: the instance's users and sudoers rule (instance.sh), and the stand-in claude
        run: |
          sudo bash scripts/setup/instance.sh probe
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          sudo install -m 0755 scripts/ci/claude-stand-in.cjs /usr/local/bin/claude
      - name: the agent user signed in, in its own home only
        run: |
          a="$(getent passwd wl-probe-agent | cut -d: -f6)" && c="$(getent passwd wl-probe | cut -d: -f6)"
          [ "$a" != "$c" ]
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"
          sudo install -d -o wl-probe-agent -g wl-probe-agent -m 0700 "$a/.claude"
          printf '{"claudeAiOauth":{"accessToken":"%s"}}\n' "$t" | sudo -u wl-probe-agent sh -c 'umask 077 && cat > "$1"' _ "$a/.claude/.credentials.json"
          unset t
          sudo -H -u wl-probe-agent env PATH=/usr/local/bin:/usr/bin:/bin claude auth status --json | jq -e '.loggedIn == true'
          sudo -H -u wl-probe env PATH=/usr/local/bin:/usr/bin:/bin claude auth status --json | jq -e '.loggedIn == false'
      - name: the probe, as the coordinator through sudo, finds the agent user signed in
        run: |
          # What wl-probe runs, world-readable: the build, its dependencies, node and the driver.
          t="$(mktemp -d /tmp/wl-probe-XXXXXX)"
          mkdir -p "$t/node_modules"
          cp -r dist package.json "$t/"
          cp -r node_modules/ws node_modules/yaml node_modules/zod "$t/node_modules/"
          cp scripts/ci/auth-probe-real-users.mjs "$t/"
          chmod -R a+rX "$t"
          a="$(getent passwd wl-probe-agent | cut -d: -f6)"
          sudo -u wl-probe env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-probe | cut -d: -f6)" USER=wl-probe LOGNAME=wl-probe LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec node "$1/auth-probe-real-users.mjs" "$1/dist" wl-probe-agent "$2"' _ "$t" "$a"
