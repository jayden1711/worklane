name: ci slow
# The slow checks: the bootstrap on each OS, the test-run sandbox and add-project on real systemd, and the Claude
# sign-in probe with real users. Not on every push to main (ci.yml runs the fast checks there):
#   - on main, in batches: ci-batch.yml starts this workflow (workflow_dispatch on main, job=all) on main's newest
#     commit, one batch at a time, when that commit hasn't had a batch. A workflow_dispatch run's check runs
#     land on the commit it ran on, under the job names below, which the engine updater requires
#     (UPDATE_DEFAULT_CHECKS in scripts/setup/lib.sh; test/update-checks.test.ts keeps them in step). So the
#     updater installs only a batched commit: a main commit the batch skipped never gets these checks.
#   - one bisect step: when a batch goes red, ci-batch.yml runs the failing job on one older main commit at a time
#     (job=<key>, sha=<commit>), dispatched on a ci-bisect/<commit> branch so the check runs land on that commit,
#     not on main's tip.
#   - on a pull request that touches what they exercise, or one labelled full-ci (the scope job decides).
#   - adding the full-ci label to an open PR: ci-slow-full-ci.yml calls this workflow (workflow_call) for that
#     labeled event, and the scope job runs every slow job. Its checks are named "full-ci / <job>".
# WHY: no `labeled` here (#615). GitHub can't filter labeled by name, so any label (needs-owner, which the merge flow
# adds seconds after a PR opens) started a run here. That run cancelled the PR's run in progress, and its jobs, had they
# been skipped instead, would have replaced the PR's real results under the same check names. A label now reaches only
# ci-slow-full-ci.yml, whose one job runs for full-ci alone and is named apart from these.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
  workflow_dispatch:
    inputs:
      job:
        description: The slow job to run (all of them for a batch)
        type: choice
        options: [all, bootstrap, bootstrap-windows, testrun-real-systemd, add-project-real-systemd, auth-probe-real-users, egress-real-systemd, wizard-e2e-real-systemd]
        default: all
      sha:
        description: The commit to test; empty for the commit the run is on. A bisect step names it, and the run refuses any other.
        type: string
        default: ''
# One batch at a time on main (a second waits; ci-batch.yml never queues a third), and one per bisect branch. A new
# push to a PR cancels that PR's run in progress; nothing else is ever cancelled (the updater refuses a commit with a
# cancelled check). The full-ci label's run (called for a labeled event) has a group of its own: it cancels nothing of
# the PR's own run, and a second full-ci run replaces only the first.
concurrency:
  group: ci-slow-${{ github.event_name == 'pull_request' && format('pr-{0}{1}', github.event.pull_request.number, github.event.action == 'labeled' && '-full-ci' || '') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scope:
    # Which slow jobs this run runs (scripts/ci/slow-jobs.sh): on a dispatch, the one asked for or all of them; on a PR,
    # those whose paths it touches.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          JOB: ${{ inputs.job }}
          WANT_SHA: ${{ inputs.sha }}
          SHA: ${{ github.sha }}
        run: bash scripts/ci/slow-jobs.sh

  bootstrap:
    # A fresh install in local mode, end to end (scripts/bootstrap.sh, then `worklane init --mode local`): on a clean
    # runner, this commit's engine packed as a release ships it, set up in a scratch copy of examples/basic, through
    # init's checklist and ending at doctor green, which shows that checklist and what local mode can't do; run twice,
    # the second changing nothing; on macOS, the coordinator as a launchd service (worklane up / down); then the demo
    # from the installed package. No GitHub: stand-in gh and claude (scripts/ci/stand-ins), and no token. macOS is
    # not a required check (the owner decides). Batched on main, and in the updater's list.
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' bootstrap ') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Mac runner's own Node is older than 22.13; the bootstrap would take it from Homebrew, which is slow here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'macOS'
        with:
          node-version: '24'
          cache: npm
      - name: pack this commit's engine (dist/ and the web UI built, as in a release)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build && npm run build:web
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          ls "$RUNNER_TEMP"/*.tgz
      - name: the Docker image (the same bootstrap, with the pinned release engine)
        if: runner.os == 'Linux'
        run: |
          docker build -t worklane-trial .
          docker run --rm worklane-trial worklane --version
          docker run --rm worklane-trial sh -c 'gitleaks version && claude --version && node --version'
      - name: no GitHub from here on (a stand-in gh, signed in, that reaches nothing; a stand-in claude, signed in)
        run: echo "$GITHUB_WORKSPACE/scripts/ci/stand-ins" >> "$GITHUB_PATH"
      - name: bootstrap in local mode, three times, each ending with the same one wizard URL that answers
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          ex="$RUNNER_TEMP/example"
          cp -r examples/basic "$ex" && git -C "$ex" init -q
          # Its CI's check named: init finishes only with a CI chosen (#469; the refusal is add-project's job's).
          printf 'required_checks: [test]\n' >> "$ex/.worklane/config.yaml"
          git -C "$ex" remote add origin https://github.com/example-org/example-shop.git
          tgz="$(ls "$RUNNER_TEMP"/*.tgz)"
          bash scripts/bootstrap.sh --dry-run --mode local --engine "$tgz" "$ex"
          # Unattended (--yes): init's checklist here, then the dashboard and its URL.
          bash scripts/bootstrap.sh --mode local --yes --engine "$tgz" "$ex" | tee "$RUNNER_TEMP/first.log"
          # Each step's result line ("   done: ...") can follow what the step printed doing it: count them, not neighbours.
          [ "$(grep -cE '^   done: ' "$RUNNER_TEMP/first.log")" = 5 ] || { echo "not every required step was done" >&2; exit 1; }
          grep -q 'all 6 steps done or skipped' "$RUNNER_TEMP/first.log"
          grep -q 'started in the background' "$RUNNER_TEMP/first.log"
          kf="$(awk '/^  the page asks once for the dashboard key, in this file/{getline; sub(/^ +/, ""); print; exit}' "$RUNNER_TEMP/first.log")"
          [ "$(ls -l "$kf" | cut -c1-10)" = '-rw-------' ] || { ls -l "$kf"; echo "the key file isn't 0600" >&2; exit 1; }
          u1="$(bash scripts/ci/wizard-url.sh "$RUNNER_TEMP/first.log" "$kf" /api/first-run | tail -n 1)"
          # The second run, the one command as a person runs it: no --mode and no terminal (local, said so); no checklist
          # in the terminal, nothing installed, the dashboard already running: the same URL.
          bash scripts/bootstrap.sh --engine "$tgz" "$ex" < /dev/null | tee "$RUNNER_TEMP/second.log"
          if grep -E 'added [0-9]+ package|would download|installed [a-z]+ [0-9]|kept .worklane/|init --mode|started in the background' "$RUNNER_TEMP/second.log"; then echo "the second run did something again" >&2; exit 1; fi
          grep -q 'no --mode, and no terminal to ask on: local mode' "$RUNNER_TEMP/second.log"
          grep -q 'already running; nothing changed' "$RUNNER_TEMP/second.log"
          u2="$(bash scripts/ci/wizard-url.sh "$RUNNER_TEMP/second.log" "$kf" /api/first-run | tail -n 1)"
          # The dashboard stopped (a reboot, say): the third run, unattended from a config file (the wizard's steps as
          # key=value lines), redoes no step, starts the dashboard again, and ends at the same URL.
          pkill -f 'dashboard --service --root' && sleep 2
          printf 'mode=local\n' > "$RUNNER_TEMP/setup.conf"
          bash scripts/bootstrap.sh --config "$RUNNER_TEMP/setup.conf" --engine "$tgz" "$ex" < /dev/null | tee "$RUNNER_TEMP/third.log"
          grep -q 'resuming: 6 of 6 steps done earlier' "$RUNNER_TEMP/third.log"
          grep -q 'started in the background' "$RUNNER_TEMP/third.log"
          u3="$(bash scripts/ci/wizard-url.sh "$RUNNER_TEMP/third.log" "$kf" /api/first-run | tail -n 1)"
          [ "$u1" = "$u2" ] && [ "$u2" = "$u3" ] || { echo "the URL changed: $u1 / $u2 / $u3" >&2; exit 1; }
          echo "every run ended with $u1"
      - name: doctor shows the checklist, and what local mode can't do
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          worklane doctor --root "$RUNNER_TEMP/example" | tee "$RUNNER_TEMP/doctor.log"
          for id in tools claude github repo-config protection discord; do grep -Eq "^ok +setup $id: " "$RUNNER_TEMP/doctor.log"; done
          grep -Eq '^off +not in local mode: separate OS users: ' "$RUNNER_TEMP/doctor.log"
          grep -Eq '^off +not in local mode: root-run add-project: ' "$RUNNER_TEMP/doctor.log"
          # As a server would see it (its steps aren't done here, so it fails; only the list matters): nothing missing.
          worklane doctor --root "$RUNNER_TEMP/example" --mode server > "$RUNNER_TEMP/doctor-server.log" || true
          grep -q '^FAIL  setup github: ' "$RUNNER_TEMP/doctor-server.log"
          if grep -E '^off ' "$RUNNER_TEMP/doctor-server.log"; then echo "server mode lists something it can't do" >&2; exit 1; fi
      - name: the coordinator as a launchd service (worklane up, then down)
        if: runner.os == 'macOS'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          label=dev.worklane.example-shop
          plist="$HOME/Library/LaunchAgents/$label.plist"
          worklane up --root "$RUNNER_TEMP/example"
          test -f "$plist"
          launchctl print "gui/$(id -u)/$label" | head -n 20
          worklane down --root "$RUNNER_TEMP/example"
          if [ -e "$plist" ]; then echo "down left $plist" >&2; exit 1; fi
          if launchctl print "gui/$(id -u)/$label" > /dev/null 2>&1; then echo "down left $label loaded" >&2; exit 1; fi
      - name: the demo, from the installed package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          worklane --version
          worklane demo "$RUNNER_TEMP/demo"

  bootstrap-windows:
    # Windows' documented route, local mode inside WSL2 (Ubuntu 24.04, systemd on), end to end as the bootstrap job
    # runs it: this commit's engine packed inside the distro, then, as a plain user, the bootstrap
    # (which fetches its own Node; nothing of ours is preinstalled), init's checklist, doctor green and naming the OS as
    # WSL, `worklane up` / `down` as a systemd --user unit, and the demo. No GitHub: the same stand-ins. Not a
    # required check on PRs; batched on main, and one of the updater's checks. WSL setup: Vampire/setup-wsl
    # (Apache-2.0), used as an action, nothing copied. #214 (closed) explored the Windows side.
    name: bootstrap (windows-wsl)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' bootstrap-windows ') }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: wsl-bash {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WSL2, Ubuntu 24.04, systemd on
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: xz-utils
          wsl-conf: |
            [boot]
            systemd=true
      - name: a plain user to install as (local mode runs as you), with a systemd --user manager
        run: |
          [ "$(ps -p 1 -o comm=)" = systemd ] || { echo "PID 1 is $(ps -p 1 -o comm=), not systemd" >&2; exit 1; }
          uname -r; grep -i microsoft /proc/version
          useradd -m -s /bin/bash wl
          loginctl enable-linger wl
          for _ in $(seq 30); do systemctl is-active --quiet user@"$(id -u wl)".service && break; sleep 1; done
          systemctl is-active user@"$(id -u wl)".service
      - name: pack this commit's engine inside WSL (dist/ and the web UI built, as in a release), with a Node that's gone after
        run: |
          ws="$(wslpath -u '${{ github.workspace }}')" home="$(getent passwd wl | cut -d: -f6)"
          # The bootstrap's own pinned Node, in a scratch place off every PATH, removed once the tarball is made.
          v="$(sed -n 's/^NODE_VERSION=//p' "$ws/scripts/bootstrap.sh")"
          sum="$(sed -n 's/^NODE_SHA256_LINUX_X64=//p' "$ws/scripts/bootstrap.sh")"
          curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/$v/node-$v-linux-x64.tar.xz"
          echo "$sum  /tmp/node.tar.xz" | sha256sum -c -
          mkdir -p /opt/pack-node && tar -xJf /tmp/node.tar.xz -C /opt/pack-node --strip-components 1
          mkdir -p /root/src && tar -C "$ws" --exclude=./.git -cf - . | tar -C /root/src -xf -
          (
            export PATH="/opt/pack-node/bin:$PATH"
            cd /root/src
            npm ci --ignore-scripts --no-audit --no-fund
            npm run build && npm run build:web
            npm pack --pack-destination "$home" > /dev/null
          )
          rm -rf /opt/pack-node /tmp/node.tar.xz /root/src
          chown wl: "$home"/*.tgz && ls -l "$home"/*.tgz
      - name: no GitHub from here on (a stand-in gh, signed in, that reaches nothing; a stand-in claude, signed in)
        run: |
          ws="$(wslpath -u '${{ github.workspace }}')" h="$(getent passwd wl | cut -d: -f6)" uid="$(id -u wl)"
          install -d -o wl -g wl "$h/stand-ins" && install -o wl -g wl -m 0755 "$ws"/scripts/ci/stand-ins/* "$h/stand-ins/"
          # What every later step sources first: it stops the step unless it runs as wl.
          {
            echo '[ "$(id -un)" = wl ] || { echo "this step runs as $(id -un), not wl" >&2; exit 1; }'
            echo "H=$h WS=$ws"
            echo "export PATH=\"$h/stand-ins:$h/.local/bin:\$PATH\""
            echo "export XDG_RUNTIME_DIR=/run/user/$uid DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus"
            echo 'echo "as $(id -un), HOME=$HOME"'
          } > /etc/wl-ci.env
          cat /etc/wl-ci.env
      - name: the next steps run as that user (a wsl-sudo shell)
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          wsl-shell-command: sudo -iu wl bash -euo pipefail
      - name: as wl, no Node yet (the bootstrap fetches its own)
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          if command -v node; then echo "node is already here; the bootstrap must fetch its own" >&2; exit 1; fi
      - name: bootstrap in local mode, twice, each ending with the same one wizard URL that answers
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          ex="$H/example"
          cp -r "$WS/examples/basic" "$ex" && git -C "$ex" init -q
          # Its CI's check named: init finishes only with a CI chosen (#469; the refusal is add-project's job's).
          printf 'required_checks: [test]\n' >> "$ex/.worklane/config.yaml"
          git -C "$ex" remote add origin https://github.com/example-org/example-shop.git
          tgz="$(ls "$H"/*.tgz)"
          bash "$WS/scripts/bootstrap.sh" --dry-run --mode local --engine "$tgz" "$ex"
          bash "$WS/scripts/bootstrap.sh" --mode local --yes --engine "$tgz" "$ex" | tee "$H/first.log"
          [ "$(grep -cE '^   done: ' "$H/first.log")" = 5 ] || { echo "not every required step was done" >&2; exit 1; }
          grep -q 'all 6 steps done or skipped' "$H/first.log"
          kf="$(awk '/^  the page asks once for the dashboard key, in this file/{getline; sub(/^ +/, ""); print; exit}' "$H/first.log")"
          [ "$(stat -c %a "$kf")" = 600 ]
          u1="$(bash "$WS/scripts/ci/wizard-url.sh" "$H/first.log" "$kf" /api/first-run | tail -n 1)"
          bash "$WS/scripts/bootstrap.sh" --engine "$tgz" "$ex" < /dev/null | tee "$H/second.log"
          if grep -E 'added [0-9]+ package|would download|installed [a-z]+ [0-9]|kept .worklane/|init --mode|started in the background' "$H/second.log"; then echo "the second run did something again" >&2; exit 1; fi
          grep -q 'no --mode, and no terminal to ask on: local mode' "$H/second.log"
          grep -q 'already running; nothing changed' "$H/second.log"
          u2="$(bash "$WS/scripts/ci/wizard-url.sh" "$H/second.log" "$kf" /api/first-run | tail -n 1)"
          [ "$u1" = "$u2" ] || { echo "the URL changed: $u1 / $u2" >&2; exit 1; }
          pkill -f 'dashboard --service --root' || true
      - name: doctor shows the checklist, the OS as WSL, and what local mode can't do
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          worklane doctor --root "$H/example" | tee "$H/doctor.log"
          for id in tools claude github repo-config protection discord; do grep -Eq "^ok +setup $id: " "$H/doctor.log"; done
          grep -Eq '^ok +os: windows-wsl$' "$H/doctor.log"
          grep -Eq '^off +not in local mode: separate OS users: ' "$H/doctor.log"
          grep -Eq '^off +not in local mode: root-run add-project: ' "$H/doctor.log"
      - name: the coordinator as a systemd --user service (worklane up, then down)
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          label=dev.worklane.example-shop
          unit="$H/.config/systemd/user/$label.service"
          worklane up --root "$H/example"
          test -f "$unit"
          systemctl --user is-enabled "$label.service"
          systemctl --user status "$label.service" --no-pager | head -n 20 || true
          worklane down --root "$H/example"
          if [ -e "$unit" ]; then echo "down left $unit" >&2; exit 1; fi
          if systemctl --user is-enabled "$label.service" > /dev/null 2>&1; then echo "down left $label enabled" >&2; exit 1; fi
      - name: the demo, from the installed package
        shell: wsl-sudo {0}
        run: |
          . /etc/wl-ci.env
          worklane --version
          worklane demo "$H/demo"

  testrun-real-systemd:
    # The test-run sandbox on a real host, no mocks: test-user.sh install (rootless Docker, the helper, its check),
    # then the coordinator's own sandbox host, as the coordinator user through its real sudoers rule, against real
    # systemd-run (the other jobs stand in for sudo and the helper). scripts/ci/testrun-real-systemd.mjs has the
    # assertions; its log shows systemd-run's raw summary, the text test/fixtures/systemd-run-255/ holds.
    name: test-run sandbox (real systemd)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' testrun-real-systemd ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run:
        shell: bash # -eo pipefail: a failed install isn't hidden by its tee
    env:
      # The second instance's name is as long as the helper takes (21), so a run's paths are the longest a host has.
      I2: ci2-sandbox-long-name
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - name: the host
        run: |
          systemd-run --version | head -1
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          nproc
      - name: a coordinator user and the full-run lock (what instance.sh and the machine script make)
        run: |
          # Two instances, so each test user's check also proves it can't reach the other's state.
          for u in wl-ci "wl-$I2"; do
            sudo useradd --create-home --shell /bin/bash "$u"
            sudo chmod 0750 "$(getent passwd "$u" | cut -d: -f6)"
          done
          sudo install -o root -g root -m 0644 /dev/null /run/lock/worklane-full-run.lock
      - name: a coordinator checkout's pre-push hook refuses the default branch (checkout.sh's hook step)
        run: |
          # A remote with a main, cloned as checkout.sh clones (origin/HEAD set), then the hook step checkout.sh runs.
          t="$(mktemp -d)"
          id=(-c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false)
          git init -q --bare -b main "$t/remote.git"
          git init -q -b main "$t/seed" && git -C "$t/seed" "${id[@]}" commit -q --allow-empty -m init && git -C "$t/seed" push -q "$t/remote.git" main
          git clone -q "$t/remote.git" "$t/checkout"
          git -C "$t/checkout" "${id[@]}" commit -q --allow-empty -m change
          (cd "$t/checkout" && node "$GITHUB_WORKSPACE/dist/src/cli.js" install --root . --git-hooks-only)
          sudo chown -R root:root "$t/checkout/.git/hooks" && sudo chmod 0755 "$t/checkout/.git/hooks"
          if [ -w "$t/checkout/.git/hooks/pre-push" ]; then echo "the hook is writable by the checkout's user" >&2; exit 1; fi
          for spec in HEAD:main HEAD:refs/heads/main +HEAD:main; do
            if git -C "$t/checkout" push origin "$spec" 2> "$RUNNER_TEMP/push.log"; then echo "pushed $spec through the hook" >&2; exit 1; fi
            grep -q 'refusing to push refs/heads/main, the default branch' "$RUNNER_TEMP/push.log"
          done
          [ "$(git -C "$t/remote.git" rev-parse main)" = "$(git -C "$t/seed" rev-parse HEAD)" ] || { echo "main moved" >&2; exit 1; }
          git -C "$t/checkout" push -q origin HEAD:refs/heads/worklane/issue-1
          echo "main refused, a task branch pushed"
      - name: test-user.sh install, in full
        run: |
          n="$(nproc)"
          sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/install.log"
          tail -n 5 "$RUNNER_TEMP/install.log" | grep -qx 'OK: all checks passed'
          # An older install's Docker unit, still running: install must restart it into the new layout by itself.
          u=/etc/systemd/system/worklane-test-ci-docker.service
          sudo sed -i -e '/^DelegateSubgroup=/d' -e 's/^Delegate=.*/Delegate=yes/' "$u"
          sudo systemctl daemon-reload && sudo systemctl restart worklane-test-ci-docker.service
          if sudo bash scripts/setup/test-user.sh check ci > "$RUNNER_TEMP/old.log"; then echo "check passed on the old layout" >&2; exit 1; fi
          grep -q '^FAIL Docker' "$RUNNER_TEMP/old.log"
          # With a run in progress, install refuses to restart Docker under it, and says why.
          sudo sed -i -e '/^DelegateSubgroup=/d' "$u"; sudo install -d -o root -g root -m 0700 /var/lib/worklane-test/ci/runs/fast-inprogress
          if sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G > "$RUNNER_TEMP/busy.log" 2>&1; then echo "install restarted Docker under a run" >&2; exit 1; fi
          grep -q 'test runs of ci are in progress' "$RUNNER_TEMP/busy.log"
          sudo rmdir /var/lib/worklane-test/ci/runs/fast-inprogress
          # No run in progress: the re-run restarts Docker and check passes, with no manual restart.
          sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/reinstall.log"
          grep -q '^restarted worklane-test-ci-docker.service' "$RUNNER_TEMP/reinstall.log"
