          sudo rm -f /tmp/siri-ci-token
          # Every root record re-keyed; none of ci's left.
          sudo jq -e '(.instances|has("ci")|not) and (.instances|has("kilo")|not)' /etc/worklane/testrun-gpu.json
          grep -q "note: ci's GPU grant (GPU 0) is not moved: ci has no test user" "$F/rn5.out"
          grep -q "note: ci's test-run network grant (tiers e2e) is not moved: ci has no test user" "$F/rn5.out"
          sudo jq -e '(.instances|has("ci")|not) and (.instances|has("kilo")|not)' /etc/worklane/testrun-network.json
          grep -qF "dropped  experiments.sh remove ci (experiments aren't moved" "$F/rn5.out"
          # The old home's notes/ survived into the archive, root's 0600, listed by path and size.
          kt="$(sudo sh -c 'ls -1 /var/lib/worklane/removed/ci-to-kilo-*.home-dirs.tar')"; kl="${kt%.tar}.txt"
          for f in "$kt" "$kl"; do [ "$(sudo stat -c '%U:%G %a' "$f")" = "root:root 600" ] || { sudo stat -c '%n %U:%G %a' "$f"; exit 1; }; done
          [ "$(sudo tar -xOf "$kt" notes/keep-me.txt)" = "kept across the rename" ]
          sudo grep -qxF "$(printf 'notes/keep-me.txt\t23')" "$kl"
          grep -qF "$(printf 'notes/keep-me.txt\t23')" "$F/rn5.out"
          grep -qF "  - experiments.sh remove ci (experiments aren't moved" "$F/rn5.out"
          grep -qF "  - /var/lib/worklane/agent-slots/discord-claim-ci.json (the new name's coordinator writes its own" "$F/rn5.out"
          for u in wl-exp-ci wl-score-ci wl-exp-kilo wl-score-kilo; do if id "$u" 2>/dev/null; then echo "$u is left" >&2; exit 1; fi; done
          for p in /var/lib/worklane-exp/ci /etc/worklane/experiments/ci.json /etc/sudoers.d/worklane-exp-ci /var/lib/worklane-exp/kilo /etc/worklane/experiments/kilo.json; do if sudo test -e "$p"; then echo "$p is left" >&2; exit 1; fi; done
          for u in $exp_uids; do if sudo grep -qx "$u" /etc/worklane/egress.users; then echo "the egress rule still names uid $u" >&2; exit 1; fi; done
          # ci's plugins and MCP broker: not moved, said so, and none left under either name.
          grep -qF "  - /etc/worklane/plugins/ci.json (plugins aren't moved" "$F/rn5.out"
          grep -qF "(its MCP broker isn't moved: mcp-broker.sh <new>" "$F/rn5.out"
          for u in wl-ci-mcp wl-kilo-mcp; do if id "$u" 2>/dev/null; then echo "$u is left" >&2; exit 1; fi; done
          for n in ci kilo; do
            bu="worklane-mcp@${n}.service"
            if systemctl is-active -q "$bu" || systemctl is-enabled -q "$bu" 2>/dev/null; then echo "$bu runs or is enabled" >&2; exit 1; fi
            for p in "/etc/worklane/plugins/$n.json" "/var/lib/worklane/plugins/store/$n" "/var/lib/worklane/plugins/previews/$n" "/var/lib/worklane/plugins/fetch-status/$n.json" "/var/lib/worklane-mcp-$n"; do if sudo test -e "$p"; then echo "$p is left" >&2; exit 1; fi; done
          done
          sudo jq -e '[.entries[] | select(.instance=="ci" or .instance=="kilo")] | length == 0' /var/lib/worklane/plugins/pending.json
          sudo jq -e '(.active|has("ci")|not) and .active["kilo"].profile=="ci-shared" and (.failover.instances|has("kilo")) and (.profiles["ci-shared"].users["wl-kilo-agent"].instance=="kilo") and (.profiles["ci-shared"].users|has("wl-ci-agent")|not)' /var/lib/worklane/claude-account/profiles.json
          sudo jq -e '([.users[] | select(.instance=="ci")] | length == 0) and ([.users[] | select(.instance=="kilo" and .user=="wl-kilo-agent")] | length > 0)' /var/lib/worklane/claude-account/status.json
          sudo grep -qx kilo /var/lib/worklane/claude-account/paused && ! sudo grep -qx ci /var/lib/worklane/claude-account/paused
          sudo jq -e '.canary.instance=="kilo"' /etc/worklane/updates.json
          sudo jq -e '[.incidents[] | select(.id=="ciciok01")][0] | .instance=="kilo" and .key=="worklane-kilo.service"' /var/lib/worklane/agent-slots/incidents.json
          sudo jq -e '[.incidents[] | select(.instance=="ci")] | length == 0' /var/lib/worklane/agent-slots/incidents.json
          sudo jq -e '[.pending[] | select(.instance=="ci")] | length == 0' /var/lib/worklane/pending-signers.json
          # The helper's rule and the hub with kilo, never ci; the hub's Siri gateway kept.
          sudo grep -qxF "$RN_HELPER ALL=(root) NOPASSWD: WORKLANE_MACHINE" /etc/sudoers.d/worklane-machine
          hub=/etc/systemd/system/worklane-dashboard-hub.service
          grep -q -- '--hub kilo=' "$hub" && grep -q -- ' --siri-port 4397' "$hub"
          if grep -qE -- '--hub (.*,)?ci=' "$hub"; then echo "the hub still serves ci" >&2; exit 1; fi
          sudo -n -l -U wl-kilo "$HELPER" set-slots 1 >/dev/null
          sudo tail -n 1 /var/lib/worklane/machine-changes.jsonl | jq -e '.what=="instance.renamed" and .from=="ci" and .to=="kilo"'
          [ "$(sudo sh -c 'ls -1 /var/lib/worklane/removed/ci-*.bundle' | wc -l)" = 2 ]
          # A rerun: done already.
          sudo bash scripts/setup/instance-rename.sh ci kilo --yes | grep -q 'ci was renamed to kilo already'
      - name: the units and the fake's log, on failure
        if: failure()
        run: |
          sudo cat /var/lib/worklane/tailscale/steps.jsonl || true
          sudo journalctl --no-pager -n 80 -u worklane-tailscale.service -u tailscaled.service || true
          tail -n 80 "$F2"/*.log || true
          sudo journalctl --no-pager -n 60 -u worklane-gamma.service || true
          sudo systemctl --no-pager status worklane-ci.service worklane-dashboard-ci.service worklane-dashboard-hub.service worklane-beta.service || true
          sudo journalctl --no-pager -n 80 -u worklane-ci.service -u worklane-dashboard-ci.service -u worklane-dashboard-hub.service -u worklane-dashboard-hub-setup.service -u worklane-beta.service -u worklane-claude-account.service || true
          sudo cat /var/lib/worklane/claude-account/switch.jsonl || true
          cat "$F"/rm*.out "$F"/rm*.err "$F/rm-print.txt" "$F"/rn*.out "$F"/rn*.err 2>/dev/null || true
          sudo journalctl --no-pager -n 60 -u worklane-kilo.service -u worklane-dashboard-kilo.service -u worklane-gamma.service || true
          tail -n 80 "$F/requests.log" "$F/server.log" || true
          tail -n 80 "$F"/run*.err || true
          sudo journalctl --no-pager -n 80 -u "worklane-mcp@ci" || true

  auth-probe-real-users:
    # The watchdog's Claude sign-in probe on a real host: instance.sh's coordinator and agent users (separate homes,
    # 0700) and its real sudoers rule; the agent user signed in to a stand-in claude that reads the login under the
    # HOME it is given; the probe run as the coordinator through sudo, as its service runs it, finds it signed in.
    # scripts/ci/auth-probe-real-users.mjs has the assertions; scripts/ci/project-command-real-users.mjs has those of a
    # project command's sandbox there (#713).
    name: Claude sign-in probe (real users)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' auth-probe-real-users ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - name: the instance's users and sudoers rule (instance.sh), and the stand-in claude
        run: |
          sudo bash scripts/setup/instance.sh probe
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          sudo install -m 0755 scripts/ci/claude-stand-in.cjs /usr/local/bin/claude
      - name: the agent user signed in, in its own home only
        run: |
          a="$(getent passwd wl-probe-agent | cut -d: -f6)" && c="$(getent passwd wl-probe | cut -d: -f6)"
          [ "$a" != "$c" ]
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"
          sudo install -d -o wl-probe-agent -g wl-probe-agent -m 0700 "$a/.claude"
          printf '{"claudeAiOauth":{"accessToken":"%s"}}\n' "$t" | sudo -u wl-probe-agent sh -c 'umask 077 && cat > "$1"' _ "$a/.claude/.credentials.json"
          unset t
          sudo -H -u wl-probe-agent env PATH=/usr/local/bin:/usr/bin:/bin claude auth status --json | jq -e '.loggedIn == true'
          sudo -H -u wl-probe env PATH=/usr/local/bin:/usr/bin:/bin claude auth status --json | jq -e '.loggedIn == false'
      - name: credentials.sh claude (first run's server sign-in) installs a pasted setup token for the agent user only, 0600, never echoed
        # The terminal half of wizard screen 2: the token on stdin, as automation (and a no-tty run) passes it. Not a
        # real token: the stand-in claude says signed in for any sk-ant-oat01- token in the agent user's own home.
        run: |
          a="$(getent passwd wl-probe-agent | cut -d: -f6)"
          f="$a/.claude/.credentials.json"
          sudo rm -f "$f"
          # A bad token: refused, nothing installed, never echoed.
          bad="not-a-token-$(openssl rand -hex 16)"
          if printf '%s\n' "$bad" | sudo bash scripts/setup/credentials.sh probe claude > "$RUNNER_TEMP/bad.out" 2>&1; then echo "a bad token was accepted"; exit 1; fi
          cat "$RUNNER_TEMP/bad.out"
          if grep -qF "$bad" "$RUNNER_TEMP/bad.out"; then echo "the bad token was echoed"; exit 1; fi
          grep -q 'not a token from claude setup-token' "$RUNNER_TEMP/bad.out"
          if sudo test -e "$f"; then echo "a bad token installed something"; exit 1; fi
          # A good one: installed as the agent user's own Claude login, 0600 in its 0700 ~/.claude, and checked.
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"
          printf '%s\n' "$t" | sudo bash scripts/setup/credentials.sh probe claude > "$RUNNER_TEMP/good.out" 2>&1
          cat "$RUNNER_TEMP/good.out"
          if grep -qF "${t#sk-ant-oat01-}" "$RUNNER_TEMP/good.out"; then echo "the token was echoed"; exit 1; fi
          grep -q 'wl-probe-agent is signed in to Claude, per claude auth status' "$RUNNER_TEMP/good.out"
          [ "$(sudo stat -c '%U %a' "$f")" = "wl-probe-agent 600" ]
          [ "$(sudo stat -c '%U %a' "$a/.claude")" = "wl-probe-agent 700" ]
          printf '%s' "$t" | sudo node -e 'const fs = require("node:fs"); process.exit(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).claudeAiOauth.accessToken === fs.readFileSync(0, "utf8") ? 0 : 1)' "$f"
          unset t
          if sudo -u wl-probe cat "$f" > /dev/null 2>&1; then echo "the coordinator user can read the agent's login"; exit 1; fi
          sudo -H -u wl-probe-agent env PATH=/usr/local/bin:/usr/bin:/bin claude auth status --json | jq -e '.loggedIn == true'
          # No interactive /login session is ever started: the script never runs claude but to check.
          if grep -n '/login' scripts/setup/credentials.sh; then echo "credentials.sh still names /login"; exit 1; fi
      - name: the probe, as the coordinator through sudo, finds the agent user signed in
        run: |
          # What wl-probe runs, world-readable: the build, its dependencies, node and the driver.
          t="$(mktemp -d /tmp/wl-probe-XXXXXX)"
          mkdir -p "$t/node_modules"
          cp -r dist package.json "$t/"
          cp -r node_modules/yaml node_modules/zod "$t/node_modules/"
          cp scripts/ci/auth-probe-real-users.mjs "$t/"
          chmod -R a+rX "$t"
          a="$(getent passwd wl-probe-agent | cut -d: -f6)"
          sudo -u wl-probe env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-probe | cut -d: -f6)" USER=wl-probe LOGNAME=wl-probe LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec node "$1/auth-probe-real-users.mjs" "$1/dist" wl-probe-agent "$2"' _ "$t" "$a"
      - name: "a project command (#713), as the coordinator through sudo to the agent user, reads neither the agent's Claude login nor its API key: bubblewrap from machine.sh, the real sandbox"
        run: |
          sudo apt-get update -q && sudo bash scripts/setup/machine.sh
          # check.sh probes that the agent user can start bubblewrap with the flags project commands use (its other lines
          # need more setup than this job has).
          sudo bash scripts/setup/check.sh probe | tee "$RUNNER_TEMP/check.log" || true
          grep -qx "PASS wl-probe-agent can start a project command's sandbox" "$RUNNER_TEMP/check.log"
          a="$(getent passwd wl-probe-agent | cut -d: -f6)"
          # A stand-in API key where credentials.sh <name> api-key puts one (never a real key).
          k="sk-ant-api03-$(openssl rand -hex 24)"; echo "::add-mask::$k"
          printf '%s' "$k" | sudo -u wl-probe-agent sh -c 'umask 077 && mkdir -p "$1" && cat > "$1/api_key"' _ "$a/.config/probe-claude-key"
          unset k
          # A secret store of the agent's, reached through a symlink in a root-owned directory (which the agent can't
          # change): the only layout whose symlink a project command's sandbox follows rather than refuses.
          k="sk-ant-api03-$(openssl rand -hex 24)"; echo "::add-mask::$k"
          printf '%s' "$k" | sudo -u wl-probe-agent sh -c 'umask 077 && mkdir -p "$1" && cat > "$1/key"' _ "$a/secret-store"
          unset k
          sudo install -d -o root -g root -m 0755 /opt/wl-713-link
          sudo ln -s "$a/secret-store" /opt/wl-713-link/store
          t="$(mktemp -d /tmp/wl-project-command-XXXXXX)"
          mkdir -p "$t/node_modules"
          cp -r dist package.json "$t/"
          cp -r node_modules/yaml node_modules/zod "$t/node_modules/"
          cp scripts/ci/project-command-real-users.mjs "$t/"
          git init -q -b main "$t/checkout"
          git -C "$t/checkout" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q --allow-empty -m 'the coordinator checkout'
          chmod -R a+rX "$t"
          sudo chown -R wl-probe "$t/checkout"
          sudo -u wl-probe env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-probe | cut -d: -f6)" USER=wl-probe LOGNAME=wl-probe LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec node "$1/project-command-real-users.mjs" "$1/dist" wl-probe-agent "$2" "$1/checkout" /opt/wl-713-link/store' _ "$t" "$a" < /dev/null
          # The unit tests' real-sandbox cases, here required to run (elsewhere they skip without bubblewrap): the
          # isolation tests, and separate-users' check that runs git as another user (nobody) in a checkout it doesn't own.
          PROJECT_SANDBOX_REQUIRED=1 node --import ./dist/test/isolate.js --test dist/test/project-command-isolation.test.js dist/test/separate-users.test.js

  wizard-e2e-real-systemd:
    # The first-run wizard end to end, the way a person walks it, on a fresh runner with real systemd: the one install
    # command, the one URL it prints, that URL in headless Chrome (scripts/ci/wizard-e2e.mjs: real clicks, the key page
    # given the key file), each screen in order with its effect on the machine checked, one screen skipped, one rerun
    # from Settings, every screen's "Without this page" line, and the project's dashboard at the end. Local mode first
    # (as the runner user, systemd --user), then server mode (bootstrap --hardened as root: with no https origin, setup
    # mode on loopback and the ssh -L line, its App step pointing to screen 7; then the origin, the sign-in App, the first
    # project through add-project.sh, then the hub's break-glass). Outside services are stand-ins, never a host override: gh, claude and
    # git's ssh to github.com (scripts/ci/wizard-stand-ins/), the fake GitHub behind the loopback stand-in, the hub
    # stand-in for the App's approval, and the tailscale CLI after its real install. Last, no secret in any URL the
    # browser asked for, any log, the journal, or any process's arguments.
    name: wizard end to end (real systemd)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' wizard-e2e-real-systemd ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      GH_FAKE: http://127.0.0.1:8999
      LOOPBACK: --import=/opt/worklane/current/scripts/ci/loopback-github.mjs
      HELPER: /usr/local/libexec/worklane-machine
      # The same nothing-from-GitHub as the bootstrap job: no token in any step's environment.
      GH_TOKEN: ''
      GITHUB_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: this commit's engine, built and packed as a release ships it
        run: |
          npm ci --no-audit --no-fund && npm run build && npm run build:web
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          F="$RUNNER_TEMP/wiz" && mkdir -p "$F" && chmod 0700 "$F"
          { echo "F=$F"; echo "TGZ=$(ls "$RUNNER_TEMP"/*.tgz)"; echo "WIZARD_STANDIN_DIR=$RUNNER_TEMP/standin"; } >> "$GITHUB_ENV"
      - name: every process's arguments, sampled twice a second from here to the end (for the leak check)
        run: |
          nohup bash -c 'while :; do ps -e -ww -o args=; sleep 0.5; done | awk "!seen[\$0]++" > "$1"' _ "$F/argv.txt" > /dev/null 2>&1 &
          echo "$!" > "$F/argv.pid"
      # ---------------------------------------------------------------- local mode
      - name: "local mode: a repo with no config, signed out of Claude and GitHub; the one command ends with one URL"
        run: |
          d="$WIZARD_STANDIN_DIR" && mkdir -p "$d/git/example" "$RUNNER_TEMP/seed"
          echo "$GITHUB_WORKSPACE/scripts/ci/wizard-stand-ins" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/scripts/ci/wizard-stand-ins:$PATH"
          # GitHub's side of the repo: a bare repo the ssh stand-in serves as github.com:example/alpha.git.
          printf 'alpha\n' > "$RUNNER_TEMP/seed/README.md" && printf 'test:\n\t@echo ok\n' > "$RUNNER_TEMP/seed/Makefile"
          git init -q --bare -b main "$d/git/example/alpha.git"
          git -C "$RUNNER_TEMP/seed" init -q -b main && git -C "$RUNNER_TEMP/seed" add README.md Makefile
          git -C "$RUNNER_TEMP/seed" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q -m init
          git -C "$RUNNER_TEMP/seed" push -q "$d/git/example/alpha.git" main
          git config --global core.sshCommand "$GITHUB_WORKSPACE/scripts/ci/wizard-stand-ins/ssh"
          git config --global user.email owner@example.com && git config --global user.name owner
          git clone -q github.com:example/alpha.git "$RUNNER_TEMP/alpha"
          # The runner user's own systemd manager, as a desktop login has one (Start installs a systemd --user unit).
          sudo loginctl enable-linger "$USER"
          rt="/run/user/$(id -u)"
          for _ in $(seq 1 30); do [ -S "$rt/bus" ] && break; sleep 1; done
          { echo "XDG_RUNTIME_DIR=$rt"; echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$rt/bus"; } >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR="$rt" DBUS_SESSION_BUS_ADDRESS="unix:path=$rt/bus"
          systemctl --user is-system-running || true
          claude auth status && { echo "the stand-in claude starts signed in" >&2; exit 1; } || true
          gh auth status && { echo "the stand-in gh starts signed in" >&2; exit 1; } || true
          # The one command, as a person runs it: no --mode and no terminal (local, said so).
          bash scripts/bootstrap.sh --engine "$TGZ" "$RUNNER_TEMP/alpha" < /dev/null | tee "$F/local-install.log"
          kf="$(awk '/^  the page asks once for the dashboard key, in this file/{getline; sub(/^ +/, ""); print; exit}' "$F/local-install.log")"
          [ "$(stat -c '%U %a' "$kf")" = "$USER 600" ]
          u="$(bash scripts/ci/wizard-url.sh "$F/local-install.log" "$kf" /api/first-run | tail -n 1)"
          { echo "LOCAL_URL=$u"; echo "LOCAL_KEY=$kf"; } >> "$GITHUB_ENV"
          echo "the install's one URL: $u"
      # One tab, the whole walk, nothing typed in a terminal after the install: no git pull after a merge, and no
      # dashboard restart for Protect to see the merged checks (owner, #393).
      - name: "local mode, in the browser: Claude sign-in, Connect GitHub, the repo config and its form, a skip, hooks, Protect, every automation line, rerun from Settings, Start, the dashboard (screens 1-4, 6, 10)"
        run: |
          before="$(pgrep -f "dashboard --service --root $RUNNER_TEMP/alpha")"
          node scripts/ci/wizard-e2e.mjs local "$GITHUB_WORKSPACE/dist" "$LOCAL_URL" "$LOCAL_KEY" "$F/browser" "$RUNNER_TEMP/alpha" | tee "$F/walk-local.jsonl"
          # The same dashboard process served the whole walk, and the checkout is at "GitHub's" main without a pull.
          [ "$(pgrep -f "dashboard --service --root $RUNNER_TEMP/alpha")" = "$before" ] || { echo "the dashboard was restarted during the walk" >&2; exit 1; }
          [ "$(git -C "$RUNNER_TEMP/alpha" rev-parse HEAD)" = "$(git -C "$WIZARD_STANDIN_DIR/git/example/alpha.git" rev-parse main)" ]
      - name: "local mode: the coordinator's systemd --user unit, then down; the dashboard stopped"
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          label="$(jq -r 'select(.screen? and (.screen|startswith("Start:"))) | .detail.unit' "$F/walk-local.jsonl")"
          [ -n "$label" ] && [ "$label" != null ]
          systemctl --user is-active "$label"
          unit="$(systemctl --user show -p FragmentPath --value "$label")"
          [ "$(stat -c '%U' "$unit")" = "$USER" ]
          worklane down --root "$RUNNER_TEMP/alpha"
          if systemctl --user is-active -q "$label"; then echo "down left $label running" >&2; exit 1; fi
          pkill -f "dashboard --service --root $RUNNER_TEMP/alpha" || true
      # ---------------------------------------------------------------- server mode
      - name: "server mode: the one command (bootstrap --hardened, as root) with this commit's engine; with no https origin yet, it still ends with one URL that answers: setup mode on 127.0.0.1 only, the ssh -L line, no token in the URL or the log"
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q acl
          sha="$(git rev-parse HEAD)"
          # This commit's engine where engine.sh puts it, built (engine.sh finds it there and only links it).
          sudo chmod 0755 /opt && sudo install -d -m 0755 /opt/worklane
          sudo cp -a "$GITHUB_WORKSPACE" "/opt/worklane/$sha"
          sudo chown -R root:root "/opt/worklane/$sha" && sudo chmod -R a+rX,go-w "/opt/worklane/$sha"
          # The install command from a root-owned copy of this checkout whose pinned engine is this commit, its origin
          # itself (engine.sh clones the origin of the scripts it runs from). Only ENGINE_TAG differs, in the copy.
          b=/var/tmp/wizard-boot
          sudo rsync -a --exclude node_modules --exclude dist "$GITHUB_WORKSPACE/" "$b/"
          sudo chown -R root:root "$b"
          sudo git -C "$b" remote set-url origin "$b"
          sudo sed -i "s/^ENGINE_TAG=.*/ENGINE_TAG=$sha/" "$b/scripts/bootstrap.sh"
          [ "$(sudo git -C "$b" diff --name-only)" = scripts/bootstrap.sh ]
          echo "BOOT=$b" >> "$GITHUB_ENV"
          rc=0; sudo bash "$b/scripts/bootstrap.sh" --hardened --yes --machine-owner ci-owner ci example/alpha > "$F/server-install.log" 2>&1 || rc=$?
          tail -n 15 "$F/server-install.log"
          [ "$(readlink -f /opt/worklane/current)" = "/opt/worklane/$sha" ]
          id wl-ci && id wl-ci-agent
          jq -e '.owners == ["ci-owner"]' /etc/worklane/machine-owners.json
          # No https origin (no Tailscale here, no --public-url). Until 2026-10-14 this was exit 4 with no URL (#402); the
          # owner changed the product: the one command always ends with a working URL. Setup mode on loopback only, its
          # URL last (checked to answer 200 first), and above it the ssh -L line to run from the owner's own computer.
          [ "$rc" = 0 ] || { echo "expected exit 0 with no origin (setup mode on loopback), got $rc" >&2; exit 1; }
          u="$(tail -n 1 "$F/server-install.log")"
          [ "$u" = http://127.0.0.1:4399/ ] || { echo "the install's last line: $u" >&2; exit 1; }
          closing="$(awk '/^== /{b=""} {b=b $0 "\n"} END{printf "%s", b}' "$F/server-install.log")"
          [ "$(grep -c '://' <<< "$closing")" = 1 ] || { echo "more than one URL in: $closing" >&2; exit 1; }
          # Who ran sudo (the runner's user) at this machine's name.
          grep -qxF "   From your own computer, first: ssh -L 4399:127.0.0.1:4399 $USER@$(hostname)" "$F/server-install.log"
          grep -qF 'the page shows Tailscale and HTTPS (screen 7)' "$F/server-install.log"
          systemctl is-active worklane-dashboard-hub-setup.service
          systemctl show -p ExecStart --value worklane-dashboard-hub-setup.service | grep -qF ' --loopback '
          [ "$(curl -s -o "$F/loopback-page.html" -w '%{http_code}' "$u")" = 200 ]
          grep -q 'This hub is in setup mode' "$F/loopback-page.html"
          # Loopback only: nothing listens on 4399 but 127.0.0.1, and the runner's other address doesn't reach it.
          ss -ltnH 'sport = :4399' | tee "$F/loopback-listen.txt"
          [ "$(awk '{print $4}' "$F/loopback-listen.txt" | sort -u)" = 127.0.0.1:4399 ]
          ip4="$(hostname -I | tr ' ' '\n' | grep -E '^[0-9]+(\.[0-9]+){3}$' | grep -v '^127\.' | head -1)"
          [ -n "$ip4" ] || { echo "no other IPv4 address on this runner to try" >&2; exit 1; }
          other="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$ip4:4399/" || true)"
          [ "$other" = 000 ] || { echo "http://$ip4:4399/ answered $other: setup mode reached off loopback" >&2; exit 1; }
          # A proxied request (tailscale serve's headers) is refused, as on the break-glass.
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 192.0.2.9' "$u")" = 403 ]
          # The token: in its 0600 file of the hub's user, never in the URL or the log (a pattern file, never an argument).
          tf="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/setup-token"
          [ "$(sudo stat -c '%U %a' "$tf")" = "wl-dash 600" ]
          (umask 077; sudo cat "$tf" > "$F/setup-token-loopback")
          echo "::add-mask::$(cat "$F/setup-token-loopback")"
          if grep -qFf "$F/setup-token-loopback" "$F/server-install.log" || printf '%s\n' "$u" | grep -qFf "$F/setup-token-loopback"; then echo "the setup token was printed or is in the URL" >&2; exit 1; fi
          echo "LOOPBACK_URL=$u" >> "$GITHUB_ENV"
          # Anthropic's sign-in stays outside: the stand-in claude (signed in when a user's login holds a setup token).
          sudo install -m 0755 scripts/ci/claude-stand-in.cjs /usr/local/bin/claude
      - name: "server, screen 3 with no origin, in the browser at the loopback URL: the one-time token from its file, then the App step says https first and points to screen 7; GitHub never asked"
        run: node scripts/ci/wizard-e2e.mjs setup-loopback "$GITHUB_WORKSPACE/dist" "$LOOPBACK_URL" "$F/setup-token-loopback" "$F/browser" - | tee "$F/walk-setup-loopback.jsonl"
      - name: "server mode: a fake GitHub with the repo (examples/basic) behind the App's token, reached through the loopback stand-in"
        run: |
          f="$RUNNER_TEMP/fake" && mkdir -p "$f/git/example"
          git init -q --bare -b main "$f/git/example/alpha.git"
          cp -r examples/basic "$f/seed"
          sed -i -e 's|^  repo: example-org/example-shop |  repo: example/alpha |' "$f/seed/.worklane/config.yaml"
          sed -i -e 's|^daily_budget_usd: 40 |daily_budget_usd: 20 |' -e 's|count: 1, max: 4,|count: 1, max: 2,|' "$f/seed/.worklane/agents.yaml"
          git -C "$f/seed" init -q -b main && git -C "$f/seed" add -A
          git -C "$f/seed" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q -m init
          git -C "$f/seed" push -q "$f/git/example/alpha.git" main
          openssl genrsa -traditional -out "$f/app.pem" 2048 2>/dev/null || openssl genrsa -out "$f/app.pem" 2048
          nohup node scripts/ci/fake-github.mjs "$GITHUB_WORKSPACE/dist" 8999 "$f/git" example/alpha "$f/requests.log" "$f/app.pem" > "$f/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf "$GH_FAKE/repos/example/alpha" >/dev/null && break; sleep 1; done
          curl -sf "$GH_FAKE/repos/example/alpha" > /dev/null
          echo "FK=$f" >> "$GITHUB_ENV"
          sudo git config --system url."$GH_FAKE/example/alpha".insteadOf https://github.com/example/alpha
          printf 'Defaults env_keep += "NODE_OPTIONS CI_LOOPBACK_GITHUB_PORT"\n' > "$F/sudoers" && sudo visudo -cf "$F/sudoers" && sudo install -m 0440 "$F/sudoers" /etc/sudoers.d/ci-fake-github
          for u in worklane-ci worklane-dashboard-ci worklane-dashboard-hub worklane-dashboard-hub-setup; do
            sudo install -d "/etc/systemd/system/$u.service.d"
            printf '[Service]\nEnvironment=NODE_OPTIONS=%s CI_LOOPBACK_GITHUB_PORT=8999\n' "$LOOPBACK?port=8999" | sudo tee "/etc/systemd/system/$u.service.d/fake-github.conf" >/dev/null
          done
      # The hub's https origin, as tailscale serve gives it, played on this runner the way #402's proof does: the name
      # hub.example.test on this machine, real TLS from a CA the system trusts, forwarded to the hub's port 4399. It
      # carries nothing to GitHub or any outside service (those stay the fake's, through the loopback stand-in).
      - name: "server mode: the install command again with the origin given and served: it moves setup mode to the origin and ends with one URL that answers 200, no token in it or the log"
        run: |
          pub=https://hub.example.test
          sudo apt-get install -y -q socat > /dev/null
          t="$RUNNER_TEMP/tls" && mkdir -p "$t"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$t/ca.key" -out "$t/ca.pem" -subj /CN=ci-hub-ca -days 2 -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$t/leaf.key" -out "$t/leaf.csr" -subj /CN=hub.example.test 2>/dev/null
          printf 'subjectAltName=DNS:hub.example.test\nextendedKeyUsage=serverAuth\n' > "$t/ext"
          openssl x509 -req -in "$t/leaf.csr" -CA "$t/ca.pem" -CAkey "$t/ca.key" -CAcreateserial -out "$t/leaf.pem" -days 2 -extfile "$t/ext" 2>/dev/null
          sudo cp "$t/ca.pem" /usr/local/share/ca-certificates/ci-hub-ca.crt && sudo update-ca-certificates > /dev/null
          echo '127.0.0.1 hub.example.test' | sudo tee -a /etc/hosts > /dev/null
          sudo sh -c "nohup socat openssl-listen:443,reuseaddr,fork,cert=$t/leaf.pem,key=$t/leaf.key,verify=0 tcp:127.0.0.1:4399 > $t/socat.log 2>&1 &"
          echo "TLS=$t" >> "$GITHUB_ENV"
          rc=0; sudo bash "$BOOT/scripts/bootstrap.sh" --hardened --yes --machine-owner ci-owner --public-url "$pub" ci example/alpha > "$F/server-install-setup.log" 2>&1 || rc=$?
          tail -n 15 "$F/server-install-setup.log"
          [ "$rc" = 0 ] || { echo "exit $rc" >&2; exit 1; }
          systemctl is-active worklane-dashboard-hub-setup.service
          # The origin exists now: setup mode moved from loopback to it, with a new token (the App step goes on there).
          systemctl show -p ExecStart --value worklane-dashboard-hub-setup.service | grep -qF " --public-url $pub "
          u="$(tail -n 1 "$F/server-install-setup.log")"
          [ "$u" = "$pub/" ] || { echo "the install's last line: $u" >&2; exit 1; }
          closing="$(awk '/^== /{b=""} {b=b $0 "\n"} END{printf "%s", b}' "$F/server-install-setup.log")"
          [ "$(grep -c '://' <<< "$closing")" = 1 ]
          [ "$(curl -s -o "$F/setup-page.html" -w '%{http_code}' "$u")" = 200 ]
          grep -q 'This hub is in setup mode' "$F/setup-page.html"
          tf="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/setup-token"
          [ "$(sudo stat -c '%U %a' "$tf")" = "wl-dash 600" ]
          # The token as a pattern file, never an argument (the argv sampler would catch it, and so would ps).
          if sudo grep -qFf "$tf" "$F/server-install-setup.log" || printf '%s\n' "$u" | sudo grep -qFf "$tf"; then echo "the setup token was printed or is in the URL" >&2; exit 1; fi
          echo "SETUP_URL=$u" >> "$GITHUB_ENV"
      # Screen 3 (server): the hub's setup mode makes the sign-in App, at the URL the install printed. Over curl, not
      # Chrome: its manifest form posts to github.com itself, which nothing here may reach. These are that browser's
      # requests, with that origin, and GitHub's redirect back (the fake converts the code).
      - name: "server, screen 3: the sign-in App through the hub's setup mode, at the install's URL (its one-time token from a 0600 file, never in a URL)"
        run: |
          u=worklane-dashboard-hub-setup.service pub=https://hub.example.test h="${SETUP_URL%/}"
          [ "$h" = "$pub" ]
          systemctl is-active "$u"
          tf="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/setup-token"
          [ "$(sudo stat -c '%U %a' "$tf")" = "wl-dash 600" ]
          (umask 077; sudo cat "$tf" > "$F/setup-token")
          echo "::add-mask::$(cat "$F/setup-token")"
          curl -s -D "$F/unlock.h" -o /dev/null -H "Origin: $pub" --data-urlencode "token@$F/setup-token" "$h/setup/unlock"
          c="$(tr -d '\r' < "$F/unlock.h" | sed -n 's/^[Ss]et-[Cc]ookie: \(__Host-setup=[^;]*\);.*/\1/p')"
          [ -n "$c" ]
          csrf="$(curl -s -H "Cookie: $c" "$h/" | sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p')"
          loc="$(curl -s -D - -o /dev/null -H "Cookie: $c" -H "Origin: $pub" --data-urlencode "csrf=$csrf" --data-urlencode owner=example "$h/setup/signin-app" | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')"
          curl -s -H "Cookie: $c" "$h$loc" > "$F/start.html"
          grep -qF 'action="https://github.com/settings/apps/new?state=' "$F/start.html"
          state="$(sed -n 's/.*?state=\([A-Za-z0-9_-]*\)".*/\1/p' "$F/start.html")"
          curl -s -H "Cookie: $c" "$h/setup/app-manifest/callback?state=$state&code=ci-signin-code" | tee "$F/back.html" | grep -q 'GitHub made'
          for _ in $(seq 1 15); do systemctl is-active -q "$u" || break; sleep 1; done
          if systemctl is-active -q "$u"; then echo "setup mode did not turn itself off" >&2; exit 1; fi
          d="$(getent passwd wl-dash | cut -d: -f6)/.config/dashboard-signin"
          for x in client-secret session-secret client-id public-url; do [ "$(sudo stat -c '%U %a' "$d/$x")" = "wl-dash 400" ]; done
          (umask 077; sudo cat "$d/client-secret" > "$F/client-secret")
      # Anthropic's sign-in stays outside: the stand-in claude (signed in when a user's login holds a setup token), pinned
      # here, after the last bootstrap that runs tools.sh (which links /usr/local/bin/claude to the real CLI again). The
      # real CLI refuses CI's random token on the login's proof (#463). Every later step that relies on it checks it first.
      - name: "server: the stand-in claude, pinned after the last tools.sh, for root and the agent user"
        run: bash scripts/ci/claude-stand-in-pin.sh pin wl-ci-agent
      # Screens 5 and 2 (server): the machine's first project. add-project.sh as root (the Setup console's Add project
      # needs a running coordinator to run it, and a fresh machine has none): the agents' App through the manifest flow,
      # approved by the machine owner's browser (scripts/ci/manifest-browser.mjs) on a hub stand-in, since the real hub
      # signs people in at github.com only; the Claude token pasted on stdin.
      - name: "server, screens 5 and 2: the first project: the agents' App through the manifest flow, the Claude token, the checkout, the services"
        run: |
          bash scripts/ci/claude-stand-in-pin.sh check wl-ci-agent
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/claude-token"); unset t
          dd=/etc/systemd/system/worklane-dashboard-hub.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/local/bin/node /opt/worklane/current/scripts/ci/hub-stand-in.mjs /opt/worklane/current/dist %s https://hub.example.test\n' "$GH_FAKE" | sudo tee "$dd/stand-in.conf" >/dev/null
          ( set +e; sudo env NODE_OPTIONS="$LOOPBACK?port=8999" CI_LOOPBACK_GITHUB_PORT=8999 bash scripts/setup/add-project.sh ci example/alpha --timeout 3 < "$F/claude-token" > "$F/add.jsonl" 2> "$F/add.err"; echo "$?" > "$F/add.rc" ) &
          for _ in $(seq 1 90); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4399/auth/login)" = 302 ] && break; sleep 1; done
          node scripts/ci/manifest-browser.mjs "$GITHUB_WORKSPACE/dist" http://127.0.0.1:4399 https://hub.example.test "$GH_FAKE" ci-owner "$F/add.jsonl" "$F/manifest-code" || { cat "$F/add.jsonl"; tail -n 40 "$F/add.err"; exit 1; }
          wait
          cat "$F/add.jsonl"
          [ "$(cat "$F/add.rc")" = 0 ] || { tail -n 60 "$F/add.err"; exit 1; }
          jq -se 'map(select(.state=="failed")) | length == 0' "$F/add.jsonl"
          a="$(getent passwd wl-ci | cut -d: -f6)/.config/ci-app"
          for x in private-key.pem client-secret webhook-secret; do [ "$(sudo stat -c '%U %a' "$a/$x")" = "wl-ci 400" ]; done
          c="$(getent passwd wl-ci-agent | cut -d: -f6)/.claude/.credentials.json"
          [ "$(sudo stat -c '%U %a' "$c")" = "wl-ci-agent 600" ]
          # The real hub, with the instance (the stand-in goes).
          sudo rm -f "$dd/stand-in.conf" && sudo systemctl daemon-reload && sudo systemctl restart worklane-dashboard-hub.service
          for u in worklane-ci worklane-dashboard-ci worklane-dashboard-hub; do systemctl is-active "$u.service"; done
          node --input-type=module -e 'const f = await import(process.argv[1]); process.stdout.write(f.APP_SECRET + "\n" + f.WEBHOOK_SECRET + "\n");' "file://$GITHUB_WORKSPACE/dist/test/fake-github.js" > "$F/app-secrets"
      # With the hub up, the install command ends with the hub's own wizard URL: its https origin while that answers, else
      # the owner's break-glass on the machine. People sign in at the origin with GitHub, which no CI runner can do (the
      # hub's sign-in hosts are constants), so the walk goes on through the break-glass: the origin stops answering
      # (tailscale serve's stand-in goes), and the same command must then print the break-glass URL, which the walk opens.
      - name: "server mode: the install command again: the hub's wizard at its https origin; with the origin gone, the break-glass, which the walk uses"
        run: |
          bash scripts/ci/claude-stand-in-pin.sh check wl-ci-agent
          boot() { sudo env NODE_OPTIONS="$LOOPBACK?port=8999" CI_LOOPBACK_GITHUB_PORT=8999 bash "$BOOT/scripts/bootstrap.sh" --hardened --after-credentials --yes ci example/alpha > "$F/$1" 2>&1 || { cat "$F/$1"; exit 1; }; tail -n 12 "$F/$1"; }
          one_url() { closing="$(awk '/^== /{b=""} {b=b $0 "\n"} END{printf "%s", b}' "$F/$1")"; [ "$(grep -c '://' <<< "$closing")" = 1 ]; }
          boot server-install2.log
          [ "$(tail -n 1 "$F/server-install2.log")" = https://hub.example.test/first-run ]
          one_url server-install2.log
          [ "$(curl -s -o /dev/null -w '%{http_code}' https://hub.example.test/first-run)" = 200 ]
          sudo pkill -f 'socat openssl-listen:443'
          # The signal: the origin refusing connections once the stand-in has exited (bounded at 10 s).
          for _ in $(seq 1 10); do curl -s -o /dev/null https://hub.example.test/ || break; sleep 1; done
          boot server-install3.log
          hk="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/dashboard-token"
          (umask 077; sudo cat "$hk" > "$F/hub-key")
          u="$(bash scripts/ci/wizard-url.sh "$F/server-install3.log" "$F/hub-key" /api/i/ci/first-run | tail -n 1)"
          [ "$u" = http://127.0.0.1:4398/first-run ]
          echo "SERVER_URL=$u" >> "$GITHUB_ENV"
      - name: "server mode, in the browser through the hub: Claude, Protect, the policy, Discord skipped, Tailscale, the updater, every automation line, rerun from Settings, the project's dashboard (screens 2, 6-9, 11)"
        run: |
          bash scripts/ci/claude-stand-in-pin.sh check wl-ci-agent
          node scripts/ci/wizard-e2e.mjs server "$GITHUB_WORKSPACE/dist" "$SERVER_URL" "$F/hub-key" "$F/browser" ci | tee "$F/walk-server.jsonl"
      - name: "the first project's dashboard: the hub lists it, reachable, the coordinator running"
        run: |
          (umask 077; printf 'Authorization: Bearer %s\n' "$(cat "$F/hub-key")" > "$F/hub-auth")
          curl -sf -H @"$F/hub-auth" http://127.0.0.1:4398/api/hub | tee "$F/hub.json"; echo
          jq -e '.instances | length == 1 and .[0].name == "ci"' "$F/hub.json"
          curl -sf -H @"$F/hub-auth" http://127.0.0.1:4398/api/i/ci/first-run | jq -e '[.setup.groups[].steps[] | select(.id == "discord")][0].skipped'
          systemctl is-active worklane-ci.service worklane-dashboard-ci.service worklane-dashboard-hub.service
          rm -f "$F/hub-auth"
      - name: "no secret in any URL the browser asked for, any log or output, the journal, a unit, the machine's state, or any process's arguments"
        run: |
          kill "$(cat "$F/argv.pid")" || true
          # Every secret of the run, "<name><TAB><value>" one per line, in a file of the runner's only; $F/never holds the
          # values alone (grep's pattern file). Values are only ever read from these files, never put in an argument.
          one() { printf '%s\t' "$1"; tr -d '\n' < "$2"; echo; }
          (umask 077
            one "the local dashboard key" "$LOCAL_KEY"
            one "the hub's key" "$F/hub-key"
            one "the setup token" "$F/setup-token"
            one "the loopback setup token" "$F/setup-token-loopback"
            one "the sign-in App's client secret" "$F/client-secret"
            one "the Claude token" "$F/claude-token"
            printf 'the App client secret\t'; sed -n 1p "$F/app-secrets"
            printf 'the App webhook secret\t'; sed -n 2p "$F/app-secrets"
            one "the manifest code" "$F/manifest-code"
            one "the tailscale login link id" "$F/browser/tailscale-link"
            printf "a line of the App's key\t"; sed -n 2p "$FK/app.pem"
            printf "the instance's dashboard key\t"; sudo cat "$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci/state/dashboard-token" | tr -d '\n'; echo
          ) | awk -F'\t' '$2 != ""' > "$F/never-named"
          (umask 077; cut -f2- "$F/never-named" > "$F/never")
          # The local key, the hub's key, the two setup tokens (loopback, then the origin's), the sign-in secret, the Claude
          # token, the App's two secrets, the one-time code, the login link's id, a line of the App's key, the instance's own key.
          [ "$(wc -l < "$F/never")" = 12 ] || { echo "expected 12 secrets, have $(wc -l < "$F/never")" >&2; exit 1; }
          sudo journalctl --no-pager > "$F/journal.txt" 2>&1
          journalctl --user --no-pager > "$F/journal-user.txt" 2>&1 || true
          leaks=0
          for x in "$F"/browser/urls-*.txt "$F/argv.txt" "$F/journal.txt" "$F/journal-user.txt" "$F"/*.log "$F"/*.jsonl "$F"/*.err "$FK/requests.log" "$FK/server.log" "$RUNNER_TEMP/alpha"; do
            if grep -rqaFf "$F/never" "$x" 2>/dev/null; then echo "a secret is in $x" >&2; leaks=1; fi
          done
          # The local dashboard's state, but for the key's own file.
          if grep -rqaFf "$F/never" --exclude=dashboard-token "$HOME/.local/state"; then echo "a secret is in the local state" >&2; leaks=1; fi
          if sudo grep -rqaFf "$F/never" /etc/systemd/system /var/lib/worklane /etc/worklane; then echo "a secret is in a unit or the machine's state" >&2; leaks=1; fi
          # For a URL that holds one: which secret (by name), the URL's path and its parameter names, every value masked.
          # INVARIANT: no value is printed. awk reads the secrets from the file, and prints the path and names only.
          awk -F'\t' 'NR == FNR { name[$2] = $1; next }
            { for (v in name) if (index($0, v)) {
                u = $0; sub(/^[a-z]+:\/\/[^\/]*/, "", u); p = u; q = ""
                if ((i = index(u, "?")) > 0) { p = substr(u, 1, i - 1); n = split(substr(u, i + 1), kv, "&"); for (j = 1; j <= n; j++) { split(kv[j], a, "="); q = q (q == "" ? "?" : "&") a[1] "=***" } }
                printf "URL leak in %s: %s in %s%s\n", FILENAME, name[v], p, q
              } }' "$F/never-named" "$F"/browser/urls-*.txt | sort | uniq -c >&2
          [ "$leaks" = 0 ]
          # The browser's own URLs: none carries a key or token parameter at all (path and names only, values masked).
          bad="$(grep -hE '[?&](t|token|key|code)=' "$F"/browser/urls-*.txt | grep -v '^http://127.0.0.1:[0-9]*/assets/' | sed -E 's#^[a-z]+://[^/]*##; s#=([^&]*)#=***#g' | sort -u || true)"
          if [ -n "$bad" ]; then echo "a URL carries a credential parameter:" >&2; echo "$bad" >&2; exit 1; fi
          echo "checked $(cat "$F"/browser/urls-*.txt | wc -l) URLs, $(wc -l < "$F/argv.txt") distinct process argument lists, the journal, the logs and the machine's state"
      - name: "the walk's screens and how long each took"
        if: always()
        run: cat "$F"/walk-*.jsonl 2>/dev/null | jq -r 'select(.screen) | "\(if .ok then "ok  " else "FAIL" end) \(.ms / 1000 | floor)s  \(.screen)"' || true
      - name: the browser's screenshots, the units and the logs, on failure
        if: failure()
        run: |
          ls -la "$F/browser" || true
          cat "$F"/browser/page-errors-*.txt 2>/dev/null || true
          sudo journalctl --no-pager -n 60 -t worklane-machine -u worklane-update.service || true
          sudo tail -n 20 /var/lib/worklane/machine-changes.jsonl || true
          sudo journalctl --no-pager -n 80 -u worklane-ci.service -u worklane-dashboard-ci.service -u worklane-dashboard-hub.service -u worklane-tailscale.service || true
          journalctl --user --no-pager -n 60 || true
          tail -n 60 "$F"/*.err "$FK/server.log" 2>/dev/null || true
          cat "$HOME"/.local/state/worklane/projects/*/dashboard.log 2>/dev/null | tail -n 60 || true
          # The local coordinator unit's own output: its stdout and stderr go to coordinator.log (StandardOutput=append:),
          # not the journal, which has only systemd's lines (e.g. "exited, status=2").
          systemctl --user status --no-pager 'dev.worklane.*' 2>/dev/null || true
          tail -n 80 "$HOME"/.local/state/worklane/projects/*/coordinator.log 2>/dev/null || true
      - name: the browser's screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wizard-e2e-screenshots
          path: ${{ runner.temp }}/wiz/browser/*.png
          if-no-files-found: ignore

  egress-real-systemd:
    # The host egress rule (scripts/setup/egress-firewall.sh, #543) on real systemd and nft, with a test user's real
    # rootless Docker (test-user.sh install): test users covered by default; a test-user process dropped; Docker's
    # image pull the one exception (its unit's NFTSet=), kept across a reload and a restart; without NFTSet= the pull
    # is dropped; a test-user unit can't move itself into Docker's cgroup. Measured and put in the job summary either
    # way, whether a test run can join Docker's user+net namespaces. And an install that covered test users before #543
    # (the pre-#543 egress-firewall.sh's apply --with-test-users) keeps dropping their Docker after the new install and apply: no route the
    # join probe found blocked before opens. scripts/ci/egress-real-systemd.sh has the steps and assertions.
    name: egress firewall (real systemd)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' egress-real-systemd ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: a coordinator user and the full-run lock (what instance.sh and the machine script make), and nft
        run: |
          sudo useradd --create-home --shell /bin/bash wl-ci
          sudo chmod 0750 "$(getent passwd wl-ci | cut -d: -f6)"
          sudo install -o root -g root -m 0644 /dev/null /run/lock/worklane-full-run.lock
          command -v nft > /dev/null 2>&1 || sudo apt-get install -y -q nftables > /dev/null
      - name: test-user.sh install (its rootless Docker, before any egress rule)
        run: |
          n="$(nproc)"
          sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/install.log"
          tail -n 5 "$RUNNER_TEMP/install.log" | grep -qx 'OK: all checks passed'
          grep -qx 'NFTSet=cgroup:inet:worklane_egress:egress_ok' /etc/systemd/system/worklane-test-ci-docker.service
      - name: the database image, pinned to the digest it has today
        run: |
          docker pull -q postgres:17-alpine
          echo "DB_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' postgres:17-alpine)" >> "$GITHUB_ENV"
      - name: "egress on real systemd: test users covered by default and dropped; a real rootless pull with the rule on; the set kept across a reload and a restart (the old delete-table reload emptied it); no pull without NFTSet=; no move into Docker's cgroup; whether a run can join Docker's namespaces (measured); a pre-#543 --with-test-users install keeps Docker dropped"
        run: bash scripts/ci/egress-real-systemd.sh
      - name: the rule, Docker and its journal, on failure
        if: failure()
        run: |
          sudo nft list ruleset || true
          systemctl cat worklane-test-ci-docker.service || true
          systemctl show -p ControlGroup worklane-test-ci-docker.service || true
          sudo journalctl --no-pager -n 80 -u worklane-test-ci-docker.service || true
