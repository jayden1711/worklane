      - name: "regression: no value of a run's variables, nor its database password, in any argv, the journal or the unit (a canary, watched as nobody)"
        run: |
          # sudo logs its whole command line to the journal; any user reads a process's argv (ps, /proc/<pid>/cmdline)
          # and a unit's systemctl show / cat. A run's DATABASE_URL carries its database's password. Each phase: a run
          # made as wl-ci, its exec given a canary variable and its database started, while nobody watches
          # (scripts/ci/argv-watch.sh); then the canary and the password are looked for in that output and the journal.
          H=/usr/local/libexec/worklane-testrun
          w="$(mktemp -d /tmp/wl-watch-XXXXXX)"; cp scripts/ci/argv-watch.sh "$w/"; chmod -R a+rX "$w"
          # Every docker call the helper makes, recorded (scripts/ci/docker-argv-shim.sh in place of the test user's
          # docker CLI for this step, the real one put back after): sampling can miss a call that lasts a moment.
          D="$(readlink -f /opt/worklane-test/docker/docker)"
          argvlog=/var/log/wl-docker-argv.log
          sudo install -o wl-test-ci -g wl-test-ci -m 0600 /dev/null "$argvlog"
          sudo mv "$D" "$D.real"
          trap 'sudo mv -f "$D.real" "$D"' EXIT
          sed -e "s#@LOG@#$argvlog#" -e "s#@REAL@#$D.real#" scripts/ci/docker-argv-shim.sh | sudo tee "$D" > /dev/null
          sudo chmod 0755 "$D"
          mkrun() {
            local r id_=(-c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false)
            r="$(mktemp -d)"
            git init -q "$r" && date > "$r/f" && git -C "$r" add f && git -C "$r" "${id_[@]}" commit -q -m probe
            for x in head base; do git -C "$r" update-ref "refs/worklane/test-run/$1/$x" HEAD; done
            git -C "$r" bundle create --quiet "$r/b" "refs/worklane/test-run/$1/head" "refs/worklane/test-run/$1/base"
            sudo -u wl-ci sudo -n "$H" ci create "$1" main "refs/worklane/test-run/$1/head" "refs/worklane/test-run/$1/base" "$(git -C "$r" rev-parse HEAD)" "$(git -C "$r" rev-parse HEAD)" < "$r/b" >/dev/null
            rm -rf "$r"
          }
          # One phase: $1 old|new. Prints how often the canary and the password were seen, and where.
          phase() {
            local which="$1" id="argv-$1-$$" canary value since out pw seen cmd watcher
            canary="wl-canary-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            value="$canary x \"q\" \$HOME \`id\` #h 'a'"
            mkrun "$id"
            since="$(date '+%Y-%m-%d %H:%M:%S')"
            rm -f "$w/stop"
            sudo -u nobody bash "$w/argv-watch.sh" ci "$w/stop" > "$RUNNER_TEMP/watch-$which.log" 2>&1 &
            watcher=$!
            sleep 1
            cmd='printf %s "$CANARY_VAR" | sha256sum; sleep 3'
            if [ "$which" = old ]; then
              out="$(sudo -u wl-ci sudo -n "$H" ci exec "$id" 60 --env "CANARY_VAR=$value" -- "$cmd" 2>/dev/null < /dev/null)"
            else
              # As the engine passes them (src/testrun/host.ts runVars): NAME=value, a NUL, on stdin. printf is bash's own.
              out="$(printf 'CANARY_VAR=%s\0' "$value" | sudo -u wl-ci sudo -n "$H" ci exec "$id" 60 -- "$cmd" 2>/dev/null)"
            fi
            [ "$(cut -d' ' -f1 <<<"$out")" = "$(printf %s "$value" | sha256sum | cut -d' ' -f1)" ] || { echo "$which: the run didn't get the value exactly: $out" >&2; exit 1; }
            echo "$which helper: the run got CANARY_VAR exactly (its sha256 matches)"
            sudo truncate -s 0 "$argvlog"
            # "<port> <password>" from the old helper, "<socket directory> <password>" from this one.
            pw="$(sudo -u wl-ci sudo -n "$H" ci db-start "$id" "$DB_IMAGE" test 90 250 | sed -n 's/^[^ ]* \([0-9a-f]\{32\}\)$/\1/p')"
            [ -n "$pw" ] || { echo "$which: db-start printed no password" >&2; exit 1; }
            # db-start's recorded docker calls, copied out with no value on any command line. WHY: a sudo grep for the
            # password put it in sudo's own journal line; every search with the value runs only after the watch and
            # the journal are taken, and never through sudo.
            sudo cat "$argvlog" > "$RUNNER_TEMP/argv-$which.log"
            touch "$w/stop"; wait "$watcher" || true
            sudo journalctl --since "$since" -o verbose --no-pager > "$RUNNER_TEMP/journal-$which.txt"
            # How many recorded docker calls carry the password, and how many were "docker run".
            echo "$which shim $(grep -cF -- "$pw" "$RUNNER_TEMP/argv-$which.log" || true) $(grep -c '^run ' "$RUNNER_TEMP/argv-$which.log" || true)" >> "$RUNNER_TEMP/seen"
            grep '^run ' "$RUNNER_TEMP/argv-$which.log" | cut -c1-240 | sed "s/^/  $which, docker argv recorded: /" || true
            for secret in canary pw; do
              seen="$(grep -cF -- "${!secret}" "$RUNNER_TEMP/watch-$which.log" || true) $(grep -cF -- "${!secret}" "$RUNNER_TEMP/journal-$which.txt" || true)"
              echo "$which helper: the $secret in argv/units as nobody, in the journal: $seen (lines)"
              grep -hF -- "${!secret}" "$RUNNER_TEMP/watch-$which.log" "$RUNNER_TEMP/journal-$which.txt" | sort -u | head -n 3 | cut -c1-240 | sed "s/^/  $which, $secret seen: /" || true  # WHY: none seen is the pass, and grep then exits 1
              echo "$which $secret $seen" >> "$RUNNER_TEMP/seen"
            done
            echo "$which helper: who can ask the test user's Docker for the container's environment (docker inspect): $(sudo stat -c '%U:%G %a' /run/worklane-test-ci-docker)"
            sudo -u wl-ci sudo -n "$H" ci wipe "$id" >/dev/null
          }
          : > "$RUNNER_TEMP/seen"
          # Fail-without: the helper before this change (protocol 6, as on main at 593e0d2), as a machine had it.
          old=593e0d248f0ba2f9d984522b8d2675f0ba51133a
          git fetch -q --depth=1 origin "$old"
          git show "$old:scripts/machine/worklane-testrun.sh" > "$RUNNER_TEMP/helper-6.sh"
          grep -qx 'PROTOCOL=6' "$RUNNER_TEMP/helper-6.sh"
          sudo install -o root -g root -m 0755 "$RUNNER_TEMP/helper-6.sh" "$H"
          phase old
          sudo install -o root -g root -m 0755 scripts/machine/worklane-testrun.sh "$H"
          phase new
          cat "$RUNNER_TEMP/seen"
          # The old helper showed both (else this proves nothing); the new one shows neither, anywhere.
          grep -Eq '^old canary [1-9][0-9]* [1-9][0-9]*$' "$RUNNER_TEMP/seen"
          # The password: sampled or in the journal (a short docker call can slip between samples), and always in the
          # recorded docker argv.
          grep -Eq '^old pw ([1-9][0-9]* [0-9]+|[0-9]+ [1-9][0-9]*)$' "$RUNNER_TEMP/seen"
          grep -Eq '^old shim [1-9][0-9]* [1-9][0-9]*$' "$RUNNER_TEMP/seen"
          grep -qx 'new canary 0 0' "$RUNNER_TEMP/seen"
          grep -qx 'new pw 0 0' "$RUNNER_TEMP/seen"
          # And in no recorded docker argv, with "docker run" recorded (the shim ran).
          grep -Eq '^new shim 0 [1-9][0-9]*$' "$RUNNER_TEMP/seen"
          [ -z "$(sudo ls -A /run/worklane-testrun-env)" ] || { echo "a variables file was left" >&2; sudo ls -la /run/worklane-testrun-env >&2; exit 1; }
          echo "no value seen with this helper; its variables files are gone"
          rm -rf "$w"
      - name: the coordinator's sandbox host, as wl-ci, against real systemd-run
        run: |
          # What wl-ci runs, world-readable: the build, its one dependency, node, the driver and the fixtures.
          t="$(mktemp -d /tmp/wl-ci-XXXXXX)"
          mkdir -p "$t/node_modules" "$t/fixtures"
          cp -r dist package.json "$t/"
          cp -r node_modules/zod "$t/node_modules/"
          cp "$(command -v node)" "$t/node"
          cp scripts/ci/testrun-real-systemd.mjs "$t/"
          cp test/fixtures/systemd-run-255/* "$t/fixtures/"
          chmod -R a+rX "$t"
          echo "T=$t" >> "$GITHUB_ENV"
          sudo install -o wl-ci -g wl-ci -m 0644 /dev/null "$t/ids"
          sudo install -o wl-ci -g wl-ci -m 0644 /dev/null "$t/ids.db"
          sudo -u wl-ci env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-ci | cut -d: -f6)" LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec "$1/node" "$1/testrun-real-systemd.mjs" "$1/dist" ci "$2" "$1/fixtures" "$1/ids"' _ "$t" "$DB_IMAGE"
      - name: the database container's processes are in a cgroup of their own, inside worklane-test.slice
        run: |
          c="$(cat "$T/ids.db")"
          [ -n "$c" ] || { echo "the driver named no container" >&2; exit 1; }
          pid="$(sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker inspect --format '{{.State.Pid}}' "$c")"
          echo "container $c, main pid $pid"
          cat "/proc/$pid/cgroup"
          cg="$(sed -n 's/^0:://p' "/proc/$pid/cgroup")"
          unit="$(systemctl show worklane-test-ci-docker.service -p ControlGroup --value)"
          echo "the container's cgroup: $cg"
          echo "its controllers: $(cat "/sys/fs/cgroup$cg/cgroup.controllers")"
          case "$cg" in /worklane.slice/worklane-test.slice/*) ;; *) echo "not inside /worklane.slice/worklane-test.slice/" >&2; exit 1 ;; esac
          case "$cg" in "$unit"/daemon | "$unit"/daemon/*) echo "in the daemon's own cgroup, not one of its own" >&2; exit 1 ;; "$unit"/*) ;; *) echo "not inside $unit" >&2; exit 1 ;; esac
          for k in cpu io memory pids; do grep -qw "$k" "/sys/fs/cgroup$cg/cgroup.controllers" || { echo "no $k controller in its cgroup" >&2; exit 1; }; done
          echo "CG=$cg" >> "$GITHUB_ENV"
      - name: the run's Postgres has the max_connections db-start was given (250), asked inside the database
        run: |
          c="$(cat "$T/ids.db")"
          got="$(sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker exec "$c" psql -U postgres -d test -tAc 'SHOW max_connections')"
          echo "SHOW max_connections in $c: $got"
          [ "$got" = 250 ] || { echo "expected 250" >&2; exit 1; }
      - name: wipe, as wl-ci
        run: |
          sudo -u wl-ci env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-ci | cut -d: -f6)" LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec "$1/node" "$1/testrun-real-systemd.mjs" --wipe "$1/dist" ci "$1/ids"' _ "$T"
      - name: nothing left of the run, seen as root
        run: |
          if [ -e "/sys/fs/cgroup$CG" ]; then echo "the container's cgroup $CG is still there" >&2; exit 1; fi
          echo "the container's cgroup $CG is gone"
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if sudo test -e "/var/lib/worklane-test/ci/runs/$id"; then echo "run $id's directory is still there" >&2; exit 1; fi
            if [ -n "$(systemctl list-units --all --plain --no-legend "worklane-test-ci_${id}_*" "worklane-test-ci-$id-*")" ]; then echo "run $id has units left" >&2; exit 1; fi
          done < "$T/ids"
          sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker ps -aq --filter label=worklane.test-run > "$RUNNER_TEMP/left"
          if [ -s "$RUNNER_TEMP/left" ]; then echo "containers left:" >&2; cat "$RUNNER_TEMP/left" >&2; exit 1; fi
          echo "nothing left"
      - name: testrun measure, as wl-ci, through the real helper and sudoers rule (two values of a test_run env key, in sequence)
        run: |
          # The CLI whole (it needs every dependency, not only zod) and the example project, world-readable for wl-ci.
          cp -r node_modules/. "$T/node_modules/"
          cp -r examples "$T/"
          # WHY: only what this step added: $T/ids and $T/ids.db belong to wl-ci, so a chmod of all of $T fails on them.
          chmod -R a+rX "$T/node_modules" "$T/examples"
          cat > "$T/measure.sh" <<'EOF'
          set -euo pipefail
          t="$1"
          export WORKLANE_INSTANCES_DIR="$HOME/measure-instances"
          r="$HOME/measure-repo"
          cp -r "$t/examples/basic" "$r"
          # A tier that prints one stopwatch line per lane, as a runner that times its suites does.
          printf '%s\n' 'test_run: {"tiers": [{"name": "lanes", "kind": "fast", "command": "for i in $(seq $LANES); do echo \"⏱ suite-$i: 0.$i\"s; done; sleep 1"}], "env": {"LANES": "1"}}' >> "$r/.worklane/tests.yaml"
          g=(git -C "$r" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false)
          "${g[@]}" init -q -b main && "${g[@]}" add -A && "${g[@]}" commit -q -m measure
          "$t/node" "$t/dist/src/cli.js" instance init ci --repo "$r" --github example-org/example-shop > /dev/null
          printf 'version: 1\nbudget: { daily_usd: 40 }\nagents: { max_workers: 4 }\nland_mode: pr\n' > "$WORKLANE_INSTANCES_DIR/ci/policy.yaml"
          cli() { "$t/node" "$t/dist/src/cli.js" testrun measure --instance ci "$@"; }
          # Refused, and nothing started: not a key of test_run env, and a key the engine sets.
          for bad in NOPE=1 DATABASE_URL=postgres://x; do
            rc=0; cli --tier lanes --set "$bad" 2> "$HOME/refused.log" || rc=$?
            echo "--set $bad: exit $rc: $(cat "$HOME/refused.log")"
            [ "$rc" = 2 ] && grep -q '^refused: .*nothing was started$' "$HOME/refused.log"
          done
          [ ! -e "$WORKLANE_INSTANCES_DIR/ci/state/test-runs-measure" ]
          cli --tier lanes --set LANES=1,2 | tee "$HOME/measure.log"
          grep -E '^LANES=1  wall [0-9.]+s  ok  lanes passed in [0-9.]+s \(cpu [0-9.]+s, [0-9.]+ cores avg, mem peak [0-9]+ MB\); suites: suite-1 0\.1s  \[run measure-' "$HOME/measure.log"
          grep -E '^LANES=2  wall [0-9.]+s  ok  lanes passed in [0-9.]+s \(cpu [0-9.]+s, [0-9.]+ cores avg, mem peak [0-9]+ MB\); suites: suite-2 0\.2s, suite-1 0\.1s  \[run measure-' "$HOME/measure.log"
          # The instance's log has its own event type only: no testrun.queued/started/finished a PR run would read.
          types="$("$t/node" -e 'const { DatabaseSync } = require("node:sqlite"); const db = new DatabaseSync(process.argv[1]); console.log([...new Set(db.prepare("select type from events").all().map((r) => r.type))].join(","))' "$WORKLANE_INSTANCES_DIR/ci/state/events.db")"
          echo "event types recorded: $types"
          [ "$types" = testrun.measure ]
          grep -o 'run measure-[0-9a-f-]*' "$HOME/measure.log" | cut -d' ' -f2 > "$t/measure-ids"
          EOF
          chmod a+r "$T/measure.sh"
          sudo install -o wl-ci -g wl-ci -m 0644 /dev/null "$T/measure-ids"
          sudo -u wl-ci env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-ci | cut -d: -f6)" LANG=C.UTF-8 \
            bash -c 'cd "$HOME" && bash "$1/measure.sh" "$1"' _ "$T"
          # Each value's run is wiped, seen as root.
          [ "$(wc -l < "$T/measure-ids")" = 2 ]
          while IFS= read -r id; do
            if sudo test -e "/var/lib/worklane-test/ci/runs/$id"; then echo "run $id's directory is still there" >&2; exit 1; fi
          done < "$T/measure-ids"
          echo "both measure runs wiped"
      - name: "Experiment jobs on real systemd: install and check, approved data by sha256 only, a job's steps with no network and only their own binds, the scorer apart from the job's code, sealed outputs, a job stopped at its cap, another instance refused"
        env:
          KEEP_FOR_REMOVE: 1
        run: bash scripts/ci/exp-real-systemd.sh "$I2"
      - name: "instance-remove (v0.5.1): ci, which ran a study cut off with its output volume mounted: a mount the engine didn't make refuses it; then the volume unmounted and every experiments user, rule, file and egress entry of ci's gone, the other instance as it was"
        run: bash scripts/ci/instance-remove-exp.sh "$I2"
      - name: the sandbox's units and Docker, on failure
        if: failure()
        run: |
          sudo systemctl --no-pager status worklane-test.slice worklane-test-ci-docker.service || true
          sudo journalctl --no-pager -n 100 -u worklane-test-ci-docker.service || true
          sudo journalctl --no-pager -n 50 _SYSTEMD_UNIT=init.scope -g worklane-test || true

  add-project-real-systemd:
    # scripts/setup/add-project.sh end to end on a real host, as root, against a fake GitHub (test/fake-github.ts, the
    # manifest flow's, served by scripts/ci/fake-github.mjs): the dashboard's sign-in App made through the hub's setup
    # mode (dashboards.sh --setup; its one-time token, and it turning itself off); before that, a first run stops at the
    # App step naming dashboards.sh --setup; after it, the machine's first project goes all the way with nothing by hand:
    # add-project starts the hub alone before its App step, the App comes through the manifest flow, a stand-in Claude
    # token: the checkout cloned through the App's credential helper, the coordinator's service active, the machine
    # helper and the dashboards. A third run, through the machine helper as the coordinator, skips every step. Last,
    # another instance gets its App through the manifest flow itself (wizard screen 5), with GitHub's conversion faked
    # and a stand-in hub for the owner's sign-in: no real App is made.
    # Last, Tailscale for the hub through the same helper (tailscale.sh): the real signed install, then a stand-in CLI.
    # Then the chat bot's token (credentials.sh intake-discord) and the dashboard's Discord step, against a fake Discord.
    name: add-project (real systemd)
    needs: scope
    if: ${{ !cancelled() && contains(needs.scope.outputs.run, ' add-project-real-systemd ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 46
    defaults:
      run:
        shell: bash
    env:
      GH_FAKE: http://127.0.0.1:8999
      # The stand-in for GitHub's hosts in every engine process of this job (see the fake GitHub's step).
      LOOPBACK: --import=/opt/worklane/current/scripts/ci/loopback-github.mjs
      HELPER: /usr/local/libexec/worklane-machine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && npm run build:web
      - name: the machine (machine.sh) and this commit's engine, root-owned, as engine.sh installs it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q acl
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          sudo bash scripts/setup/machine.sh
          sha="$(git rev-parse HEAD)"
          # The runner's /opt is open to all (0777); on a server it is root's 0755, and the machine helper refuses to run
          # add-project.sh from under a directory anyone may write.
          sudo chmod 0755 /opt
          sudo install -d -m 0755 /opt/worklane
          sudo cp -a "$GITHUB_WORKSPACE" "/opt/worklane/$sha"
          sudo chown -R root:root "/opt/worklane/$sha" && sudo chmod -R a+rX,go-w "/opt/worklane/$sha"
          sudo ln -sfn "/opt/worklane/$sha" /opt/worklane/current
          sudo chmod 0755 "/opt/worklane/$sha/dist/src/cli.js"
          sudo ln -sfn /opt/worklane/current/dist/src/cli.js /usr/local/bin/worklane
          worklane --version
      - name: a fake GitHub, with the repo (examples/basic) behind the App's installation token
        run: |
          f="$RUNNER_TEMP/fake" && mkdir -p "$f/git/example"
          git init -q --bare -b main "$f/git/example/alpha.git"
          cp -r examples/basic "$f/seed"
          # Its .worklane/ for example/alpha, within the default policy add-project writes ($20/day, 2 workers).
          sed -i -e 's|^  repo: example-org/example-shop |  repo: example/alpha |' "$f/seed/.worklane/config.yaml"
          sed -i -e 's|^daily_budget_usd: 40 |daily_budget_usd: 20 |' -e 's|count: 1, max: 4,|count: 1, max: 2,|' "$f/seed/.worklane/agents.yaml"
          grep -q '^  repo: example/alpha ' "$f/seed/.worklane/config.yaml" && grep -q '^daily_budget_usd: 20 ' "$f/seed/.worklane/agents.yaml" && grep -q 'max: 2,' "$f/seed/.worklane/agents.yaml"
          git -C "$f/seed" init -q -b main && git -C "$f/seed" add -A
          git -C "$f/seed" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q -m init
          git -C "$f/seed" push -q "$f/git/example/alpha.git" main
          # The App's key, as one would download it (the fake checks the JWT's App id, not its signature); a manifest
          # conversion on the fake returns this same key.
          openssl genrsa -traditional -out "$f/app.pem" 2048 2>/dev/null || openssl genrsa -out "$f/app.pem" 2048
          nohup node scripts/ci/fake-github.mjs "$GITHUB_WORKSPACE/dist" 8999 "$f/git" example/alpha "$f/requests.log" "$f/app.pem" > "$f/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf "$GH_FAKE/repos/example/alpha" >/dev/null && break; sleep 1; done
          curl -sf "$GH_FAKE/repos/example/alpha"
          echo "F=$f" >> "$GITHUB_ENV"
          # The engine's GitHub hosts are constants, so the fake is reached through a stand-in loaded into each engine
          # process (scripts/ci/loopback-github.mjs: GitHub's hosts go to a port on 127.0.0.1, anything else off this
          # machine is refused): kept through sudo, and set for the units. git's own requests to github.com go to
          # the fake through the runner's git config.
          sudo git config --system url."$GH_FAKE/example/alpha".insteadOf https://github.com/example/alpha
          printf 'Defaults env_keep += "NODE_OPTIONS CI_LOOPBACK_GITHUB_PORT"\n' > "$f/sudoers" && sudo visudo -cf "$f/sudoers" && sudo install -m 0440 "$f/sudoers" /etc/sudoers.d/ci-fake-github
          for u in worklane-ci worklane-dashboard-ci worklane-dashboard-hub worklane-dashboard-hub-setup; do
            sudo install -d "/etc/systemd/system/$u.service.d"
            printf '[Service]\nEnvironment=NODE_OPTIONS=%s CI_LOOPBACK_GITHUB_PORT=8999\n' "$LOOPBACK?port=8999" | sudo tee "/etc/systemd/system/$u.service.d/fake-github.conf" >/dev/null
          done
      - name: "a first project before the sign-in App exists: stops at the App step, naming dashboards.sh --setup and its retry; starts nothing"
        run: |
          # The stand-in token: in a file of the runner's only, masked in case anything prints it; never in the env.
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/claude-token"); unset t
          set +e
          sudo env NODE_OPTIONS="$LOOPBACK?port=8999" CI_LOOPBACK_GITHUB_PORT=8999 bash scripts/setup/add-project.sh ci example/alpha < /dev/null > "$F/run1.jsonl" 2> "$F/run1.err"
          rc=$?
          set -e
          cat "$F/run1.jsonl"; tail -n 20 "$F/run1.err"
          [ "$rc" = 1 ] || { echo "expected exit 1, got $rc" >&2; exit 1; }
          jq -e 'select(.step=="instance" and .state=="done")' "$F/run1.jsonl" >/dev/null
          last="$(tail -n 1 "$F/run1.jsonl")"
          jq -e '.step=="app" and .state=="failed" and (.detail|test("no dashboard hub on this machine yet, and no sign-in App for one")) and (.detail|test("manifest flow")) and (.detail|test("dashboards.sh --setup --public-url")) and (.retry|test("add-project.sh ci example/alpha .*worklane app-manifest ci example/alpha$"))' <<<"$last"
          # Manifest only: the App step never sends anyone off to make an App by hand.
          if jq -e '(.detail + " " + .retry) | test("by hand|credentials.sh")' <<<"$last"; then echo "the App step still names the manual way" >&2; exit 1; fi
          id wl-ci && id wl-ci-agent
          if [ -e /etc/systemd/system/worklane-dashboard-hub.service ] || systemctl is-active -q worklane-dashboard-hub.service; then echo "a hub was started with no sign-in App" >&2; exit 1; fi
      - name: "the one command on a machine with no hub (bootstrap --hardened): with no origin, setup mode on loopback and its URL; with one, setup mode there, its URL only once it answers 200; before that, no URL, the reason and the fix (#393)"
        run: |
          pub=https://hub.example.test u=worklane-dashboard-hub-setup.service
          # The install command from a root-owned copy of this checkout whose pinned engine is this commit, its origin
          # itself (engine.sh clones the origin of the scripts it runs from, and finds this commit's build in /opt).
          # Only ENGINE_TAG differs, in the copy.
          b=/var/tmp/one-url-boot sha="$(git rev-parse HEAD)"
          sudo rsync -a --exclude node_modules --exclude dist "$GITHUB_WORKSPACE/" "$b/"
          sudo chown -R root:root "$b" && sudo git -C "$b" remote set-url origin "$b"
          sudo sed -i "s/^ENGINE_TAG=.*/ENGINE_TAG=$sha/" "$b/scripts/bootstrap.sh"
          [ "$(sudo git -C "$b" diff --name-only)" = scripts/bootstrap.sh ]
          boot() { set +e; sudo bash "$b/scripts/bootstrap.sh" --hardened --yes --machine-owner ci-owner "$@" ci example/alpha > "$F/$log" 2>&1; rc=$?; set -e; tail -n 12 "$F/$log"; echo "rc=$rc"; }
          last_is_url() { tail -n 1 "$F/$1" | grep -qE '^https?://'; }
          # No https origin (no Tailscale here, no --public-url). Until 2026-10-14 no URL and exit 4; the owner changed the
          # product: setup mode on loopback only, its URL last once it answers 200, the ssh -L line above it.
          log=boot-a.log
          boot
          [ "$rc" = 0 ]
          [ "$(tail -n 1 "$F/$log")" = http://127.0.0.1:4399/ ]
          grep -qxF "   From your own computer, first: ssh -L 4399:127.0.0.1:4399 $USER@$(hostname)" "$F/$log"
          systemctl is-active "$u"
          systemctl show -p ExecStart --value "$u" | grep -qF ' --loopback '
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4399/)" = 200 ]
          [ "$(readlink -f /opt/worklane/current)" = "/opt/worklane/$sha" ]
          # The origin given, but nothing serves it yet (tailscale serve): setup mode moves to it, and no URL: it doesn't answer.
          log=boot-b.log
          boot --public-url "$pub"
          [ "$rc" = 4 ]
          systemctl is-active "$u"
          systemctl show -p ExecStart --value "$u" | grep -qF " --public-url $pub "
          grep -qF "no URL to open yet: the hub's setup mode runs on this machine (port 4399), but $pub doesn't reach it" "$F/$log"
          grep -qF "fix: sudo tailscale serve --bg --https=443 http://127.0.0.1:4399, then run this again" "$F/$log"
          if last_is_url "$log"; then echo "a URL that answers nothing was printed" >&2; exit 1; fi
          # tailscale serve's stand-in: the origin's name on this machine, real TLS from a CA the system trusts, to port 4399.
          sudo apt-get install -y -q socat > /dev/null
          t="$RUNNER_TEMP/tls" && mkdir -p "$t"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$t/ca.key" -out "$t/ca.pem" -subj /CN=ci-hub-ca -days 2 -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$t/leaf.key" -out "$t/leaf.csr" -subj /CN=hub.example.test 2>/dev/null
          printf 'subjectAltName=DNS:hub.example.test\nextendedKeyUsage=serverAuth\n' > "$t/ext"
          openssl x509 -req -in "$t/leaf.csr" -CA "$t/ca.pem" -CAkey "$t/ca.key" -CAcreateserial -out "$t/leaf.pem" -days 2 -extfile "$t/ext" 2>/dev/null
          sudo cp "$t/ca.pem" /usr/local/share/ca-certificates/ci-hub-ca.crt && sudo update-ca-certificates > /dev/null
          echo '127.0.0.1 hub.example.test' | sudo tee -a /etc/hosts > /dev/null
          sudo sh -c "nohup socat openssl-listen:443,reuseaddr,fork,cert=$t/leaf.pem,key=$t/leaf.key,verify=0 tcp:127.0.0.1:4399 > $t/socat.log 2>&1 &"
          for _ in $(seq 1 20); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$pub/")" = 200 ] && break; sleep 1; done
          tf="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/setup-token"
          before="$(sudo sha256sum "$tf")"
          # Served: the one URL, last, the only one in its block, no token in it; it answers 200 with setup mode's page.
          for log in boot-c.log boot-d.log; do
            boot --public-url "$pub"
            [ "$rc" = 0 ]
            [ "$(tail -n 1 "$F/$log")" = "$pub/" ]
            closing="$(awk '/^== /{b=""} {b=b $0 "\n"} END{printf "%s", b}' "$F/$log")"
            [ "$(grep -c '://' <<< "$closing")" = 1 ]
            if sudo grep -qFf "$tf" "$F/$log"; then echo "the setup token was printed" >&2; exit 1; fi
            curl -s -o "$t/page.html" -w '%{http_code}\n' "$(tail -n 1 "$F/$log")" | grep -qx 200
            grep -q 'This hub is in setup mode' "$t/page.html"
            grep -qF "sudo cat $tf" "$F/$log"
          done
          # The rerun changed nothing: setup mode left running, its one-time token the same.
          [ "$(sudo sha256sum "$tf")" = "$before" ]
          [ "$(grep -c 'scripts/setup/dashboards.sh --setup' "$F/boot-d.log")" = 0 ]
          # Back as the next steps expect it: no stand-in for tailscale serve.
          sudo pkill -f 'socat openssl-listen:443' || true
          sudo sed -i '/ hub\.example\.test$/d' /etc/hosts
      - name: "the sign-in App through the hub's setup mode (B8): wl-dash's one-time token from a 0600 file, never printed or in a URL; it turns itself off once the secret exists"
        run: |
          u=worklane-dashboard-hub-setup.service pub=https://hub.example.test h=http://127.0.0.1:4399
          sudo bash scripts/setup/dashboards.sh --setup --public-url "$pub" | tee "$F/setup1.log"
          systemctl is-active "$u"
          [ "$(systemctl show -p User --value "$u")" = wl-dash ]
          tf="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/setup-token"
          [ "$(sudo stat -c '%U %a' "$tf")" = "wl-dash 600" ]
          grep -qx "setup-mode hub: $pub" "$F/setup1.log"
          grep -qF "sudo cat $tf" "$F/setup1.log"
          # The token: into a file of the runner's only, masked; curl reads it from there (never an argument or the env).
          (umask 077; sudo cat "$tf" > "$F/setup-token")
          echo "::add-mask::$(cat "$F/setup-token")"
          if grep -qFf "$F/setup-token" "$F/setup1.log" "/etc/systemd/system/$u" || sudo journalctl --no-pager -u "$u" | grep -qFf "$F/setup-token"; then echo "the setup token was echoed" >&2; exit 1; fi
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          [ "$(code "$h/?token=anything")" = 400 ]
          [ "$(code -H 'Origin: https://evil.example' --data-urlencode "token@$F/setup-token" "$h/setup/unlock")" = 403 ]
          [ "$(code -H "Origin: $pub" --data-urlencode token=wrong "$h/setup/unlock")" = 401 ]
          [ "$(code -H "Origin: $pub" -d owner=example "$h/setup/signin-app")" = 401 ]
          curl -s -D "$F/unlock.h" -o /dev/null -H "Origin: $pub" --data-urlencode "token@$F/setup-token" "$h/setup/unlock"
          head -n 1 "$F/unlock.h" | grep -q ' 303'
          c="$(tr -d '\r' < "$F/unlock.h" | sed -n 's/^[Ss]et-[Cc]ookie: \(__Host-setup=[^;]*\);.*/\1/p')"
          [ -n "$c" ]
          if sudo test -e "$tf"; then echo "the used token is still there" >&2; exit 1; fi
          [ "$(code -H "Origin: $pub" --data-urlencode "token@$F/setup-token" "$h/setup/unlock")" = 410 ]
          csrf="$(curl -s -H "Cookie: $c" "$h/" | sed -n 's/.*name="csrf" value="\([^"]*\)".*/\1/p')"
          [ -n "$csrf" ]
          loc="$(curl -s -D - -o /dev/null -H "Cookie: $c" -H "Origin: $pub" --data-urlencode "csrf=$csrf" --data-urlencode owner=example "$h/setup/signin-app" | tr -d '\r' | sed -n 's/^[Ll]ocation: //p')"
          curl -s -H "Cookie: $c" "$h$loc" > "$F/start.html"
          # The manifest form posts to GitHub itself (no setting moves it); the code's exchange, from the setup unit,
          # reaches the fake through the stand-in its drop-in loads.
          grep -qF 'action="https://github.com/settings/apps/new?state=' "$F/start.html"
          state="$(sed -n 's/.*?state=\([A-Za-z0-9_-]*\)".*/\1/p' "$F/start.html")"
          [ -n "$state" ]
          # GitHub's redirect back, with the code the fake converts once (scripts/ci/fake-github.mjs).
          curl -s -H "Cookie: $c" "$h/setup/app-manifest/callback?state=$state&code=ci-signin-code" | tee "$F/back.html" | grep -q 'GitHub made'
          for _ in $(seq 1 15); do systemctl is-active -q "$u" || break; sleep 1; done
          if systemctl is-active -q "$u"; then echo "setup mode did not turn itself off" >&2; exit 1; fi
          [ "$(systemctl show -p Result --value "$u")" = success ]
          if curl -s -o /dev/null "$h/"; then echo "something still answers on 4399" >&2; exit 1; fi
          d="$(getent passwd wl-dash | cut -d: -f6)/.config/dashboard-signin"
          [ "$(sudo stat -c '%U %a' "$d")" = "wl-dash 700" ]
          for f in client-secret session-secret client-id public-url; do [ "$(sudo stat -c '%U %a' "$d/$f")" = "wl-dash 400" ]; done
          [ "$(sudo cat "$d/client-id")" = Iv1.madeapp00001 ] && [ "$(sudo cat "$d/public-url")" = "$pub" ]
          (umask 077; sudo cat "$d/client-secret" > "$F/client-secret")
          if grep -qFf "$F/client-secret" "$F/back.html" "$F/start.html" || sudo journalctl --no-pager | grep -qFf "$F/client-secret"; then echo "the client secret was echoed" >&2; exit 1; fi
          # Setup mode is off for good: a rerun is refused.
          if sudo bash scripts/setup/dashboards.sh --setup --public-url "$pub" 2> "$F/setup2.err"; then echo "setup mode started again" >&2; exit 1; fi
          grep -q 'setup mode is off' "$F/setup2.err"
      # The first-project gap: the agents' App needs a running hub with sign-in, and add-project starts the hub in its
      # last step. So on a machine with no hub, the App step starts the hub alone first (dashboards.sh --no-instances,
      # with what setup mode stored). First the real hub with no instance, under systemd; then it is taken down again,
      # so the machine has no hub when its first project is added.
      - name: "dashboards.sh --no-instances: the real hub alone, as wl-dash, signing in at github.com only; never with names"
        run: |
          u=worklane-dashboard-hub.service
          sudo bash scripts/setup/dashboards.sh --no-instances | tee "$F/hub0.log"
          systemctl is-active "$u"
          [ "$(systemctl show -p User --value "$u")" = wl-dash ]
          sudo grep -q -- '^ExecStart=/usr/local/bin/worklane dashboard --hub - --service --client-id Iv1.madeapp00001 --public-url https://hub.example.test --signin-dir ' "/etc/systemd/system/$u"
          if [ -e /etc/systemd/system/worklane-dashboard-hub-setup.service ]; then echo "the setup-mode unit is still installed" >&2; exit 1; fi
          to="$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:4399/auth/login)"
          case "$to" in https://github.com/login/oauth/authorize\?*) ;; *) echo "the hub's sign-in goes to $to" >&2; exit 1 ;; esac
          # Its break-glass, with the hub's token from a file of the runner's only: no instance yet.
          ht="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/dashboard-token"
          (umask 077; printf 'Authorization: Bearer %s\n' "$(sudo cat "$ht")" > "$F/hub-auth")
          [ "$(curl -s -H @"$F/hub-auth" http://127.0.0.1:4398/api/hub)" = '{"instances":[]}' ]
          rm -f "$F/hub-auth"
          if sudo bash scripts/setup/dashboards.sh --no-instances ci 2> "$F/hub0.err"; then echo "--no-instances took a name" >&2; exit 1; fi
          # Back to a machine with no hub, for its first project.
          sudo systemctl disable --now "$u"
          sudo rm -f "/etc/systemd/system/$u" "$ht"
          sudo systemctl daemon-reload
          if curl -s -o /dev/null http://127.0.0.1:4399/; then echo "something still answers on 4399" >&2; exit 1; fi
      # The machine owner's browser is scripts/ci/manifest-browser.mjs. The hub's unit runs a stand-in for this step
      # (scripts/ci/hub-stand-in.mjs, the hub's own code with its sign-in given the fake GitHub in process), through a
      # drop-in that replaces ExecStart: the real hub signs people in at github.com only, with no host override, so
      # nobody could sign in to it on this runner. Everything else is real: add-project.sh as root writes and starts the
      # unit itself, before its App step. The drop-in goes afterwards, and the real hub runs with the instance.
      - name: "a machine's first project, no hub and no instance: add-project starts the hub before the App step, the App through the manifest flow, to the end; nothing by hand"
        run: |
          # A stand-in claude from here on (scripts/ci/claude-stand-in.cjs): add-project's claude-token step asks claude
          # auth status as the agent user, and records what it says for the first-run step (claude-account status.json).
          sudo install -m 0755 scripts/ci/claude-stand-in.cjs /usr/local/bin/claude
          sudo bash scripts/setup/machine-owners.sh --first ci-owner
          dd=/etc/systemd/system/worklane-dashboard-hub.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/local/bin/node /opt/worklane/current/scripts/ci/hub-stand-in.mjs /opt/worklane/current/dist %s https://hub.example.test\n' "$GH_FAKE" | sudo tee "$dd/stand-in.conf" >/dev/null
          if [ -e /etc/systemd/system/worklane-dashboard-hub.service ]; then echo "there is a hub already" >&2; exit 1; fi
          sudo test ! -e "$(getent passwd wl-ci | cut -d: -f6)/.config/ci-app/private-key.pem"
          # No --client-id or --public-url: the hub takes what its setup mode stored.
          ( set +e; sudo env NODE_OPTIONS="$LOOPBACK?port=8999" CI_LOOPBACK_GITHUB_PORT=8999 bash scripts/setup/add-project.sh ci example/alpha --timeout 3 < "$F/claude-token" > "$F/run2.jsonl" 2> "$F/run2.err"; echo "$?" > "$F/run2.rc" ) &
          for _ in $(seq 1 90); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4399/auth/login)" = 302 ] && break; sleep 1; done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4399/auth/login)" = 302 ] || { cat "$F/run2.jsonl"; tail -n 40 "$F/run2.err"; exit 1; }
          node scripts/ci/manifest-browser.mjs "$GITHUB_WORKSPACE/dist" http://127.0.0.1:4399 https://hub.example.test "$GH_FAKE" ci-owner "$F/run2.jsonl" "$F/manifest-code-ci" || { cat "$F/run2.jsonl"; tail -n 40 "$F/run2.err"; exit 1; }
          wait
          cat "$F/run2.jsonl"
          [ "$(cat "$F/run2.rc")" = 0 ] || { tail -n 60 "$F/run2.err"; exit 1; }
          grep -q 'no dashboard hub on this machine yet: starting it, with no instance' "$F/run2.err"
          for s in instance app; do jq -se --arg s "$s" 'map(select(.step==$s and .state=="done")) | length == 1' "$F/run2.jsonl"; done
          [ "$(jq -sc 'map(select(.state=="started") | .step)' "$F/run2.jsonl")" = '["instance","app","claude-token","checkout","policy","service","test-user","machine-helper","dashboards"]' ]
          jq -se 'map(select(.state=="failed")) | length == 0' "$F/run2.jsonl"
          jq -se 'map(select(.step=="app" and .state=="ask" and .ask.kind=="approve_link")) | length == 2' "$F/run2.jsonl"
          jq -se 'map(select(.step=="app" and .state=="done" and (.detail|test("made through the manifest flow$")))) | length == 1' "$F/run2.jsonl"
          # Issue #711: the claude-token step never asks a dashboard for the token; here it comes from root's stdin.
          jq -se 'map(select(.step=="claude-token" and .state=="ask")) | length == 0' "$F/run2.jsonl"
          jq -se 'map(select(.step=="claude-token" and .state=="done")) | length == 1' "$F/run2.jsonl"
          jq -se 'map(select(.step=="policy" and .state=="done" and (.detail|startswith("auto_merge off, $20/day, 2 workers")))) | length == 1' "$F/run2.jsonl"
          if grep -qFf "$F/claude-token" "$F/run1.jsonl" "$F/run1.err" "$F/run2.jsonl" "$F/run2.err"; then echo "the token was echoed" >&2; exit 1; fi
          # The App came through the manifest flow: its key and secrets the coordinator's own 0400 files, nothing by hand.
          a="$(getent passwd wl-ci | cut -d: -f6)/.config/ci-app"
          [ "$(sudo cat "$a/made-by")" = manifest ]
          [ "$(sudo stat -c '%U %a' "$a")" = "wl-ci 700" ]
          for f in private-key.pem client-secret webhook-secret; do [ "$(sudo stat -c '%U %a' "$a/$f")" = "wl-ci 400" ] || { sudo stat -c '%n %U %a' "$a/$f"; exit 1; }; done
          if sudo -u wl-dash test -r "$a/private-key.pem"; then echo "wl-dash can read the App's key" >&2; exit 1; fi
          # Nothing echoed: the App's secrets, a line of its key, the one-time code, the sign-in secret.
          node --input-type=module -e 'const f = await import(process.argv[1]); process.stdout.write(f.APP_SECRET + "\n" + f.WEBHOOK_SECRET + "\n");' "file://$GITHUB_WORKSPACE/dist/test/fake-github.js" > "$F/never-ci"
          { sed -n 2p "$F/app.pem"; cat "$F/manifest-code-ci"; } >> "$F/never-ci"
          [ "$(grep -c . "$F/never-ci")" = 4 ]
          if grep -qFf "$F/never-ci" "$F/run2.jsonl" "$F/run2.err" "$F/hub0.log" || sudo journalctl --no-pager | grep -qFf "$F/never-ci"; then echo "a secret or the code was echoed" >&2; exit 1; fi
          # The stand-in goes; the real hub runs, with the instance and the sign-in App setup mode made.
          sudo rm -f "$dd/stand-in.conf"
          sudo systemctl daemon-reload && sudo systemctl restart worklane-dashboard-hub.service
          for _ in $(seq 1 30); do to="$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:4399/auth/login || true)"; [ -n "$to" ] && break; sleep 1; done
          case "$to" in https://github.com/login/oauth/authorize\?*) ;; *) echo "the hub's sign-in goes to $to" >&2; exit 1 ;; esac
          systemctl show -p ExecStart --value worklane-dashboard-hub.service | grep -q -- '/usr/local/bin/worklane dashboard --hub ci='
      - name: the instance, the token for the agent only, the checkout through the App, the services, the helper
        run: |
          sudo test -f "$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci/instance.yaml"
          c="$(getent passwd wl-ci-agent | cut -d: -f6)/.claude/.credentials.json"
          [ "$(sudo stat -c '%U %a' "$c")" = "wl-ci-agent 600" ]
          sudo grep -qFf "$F/claude-token" "$c"
          if sudo -u wl-ci test -r "$c"; then echo "the coordinator can read the agent's Claude login" >&2; exit 1; fi
          d=/srv/worklane/ci/alpha
          sudo test -f "$d/.worklane/config.yaml"
          # The checkout's origin is GitHub's own URL: no setting moved it (the runner's git config carries it to the fake).
          [ "$(sudo git -C "$d" config --get remote.origin.url)" = "https://github.com/example/alpha.git" ]
          sudo git -C "$d" config --get-all credential.helper | grep -qx '!/usr/local/bin/worklane git-credential --instance ci'
          grep -q '^git as x-access-token: POST /example/alpha.git/git-upload-pack$' "$F/requests.log"
          if grep '^git as ' "$F/requests.log" | grep -v '^git as x-access-token:'; then echo "git authenticated as someone else" >&2; exit 1; fi
          grep -q "^POST /app/installations/4242/access_tokens$" "$F/requests.log"
          for u in worklane-ci worklane-dashboard-ci worklane-dashboard-hub; do systemctl is-active "$u.service"; done
          # The real hub took over from setup mode, with the sign-in App setup mode made: its unit is gone.
          systemctl show -p ExecStart --value worklane-dashboard-hub.service | grep -q -- '--client-id Iv1.madeapp00001 --public-url https://hub.example.test '
          if [ -e /etc/systemd/system/worklane-dashboard-hub-setup.service ]; then echo "the setup-mode unit is still installed" >&2; exit 1; fi
          sleep 15 && systemctl is-active worklane-ci.service
          # The hub serves an instance now: starting it alone would drop it, and is refused.
          if sudo bash scripts/setup/dashboards.sh --no-instances 2> "$F/hub1.err"; then echo "--no-instances ran over a hub with instances" >&2; exit 1; fi
          grep -q -- "--no-instances: the hub serves ci already" "$F/hub1.err"
          systemctl show -p ExecStart --value worklane-dashboard-hub.service | grep -q -- "--hub ci="
          sudo -n -l -U wl-ci "$HELPER" add-project beta example/beta
          if sudo -n -l -U wl-ci "$HELPER" add-project beta example/beta extra; then echo "the rule passes extra arguments" >&2; exit 1; fi
          if sudo -n -l -U wl-dash "$HELPER" add-project beta example/beta; then echo "wl-dash may add a project" >&2; exit 1; fi
      - name: "No CI (#469): the agent user can't write the event log a test run's tier results are read from; only the coordinator records one, and only that one counts"
        run: |
          home="$(getent passwd wl-ci | cut -d: -f6)"
          state="$home/.local/state/worklane/instances/ci/state"
          db="$state/events.db"
          sudo test -f "$db"
          sudo stat -c '%U:%G %a %n' "$home" "$home/.local" "$state" "$db"* | tee "$F/log-modes.txt"
          # The home, the state and the log are the coordinator's, in its own private group, with nothing for others
          # (the engine keeps its state 0770/0660, src/os/index.ts groupOnly; the home was found 0770 here too).
          for p in "$home" "$home/.local" "$state" "$db"; do
            [ "$(sudo stat -c '%U:%G' "$p")" = "wl-ci:wl-ci" ] || { echo "$p isn't wl-ci:wl-ci" >&2; exit 1; }
            m="$(sudo stat -c '%a' "$p")" && [ "${m: -1}" = 0 ] || { echo "$p gives others access ($m)" >&2; exit 1; }
          done
          # So the group is what keeps everyone else out: wl-ci is its only member, and no other user has it as theirs.
          getent group wl-ci
          [ -z "$(getent group wl-ci | cut -d: -f4)" ] || { echo "wl-ci's group has members" >&2; exit 1; }
          gid="$(getent group wl-ci | cut -d: -f3)"
          [ "$(getent passwd | awk -F: -v g="$gid" '$4 == g {print $1}')" = wl-ci ] || { echo "another user has wl-ci's group" >&2; exit 1; }
          for u in wl-ci-agent wl-dash; do if id -nG "$u" | tr ' ' '\n' | grep -qx wl-ci; then echo "$u is in the coordinator's group" >&2; exit 1; fi; done
          # No ACL anywhere on the way gives the agent user or the work group anything.
          sudo getfacl -p "$home" "$home/.local" "$home/.local/state" "$state" "$db" > "$F/log-acl.txt"
          cat "$F/log-acl.txt"
          if grep -E '^(user|group):(wl-ci-agent|wl-ci-work):' "$F/log-acl.txt"; then echo "an ACL grants the agent user or the work group" >&2; exit 1; fi
          # wl-dash's ACLs: traverse (--x) on the way to the dashboard token, never on the log itself.
          if sudo getfacl -p "$db" | grep -E '^(user|group):wl-dash:'; then echo "an ACL grants wl-dash the event log" >&2; exit 1; fi
          # What a tier result is, as the engine records it, and how many there are now (as the coordinator, read-only).
          sha=4690000000000000000000000000000000000469
          # In /tmp, which every user can read (the runner's temp is not).
          pr=/tmp/wl-log-probe-469.mjs
          cat > "$pr" <<'JS'
          import { EventLog } from '/opt/worklane/current/dist/src/events/log.js';
          import { openReadOnly } from '/opt/worklane/current/dist/src/events/read-only.js';
          import { localRunChecks } from '/opt/worklane/current/dist/src/ci-none.js';
          const [what, db, sha] = process.argv.slice(2);
          const tests = { test_run: { tiers: [{ name: 'unit', kind: 'fast' }], checks: {} } };
          if (what === 'append') {
            const log = new EventLog(db);
            log.append('testrun.finished', { id: `probe-${process.getuid()}`, sha, kind: 'fast', prs: [469], ok: true, outcome: 'done', results: [{ tier: 'unit', ok: true }], detail: 'the #469 probe' }, 'probe');
            log.close();
            console.log('appended');
          } else {
            const d = openReadOnly(db);
            const rows = d.prepare("SELECT type, payload FROM events WHERE type IN ('testrun.queued', 'testrun.finished')").all().map((r) => ({ type: r.type, payload: JSON.parse(r.payload) }));
            d.close();
            console.log(JSON.stringify({ finished: rows.filter((r) => r.type === 'testrun.finished' && r.payload.sha === sha).length, checks: localRunChecks(rows, sha, tests) }));
          }
          JS
          chmod 0644 "$pr"
          probe() { (cd / && sudo -u "$1" /usr/local/bin/node "$pr" "$2" "$db" "$sha"); }
          before="$(probe wl-ci count)"
          echo "before: $before"
          [ "$before" = '{"finished":0,"checks":[]}' ]
          sum="$(sudo sha256sum "$db" | cut -d' ' -f1)"
          # As the agent user, and as the hub's viewer user (it may traverse to the dashboard token, nothing else):
          # every way at the file is refused: through the engine's own log, a plain append, a truncate, a new file
          # beside it, a rename, reading it, and listing its directory.
          for who in wl-ci-agent wl-dash; do
            if probe "$who" append > "$F/append-$who.log" 2>&1; then cat "$F/append-$who.log"; echo "$who appended to the event log" >&2; exit 1; fi
            cat "$F/append-$who.log"
            grep -Eq 'EACCES|permission denied|unable to open database|SQLITE_CANTOPEN' "$F/append-$who.log"
            for how in 'printf x >> "$1"' ': > "$1"' 'touch "$(dirname "$1")/events.db.new"' 'mv "$1" "$1.moved"' 'cat "$1" > /dev/null' 'ls "$(dirname "$1")"' 'test -w "$1"'; do
              if (cd / && sudo -u "$who" sh -c "$how" _ "$db") 2>/dev/null; then echo "$who could: $how" >&2; exit 1; fi
            done
          done
          [ "$(sudo sha256sum "$db" | cut -d' ' -f1)" = "$sum" ] || { echo "the log changed under the agent user's attempts" >&2; exit 1; }
          [ "$(probe wl-ci count)" = "$before" ] || { echo "a tier result appeared" >&2; exit 1; }
          # As the coordinator, the engine side: the same append works, and only now is the tier's check there, passed.
          probe wl-ci append
          after="$(probe wl-ci count)"
          echo "after: $after"
          [ "$after" = '{"finished":1,"checks":[{"name":"test-run/unit","source":"check_run","status":"completed","conclusion":"success"}]}' ]
      - name: "regression (bug B): after add-project installed the agents' token, the first-run step reads it done, from claude-account's status.json (never the token, never the cached email)"
        run: |
          s=/var/lib/worklane/claude-account/status.json
          [ "$(stat -c '%U %a' "$s")" = "root 644" ]
          id="$(tr -d '[:space:]' < "$F/claude-token" | tr -d '\n' | sha256sum | cut -c1-8)"
          jq -e --arg id "$id" '.users | map(select(.instance == "ci" and .kind == "agent")) | length == 1 and .[0].user == "wl-ci-agent" and .[0].logged_in == true and .[0].stored == true and .[0].token_id == $id' "$s"
          if sudo grep -qFf "$F/claude-token" "$s"; then echo "status.json holds the token" >&2; exit 1; fi
          # The step, through the real hub (wl-dash, break-glass) to the instance's dashboard (wl-ci), which can't sudo.
          hub="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/dashboard-token"
          (umask 077; printf 'authorization: Bearer %s\n' "$(sudo cat "$hub")" > "$F/hub-auth-b")
          for _ in $(seq 1 20); do curl -sS -H @"$F/hub-auth-b" 'http://127.0.0.1:4398/api/i/ci/first-run?fresh=1' > "$F/first-run-b.json" && jq -e '.setup' "$F/first-run-b.json" > /dev/null && break; sleep 3; done
          jq '.setup.groups[].steps[] | select(.id == "claude-token")' "$F/first-run-b.json"
          jq -e --arg id "$id" '.setup.groups[].steps[] | select(.id == "claude-token") | .done == true and (.detail | test("^wl-ci-agent is signed in \\(claude\\.ai\\), per claude auth status as that user at .*; token " + $id + "$"))' "$F/first-run-b.json"
          if grep -q '@example.test' "$F/first-run-b.json"; then echo "the first-run page shows the cached account email" >&2; exit 1; fi
      - name: "outbound env on a real unit, as the coordinator (#381 follow-up): the unit's redirecting and TLS-trust variables reach no child; root's network.json proxy and CA do (a real Node, git and gh handshake); a writable, non-root, symlinked or non-PEM one is refused"
        run: |
          # As wl-ci in a transient unit whose own environment points every redirecting variable elsewhere: the env the
          # instance's coordinator builds (instanceEnv, its implicit gh/git children) and a project command's (childEnv),
          # each printed by a real child, and real Node, git and gh children's HTTPS requests to local servers whose
          # certificate only the test CA signs. The files are really root's here, which the unit tests can't make.
          # Nothing leaves the runner: every request goes to 127.0.0.1.
          d=/var/tmp/outbound-ci && sudo install -d -m 0755 "$d"
          cat > "$F/outbound.mjs" <<'EOF'
          const engine = '/opt/worklane/current/dist/src';
          const { spawnSync } = await import('node:child_process');
          const { projectCommand } = await import(`${engine}/os/index.js`);
          const { loadInstance } = await import(`${engine}/instance.js`);
          const { instanceEnv } = await import(`${engine}/service.js`);
          const envOf = (file, args, env) => Object.fromEntries(spawnSync(file, args, { env, encoding: 'utf8' }).stdout.split('\n').filter((l) => l.includes('=')).map((l) => [l.slice(0, l.indexOf('=')), l.slice(l.indexOf('=') + 1)]));
          const c = projectCommand('env');
          const coord = instanceEnv(loadInstance('ci'));
          // A real TLS handshake from a child with each env: trusted only through root's CA, never through the unit's own variables.
          const get = "require('https').get('https://127.0.0.1:8443/', (r) => { console.log('status ' + r.statusCode); r.resume(); }).on('error', (e) => console.log('error ' + e.code))";
          const tls = (env) => spawnSync(process.execPath, ['-e', get], { env, encoding: 'utf8', timeout: 20000 }).stdout.trim();
          // git and gh with the same envs, against scripts/ci/test-ca-server.mjs on 127.0.0.1:443 (gh takes no port in --hostname).
          const run = (file, args, env) => {
            const r = spawnSync(file, args, { env, encoding: 'utf8', timeout: 30000 });
            return { code: r.status, out: (r.stdout ?? '').trim().slice(0, 300), err: (r.stderr ?? '').trim().split('\n').slice(-2).join(' | ').slice(0, 300) };
          };
          const { mkdtempSync } = await import('node:fs');
          const ghDir = mkdtempSync('/tmp/outbound-gh-');
          // The probe's own additions for gh only, none of which changes what it trusts: an empty config dir, a dummy token
          // for the loopback host (gh refuses an unauthenticated host before any request), no update check, no telemetry.
          const gh = (env) => run('gh', ['api', '--hostname', '127.0.0.1', '/ci-probe'], { ...env, GH_CONFIG_DIR: ghDir, GH_ENTERPRISE_TOKEN: 'ci-dummy-token', GH_NO_UPDATE_NOTIFIER: '1', GH_TELEMETRY: 'false', DO_NOT_TRACK: '1', GH_PROMPT_DISABLED: '1' });
          const git = (env) => run('git', ['ls-remote', 'https://127.0.0.1/x.git'], env);
          console.log(JSON.stringify({
            project: envOf(c.file, c.args, c.env),
            coordinator: envOf('/usr/bin/env', [], coord),
            tls: { project: tls(c.env), coordinator: tls(coord) },
            tools: { project: { git: git(c.env), gh: gh(c.env) }, coordinator: { git: git(coord), gh: gh(coord) } },
          }));
          EOF
          sudo install -m 0644 "$F/outbound.mjs" "$d/outbound.mjs"
          bad=http://attacker.invalid:8080
          probe() {
            sudo systemd-run --uid=wl-ci --wait --pipe --quiet -p WorkingDirectory=/ \
              -p "Environment=HTTPS_PROXY=$bad HTTP_PROXY=$bad ALL_PROXY=$bad NO_PROXY=* https_proxy=$bad http_proxy=$bad all_proxy=$bad no_proxy=*" \
              -p "Environment=ANTHROPIC_BASE_URL=$bad ANTHROPIC_API_URL=$bad GH_HOST=attacker.invalid GH_REPO=attacker.invalid/o/r GITHUB_API_URL=$bad GIT_PROXY_COMMAND=/bin/false CLAUDE_CODE_USE_BEDROCK=1" \
              -p "Environment=NODE_TLS_REJECT_UNAUTHORIZED=0 GIT_SSL_NO_VERIFY=1 NODE_EXTRA_CA_CERTS=/tmp/attacker-ca.pem SSL_CERT_FILE=/tmp/attacker-ca.pem SSL_CERT_DIR=/tmp/attacker-certs GIT_SSL_CAINFO=/tmp/attacker-ca.pem REQUESTS_CA_BUNDLE=/tmp/attacker-ca.pem CURL_CA_BUNDLE=/tmp/attacker-ca.pem SSLKEYLOGFILE=/tmp/attacker-keys GODEBUG=x509sha1=1 GIT_CONFIG_PARAMETERS=http.sslverify=false" \
              /usr/local/bin/node "$d/outbound.mjs"
          }
          check() { # $1: the probe's JSON; $2: the proxy root set, or empty for none
            for k in project coordinator; do
              jq -e --arg k "$k" '.[$k] | (.PATH | length > 0) and (to_entries | map(select(.value | test("attacker|^\\*$"))) | length == 0)' <<<"$1" || return 1
              jq -e --arg k "$k" '.[$k] | keys | map(select(test("^(ANTHROPIC_BASE_URL|ANTHROPIC_API_URL|GH_HOST|GH_REPO|GITHUB_API_URL|GIT_PROXY_COMMAND|CLAUDE_CODE_USE_BEDROCK|ALL_PROXY)$"; "i"))) | length == 0' <<<"$1" || return 1
              if [ -n "$2" ]; then
                jq -e --arg k "$k" --arg p "$2" '.[$k] | .HTTPS_PROXY == $p and .HTTP_PROXY == $p and .https_proxy == $p and .http_proxy == $p and .NO_PROXY == "localhost,127.0.0.1" and .no_proxy == "localhost,127.0.0.1"' <<<"$1" || return 1
              else
                jq -e --arg k "$k" '.[$k] | keys | map(select(test("_proxy$"; "i"))) | length == 0' <<<"$1" || return 1
              fi
            done
          }
          # Only root's CA, as NODE_EXTRA_CA_CERTS, SSL_CERT_FILE and GIT_SSL_CAINFO; no other trust variable; and a real handshake
          # to the test server that succeeds only with it ($2: the CA path, or empty for none).
          check_ca() {
            check_tools "$1" "$2" "${3:-?}" || return 1
            for k in project coordinator; do
              jq -e --arg k "$k" '.[$k] | keys | map(select(test("^(NODE_TLS_REJECT_UNAUTHORIZED|GIT_SSL_NO_VERIFY|SSL_CERT_DIR|REQUESTS_CA_BUNDLE|CURL_CA_BUNDLE|SSLKEYLOGFILE|GODEBUG|GIT_CONFIG_PARAMETERS)$"; "i"))) | length == 0' <<<"$1" || return 1
              jq -e --arg k "$k" '.[$k] | to_entries | map(select(.value | test("attacker"))) | length == 0' <<<"$1" || return 1
              if [ -n "$2" ]; then
                jq -e --arg k "$k" --arg c "$2" '(.[$k] | .NODE_EXTRA_CA_CERTS == $c and .SSL_CERT_FILE == $c and .GIT_SSL_CAINFO == $c) and (.tls[$k] == "status 200")' <<<"$1" || return 1
              else
                jq -e --arg k "$k" '(.[$k] | has("NODE_EXTRA_CA_CERTS") or has("SSL_CERT_FILE") or has("GIT_SSL_CAINFO") | not) and (.tls[$k] | startswith("error "))' <<<"$1" || return 1
              fi
            done
          }
          # git and gh, as children of each env: with root's CA, past TLS (git lists the server's one ref, gh prints its JSON);
          # without, refused at TLS with a certificate error, whatever the unit's GIT_SSL_NO_VERIFY, SSL_CERT_FILE and the
          # rest say. Each result printed as an OK line quoting git's and gh's own text ($3: what this probe is).
          check_tools() {
            for k in project coordinator; do
              for tool in git gh; do
                r="$(jq -c --arg k "$k" --arg t "$tool" '.tools[$k][$t]' <<<"$1")"
                if [ -n "$2" ]; then
                  want='refs/heads/main'; [ "$tool" = gh ] && want='ci-probe-ok'
                  jq -e --arg w "$want" '.code == 0 and (.out | contains($w))' <<<"$r" >/dev/null || { echo "FAIL: $3: $tool ($k) with the root CA: $r" >&2; return 1; }
                  echo "OK: $3: $tool ($k) got past TLS with the root CA: $(jq -r '.out' <<<"$r")"
                else
                  jq -e '.code != 0 and (.err | test("certificate|x509|SSL"; "i"))' <<<"$r" >/dev/null || { echo "FAIL: $3: $tool ($k) without the root CA: $r" >&2; return 1; }
                  echo "OK: $3: $tool ($k) refused at TLS: $(jq -r '.err' <<<"$r")"
                fi
              done
            done
          }
          # The test CA and a server certificate for 127.0.0.1 that only it signs, served by openssl on 8443 (Node's probe)
          # and by scripts/ci/test-ca-server.mjs on 443, as root (git's smart-HTTP refs and gh's API, both loopback only).
          t="$F/tls" && mkdir -p "$t"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$t/ca.key" -out "$t/ca.pem" -subj /CN=ci-test-ca -days 2 -addext basicConstraints=critical,CA:TRUE -addext keyUsage=critical,keyCertSign 2>/dev/null
          openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout "$t/leaf.key" -out "$t/leaf.csr" -subj /CN=localhost 2>/dev/null
          printf 'subjectAltName=IP:127.0.0.1,DNS:localhost\nbasicConstraints=CA:FALSE\n' > "$t/leaf.ext"
          openssl x509 -req -in "$t/leaf.csr" -CA "$t/ca.pem" -CAkey "$t/ca.key" -CAcreateserial -out "$t/leaf.pem" -days 2 -extfile "$t/leaf.ext" 2>/dev/null
          nohup openssl s_server -quiet -accept 8443 -cert "$t/leaf.pem" -key "$t/leaf.key" -www > "$t/server.log" 2>&1 &
          echo $! > "$t/server.pid"
          sudo bash -c 'nohup /usr/local/bin/node "$1" "$2" "$3" 443 > "$4" 2>&1 & echo $! > "$5"' _ "$GITHUB_WORKSPACE/scripts/ci/test-ca-server.mjs" "$t/leaf.pem" "$t/leaf.key" "$t/git-gh-server.log" "$t/git-gh-server.pid"
          for _ in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/8443) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/443) 2>/dev/null && break; sleep 0.5; done
          n=/etc/worklane/network.json
          out="$(probe)"
          check "$out" ""
          check_ca "$out" "" "no network.json"
          printf '{"proxy": "http://proxy.ci.invalid:3128", "no_proxy": "localhost,127.0.0.1"}\n' > "$F/network.json"
          sudo install -o root -g root -m 0644 "$F/network.json" "$n"
          check "$(probe)" "http://proxy.ci.invalid:3128"
          # Writable by others, then not root's, then a proxy with a login: each refused, so no proxy at all.
          sudo chmod 0666 "$n"
          check "$(probe)" ""
          sudo chmod 0644 "$n"
          sudo chown wl-ci "$n"
          check "$(probe)" ""
          sudo chown root "$n"
          printf '{"proxy": "http://user:pass@proxy.ci.invalid:3128"}\n' | sudo tee "$n" >/dev/null
          check "$(probe)" ""
          # The custom CA: root's file in root's directory, then each refusal (no CA at all, never the unit's own).
          ca=/etc/worklane/ca/ci-test.pem
          sudo install -d -o root -g root -m 0755 /etc/worklane/ca
          sudo install -o root -g root -m 0644 "$t/ca.pem" "$ca"
          printf '{"ca_file": "%s"}\n' "$ca" | sudo tee "$n" >/dev/null
          out="$(probe)"
          check_ca "$out" "$ca" "root's ca_file"
          check "$out" ""
          sudo chmod 0666 "$ca"
          check_ca "$(probe)" "" "CA file 0666"
          sudo chmod 0644 "$ca"
          sudo chown wl-ci "$ca"
          check_ca "$(probe)" "" "CA file owned by wl-ci"
          sudo chown root "$ca"
          sudo chmod 0777 /etc/worklane/ca
          check_ca "$(probe)" "" "CA directory 0777"
          sudo chmod 0755 /etc/worklane/ca
          sudo ln -sfn "$ca" /etc/worklane/ca/link.pem
          printf '{"ca_file": "/etc/worklane/ca/link.pem"}\n' | sudo tee "$n" >/dev/null
          check_ca "$(probe)" "" "CA through a symlink"
          sudo install -o root -g root -m 0644 "$t/leaf.key" /etc/worklane/ca/key.pem
          printf '{"ca_file": "/etc/worklane/ca/key.pem"}\n' | sudo tee "$n" >/dev/null
          check_ca "$(probe)" "" "a private key as ca_file"
          head -c 300000 /dev/zero | tr '\0' ' ' | cat "$t/ca.pem" - | sudo tee /etc/worklane/ca/big.pem >/dev/null
          printf '{"ca_file": "/etc/worklane/ca/big.pem"}\n' | sudo tee "$n" >/dev/null
          check_ca "$(probe)" "" "a 300 KB CA file"
          printf '{"ca_file": "%s"}\n' "$ca" | sudo tee "$n" >/dev/null
          check_ca "$(probe)" "$ca" "root's ca_file again"
          kill "$(cat "$t/server.pid")" || true
          sudo kill "$(cat "$t/git-gh-server.pid")" || true
          # Every request the git/gh server saw (all on 127.0.0.1).
          cat "$t/git-gh-server.log"
          sudo rm -f "$n"
          sudo rm -rf /etc/worklane/ca "$d"
      - name: through the machine helper, as the coordinator from inside its own sandbox, every step is skipped as done
        run: |
          # As the coordinator really calls it: through sudo from inside its unit (ProtectSystem=full), the unit's settings
          # read from the one service.sh generates. The helper runs add-project.sh in a unit of its own.
          mapfile -t props < <(bash scripts/ci/coordinator-unit-props.sh ci)
          args=(); for p in "${props[@]}"; do args+=(-p "$p"); done
          sudo systemd-run --wait --pipe --collect --quiet "${args[@]}" sudo -n "$HELPER" add-project ci example/alpha < /dev/null > "$F/run3.jsonl" 2> "$F/run3.err" || { cat "$F/run3.jsonl" "$F/run3.err"; exit 1; }
          # (The read-only failure of the old inline way is shown in the updater step, for install-updater and set-slots.
          # A rerun of add-project that skips every step could pass inline too, so it would prove nothing here.)
          cat "$F/run3.jsonl"
          jq -se 'length == 18 and (map(select(.state=="done")) | length == 9) and (map(select(.state=="ask" or .state=="failed")) | length == 0)' "$F/run3.jsonl"
          sudo grep -q '"what":"add-project".*"to":"ci example/alpha"' /var/lib/worklane/machine-changes.jsonl
          if sudo -u wl-ci sudo -n "$HELPER" add-project 'ci;id' example/alpha 2>/dev/null; then echo "a bad name ran" >&2; exit 1; fi
          echo "OK: add-project, called by the coordinator from inside its sandbox, ran in a unit of its own: every step skipped as done"
      - name: "the updater through the machine helper, as the coordinator: installed off, the release channel only, a signer staged and the signers file untouched; adding a signer and any other arguments refused by sudo"
        run: sudo "$(command -v node)" scripts/ci/updater-setup-root.mjs wl-ci
      - name: "updates.sh --add-check, as root: an existing updates.json with its own values gets only the new names (twice for one: added once), every other byte, its owner and mode kept; nothing installed; bad names, other options and a missing file refused"
        run: |
          cfg=/etc/worklane/updates.json
          sudo cp -p "$cfg" "$RUNNER_TEMP/updates.json.saved"
          # An owner's own values, laid out as updates.sh writes it, with a key setup never writes.
          printf '%s\n' '{' '  "enabled": true,' '  "channel": "main",' '  "allowed_signers": "/etc/worklane/allowed_signers",' '  "repo_url": "https://example.invalid/fork.git",' '  "branch": "stable",' '  "required_checks": [' '    "scan",' '    "test (ubuntu-latest, 22)"' '  ],' '  "note": {"kept": [1, 2]}' '}' > "$RUNNER_TEMP/custom.json"
          printf '%s\n' '{' '  "enabled": true,' '  "channel": "main",' '  "allowed_signers": "/etc/worklane/allowed_signers",' '  "repo_url": "https://example.invalid/fork.git",' '  "branch": "stable",' '  "required_checks": [' '    "scan",' '    "test (ubuntu-latest, 22)",' '    "wizard end to end (real systemd)",' '    "dco"' '  ],' '  "note": {"kept": [1, 2]}' '}' > "$RUNNER_TEMP/want.json"
          sudo install -o root -g root -m 0644 "$RUNNER_TEMP/custom.json" "$cfg"
          installed() { sudo sha256sum /usr/local/libexec/worklane-update /etc/systemd/system/worklane-update.service /etc/systemd/system/worklane-update.timer; systemctl show -p ActiveEnterTimestampMonotonic worklane-update.timer; }
          before="$(installed)"
          sudo bash scripts/setup/updates.sh --add-check "wizard end to end (real systemd)" --add-check dco > "$RUNNER_TEMP/add1.out" 2>&1 || { cat "$RUNNER_TEMP/add1.out"; exit 1; }
          cat "$RUNNER_TEMP/add1.out"
          sudo cmp "$cfg" "$RUNNER_TEMP/want.json"
          [ "$(sudo stat -c '%U %G %a' "$cfg")" = "root root 644" ]
          grep -qxF 'added: "wizard end to end (real systemd)"' "$RUNNER_TEMP/add1.out"
          grep -qxF 'added: "dco"' "$RUNNER_TEMP/add1.out"
          grep -qxF "$cfg required_checks before:" "$RUNNER_TEMP/add1.out"
          grep -qxF "$cfg required_checks after:" "$RUNNER_TEMP/add1.out"
          # dco runs on pull requests only, so main's commits never pass it: warned. A default check isn't.
          grep -q '^WARNING: "dco" isn'"'"'t one of the checks a batched main commit gets' "$RUNNER_TEMP/add1.out"
          if grep -q 'WARNING: "wizard end to end' "$RUNNER_TEMP/add1.out"; then echo "a default check was warned about" >&2; exit 1; fi
          # Again, the same name twice and one already there: nothing changes, the file isn't rewritten.
          ino="$(sudo stat -c %i "$cfg")"
          sudo bash scripts/setup/updates.sh --add-check "wizard end to end (real systemd)" --add-check "wizard end to end (real systemd)" --add-check scan > "$RUNNER_TEMP/add2.out" 2>&1 || { cat "$RUNNER_TEMP/add2.out"; exit 1; }
          cat "$RUNNER_TEMP/add2.out"
          sudo cmp "$cfg" "$RUNNER_TEMP/want.json"
          [ "$(sudo stat -c '%i %U %G %a' "$cfg")" = "$ino root root 644" ]
          [ "$(grep -c '^already listed, skipped: ' "$RUNNER_TEMP/add2.out")" = 3 ]
          grep -qxF 'nothing to add; the file is unchanged' "$RUNNER_TEMP/add2.out"
          # The file's own mode is kept (here 0600), and no dotted temp file is left.
          sudo chmod 0600 "$cfg"
          sudo bash scripts/setup/updates.sh --add-check desktop > /dev/null
          [ "$(sudo stat -c '%U %G %a' "$cfg")" = "root root 600" ]
          sudo jq -e '.required_checks[-1] == "desktop" and (.required_checks | length) == 5' "$cfg"
          if sudo ls -A /etc/worklane | grep '^\.updates'; then echo "a temp file was left" >&2; exit 1; fi
          sudo grep -q '"what":"updates.required_checks".*"to":"added \\"wizard end to end (real systemd)\\", \\"dco\\""' /var/lib/worklane/machine-changes.jsonl
          # Refused, with nothing changed: a bad name, another option beside it, an unknown flag, no name.
          now="$(sudo sha256sum "$cfg")"
          refused() {
            local rc=0
            sudo bash scripts/setup/updates.sh "$@" > "$RUNNER_TEMP/bad.out" 2>&1 || rc=$?
            cat "$RUNNER_TEMP/bad.out"
            [ "$rc" = 2 ] || { echo "exit $rc, not 2, for: $*" >&2; exit 1; }
          }
          refused --add-check "test (macos-latest"
          grep -q 'has unbalanced parentheses' "$RUNNER_TEMP/bad.out"
          refused --add-check "22)"
          refused --add-check ""
          grep -q 'the name is empty' "$RUNNER_TEMP/bad.out"
          refused --add-check " scan"
          refused --add-check "$(printf 'a\nb')"
          grep -q 'has a newline or another control character' "$RUNNER_TEMP/bad.out"
          refused --add-check scan --channel main
          grep -q 'takes no other option' "$RUNNER_TEMP/bad.out"
          refused --add-check scan --check scan
          refused --add-check scan --bogus
          grep -q 'unknown argument --bogus' "$RUNNER_TEMP/bad.out"
          refused --add-check
          refused --add-check --release-hold
          grep -q -- '--add-check needs a check name' "$RUNNER_TEMP/bad.out"
          [ "$(sudo sha256sum "$cfg")" = "$now" ]
          # The edit alone, every time: the updater, its units and its timer as they were.
          [ "$(installed)" = "$before" ]
          # No updates.json: refused with the fix, and none made.
          sudo mv "$cfg" "$RUNNER_TEMP/updates.json.aside"
          if sudo bash scripts/setup/updates.sh --add-check scan > "$RUNNER_TEMP/none.out" 2>&1; then echo "added to a missing file" >&2; exit 1; fi
          grep -qF "updates.json doesn't exist: install the updater first (sudo bash scripts/setup/updates.sh, without --add-check)" "$RUNNER_TEMP/none.out"
          if sudo test -e "$cfg"; then echo "--add-check made an updates.json" >&2; exit 1; fi
          sudo cp -p "$RUNNER_TEMP/updates.json.saved" "$cfg"
          [ "$(sudo stat -c '%U %G %a' "$cfg")" = "root root 644" ]
          echo "OK: --add-check added only the new names, byte for byte, kept owner and mode, installed nothing, refused the rest"
      # Wizard screen 11's terminal half and its server path, on the instance add-project made (ci): credentials.sh
      # intake-discord installs the bot token for the coordinator only and writes credentials.yaml itself; the engine's
      # own listing code, run as the coordinator, reads that token and asks a fake Discord (scripts/ci/fake-discord.mjs,
      # through an injected fetch: the listing has no setting for its host); the real hub (wl-dash) forwards the Discord
      # step to the instance's dashboard (wl-ci). How that dashboard's listing is chosen is shown in units of its own
      # (scripts/ci/discord-seam-dashboard.mjs, as wl-ci): the engine's own cli.js by absolute path, whatever PATH or
      # the environment say; a stand-in only through the code-level seam; an option naming another program refused.
      # Not a real token, and nothing in this step asks discord.com.
      - name: "credentials.sh intake-discord: the bot token on stdin, 0400 for the coordinator only, credentials.yaml written; the bot's channels as the coordinator; the Discord step through the hub"
        run: |
          h="$(getent passwd wl-ci | cut -d: -f6)"
          creds="$h/.local/state/worklane/instances/ci/credentials.yaml"
          tf="$h/.config/ci-intake/discord-token"
          before="$(sudo sha256sum "$creds" | cut -d' ' -f1)"
          # A bad token: refused, nothing installed, credentials.yaml untouched, never echoed.
          bad="not-a-token-$(openssl rand -hex 8)"
          if printf '%s\n' "$bad" | sudo bash scripts/setup/credentials.sh ci intake-discord > "$F/discord-bad.out" 2>&1; then echo "a bad token was accepted" >&2; exit 1; fi
          cat "$F/discord-bad.out"
          grep -q "that doesn't look like a bot token; nothing installed" "$F/discord-bad.out"
          if grep -qF "$bad" "$F/discord-bad.out"; then echo "the bad token was echoed" >&2; exit 1; fi
          if sudo test -e "$tf"; then echo "a bad token installed something" >&2; exit 1; fi
          [ "$(sudo sha256sum "$creds" | cut -d' ' -f1)" = "$before" ]
          # A good one: in a file of the runner's only, masked in case anything prints it; on stdin, never an argument.
          t="$(openssl rand -hex 12).$(openssl rand -hex 3).$(openssl rand -hex 19)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/discord-token"); unset t
          sudo bash scripts/setup/credentials.sh ci intake-discord < "$F/discord-token" > "$F/discord.out" 2>&1 || { cat "$F/discord.out"; exit 1; }
          cat "$F/discord.out"
          if grep -q 'In credentials.yaml set' "$F/discord.out"; then echo "credentials.sh still asks for a hand edit" >&2; exit 1; fi
          grep -qxF "wrote $creds (intake.discord_token: $tf; the rest kept)" "$F/discord.out"
          [ "$(sudo stat -c '%U %G %a' "$tf")" = "wl-ci wl-ci 400" ]
          [ "$(sudo stat -c '%U %a' "$(dirname "$tf")")" = "wl-ci 700" ]
          [ "$(sudo stat -c '%U %a' "$creds")" = "wl-ci 600" ]
          [ "$(sudo cat "$tf" | sha256sum)" = "$(tr -d '\n' < "$F/discord-token" | sha256sum)" ]
          # credentials.yaml names the file, and the App written earlier is still there.
          sudo node -e 'const y=require("/opt/worklane/current/node_modules/yaml");const c=y.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(!(c.intake.discord_token===process.argv[2]&&c.github.kind==="app"&&c.github.app_id===91&&c.github.installation_id===4242))process.exit(1)' "$creds" "$tf"
          # Only the coordinator reads it: not the agent user, not the hub's user.
          sudo -u wl-ci test -r "$tf"
          for u in wl-ci-agent wl-dash; do if sudo -u "$u" cat "$tf" > /dev/null 2>&1; then echo "$u can read the bot token" >&2; exit 1; fi; done
          # A rerun (a new token after a reset) replaces the file and keeps credentials.yaml valid.
          sudo bash scripts/setup/credentials.sh ci intake-discord < "$F/discord-token" > "$F/discord2.out" 2>&1 || { cat "$F/discord2.out"; exit 1; }
          [ "$(sudo stat -c '%U %G %a' "$tf")" = "wl-ci wl-ci 400" ]
          # The bot's channels, as the coordinator: the engine's own listing reads the instance's token and asks the fake.
          nohup node scripts/ci/fake-discord.mjs 8997 "$F/discord-token" "$F/discord-requests.log" > "$F/fake-discord.log" 2>&1 &
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8997/ && break; sleep 1; done
          : > "$F/discord-requests.log"
          list() { (cd / && sudo -H -u "$1" /usr/local/bin/node /opt/worklane/current/scripts/ci/discord-listing-fake.mjs /opt/worklane/current/dist ci http://127.0.0.1:8997); }
          list wl-ci > "$F/channels.json"
          cat "$F/channels.json"
          jq -e '.application == {"id":"700000000000000001","name":"Example Bot","message_content":true} and (.channels | length) == 7 and (.channels | all(has("guild_id") and has("id") and has("name")))' "$F/channels.json"
          cat "$F/discord-requests.log"
          [ "$(grep -c '^GET /guilds/[0-9]*/channels authorized$' "$F/discord-requests.log")" = 2 ]
          if grep -v '^GET .* authorized$' "$F/discord-requests.log"; then echo "a request that isn't an authorized GET" >&2; exit 1; fi
          # The agent user has no instance and no token: the same listing, as it, lists nothing.
          if list wl-ci-agent > "$F/channels-agent.json" 2> "$F/channels-agent.err"; then echo "the agent user listed the bot's channels" >&2; exit 1; fi
          [ ! -s "$F/channels-agent.json" ]
          # The Discord step, through the real hub (wl-dash, break-glass) to the instance's dashboard (wl-ci): where the
          # token is, never what it is.
          hub="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/dashboard-token"
          (umask 077; printf 'authorization: Bearer %s\n' "$(sudo cat "$hub")" > "$F/hub-auth")
          curl -sS -H @"$F/hub-auth" http://127.0.0.1:4398/api/i/ci/first-run/discord > "$F/discord-step.json"
          jq . "$F/discord-step.json"
          jq -e --arg tf "$tf" '.available and .canAct and .token == {"configured":true,"file":$tf,"present":true,"error":null} and .invite.integer == "309237648384" and .intake.exists == false' "$F/discord-step.json"
          jq -e '(.automation.token | test("^sudo bash /opt/worklane/[^ ]+/scripts/setup/credentials\\.sh ci intake-discord$")) and .automation.channels == "sudo -H -u wl-ci worklane discord channels --instance ci"' "$F/discord-step.json"
          # The listing's seam on this host, in units of their own as wl-ci, with this engine (the same code the dashboard
          # unit runs). A copy of the instance whose token file wl-ci can't read, so the engine's own CLI fails on its own
          # line before any request. Decoys that leave a mark if they ever run: a CLI and a node first on PATH, a file
          # NODE_OPTIONS loads into the listing's process, and variables naming another binary.
          seam=/var/tmp/ci-discord-seam; marks=/var/tmp/ci-discord-marks; ci_home="$h/.local/state/worklane/instances/ci"
          sudo rm -rf "$seam" "$marks" /usr/local/lib/ci-discord
          sudo install -d -o wl-ci -g wl-ci -m 0700 "$seam" "$seam/instances" "$seam/instances/ci"
          sudo install -o wl-ci -g wl-ci -m 0600 "$ci_home/instance.yaml" "$ci_home/policy.yaml" "$seam/instances/ci/"
          sudo sed -e "s|^\( *discord_token:\).*|\1 $seam/unreadable-token|" "$ci_home/credentials.yaml" | sudo -u wl-ci sh -c 'umask 077; cat > "$1"' _ "$seam/instances/ci/credentials.yaml"
          sudo grep -q "discord_token: $seam/unreadable-token" "$seam/instances/ci/credentials.yaml"
          sudo -u wl-ci sh -c 'umask 077; openssl rand -hex 35 > "$1"; chmod 000 "$1"' _ "$seam/unreadable-token"
          sudo install -m 0666 /dev/null "$marks"
          sudo install -d -m 0755 /usr/local/lib/ci-discord
          for b in worklane node nodejs; do printf '#!/bin/sh\necho "%s $*" >> %s\necho "{}"\n' "$b" "$marks" | sudo tee "/usr/local/lib/ci-discord/$b" > /dev/null; sudo chmod 0755 "/usr/local/lib/ci-discord/$b"; done
          printf 'if (process.argv.includes("channels")) require("node:fs").appendFileSync(%s, "NODE_OPTIONS preload\\n");\n' "\"$marks\"" | sudo tee /usr/local/lib/ci-discord/preload.cjs > /dev/null
          seam_unit() {
            sudo systemd-run --quiet --collect "$@" --uid=wl-ci --gid=wl-ci --working-directory=/ \
              -p "Environment=PATH=/usr/local/lib/ci-discord:/usr/local/bin:/usr/bin:/bin" \
              -p "Environment=NODE_OPTIONS=--require=/usr/local/lib/ci-discord/preload.cjs" \
              -p "Environment=HOME=$h WORKLANE_INSTANCES_DIR=$seam/instances WORKLANE_CLI=/usr/local/lib/ci-discord/worklane WORKLANE_DISCORD_CLI=/usr/local/lib/ci-discord/worklane WORKLANE_ENGINE=/usr/local/lib/ci-discord" \
              /usr/local/bin/node /opt/worklane/current/scripts/ci/discord-seam-dashboard.mjs /opt/worklane/current/dist "$mode" "$port" "$seam/instances" /srv/worklane/ci/alpha
          }
          seam_get() {
            for _ in $(seq 1 60); do curl -s -o /dev/null "http://127.0.0.1:$port/" && break; sleep 1; done
            (umask 077; printf 'authorization: Bearer %s\n' "$(sudo cat "$seam/state-$mode/dashboard-token")" > "$F/seam-auth")
            curl -sS -o "$F/seam-$mode.json" -w '%{http_code}' -H @"$F/seam-auth" "http://127.0.0.1:$port/api/first-run/discord/channels"
          }
          # 1. No stand-in: the engine's own CLI ran (its own line for a token it can't read), and no decoy did.
          mode=engine port=4791; seam_unit --unit=ci-discord-seam-engine
          code="$(seam_get)"; cat "$F/seam-engine.json"; echo
          [ "$code" = 502 ]
          jq -e '.error | test("^instance ci: can.t read its bot token file /var/tmp/ci-discord-seam/unreadable-token \\(EACCES\\)")' "$F/seam-engine.json"
          # 2. The stand-in, set in code: it answered, in the dashboard's own process, as wl-ci; still no decoy ran.
          mode=stand-in port=4792; seam_unit --unit=ci-discord-seam-stand-in
          code="$(seam_get)"; cat "$F/seam-stand-in.json"; echo
          [ "$code" = 200 ]
          jq -e '.application.name == "stand-in through the code seam for ci, run as wl-ci" and .invite == "https://discord.com/oauth2/authorize?client_id=700000000000000001&scope=bot&permissions=309237648384"' "$F/seam-stand-in.json"
          # 3. An option naming another program: refused, nothing started.
          mode=option port=4793; seam_unit --unit=ci-discord-seam-option --wait --pipe > "$F/seam-option.out" 2>&1 || { cat "$F/seam-option.out"; exit 1; }
          cat "$F/seam-option.out"
          grep -q '^refused: .*only a stand-in made in code by discordListingStandIn may replace it' "$F/seam-option.out"
          sudo systemctl stop ci-discord-seam-engine.service ci-discord-seam-stand-in.service
          echo "marks:"; cat "$marks"
          [ ! -s "$marks" ] || { echo "a decoy ran" >&2; exit 1; }
          sudo rm -rf "$seam" "$marks" /usr/local/lib/ci-discord
          # Nothing was written by looking: no intake.yaml, and the instance's log has no ask.
          sudo test ! -e "$h/.local/state/worklane/instances/ci/intake.yaml"
          # Never echoed: not in any output, the fake's log, a response, or any unit's journal.
          if grep -qFf "$F/discord-token" "$F/discord.out" "$F/discord2.out" "$F/channels.json" "$F/channels-agent.err" "$F/discord-requests.log" "$F/fake-discord.log" "$F/discord-step.json" "$F/seam-engine.json" "$F/seam-stand-in.json" "$F/seam-option.out" || sudo journalctl --no-pager | grep -qFf "$F/discord-token"; then echo "the token was echoed" >&2; exit 1; fi
      - name: "claude-account: a stand-in claude, and a second instance (beta, with an eval user) whose coordinator finishes its run on SIGTERM"
        run: |
          # claude auth status as each user: signed in when that user's own login holds a setup token (scripts/ci/).
          sudo install -m 0755 scripts/ci/claude-stand-in.cjs /usr/local/bin/claude
          sudo bash scripts/setup/instance.sh beta --eval
          sudo install -m 0755 scripts/ci/coordinator-stand-in.cjs /usr/local/lib/ci-coordinator-stand-in.cjs
          printf '[Service]\nUser=wl-beta\nExecStart=/usr/local/bin/node /usr/local/lib/ci-coordinator-stand-in.cjs 5000\nRestart=on-failure\nKillMode=control-group\nTimeoutStopSec=60\n' | sudo tee /etc/systemd/system/worklane-beta.service >/dev/null
          sudo systemctl daemon-reload && sudo systemctl start worklane-beta.service
          # The machine helper's rule names both instances, as add-project.sh keeps it.
          sudo bash scripts/setup/machine-helper.sh ci beta
          sudo -n -l -U wl-beta "$HELPER" claude-account switch
          if sudo -n -l -U wl-dash "$HELPER" claude-account switch 2>/dev/null; then echo "wl-dash may switch the account" >&2; exit 1; fi
          # The new account's tokens: in files of the runner's only, masked; never in the env.
          for n in 2 3; do t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/claude-token$n"); done; unset t
          systemctl is-active worklane-ci.service worklane-beta.service
      - name: "claude-account switch across both: paused (runs finish), the token for every agent and eval user at 0600, checked as each, resumed"
        run: |
          sudo bash scripts/setup/claude-account.sh switch --json --timeout 4 < "$F/claude-token2" > "$F/switch1.jsonl" 2> "$F/switch1.err" || { cat "$F/switch1.jsonl" "$F/switch1.err"; exit 1; }
          cat "$F/switch1.jsonl"
          for n in ci beta; do
            jq -se --arg n "$n" 'map(select(.step=="pause" and .instance==$n and .state=="done")) | length == 1' "$F/switch1.jsonl"
            # The coordinator drained (SIGTERM to its main process; its runs finished) rather than being stopped at the timeout.
            jq -se --arg n "$n" 'map(select(.step=="wait" and .instance==$n and (.detail|test("its runs have finished")))) | length == 1' "$F/switch1.jsonl"
            jq -se --arg n "$n" 'map(select(.step=="resume" and .instance==$n and .state=="done")) | length == 1' "$F/switch1.jsonl"
            systemctl is-active "worklane-$n.service"
          done
          [ "$(jq -sc '[.[] | select(.step=="check" and .state=="done") | .user]' "$F/switch1.jsonl")" = '["wl-beta-agent","wl-beta-eval","wl-ci-agent"]' ]
          jq -se 'last | .step=="switch" and .state=="done"' "$F/switch1.jsonl"
          sudo journalctl --no-pager -u worklane-beta.service | grep -q 'stand-in coordinator: SIGTERM, finishing the run in flight'
          for u in wl-ci-agent wl-beta-agent wl-beta-eval; do
            c="$(getent passwd "$u" | cut -d: -f6)/.claude/.credentials.json"
            [ "$(sudo stat -c '%U %a' "$c")" = "$u 600" ] || { sudo stat -c '%U %a' "$c"; exit 1; }
            sudo grep -qFf "$F/claude-token2" "$c"
          done
          s=/var/lib/worklane/claude-account
          [ "$(sudo stat -c '%U %a' "$s/status.json")" = "root 644" ]
          sudo jq -e '[.users[] | select(.logged_in)] | length == 3' "$s/status.json"
          sudo jq -e '[.users[].token_id] | unique | length == 1' "$s/status.json"
          # Never echoed: not in the output, the progress or status files, or any unit's journal.
          if grep -qFf "$F/claude-token2" "$F/switch1.jsonl" "$F/switch1.err" || sudo grep -qFf "$F/claude-token2" "$s/switch.jsonl" "$s/status.json" || sudo journalctl --no-pager | grep -qFf "$F/claude-token2"; then echo "the token was echoed" >&2; exit 1; fi
      - name: "claude-account: an instance whose check fails is not resumed; the rerun resumes it; status"
        run: |
          echo wl-beta-eval | sudo tee /etc/ci-claude-fail >/dev/null
          set +e
          sudo bash scripts/setup/claude-account.sh switch --json --timeout 2 beta < "$F/claude-token2" > "$F/switch2.jsonl" 2> "$F/switch2.err"
          rc=$?
          set -e
          cat "$F/switch2.jsonl"
          [ "$rc" = 1 ]
          jq -se 'map(select(.step=="check" and .user=="wl-beta-eval" and .state=="failed")) | length == 1' "$F/switch2.jsonl"
          jq -se 'map(select(.step=="resume" and .instance=="beta" and .state=="failed")) | length == 1' "$F/switch2.jsonl"
          if systemctl is-active -q worklane-beta.service; then echo "beta was resumed with a failed check" >&2; exit 1; fi
          [ "$(cat /var/lib/worklane/claude-account/paused)" = beta ]
          sudo rm -f /etc/ci-claude-fail
          sudo bash scripts/setup/claude-account.sh switch --json --timeout 2 beta < "$F/claude-token2" > "$F/switch3.jsonl" 2> "$F/switch3.err" || { cat "$F/switch3.jsonl" "$F/switch3.err"; exit 1; }
          jq -se 'map(select(.step=="pause" and .instance=="beta" and (.detail|test("earlier switch")))) | length == 1' "$F/switch3.jsonl"
          jq -se 'map(select(.step=="resume" and .instance=="beta" and .state=="done")) | length == 1' "$F/switch3.jsonl"
          systemctl is-active worklane-beta.service
          sudo bash scripts/setup/claude-account.sh status | tee "$F/status.txt"
          [ "$(grep -c ' signed in ' "$F/status.txt")" = 3 ] && ! grep -q 'NOT signed in' "$F/status.txt"
          if grep -qFf "$F/claude-token2" "$F/switch2.jsonl" "$F/switch2.err" "$F/switch3.jsonl" "$F/switch3.err" "$F/status.txt"; then echo "the token was echoed" >&2; exit 1; fi
      - name: "claude-account (#463): the API refuses the new login on the real call: the switch is refused, every agent user back on its previous login byte for byte, both instances resumed on it, the token never echoed"
        run: |
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/claude-token4"); unset t
          # The stand-in's API refuses a token by its last 4 characters (never the token in /etc).
          tr -d '[:space:]' < "$F/claude-token4" | tail -c 4 | sudo tee /etc/ci-claude-refuse >/dev/null
          users="wl-beta-agent wl-beta-eval wl-ci-agent"
          for u in $users; do sudo sha256sum "$(getent passwd "$u" | cut -d: -f6)/.claude/.credentials.json" | cut -d' ' -f1 > "$F/before-$u"; done
          set +e
          sudo bash scripts/setup/claude-account.sh switch --json --timeout 2 < "$F/claude-token4" > "$F/switch4.jsonl" 2> "$F/switch4.err"
          rc=$?
          set -e
          cat "$F/switch4.jsonl"
          [ "$rc" = 1 ]
          jq -se 'last | .step=="switch" and .state=="failed" and (.detail | test("^refused: the API refused the new login \\(Claude said: HTTP 401: Invalid API key"))' "$F/switch4.jsonl"
          [ "$(jq -sc '[.[] | select(.step=="check" and .state=="failed") | .user]' "$F/switch4.jsonl")" = '["wl-beta-agent","wl-beta-eval","wl-ci-agent"]' ]
          [ "$(jq -sc '[.[] | select(.step=="install" and .state=="failed" and (.detail | test("^rolled back"))) | .user]' "$F/switch4.jsonl")" = '["wl-beta-agent","wl-beta-eval","wl-ci-agent"]' ]
          for u in $users; do
            c="$(getent passwd "$u" | cut -d: -f6)/.claude/.credentials.json"
            [ "$(sudo sha256sum "$c" | cut -d' ' -f1)" = "$(cat "$F/before-$u")" ] || { echo "$u is not on its previous login" >&2; exit 1; }
            [ "$(sudo stat -c '%U %a' "$c")" = "$u 600" ] || { sudo stat -c '%U %a' "$c"; exit 1; }
          done
          for n in ci beta; do jq -se --arg n "$n" 'map(select(.step=="resume" and .instance==$n and .state=="done")) | length == 1' "$F/switch4.jsonl"; systemctl is-active "worklane-$n.service"; done
          s=/var/lib/worklane/claude-account
          if grep -qFf "$F/claude-token4" "$F/switch4.jsonl" "$F/switch4.err" || sudo grep -qFf "$F/claude-token4" "$s/switch.jsonl" "$s/status.json" || sudo journalctl --no-pager | grep -qFf "$F/claude-token4"; then echo "the token was echoed" >&2; exit 1; fi
          sudo rm -f /etc/ci-claude-refuse
      - name: "claude-account profiles (#464), real users and real sudo: profile-add in each agent user's own profile dir, proven by a real call there; use refused by the API changes nothing; remove refused while in use; a coordinator can't name another instance or every one; its add is staged until a root confirm"
        run: |
          s=/var/lib/worklane/claude-account
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/claude-token5"); unset t
          sudo bash scripts/setup/claude-account.sh profile-add work --json < "$F/claude-token5" > "$F/prof1.jsonl" 2> "$F/prof1.err" || { cat "$F/prof1.jsonl" "$F/prof1.err"; exit 1; }
          cat "$F/prof1.jsonl"
          [ "$(jq -sc '[.[] | select(.step=="check" and .state=="done") | .user]' "$F/prof1.jsonl")" = '["wl-beta-agent","wl-ci-agent"]' ]
          for u in wl-ci-agent wl-beta-agent; do
            h="$(getent passwd "$u" | cut -d: -f6)"
            [ "$(sudo stat -c '%U %a' "$h/.claude-profiles")" = "$u 700" ] || { sudo stat -c '%U %a' "$h/.claude-profiles"; exit 1; }
            [ "$(sudo stat -c '%U %a' "$h/.claude-profiles/work")" = "$u 700" ]
            [ "$(sudo stat -c '%U %a' "$h/.claude-profiles/work/.credentials.json")" = "$u 600" ]
            sudo grep -qFf "$F/claude-token5" "$h/.claude-profiles/work/.credentials.json"
            # The login it had is untouched.
            if sudo grep -qFf "$F/claude-token5" "$h/.claude/.credentials.json"; then echo "$u: ~/.claude changed" >&2; exit 1; fi
          done
          sudo test ! -e "$(getent passwd wl-beta-eval | cut -d: -f6)/.claude-profiles/work"
          [ "$(sudo stat -c '%U %a' "$s/profiles.json")" = "root 644" ]
          # The API refuses the profile: use is refused, nothing changes.
          tr -d '[:space:]' < "$F/claude-token5" | tail -c 4 | sudo tee /etc/ci-claude-refuse >/dev/null
          set +e
          sudo bash scripts/setup/claude-account.sh use work --json > "$F/prof2.jsonl" 2> "$F/prof2.err"
          rc=$?
          set -e
          cat "$F/prof2.jsonl"
          [ "$rc" = 1 ]
          jq -se 'last | .step=="use" and .state=="failed" and (.detail|test("^refused: .*HTTP 401"))' "$F/prof2.jsonl"
          sudo jq -e '.active == {}' "$s/profiles.json"
          sudo rm -f /etc/ci-claude-refuse
          sudo bash scripts/setup/claude-account.sh use work beta --json > "$F/prof3.jsonl" 2> "$F/prof3.err" || { cat "$F/prof3.jsonl" "$F/prof3.err"; exit 1; }
          sudo jq -e '.active.beta.profile == "work" and (.active.ci == null)' "$s/profiles.json"
          set +e
          sudo bash scripts/setup/claude-account.sh remove work --json > "$F/prof4.jsonl" 2> "$F/prof4.err"
          rc=$?
          set -e
          [ "$rc" = 1 ] && jq -se 'last | (.detail|test("refused: beta use profile work"))' "$F/prof4.jsonl"
          sudo bash scripts/setup/claude-account.sh use default beta --json > /dev/null
          sudo bash scripts/setup/claude-account.sh remove work --json > "$F/prof5.jsonl" 2> "$F/prof5.err" || { cat "$F/prof5.jsonl" "$F/prof5.err"; exit 1; }
          for u in wl-ci-agent wl-beta-agent; do sudo test ! -e "$(getent passwd "$u" | cut -d: -f6)/.claude-profiles/work"; done
          # Through the machine helper, as a coordinator (wl-ci): real sudo takes no instance at all, so another instance,
          # or every one, can't even be asked for; the helper takes the instance from SUDO_USER.
          # Issue #711: profile-add and login take a Claude credential: refused by the helper even where sudo lets them through.
          for bad in "use work beta" "use default beta" "use work all" "use work ci" "profile-add work" "login work" "profile-add work beta" "remove work beta" "confirm-profile work" "use work --for beta"; do
            # shellcheck disable=SC2086 # each case is its words
            if sudo -u wl-ci sudo -n "$HELPER" claude-account $bad < /dev/null 2>/dev/null; then echo "wl-ci may run claude-account $bad" >&2; exit 1; fi
          done
          if sudo -u wl-ci sudo -n bash scripts/setup/claude-account.sh use work beta < /dev/null 2>/dev/null; then echo "wl-ci may run the script itself" >&2; exit 1; fi
          ends() { sudo grep -cE "\"op\":\"$1\",\"profile\":\"$2\",\"step\":\"$1\",\"state\":\"(done|failed)\".*\"for\":\"ci\"" "$s/profile-ops.jsonl" || true; }
          ask() { # <op> <profile> <done|failed>: as wl-ci through the helper; waits for that step's own end, which must be the one given
            local n
            n="$(ends "$1" "$2")"
            sudo -u wl-ci sudo -n "$HELPER" claude-account "$1" "$2" < /dev/null | tee -a "$F/helper-ops.txt"
            for _ in $(seq 1 60); do [ "$(ends "$1" "$2")" -gt "$n" ] && break; sleep 2; done
            sudo grep -E "\"op\":\"$1\",\"profile\":\"$2\",\"step\":\"$1\",\"state\":\"(done|failed)\".*\"for\":\"ci\"" "$s/profile-ops.jsonl" | tail -n 1 | grep -q "\"state\":\"$3\"" || { sudo tail -n 20 "$s/profile-ops.jsonl"; sudo journalctl --no-pager -u worklane-claude-account.service | tail -n 40; return 1; }
          }
          # use, from ci's dashboard: ci alone (beta keeps what it has).
          sudo bash scripts/setup/claude-account.sh profile-add shared --json < "$F/claude-token5" > /dev/null
          sudo bash scripts/setup/claude-account.sh use shared beta --json > /dev/null
          ask use default done
          grep -q 'started claude-account use default as worklane-claude-account.service' "$F/helper-ops.txt"
          sudo jq -e '.active.beta.profile == "shared" and .active.ci == null' "$s/profiles.json"
          # remove, from ci's dashboard: never a profile another instance uses, nor one ci wasn't given.
          ask remove shared failed
          sudo test -e "$(getent passwd wl-beta-agent | cut -d: -f6)/.claude-profiles/shared"
          sudo bash scripts/setup/claude-account.sh use default beta --json > /dev/null
          # Issue #711: adding an account takes a Claude credential, so never from ci's dashboard. What an earlier dashboard
          # stored for profile-add (and a relayed sign-in's code) is never read: the next run removes it, as wl-ci.
          sudo -u wl-ci bash -c 'umask 077; d="$HOME/.config/ci-secrets"; mkdir -p "$d"; cat > "$d/claude-profile-token"; chmod 0400 "$d/claude-profile-token"' < "$F/claude-token5"
          code="$(openssl rand -hex 12)#$(openssl rand -hex 12)"; echo "::add-mask::$code"; (umask 077; printf '%s\n' "$code" > "$F/login-code")
          sudo -u wl-ci bash -c 'umask 077; d="$HOME/.config/ci-secrets"; cat > "$d/claude-login-code"; chmod 0400 "$d/claude-login-code"' < "$F/login-code"
          unset code
          for op in profile-add login; do
            if sudo -u wl-ci sudo -n "$HELPER" claude-account "$op" mine < /dev/null 2>> "$F/helper-refused.txt"; then echo "wl-ci may run claude-account $op" >&2; exit 1; fi
          done
          if sudo grep -q '"profile":"mine"' "$s/profile-ops.jsonl"; then echo "a dashboard's profile-add or login started" >&2; exit 1; fi
          sudo -u wl-ci sudo -n "$HELPER" claude-account status < /dev/null > /dev/null || true
          sudo -u wl-ci test ! -e "$(getent passwd wl-ci | cut -d: -f6)/.config/ci-secrets/claude-profile-token"
          sudo -u wl-ci test ! -e "$(getent passwd wl-ci | cut -d: -f6)/.config/ci-secrets/claude-login-code"
          sudo test ! -e "$s/login-url"
          # A root admin adds it, at a root shell; then ci's dashboard may choose it.
          sudo bash scripts/setup/claude-account.sh profile-add mine --json < "$F/claude-token5" > /dev/null
          ask use mine done
          sudo jq -e '.active.ci.profile == "mine" and .active.beta == null' "$s/profiles.json"
          ask use default done
          if grep -qFf "$F/login-code" "$F"/helper-ops.txt "$F/helper-refused.txt" || sudo grep -qFf "$F/login-code" "$s/profile-ops.jsonl" "$s/profiles.json" /var/lib/worklane/machine-changes.jsonl || sudo journalctl --no-pager | grep -qFf "$F/login-code"; then echo "the code was echoed" >&2; exit 1; fi
          # The failover setting, from ci's dashboard: real sudo takes the order joined by + (never a comma) and no instance.
          sudo -u wl-ci sudo -n "$HELPER" claude-account failover default+mine back < /dev/null
          sudo jq -e '.failover.instances.ci == {"order": ["default", "mine"], "back": true} and .failover.machine == null' "$s/profiles.json"
          for bad in "failover default+mine back beta" "failover off stay beta" "failover default,mine back"; do
            # shellcheck disable=SC2086 # each case is its words
            if sudo -u wl-ci sudo -n "$HELPER" claude-account $bad < /dev/null 2>/dev/null; then echo "wl-ci may run claude-account $bad" >&2; exit 1; fi
          done
          sudo -u wl-ci sudo -n "$HELPER" claude-account failover off stay < /dev/null
          # Every add, confirm, use and remove is an ops alert line in the machine change log; no token in any.
          sudo jq -se '[.[] | select(.what=="claude_account.profile") | .to] | any(. == "added mine") and any(. == "use mine for ci")' /var/lib/worklane/machine-changes.jsonl
          if grep -qFf "$F/claude-token5" "$F"/prof*.jsonl "$F"/prof*.err "$F/helper-refused.txt" || sudo grep -qFf "$F/claude-token5" "$s/profile-ops.jsonl" "$s/profiles.json" /var/lib/worklane/machine-changes.jsonl || sudo journalctl --no-pager | grep -qFf "$F/claude-token5"; then echo "the token was echoed" >&2; exit 1; fi
      - name: "claude-account from the dashboard (#711): a switch takes a Claude credential, so the helper refuses it; a token an earlier dashboard stored is never read, and the next run removes it"
        run: |
          s=/var/lib/worklane/claude-account/switch.jsonl
          before="$(sudo sha256sum "$s" | cut -d' ' -f1)"
          # What an earlier dashboard did with a pasted token: the coordinator user's own file, 0400.
          sudo -H -u wl-ci sh -c 'umask 077; d="$HOME/.config/ci-secrets"; mkdir -p "$d"; cat > "$d/.t.tmp"; chmod 0400 "$d/.t.tmp"; mv "$d/.t.tmp" "$d/claude-account-token"' < "$F/claude-token3"
          if sudo -u wl-ci sudo -n "$HELPER" claude-account switch < /dev/null 2> "$F/helper-switch.txt"; then echo "wl-ci may start a switch" >&2; exit 1; fi
          sleep 5
          if systemctl is-active -q worklane-claude-account.service; then echo "a switch unit started" >&2; exit 1; fi
          [ "$(sudo sha256sum "$s" | cut -d' ' -f1)" = "$before" ] || { echo "a switch ran" >&2; cat "$s"; exit 1; }
          # The next run of the script (a refresh, from ci's dashboard) removes it unread, as wl-ci.
          sudo -u wl-ci sudo -n "$HELPER" claude-account status < /dev/null > /dev/null || true
          sudo test ! -e "$(getent passwd wl-ci | cut -d: -f6)/.config/ci-secrets/claude-account-token"
          for u in wl-ci-agent wl-beta-agent wl-beta-eval; do if sudo grep -qFf "$F/claude-token3" "$(getent passwd "$u" | cut -d: -f6)/.claude/.credentials.json"; then echo "$u got the dashboard's token" >&2; exit 1; fi; done
          systemctl is-active worklane-ci.service worklane-beta.service
          if grep -qFf "$F/claude-token3" "$F/helper-switch.txt" || sudo grep -qFf "$F/claude-token3" "$s" /var/lib/worklane/claude-account/status.json /var/lib/worklane/machine-changes.jsonl || sudo journalctl --no-pager | grep -qFf "$F/claude-token3"; then echo "the token was echoed" >&2; exit 1; fi
      # Server mode for a repo with no .worklane/ (the setup audit's B3-B7), a fresh instance (gamma) against a second
      # fake GitHub: the App by hand writes credentials.yaml itself; --after-credentials drafts the config through
      # auto-config (questions answered as the coordinator, then a setup PR) and reports "waiting", exit 3, until it
      # merges; a rerun reuses the PR; init says so and exits non-zero, with how the App was made; doctor as the
      # coordinator reads what init (root) recorded; once the PR merges, the rerun and init succeed.
      - name: "server mode, no .worklane/: a second fake GitHub, gitleaks, the instance, and the App by hand (B3)"
        env:
          GH_FAKE2: http://127.0.0.1:8998
        run: |
          f2="$RUNNER_TEMP/fake2" && mkdir -p "$f2/git/example" "$f2/seed"
          git init -q --bare -b main "$f2/git/example/gamma.git"
          printf 'gamma\n' > "$f2/seed/README.md"
          printf 'test:\n\t@echo ok\n' > "$f2/seed/Makefile"
          git -C "$f2/seed" init -q -b main && git -C "$f2/seed" add README.md Makefile
          git -C "$f2/seed" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q -m init
          git -C "$f2/seed" push -q "$f2/git/example/gamma.git" main
          nohup node scripts/ci/fake-github.mjs "$GITHUB_WORKSPACE/dist" 8998 "$f2/git" example/gamma "$f2/requests.log" > "$f2/server.log" 2>&1 &
          sudo git config --system url."$GH_FAKE2/example/gamma".insteadOf https://github.com/example/gamma
          for _ in $(seq 1 30); do curl -sf "$GH_FAKE2/repos/example/gamma" >/dev/null && break; sleep 1; done
          curl -sf "$GH_FAKE2/repos/example/gamma"
          { echo "F2=$f2"; echo "GH_FAKE2=$GH_FAKE2"; } >> "$GITHUB_ENV"
          # gitleaks, pinned and checked as bootstrap.sh has it: the checkout's pre-commit secret scan runs it on the setup commit.
          v="$(sed -n 's/^GITLEAKS_VERSION=//p' scripts/bootstrap.sh)" && sum="$(sed -n 's/^GITLEAKS_SHA256_LINUX_X64=//p' scripts/bootstrap.sh)"
          curl -fsSL -o "$f2/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "$sum  $f2/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$f2/gitleaks.tgz" -C "$f2" gitleaks && sudo install -m 0755 "$f2/gitleaks" /usr/local/bin/gitleaks
          for u in worklane-gamma worklane-dashboard-gamma; do
            sudo install -d "/etc/systemd/system/$u.service.d"
            printf '[Service]\nEnvironment=NODE_OPTIONS=%s CI_LOOPBACK_GITHUB_PORT=8998\n' "$LOOPBACK?port=8998" | sudo tee "/etc/systemd/system/$u.service.d/fake-github.conf" >/dev/null
          done
          sudo bash scripts/setup/instance.sh gamma
          # No instance home yet (the audit's first run): credentials.sh makes it and writes the App in, no hand edit.
          echo n | sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 bash scripts/setup/credentials.sh gamma github-app 91 4242 "$F/app.pem" example/gamma 2>&1 | tee "$f2/creds.log"
          if grep -q 'set in credentials.yaml' "$f2/creds.log"; then echo "credentials.sh still asks for a hand edit" >&2; exit 1; fi
          grep -q '^wrote .*/instances/gamma/credentials.yaml (github: App 91, installation 4242; the rest kept)$' "$f2/creds.log"
          h="$(getent passwd wl-gamma | cut -d: -f6)"
          sudo cat "$h/.local/state/worklane/instances/gamma/credentials.yaml"
          sudo node -e 'const y=require("/opt/worklane/current/node_modules/yaml");const g=y.parse(require("fs").readFileSync(process.argv[1],"utf8")).github;if(!(g.kind==="app"&&g.app_id===91&&g.installation_id===4242&&g.key_path===process.argv[2]))process.exit(1)' "$h/.local/state/worklane/instances/gamma/credentials.yaml" "$h/.config/gamma-app/private-key.pem"
          sudo -u wl-gamma test -r "$h/.local/state/worklane/instances/gamma/credentials.yaml"
          [ "$(sudo cat "$h/.config/gamma-app/made-by")" = by-hand ]
      - name: "--after-credentials: auto-config's questions, answered as the coordinator, then its setup PR; waiting (exit 3), never success (B4)"
        run: |
          boot() { set +e; sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 bash scripts/bootstrap.sh --hardened --after-credentials --yes --machine-owner ci-owner gamma example/gamma > "$F2/$1.log" 2>&1; rc=$?; set -e; cat "$F2/$1.log"; echo "rc=$rc"; }
          boot boot1
          [ "$rc" = 3 ]
          grep -q '"kind":"questions"' "$F2/boot1.log"
          grep -q 'waiting for the repo config: no setup PR yet' "$F2/boot1.log"
          if grep -q 'POST /repos/example/gamma/pulls' "$F2/requests.log"; then echo "a PR was opened with a question open" >&2; exit 1; fi
          # The question, answered the way the line says: as the coordinator.
          sudo -H -u wl-gamma env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 bash -c 'umask 0002; worklane instance auto-config gamma --answer one-test-file=none' | tee "$F2/answer.json"
          jq -e '.kind == "proposed" and .pr == "http://127.0.0.1:8998/example/gamma/pull/1"' "$F2/answer.json"
          [ "$(grep -c '^POST /repos/example/gamma/pulls$' "$F2/requests.log")" = 1 ]
          # The setup branch holds the drafted config: make test, checked as the agent user, within the instance policy.
          git -C "$F2/git/example/gamma.git" show worklane/setup:.worklane/tests.yaml | tee "$F2/tests.yaml"
          grep -q 'runner.full: make test  -> passed on' "$F2/tests.yaml"
          git -C "$F2/git/example/gamma.git" show worklane/setup:.worklane/agents.yaml | grep -q '^daily_budget_usd: 20'
          [ "$(git -C "$F2/git/example/gamma.git" rev-parse main)" = "$(git -C "$F2/seed" rev-parse HEAD)" ]
      - name: "rerun --after-credentials: no 'branch already exists', the same PR, still waiting (B5)"
        run: |
          set +e; sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 bash scripts/bootstrap.sh --hardened --after-credentials --yes --machine-owner ci-owner gamma example/gamma > "$F2/boot2.log" 2>&1; rc=$?; set -e
          cat "$F2/boot2.log"
          [ "$rc" = 3 ]
          if grep -q 'already exists' "$F2/boot2.log"; then echo "the rerun tripped on the setup branch" >&2; exit 1; fi
          grep -q 'waiting for the setup PR http://127.0.0.1:8998/example/gamma/pull/1: the coordinator starts once it has merged' "$F2/boot2.log"
          [ "$(grep -c '^POST /repos/example/gamma/pulls$' "$F2/requests.log")" = 1 ]
      - name: "init --mode server: the true status, exit 1 while the setup PR waits, and how the App was made (B6); doctor as the coordinator reads it (B7)"
        run: |
          set +e; sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 worklane init --mode server example/gamma --instance gamma --timeout 1 < "$F/claude-token" > "$F2/init1.log" 2>&1; rc=$?; set -e
          cat "$F2/init1.log"
          [ "$rc" = 1 ]
          if grep -q 'steps done or skipped' "$F2/init1.log"; then echo "init claimed it was done" >&2; exit 1; fi
          grep -q 'add-project service waiting: waiting for the setup PR http://127.0.0.1:8998/example/gamma/pull/1 to merge' "$F2/init1.log"
          grep -q 'GitHub App (made by hand (credentials.sh github-app))' "$F2/init1.log"
          if grep -q 'manifest flow' "$F2/init1.log"; then echo "init claimed the manifest flow" >&2; exit 1; fi
          grep -q 'stopped at Repo config' "$F2/init1.log"
          [ "$(sudo stat -c '%U %G %a' /var/lib/worklane/init/gamma.json)" = "root wl-gamma 640" ]
          if grep -qFf "$F/claude-token" "$F2/init1.log"; then echo "the token was echoed" >&2; exit 1; fi
          set +e; sudo -H -u wl-gamma worklane doctor --mode server --instance gamma --root /srv/worklane/gamma/gamma > "$F2/doctor1.log" 2>&1; set -e
          cat "$F2/doctor1.log"
          for s in tools claude github; do grep -q "^ok    setup $s: " "$F2/doctor1.log"; done
          grep -q '^FAIL  setup repo-config: Repo config (server mode): waiting for the setup PR http://127.0.0.1:8998/example/gamma/pull/1' "$F2/doctor1.log"
          if grep -E '^(ok|FAIL)  +setup (tools|claude|github)' "$F2/doctor1.log" | grep -q 'not reached yet'; then echo "doctor did not read init's record" >&2; exit 1; fi
      - name: "the setup PR merges: --after-credentials succeeds, the coordinator runs; init exits 0; doctor as the coordinator all ok"
        run: |
          git -C "$F2/git/example/gamma.git" update-ref refs/heads/main refs/heads/worklane/setup
          sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 bash scripts/bootstrap.sh --hardened --after-credentials --yes --machine-owner ci-owner gamma example/gamma > "$F2/boot3.log" 2>&1 || { cat "$F2/boot3.log"; exit 1; }
          cat "$F2/boot3.log"
          sudo test -f /srv/worklane/gamma/gamma/.worklane/config.yaml
          systemctl is-active worklane-gamma.service
          # #469: auto-config's config names no required check (PR mode): init never finishes on it, and says why and the fix.
          set +e; sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 worklane init --mode server example/gamma --instance gamma --timeout 1 < /dev/null > "$F2/init2.log" 2>&1; code=$?; set -e
          cat "$F2/init2.log"
          [ "$code" = 5 ] || { echo "init did not stop for the CI choice (exit $code; 5 expected)" >&2; exit 1; }
          grep -q "but required_checks is empty and no CI is chosen: no PR is ever marked ready, so nothing ever merges. Fix: on the dashboard's First-run page" "$F2/init2.log"
          grep -q 'stopped at Repo config' "$F2/init2.log"
          # The owner's choice merged on main (its CI's check named), and the checkout brought up to it as add-project does.
          c="$F2/choice" && git clone -q "$F2/git/example/gamma.git" "$c"
          if grep -q '^required_checks:' "$c/.worklane/config.yaml"; then sed -i 's/^required_checks:.*/required_checks: [test]/' "$c/.worklane/config.yaml"; else printf 'required_checks: [test]\n' >> "$c/.worklane/config.yaml"; fi
          git -C "$c" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q -am 'name the CI check'
          git -C "$c" push -q origin main
          sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 bash scripts/setup/checkout.sh gamma example/gamma > "$F2/checkout2.log" 2>&1 || { cat "$F2/checkout2.log"; exit 1; }
          sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 worklane init --mode server example/gamma --instance gamma --timeout 1 < /dev/null > "$F2/init3.log" 2>&1 || { cat "$F2/checkout2.log" "$F2/init3.log"; exit 1; }
          cat "$F2/init3.log"
          grep -q 'all 8 steps done or skipped' "$F2/init3.log"
          set +e; sudo -H -u wl-gamma worklane doctor --mode server --instance gamma --root /srv/worklane/gamma/gamma > "$F2/doctor2.log" 2>&1; set -e
          cat "$F2/doctor2.log"
          for s in tools claude github repo-config coordinator protection; do grep -q "^ok    setup $s: " "$F2/doctor2.log"; done
      - name: "server: the install ends with one URL, the hub's wizard, no key in it; it answers 200, and the checklist given the hub's key; a rerun prints the same"
        run: |
          tail -n 12 "$F2/boot3.log"
          # The hub's key, root's to read: copied into a 0600 file of the runner's, never into an argument.
          hk="$(getent passwd wl-dash | cut -d: -f6)/.local/state/worklane/dashboard-hub/dashboard-token"
          (umask 077; sudo cat "$hk" > "$F2/hub-key")
          u1="$(bash scripts/ci/wizard-url.sh "$F2/boot3.log" "$F2/hub-key" /api/i/ci/first-run | tail -n 1)"
          # The sign-in App is set up here, but the machine has no public name (no Tailscale, no --public-url): the break-glass.
          [ "$u1" = http://127.0.0.1:4398/first-run ]
          grep -qF "asks once for the hub's key: it is in $hk" "$F2/boot3.log"
          sudo env NODE_OPTIONS="$LOOPBACK?port=8998" CI_LOOPBACK_GITHUB_PORT=8998 bash scripts/bootstrap.sh --hardened --after-credentials --yes --machine-owner ci-owner gamma example/gamma > "$F2/boot4.log" 2>&1 || { cat "$F2/boot4.log"; exit 1; }
          u2="$(bash scripts/ci/wizard-url.sh "$F2/boot4.log" "$F2/hub-key" /api/i/ci/first-run | tail -n 1)"
          [ "$u1" = "$u2" ] || { echo "the URL changed: $u1 / $u2" >&2; exit 1; }
          rm -f "$F2/hub-key"
      # Wizard screen 5: the agents' App through GitHub's manifest flow, for a new instance (delta): add-project.sh as
      # root, and the machine owner's browser played by scripts/ci/manifest-browser.mjs. The fake GitHub stands in for
      # GitHub's side (the one-time code and its conversion); nothing is created on GitHub. The hub is a stand-in for
      # this step (scripts/ci/hub-stand-in.mjs: the hub's own code, as wl-dash, in place of its stopped unit), because
      # the real hub signs people in at github.com only, with no override: its sign-in is not exercised on this runner.
      - name: "the agents' App through the manifest flow: add-project.sh as root, a hub stand-in's callback from a signed-in machine owner, GitHub's conversion faked"
        run: |
          sudo bash scripts/setup/machine-owners.sh --first ci-owner
          jq -e '.owners | index("ci-owner") != null' /etc/worklane/machine-owners.json
          # The real hub's unit has no GitHub host to be pointed anywhere: sign-in's hosts are constants.
          if sudo grep -rqE 'GITHUB_(API|WEB)' /etc/systemd/system/worklane-dashboard-hub.service; then echo "the hub's unit names a GitHub host" >&2; exit 1; fi
          sudo systemctl stop worklane-dashboard-hub.service
          sudo -H -u wl-dash nohup /usr/local/bin/node /opt/worklane/current/scripts/ci/hub-stand-in.mjs /opt/worklane/current/dist "$GH_FAKE" https://hub.example.test > "$F/hub-stand-in.log" 2>&1 &
          for _ in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4399/auth/login)" = 302 ] && break; sleep 1; done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4399/auth/login)" = 302 ] || { cat "$F/hub-stand-in.log"; exit 1; }
          for u in worklane-delta worklane-dashboard-delta; do
            sudo install -d "/etc/systemd/system/$u.service.d"
            printf '[Service]\nEnvironment=NODE_OPTIONS=%s CI_LOOPBACK_GITHUB_PORT=8999\n' "$LOOPBACK?port=8999" | sudo tee "/etc/systemd/system/$u.service.d/fake-github.conf" >/dev/null
          done
          ( set +e; sudo env NODE_OPTIONS="$LOOPBACK?port=8999" CI_LOOPBACK_GITHUB_PORT=8999 bash scripts/setup/add-project.sh delta example/alpha --timeout 3 < "$F/claude-token" > "$F/run4.jsonl" 2> "$F/run4.err"; echo "$?" > "$F/run4.rc" ) &
          node scripts/ci/manifest-browser.mjs "$GITHUB_WORKSPACE/dist" http://127.0.0.1:4399 https://hub.example.test "$GH_FAKE" ci-owner "$F/run4.jsonl" "$F/manifest-code" || { cat "$F/run4.jsonl"; tail -n 40 "$F/run4.err"; exit 1; }
          # The App step is over: the stand-in goes, before add-project's last step starts the real hub on the same ports.
          for _ in $(seq 1 120); do grep -q '"step":"app","state":"\(done\|failed\)"' "$F/run4.jsonl" && break; sleep 0.5; done
          sudo pkill -TERM -u wl-dash -f hub-stand-in.mjs
          wait
          cat "$F/run4.jsonl"
          # add-project's dashboards step brought the real hub back, with the new instance.
          systemctl is-active worklane-dashboard-hub.service
          [ "$(cat "$F/run4.rc")" = 0 ] || { tail -n 60 "$F/run4.err"; exit 1; }
          jq -se 'map(select(.state=="failed")) | length == 0' "$F/run4.jsonl"
          jq -se 'map(select(.step=="app" and .state=="ask" and .ask.kind=="approve_link")) | length == 2' "$F/run4.jsonl"
          jq -se 'map(select(.step=="app" and .state=="done" and (.detail|test("made through the manifest flow$")))) | length == 1' "$F/run4.jsonl"
          grep -q '^POST /app-manifests/<code>/conversions$' "$F/requests.log"
      - name: "the App's key, client secret and webhook secret: the coordinator's own 0400 files, nobody else's, and in no output, log or journal"
        run: |
          h="$(getent passwd wl-delta | cut -d: -f6)"; d="$h/.config/delta-app"
          [ "$(sudo stat -c '%U %a' "$d")" = "wl-delta 700" ] || { sudo stat -c '%U %a' "$d"; exit 1; }
          for f in private-key.pem client-secret webhook-secret; do
            [ "$(sudo stat -c '%U %a' "$d/$f")" = "wl-delta 400" ] || { sudo stat -c '%n %U %a' "$d/$f"; exit 1; }
          done
          # What GitHub's conversion returned, as the fake has it, for comparing and for the leak check below.
          node --input-type=module -e 'const f = await import(process.argv[1]); process.stdout.write(f.APP_SECRET + "\n" + f.WEBHOOK_SECRET + "\n");' "file://$GITHUB_WORKSPACE/dist/test/fake-github.js" > "$F/app-secrets"
          sudo cat "$d/private-key.pem" | cmp - "$F/app.pem"
          sudo cat "$d/client-secret" | cmp - <(sed -n 1p "$F/app-secrets" | tr -d '\n')
          sudo cat "$d/webhook-secret" | cmp - <(sed -n 2p "$F/app-secrets" | tr -d '\n')
          for u in wl-dash wl-delta-agent wl-ci; do
            for f in private-key.pem client-secret webhook-secret; do
              if sudo -u "$u" test -r "$d/$f"; then echo "$u can read $d/$f" >&2; exit 1; fi
            done
          done
          [ "$(sudo cat "$d/made-by")" = manifest ]
          sudo node -e 'const y=require("/opt/worklane/current/node_modules/yaml");const g=y.parse(require("fs").readFileSync(process.argv[1],"utf8")).github;if(!(g.kind==="app"&&g.app_id===91&&g.installation_id===4242&&g.key_path===process.argv[2]))process.exit(1)' "$h/.local/state/worklane/instances/delta/credentials.yaml" "$d/private-key.pem"
          # The checkout came through that App (its key signed for the installation token), and the coordinator runs.
          sudo test -f /srv/worklane/delta/alpha/.worklane/config.yaml
          systemctl is-active worklane-delta.service
          # Never echoed: the secrets, a line of the key and the one-time code are in no output of the run, no file the
          # machine keeps about it, and no unit's journal.
          { cat "$F/app-secrets"; sed -n 2p "$F/app.pem"; cat "$F/manifest-code"; } > "$F/never"
          [ "$(grep -c . "$F/never")" = 4 ]
          if grep -qFf "$F/never" "$F/run4.jsonl" "$F/run4.err" "$F/requests.log" "$F/server.log"; then echo "a secret or the code was echoed" >&2; exit 1; fi
          if sudo grep -qFf "$F/never" /var/lib/worklane/machine-changes.jsonl "$h/.local/state/worklane/instances/delta/credentials.yaml" || sudo journalctl --no-pager | grep -qFf "$F/never"; then echo "a secret or the code reached a log" >&2; exit 1; fi
          if sudo grep -rqFf "$F/never" /etc/systemd/system /var/lib/worklane; then echo "a secret or the code reached a unit or the machine's state" >&2; exit 1; fi
      # Tailscale for the hub (scripts/setup/tailscale.sh), through the machine helper as the coordinator, the way the
      # dashboard's requests reach it. The install is the real one: Tailscale's signed apt repository, with the key
      # and the version lib.sh pins. Nobody can log a CI machine in to a tailnet, so from `up` on the tailscale CLI is
      # a stand-in (scripts/ci/tailscale-stand-in.cjs) that prints a login link and waits, as the real one does.
      - name: "tailscale: sudo and the helper take exactly four commands and refuse every other; with no tailscale a step changes nothing"
        run: |
          for a in install up serve public-url; do sudo -n -l -U wl-ci "$HELPER" tailscale "$a"; done
          # Refused twice over: by the sudoers rule (so the helper never starts), and by the helper itself when root runs it.
          refused() {
            if sudo -n -l -U wl-ci "$HELPER" "$@" >/dev/null 2>&1; then echo "the sudoers rule allows: $*" >&2; exit 1; fi
            if sudo -u wl-ci sudo -n "$HELPER" "$@" < /dev/null >/dev/null 2>&1; then echo "it ran as the coordinator: $*" >&2; exit 1; fi
            local rc=0
            sudo "$HELPER" "$@" < /dev/null >/dev/null 2>&1 || rc=$?
            [ "$rc" = 2 ] || { echo "the helper gave $rc, not a refusal (2), to: $*" >&2; exit 1; }
          }
          refused tailscale
          refused tailscale up --auth-key=tskey-auth-kCIexample-0123456789abcdef
          refused tailscale up --auth-key tskey-auth-kCIexample-0123456789abcdef
          refused tailscale up --authkey=tskey-auth-kCIexample-0123456789abcdef
          refused tailscale up --login-server=https://example.test
          refused tailscale up --for ci
          refused tailscale up extra
          refused tailscale "up --auth-key=tskey-auth-kCIexample-0123456789abcdef"
          refused tailscale serve 4398
          refused tailscale serve --https=443 http://127.0.0.1:4398
          refused tailscale serve reset
          refused tailscale funnel
          # Nothing that could turn on Funnel, choose what serve forwards or where, or change what `up` exposes.
          refused tailscale funnel 443
          refused tailscale funnel --bg --https=443 http://127.0.0.1:4399
          refused tailscale --funnel
          refused tailscale serve --funnel
          refused tailscale serve funnel on
          refused tailscale serve --bg --https=443 http://127.0.0.1:4399
          refused tailscale serve --https=8443
          refused tailscale serve --set-path=/x http://127.0.0.1:4398
          refused tailscale serve --set-path / http://203.0.113.5:80
          refused tailscale serve http://0.0.0.0:4399
          refused tailscale serve --tcp=22 tcp://127.0.0.1:22
          refused tailscale up --advertise-exit-node
          refused tailscale up --advertise-routes=198.51.100.0/24
          refused tailscale up --ssh
          refused tailscale up --accept-routes
          refused tailscale up --exit-node=203.0.113.1
          refused tailscale up --operator=wl-ci
          refused tailscale up --timeout=600s
          refused tailscale public-url --name other
          # The rule itself names no funnel command, no flag and no target.
          if sudo grep -Eiq 'funnel|tailscale [a-z-]+ [^,\]' /etc/sudoers.d/worklane-machine; then echo "the sudoers rule has more than the four bare commands" >&2; exit 1; fi
          [ "$(sudo grep -o 'worklane-machine tailscale [a-z-]*' /etc/sudoers.d/worklane-machine | sort | tr '\n' ' ')" = "worklane-machine tailscale install worklane-machine tailscale public-url worklane-machine tailscale serve worklane-machine tailscale up " ]
          refused tailscale public-url https://elsewhere.example.test
          refused tailscale install 1.0.0
          refused tailscale install --allow-unauthenticated
          refused tailscale status
          refused tailscale logout
          refused tailscale UP
          for a in install up serve public-url; do
            if sudo -n -l -U wl-dash "$HELPER" tailscale "$a" 2>/dev/null; then echo "wl-dash may run tailscale $a" >&2; exit 1; fi
            if sudo -n -l -U wl-ci-agent "$HELPER" tailscale "$a" 2>/dev/null; then echo "the agent user may run tailscale $a" >&2; exit 1; fi
          done
          # The four themselves, as root but not as a coordinator through sudo: refused too (an admin runs tailscale.sh).
          rc=0; sudo "$HELPER" tailscale up < /dev/null > "$F/ts-root.txt" 2>&1 || rc=$?
          [ "$rc" = 2 ] && grep -q 'tailscale here is for a coordinator, through sudo' "$F/ts-root.txt"
          # None of that ran or logged anything.
          if sudo grep -q '"what":"tailscale"' /var/lib/worklane/machine-changes.jsonl; then echo "a refused tailscale command was logged as run" >&2; exit 1; fi
          sudo test ! -e /var/lib/worklane/tailscale
          if command -v tailscale; then echo "this runner already has tailscale: the steps below assume it doesn't" >&2; exit 1; fi
          # A machine with no tailscale: a step fails saying so and the hub keeps its URL.
          hub=/etc/systemd/system/worklane-dashboard-hub.service
          sudo cp "$hub" "$F/hub-before.service"
          ended() { sudo grep -q "\"step\":\"$1\",\"state\":\"\(done\|failed\)\"" /var/lib/worklane/tailscale/steps.jsonl 2>/dev/null; }
          sudo -u wl-ci sudo -n "$HELPER" tailscale public-url < /dev/null
          for _ in $(seq 1 30); do ended public-url && break; sleep 1; done
          sudo tail -n 1 /var/lib/worklane/tailscale/steps.jsonl | jq -e '.step=="public-url" and .state=="failed" and (.detail|test("tailscale isn.t installed on this machine"))'
          sudo cmp "$hub" "$F/hub-before.service"
          for _ in $(seq 1 30); do systemctl is-active -q worklane-tailscale.service || break; sleep 1; done
      - name: "tailscale install: a pinned key that isn't the repository's is refused by the real gpg check, and nothing is installed (a throwaway copy)"
        run: |
          # The shipped check, unchanged, told to expect another key: a copy outside the checkout, deleted right after.
          p="$RUNNER_TEMP/pin-probe" && mkdir -p "$p" && cp -r scripts/setup "$p/setup"
          sed -i 's/^TAILSCALE_SIGNER_FPR=.*/TAILSCALE_SIGNER_FPR=0000000000000000000000000000000000000000/' "$p/setup/lib.sh"
          grep -qx 'TAILSCALE_SIGNER_FPR=0000000000000000000000000000000000000000' "$p/setup/lib.sh"
          rc=0; sudo bash "$p/setup/tailscale.sh" install > "$F/ts-pin.txt" 2>&1 || rc=$?
          cat "$F/ts-pin.txt"; rm -rf "$p"
          [ "$rc" = 1 ]
          # Its progress file goes too: the next step waits for the real install's own last line, not this one's.
          sudo grep -q '"step":"install","state":"failed"' /var/lib/worklane/tailscale/steps.jsonl && sudo rm -f /var/lib/worklane/tailscale/steps.jsonl
          fpr="$(sed -n 's/^TAILSCALE_SIGNER_FPR=//p' scripts/setup/lib.sh)"
          # It names the key the repository really serves, which is the one this commit pins.
          grep -qF "install failed: the signing key fetched isn't the pinned one (pinned 0000000000000000000000000000000000000000, got $fpr); nothing installed" "$F/ts-pin.txt"
          sudo test ! -e /usr/bin/tailscale && sudo test ! -e /etc/apt/sources.list.d/tailscale.list && sudo test ! -e /usr/share/keyrings/tailscale-archive-keyring.gpg
          git diff --exit-code -- scripts/setup
      - name: "tailscale install, through the helper: the real package from Tailscale's signed apt repository, the pinned key and version"
        run: |
          s=/var/lib/worklane/tailscale/steps.jsonl
          ended() { sudo grep -q "\"step\":\"$1\",\"state\":\"\(done\|failed\)\"" "$s" 2>/dev/null; }
          sudo -u wl-ci sudo -n "$HELPER" tailscale install < /dev/null | tee "$F/ts-install.txt"
          grep -q 'started tailscale install as worklane-tailscale.service' "$F/ts-install.txt"
          for _ in $(seq 1 150); do ended install && break; sleep 2; done
          sudo cat "$s"
          sudo tail -n 1 "$s" | jq -e '.step=="install" and .state=="done"'
          [ "$(sudo stat -c '%U %a' "$s")" = "root 644" ]
          v="$(sed -n 's/^TAILSCALE_VERSION=//p' scripts/setup/lib.sh)"; fpr="$(sed -n 's/^TAILSCALE_SIGNER_FPR=//p' scripts/setup/lib.sh)"
          [ "$(dpkg-query -W -f='${Version}' tailscale)" = "$v" ]
          [ "$(/usr/bin/tailscale version | head -1)" = "$v" ]
          # apt's only source for it is Tailscale's repository, tied to the one key, which is the pinned one.
          code="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          grep -qxF "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu $code main" /etc/apt/sources.list.d/tailscale.list
          [ "$(stat -c '%U %G %a' /usr/share/keyrings/tailscale-archive-keyring.gpg)" = "root root 644" ]
          [ "$(gpg --show-keys --with-colons --with-fingerprint /usr/share/keyrings/tailscale-archive-keyring.gpg | awk -F: '$1 == "pub" { p = 1 } $1 == "fpr" && p { print $10; p = 0 }')" = "$fpr" ]
          apt-cache policy tailscale | tee "$F/ts-policy.txt"
          grep -q "https://pkgs.tailscale.com/stable/ubuntu $code/main" "$F/ts-policy.txt"
          systemctl is-active tailscaled
          sudo grep -q '"by":"wl-ci","what":"tailscale","from":null,"to":"install"' /var/lib/worklane/machine-changes.jsonl
          for _ in $(seq 1 30); do systemctl is-active -q worklane-tailscale.service || break; sleep 1; done
      - name: "tailscale up, through the helper (a stand-in tailscale from here): no auth key, and the login link for the asking coordinator's user only"
        run: |
          sudo systemctl stop tailscaled
          sudo install -o root -g root -m 0755 scripts/ci/tailscale-stand-in.cjs /usr/bin/tailscale
          d=/var/lib/worklane/tailscale
          ended() { sudo grep -q "\"step\":\"$1\",\"state\":\"\(done\|failed\)\"" "$d/steps.jsonl" 2>/dev/null; }
          sudo -u wl-ci sudo -n "$HELPER" tailscale up < /dev/null
          for _ in $(seq 1 60); do sudo test -s "$d/login-url" && break; sleep 1; done
          # The link: tailscale's own, in a file of the asking coordinator's user alone.
          [ "$(sudo stat -c '%U %G %a' "$d/login-url")" = "wl-ci root 400" ]
          sudo cmp "$d/login-url" /var/lib/ci-tailscale/last-url
          sudo -u wl-ci cat "$d/login-url" | grep -qE '^https://login\.tailscale\.com/a/[0-9a-f]{16}$'
          for u in wl-dash wl-ci-agent wl-beta wl-gamma; do
            if sudo -u "$u" cat "$d/login-url" >/dev/null 2>&1; then echo "$u can read the login link" >&2; exit 1; fi
          done
          id="$(sudo sed 's#.*/##' "$d/login-url")"; echo "::add-mask::$id"; [ "${#id}" = 16 ]
          # The id to look for goes in a file of the runner's, never on a sudo command line (sudo logs those to the journal).
          (umask 077; printf '%s\n' "$id" > "$F/ts-link-id")
          # A second step while this one waits is refused: one at a time.
          if sudo -u wl-ci sudo -n "$HELPER" tailscale serve < /dev/null 2> "$F/ts-busy.txt"; then echo "a second tailscale step started" >&2; exit 1; fi
          grep -q 'a tailscale step is already running' "$F/ts-busy.txt"
          leaked() { sudo journalctl --no-pager > "$F/journal.txt" 2>&1 || true; sudo grep -qFf "$F/ts-link-id" "$F/journal.txt" "$d/steps.jsonl" /var/lib/worklane/machine-changes.jsonl; }
          if leaked; then echo "the login link is in the journal, the steps or the changes log" >&2; exit 1; fi
          sudo grep -q '"step":"up","state":"waiting"' "$d/steps.jsonl"
          # The owner logs in (the stand-in's way): the machine is on the tailnet under a name, with a certificate.
          net=ts.net; name="ci-box.tail0ci.$net"; echo "TS_NAME=$name" >> "$GITHUB_ENV"
          printf '{"BackendState":"Running","Self":{"DNSName":"%s."},"CertDomains":["%s"]}\n' "$name" "$name" | sudo tee /var/lib/ci-tailscale/login.json >/dev/null
          for _ in $(seq 1 60); do ended up && break; sleep 1; done
          sudo cat "$d/steps.jsonl"
          sudo tail -n 1 "$d/steps.jsonl" | jq -e --arg n "$name" '.step=="up" and .state=="done" and .detail=="on the tailnet as \($n)"'
          sudo test ! -e "$d/login-url"
          if leaked; then echo "the login link is in the journal, the steps or the changes log" >&2; exit 1; fi
          rm -f "$F/journal.txt" "$F/ts-link-id"
          # tailscale up got a timeout and nothing else: no key as an argument or in its environment.
          [ "$(sudo jq -c 'select(.args[0]=="up")' /var/lib/ci-tailscale/calls)" = '{"args":["up","--timeout=600s"],"authkey_env":false}' ]
          if sudo grep -q 'tskey' /var/lib/ci-tailscale/calls "$d/steps.jsonl"; then echo "a key reached tailscale or the steps" >&2; exit 1; fi
          for _ in $(seq 1 30); do systemctl is-active -q worklane-tailscale.service || break; sleep 1; done
      - name: "tailscale serve and public-url, through the helper: https 443 to the hub's sign-in port only; the hub's URL through dashboards.sh, its other settings kept"
        run: |
          d=/var/lib/worklane/tailscale; hub=/etc/systemd/system/worklane-dashboard-hub.service
          ended() { sudo grep -q "\"step\":\"$1\",\"state\":\"\(done\|failed\)\"" "$d/steps.jsonl" 2>/dev/null; }
          idle() { for _ in $(seq 1 60); do systemctl is-active -q worklane-tailscale.service || return 0; sleep 1; done; return 1; }
          # Funnel already on from before (the stand-in's serve config says so): status shows it, serve and public-url do
          # nothing, and the config is byte for byte as it was. Then it is off again, as an admin would turn it off.
          printf '{"AllowFunnel":{"%s:443":true}}' "$TS_NAME" | sudo tee /var/lib/ci-tailscale/serve.json >/dev/null
          sudo cp /var/lib/ci-tailscale/serve.json "$F/ts-funnel.json"
          sudo -u wl-ci bash /opt/worklane/current/scripts/setup/tailscale.sh status --json | jq -e '.funnel and (.serve|not)'
          for a in serve public-url; do
            sudo -u wl-ci sudo -n "$HELPER" tailscale "$a" < /dev/null
            for _ in $(seq 1 60); do ended "$a" && break; sleep 1; done
            sudo tail -n 1 "$d/steps.jsonl" | jq -e --arg a "$a" '.step==$a and .state=="failed" and (.detail|test("Tailscale Funnel is on for this machine.*never turns Funnel on or off"))'
            idle
          done
          sudo cmp /var/lib/ci-tailscale/serve.json "$F/ts-funnel.json"
          sudo cmp "$hub" "$F/hub-before.service"
          if sudo jq -e 'select(.args[0]=="serve" and .args[1]=="--bg")' /var/lib/ci-tailscale/calls >/dev/null; then echo "serve ran with Funnel on" >&2; exit 1; fi
          if sudo grep -q funnel /var/lib/ci-tailscale/calls; then echo "tailscale was given a funnel command" >&2; exit 1; fi
          sudo rm -f /var/lib/ci-tailscale/serve.json
          sudo -u wl-ci sudo -n "$HELPER" tailscale serve < /dev/null
          for _ in $(seq 1 60); do ended serve && break; sleep 1; done
          sudo cat "$d/steps.jsonl"
          sudo tail -n 1 "$d/steps.jsonl" | jq -e '.step=="serve" and .state=="done"'
          if sudo grep -q AllowFunnel /var/lib/ci-tailscale/serve.json; then echo "serve turned Funnel on" >&2; exit 1; fi
          sudo -u wl-ci bash /opt/worklane/current/scripts/setup/tailscale.sh status --json | jq -e '.serve and (.funnel|not)'
          [ "$(sudo jq -sc 'map(.args) | map(select(.[0]=="serve" and .[1]=="--bg"))' /var/lib/ci-tailscale/calls)" = '[["serve","--bg","--https=443","http://127.0.0.1:4399"]]' ]
          if sudo grep -q '4398' /var/lib/ci-tailscale/serve.json; then echo "the break-glass port is forwarded" >&2; exit 1; fi
          idle
          # The hub's URL: this machine's tailnet name, and nothing else about the hub changes.
          sudo cmp "$hub" "$F/hub-before.service"
          old="$(sed -n 's/^ExecStart=.* --public-url \([^ ]*\).*$/\1/p' "$F/hub-before.service")" && [ -n "$old" ] && [ "$old" != "https://$TS_NAME" ]
          sudo -u wl-ci sudo -n "$HELPER" tailscale public-url < /dev/null
          for _ in $(seq 1 120); do ended public-url && break; sleep 1; done
          sudo cat "$d/steps.jsonl"
          sudo tail -n 1 "$d/steps.jsonl" | jq -e --arg n "$TS_NAME" --arg o "$old" '.step=="public-url" and .state=="done" and (.detail|contains("URL is now https://\($n) (it was \($o)). To sign in there, set the sign-in App"))'
          sed "s# --public-url $old# --public-url https://$TS_NAME#" "$F/hub-before.service" > "$F/hub-want.service"
          sudo cmp "$hub" "$F/hub-want.service"
          idle
          for u in worklane-dashboard-hub worklane-dashboard-ci worklane-ci; do systemctl is-active "$u.service"; done
          # What the screen reads, as the coordinator (no root): installed, on the tailnet, served, and the hub's URL.
          sudo -u wl-ci bash /opt/worklane/current/scripts/setup/tailscale.sh status --json | tee "$F/ts-status.json"
          jq -e --arg n "$TS_NAME" '.installed and .state=="Running" and .name==$n and .https and .serve and (.break_glass_forwarded|not) and .hub_url=="https://\($n)"' "$F/ts-status.json"
          # Again: already that URL, so dashboards.sh isn't run and the hub isn't restarted.
          sudo rm -f "$d/steps.jsonl"
          since="$(systemctl show -p ActiveEnterTimestampMonotonic --value worklane-dashboard-hub.service)"
          sudo -u wl-ci sudo -n "$HELPER" tailscale public-url < /dev/null
          for _ in $(seq 1 60); do ended public-url && break; sleep 1; done
          sudo tail -n 1 "$d/steps.jsonl" | jq -e '.state=="done" and (.detail|test("is already https://"))'
          [ "$(systemctl show -p ActiveEnterTimestampMonotonic --value worklane-dashboard-hub.service)" = "$since" ]
          [ "$(sudo grep -c '"what":"tailscale"' /var/lib/worklane/machine-changes.jsonl)" = 9 ]
      # The Siri gateway on a real machine (docs/siri.md): dashboards.sh --siri gives wl-dash the instance's Siri gateway
      # token (and takes it away again without --siri), the hub listens on 127.0.0.1:4397, and the kernel's word on who
      # opened the connection (/proc/net/tcp) refuses a program on this machine whatever headers it sends; the dashboard
      # key never works on /api/siri, and the gateway token works nowhere else; serve-siri adds 8443 and keeps 443.
      - name: "Siri gateway: wl-dash reads the gateway token only with --siri; a local program is refused by the kernel's word; the dashboard key never works on /api/siri; serve-siri adds 8443 only"
        run: |
          d=/var/lib/worklane/tailscale; hub=/etc/systemd/system/worklane-dashboard-hub.service
          state="$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci/state"
          port="$(node --input-type=module -e 'const m = await import("/opt/worklane/current/dist/src/dashboard.js"); console.log(m.instancePort("ci"));')"
          id="$(sed -n 's/^ExecStart=.* --client-id \([^ ]*\).*$/\1/p' "$hub")"; url="$(sed -n 's/^ExecStart=.* --public-url \([^ ]*\).*$/\1/p' "$hub")"
          [ -n "$id" ] && [ -n "$url" ]
          sudo cp "$d/steps.jsonl" "$F/siri-steps-before.jsonl"
          sudo test -s "$state/siri-gateway-token"
          if sudo -u wl-dash test -r "$state/siri-gateway-token"; then echo "wl-dash reads the Siri gateway token without --siri" >&2; exit 1; fi
          sudo bash /opt/worklane/current/scripts/setup/dashboards.sh --client-id "$id" --public-url "$url" --siri ci | tee "$F/siri-dashboards.log"
          grep -q -- ' --siri-port 4397' "$hub"
          sudo -u wl-dash test -r "$state/siri-gateway-token"
          if sudo -u wl-dash test -w "$state/siri-gateway-token"; then echo "wl-dash can write the Siri gateway token" >&2; exit 1; fi
          if sudo cmp -s "$state/siri-gateway-token" "$state/dashboard-token"; then echo "the gateway token is the dashboard token" >&2; exit 1; fi
          for _ in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4397/tell)" != 000 ] && break; sleep 1; done
          # One try from this runner's user, which is not tailscaled, naming a tailnet address: refused before any token is read.
          peer="$(printf '100.%s.%s.%s' 101 102 103)"
          code="$(curl -sS -o "$F/siri-local.json" -w '%{http_code}' -X POST http://127.0.0.1:4397/tell -H 'content-type: application/json' -H "x-forwarded-for: $peer" -d '{"text":"an idea"}')"
          cat "$F/siri-local.json"; echo
          [ "$code" = 403 ] && jq -e '.speech|test("only answers from your tailnet")' "$F/siri-local.json"
          tok="$(sudo cat "$state/dashboard-token")"; echo "::add-mask::$tok"
          gw="$(sudo cat "$state/siri-gateway-token")"; echo "::add-mask::$gw"
          # The dashboard key on the instance's Siri routes: refused; the gateway token on the dashboard's routes: refused.
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $tok" -H 'content-type: application/json' -d '{"text":"x"}' "http://127.0.0.1:$port/api/siri/tell")" = 401 ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $gw" -H 'content-type: application/json' -d '{"id":"x","answer":"approve"}' "http://127.0.0.1:$port/api/decide")" = 401 ]
          if sudo test -d "$state/voice"; then sudo find "$state/voice" -name '*.json' | grep -q . && { echo "something reached the voice inbox" >&2; exit 1; }; fi
          # serve-siri, by hand as root: 8443 to the gateway, 443 still to the hub, never Funnel.
          sudo bash /opt/worklane/current/scripts/setup/tailscale.sh serve-siri
          sudo jq -e --arg n "$TS_NAME" '.Web["\($n):8443"].Handlers["/"].Proxy=="http://127.0.0.1:4397" and .Web["\($n):443"].Handlers["/"].Proxy=="http://127.0.0.1:4399" and (has("AllowFunnel")|not)' /var/lib/ci-tailscale/serve.json
          sudo -u wl-ci bash /opt/worklane/current/scripts/setup/tailscale.sh status --json | jq -e '.siri and .serve and (.funnel|not)'
          # Back as it was for the steps after: no gateway, and wl-dash's read of the gateway token removed.
          sudo bash /opt/worklane/current/scripts/setup/dashboards.sh --client-id "$id" --public-url "$url" ci > "$F/siri-dashboards-off.log"
          if grep -q -- '--siri-port' "$hub"; then echo "the gateway stayed on" >&2; exit 1; fi
          if sudo -u wl-dash test -r "$state/siri-gateway-token"; then echo "wl-dash still reads the Siri gateway token" >&2; exit 1; fi
          sudo install -o root -g root -m 0644 "$F/siri-steps-before.jsonl" "$d/steps.jsonl"
      # The hooks gateway for webhook automations on a real machine (docs/automations.md): dashboards.sh --hooks gives
      # wl-dash the instance's hooks gateway token (and takes it away again without --hooks), the hub listens on
      # 127.0.0.1:4396, a program on this machine is refused by the kernel's word whatever headers it sends, the
      # dashboard key never works on /api/hooks and the gateway token works nowhere else; serve-hooks adds 8444 only.
      - name: "hooks gateway: wl-dash reads the gateway token only with --hooks; a local program is refused by the kernel's word; the dashboard key never works on /api/hooks; serve-hooks adds 8444 only"
        run: |
          d=/var/lib/worklane/tailscale; hub=/etc/systemd/system/worklane-dashboard-hub.service
          state="$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci/state"
          port="$(node --input-type=module -e 'const m = await import("/opt/worklane/current/dist/src/dashboard.js"); console.log(m.instancePort("ci"));')"
          id="$(sed -n 's/^ExecStart=.* --client-id \([^ ]*\).*$/\1/p' "$hub")"; url="$(sed -n 's/^ExecStart=.* --public-url \([^ ]*\).*$/\1/p' "$hub")"
          [ -n "$id" ] && [ -n "$url" ]
          sudo cp "$d/steps.jsonl" "$F/hooks-steps-before.jsonl"
          sudo test -s "$state/hooks-gateway-token"
          if sudo -u wl-dash test -r "$state/hooks-gateway-token"; then echo "wl-dash reads the hooks gateway token without --hooks" >&2; exit 1; fi
          sudo bash /opt/worklane/current/scripts/setup/dashboards.sh --client-id "$id" --public-url "$url" --hooks ci | tee "$F/hooks-dashboards.log"
          grep -q -- ' --hooks-port 4396' "$hub"
          sudo -u wl-dash test -r "$state/hooks-gateway-token"
          if sudo -u wl-dash test -w "$state/hooks-gateway-token"; then echo "wl-dash can write the hooks gateway token" >&2; exit 1; fi
          if sudo cmp -s "$state/hooks-gateway-token" "$state/dashboard-token"; then echo "the hooks gateway token is the dashboard token" >&2; exit 1; fi
          for _ in $(seq 1 30); do [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:4396/hook/ci/x)" != 000 ] && break; sleep 1; done
          # One try from this runner's user, which is not tailscaled, naming a tailnet address: refused before anything is read.
          peer="$(printf '100.%s.%s.%s' 101 102 103)"
          code="$(curl -sS -o "$F/hooks-local.json" -w '%{http_code}' -X POST http://127.0.0.1:4396/hook/ci/deploy-notes -H "x-forwarded-for: $peer" -d '{}')"
          cat "$F/hooks-local.json"; echo
          [ "$code" = 403 ]
          tok="$(sudo cat "$state/dashboard-token")"; echo "::add-mask::$tok"
          gw="$(sudo cat "$state/hooks-gateway-token")"; echo "::add-mask::$gw"
          # The dashboard key on the instance's hooks route: refused; the gateway token on the dashboard's routes: refused.
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $tok" -H 'x-hook-node: {"id":"n1","name":"ci-peer"}' -d '{}' "http://127.0.0.1:$port/api/hooks/deploy-notes")" = 401 ]
          [ "$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $gw" "http://127.0.0.1:$port/api/automations")" = 401 ]
          # serve-hooks, by hand as root: 8444 to the gateway, 443 still to the hub, never Funnel.
          sudo bash /opt/worklane/current/scripts/setup/tailscale.sh serve-hooks
          sudo jq -e --arg n "$TS_NAME" '.Web["\($n):8444"].Handlers["/"].Proxy=="http://127.0.0.1:4396" and .Web["\($n):443"].Handlers["/"].Proxy=="http://127.0.0.1:4399" and (has("AllowFunnel")|not)' /var/lib/ci-tailscale/serve.json
          sudo -u wl-ci bash /opt/worklane/current/scripts/setup/tailscale.sh status --json | jq -e '.hooks and .serve and (.funnel|not)'
          # Back as it was for the steps after: no gateway, and wl-dash's read of the gateway token removed.
          sudo bash /opt/worklane/current/scripts/setup/dashboards.sh --client-id "$id" --public-url "$url" ci > "$F/hooks-dashboards-off.log"
          if grep -q -- '--hooks-port' "$hub"; then echo "the gateway stayed on" >&2; exit 1; fi
          if sudo -u wl-dash test -r "$state/hooks-gateway-token"; then echo "wl-dash still reads the hooks gateway token" >&2; exit 1; fi
          sudo install -o root -g root -m 0644 "$F/hooks-steps-before.jsonl" "$d/steps.jsonl"
      # The first-run wizard's Tailscale screen, end to end on this machine: the instance's own dashboard (the owner's
      # break-glass token, on loopback), the request in its event log, the real coordinator (worklane-ci.service) running
      # the helper through sudo, the step's own unit, and the screen's view of it. The stand-in is logged out first.
      - name: "tailscale from the dashboard: a confirmed step becomes a machine request the coordinator runs through the helper; the login link reaches the owner's view and no event or log"
        run: |
          d=/var/lib/worklane/tailscale
          state="$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci/state"
          port="$(node --input-type=module -e 'const m = await import("/opt/worklane/current/dist/src/dashboard.js"); console.log(m.instancePort("ci"));')"
          tok="$(sudo cat "$state/dashboard-token")"; echo "::add-mask::$tok"
          api() { curl -sS --max-time 30 -H "Authorization: Bearer $tok" -H 'content-type: application/json' "$@" "http://127.0.0.1:$port$path"; }
          code() { api -o "$F/ts-api.txt" -w '%{http_code}' "$@"; }
          ended() { sudo grep -q "\"step\":\"$1\",\"state\":\"\(done\|failed\)\"" "$d/steps.jsonl" 2>/dev/null; }
          idle() { for _ in $(seq 1 60); do systemctl is-active -q worklane-tailscale.service || return 0; sleep 1; done; return 1; }
          # The view, as the steps above left the machine: everything done, nothing to open.
          path=/api/tailscale; api | tee "$F/ts-view1.json"; echo
          jq -e --arg n "$TS_NAME" '.machineOwner and .allowed and .status.installed and .status.state=="Running" and .status.name==$n and .status.https and .status.serve and (.status.funnel|not) and .status.hubUrl=="https://\($n)" and .next==null and .loginUrl==null and (.steps|map(.done)|all)' "$F/ts-view1.json"
          # Logged out again (the stand-in's way), nothing served.
          sudo rm -f /var/lib/ci-tailscale/state.json /var/lib/ci-tailscale/serve.json /var/lib/ci-tailscale/calls "$d/steps.jsonl"
          sleep 4
          path=/api/tailscale; api > "$F/ts-view2.json"
          jq -e '.status.installed and .status.state=="NeedsLogin" and .status.name==null and .next=="up" and .run==null and .loginUrl==null' "$F/ts-view2.json"
          # Looking asked for nothing; a step without its confirmation, or with anything but one of the four words, is refused.
          path=/api/machine/tailscale
          [ "$(code -X POST -d '{"action":"up"}')" = 400 ]
          [ "$(code -X POST -d '{"action":"up --auth-key=tskey-auth-kCIexample-0123456789abcdef","confirm":true}')" = 400 ]
          [ "$(code -X POST -d '{"action":"serve","confirm":true}')" = 409 ]
          sleep 45
          sudo test ! -e "$d/steps.jsonl"
          sudo test ! -e /var/lib/ci-tailscale/calls || ! sudo grep -q '"up"' /var/lib/ci-tailscale/calls
          # Confirmed: recorded, then run by the coordinator on its next tick.
          [ "$(code -X POST -d '{"action":"up","confirm":true}')" = 200 ] || { cat "$F/ts-api.txt"; exit 1; }
          jq -e '.pending and .request.args==["tailscale","up"] and .request.via=="tailscale"' "$F/ts-api.txt"
          for _ in $(seq 1 180); do sudo test -s "$d/login-url" && break; sleep 1; done
          sudo test -s "$d/login-url" || { sudo journalctl --no-pager -n 40 -u worklane-ci.service; exit 1; }
          [ "$(sudo stat -c '%U %G %a' "$d/login-url")" = "wl-ci root 400" ]
          id="$(sudo sed 's#.*/##' "$d/login-url")"; echo "::add-mask::$id"; [ "${#id}" = 16 ]
          (umask 077; printf '%s\n' "$id" > "$F/ts-link-id")
          # The owner's view has the link, exactly the file's; nothing else on the machine does.
          sleep 4
          path=/api/tailscale; api > "$F/ts-view3.json"
          [ "$(jq -r '.loginUrl' "$F/ts-view3.json")" = "$(sudo cat "$d/login-url")" ]
          jq -e '.run.step=="up" and .run.status=="waiting" and .busy=="tailscale up is running"' "$F/ts-view3.json" >/dev/null
          rm -f "$F/ts-view3.json"
          path=/api/machine/tailscale
          [ "$(code -X POST -d '{"action":"up","confirm":true}')" = 409 ]
          leaked() { sudo journalctl --no-pager > "$F/journal.txt" 2>&1 || true; sudo grep -qaFf "$F/ts-link-id" "$F/journal.txt" "$d/steps.jsonl" /var/lib/worklane/machine-changes.jsonl "$state"/events.db*; }
          if leaked; then echo "the login link is in the journal, the steps, the changes log or the event log" >&2; exit 1; fi
          # The event log has the request as two words, by the break-glass's owner, and the audit of it.
          sudo grep -qaF '"args":["tailscale","up"]' "$state"/events.db*
          sudo grep -qaF 'machine.tailscale' "$state"/events.db*
          if sudo grep -qaF 'tskey' "$state"/events.db* /var/lib/ci-tailscale/calls "$d/steps.jsonl"; then echo "key text reached the event log, tailscale or the steps" >&2; exit 1; fi
          # The owner logs in; the screen moves on to the next step, which is asked for and run the same way.
          printf '{"BackendState":"Running","Self":{"DNSName":"%s."},"CertDomains":["%s"]}\n' "$TS_NAME" "$TS_NAME" | sudo tee /var/lib/ci-tailscale/login.json >/dev/null
          for _ in $(seq 1 60); do ended up && break; sleep 1; done
          sudo tail -n 1 "$d/steps.jsonl" | jq -e '.step=="up" and .state=="done"'
          sudo test ! -e "$d/login-url"
          if leaked; then echo "the login link is in the journal, the steps, the changes log or the event log" >&2; exit 1; fi
          rm -f "$F/journal.txt" "$F/ts-link-id"
          [ "$(sudo jq -c 'select(.args[0]=="up")' /var/lib/ci-tailscale/calls)" = '{"args":["up","--timeout=600s"],"authkey_env":false}' ]
          idle; sleep 4
          path=/api/tailscale; api > "$F/ts-view4.json"
          jq -e --arg n "$TS_NAME" '.status.state=="Running" and .status.name==$n and (.status.serve|not) and .next=="serve" and .loginUrl==null and .run.status=="done"' "$F/ts-view4.json"
          path=/api/machine/tailscale
          [ "$(code -X POST -d '{"action":"serve","confirm":true}')" = 200 ] || { cat "$F/ts-api.txt"; exit 1; }
          for _ in $(seq 1 180); do ended serve && break; sleep 1; done
          sudo tail -n 1 "$d/steps.jsonl" | jq -e '.step=="serve" and .state=="done"'
          idle; sleep 4
          path=/api/tailscale; api > "$F/ts-view5.json"
          jq -e '.status.serve and .next==null and (.steps|map(.done)|all)' "$F/ts-view5.json"
          for u in worklane-dashboard-hub worklane-dashboard-ci worklane-ci; do systemctl is-active "$u.service"; done
      - name: "plugins: through the helper as ci's coordinator, a throwaway user fetches this commit's fixture and root keeps a preview; a stage grants nothing; the coordinator can't confirm or write the allowlist; root confirms only with the id typed back; remove only deletes"
        env:
          # The commit this job checked out and runs (on a PR, its merge into main), never the PR head: a PR branched
          # before a fixture change would run main's steps against its old fixture (#631).
          FIXTURE_SHA: ${{ github.sha }}
        run: |
          url="https://github.com/${{ github.repository }}.git"
          st=/var/lib/worklane/plugins/fetch-status/ci.json
          E=/opt/worklane/current/dist/src/plugins
          fetch() { # <id> <fixture>: through the helper, as the coordinator; waits for the fetch unit's result
            sudo -u wl-ci sudo -n "$HELPER" plugin-fetch "$1" "$url" "$FIXTURE_SHA" "test/fixtures/plugins/$2"
            for _ in $(seq 90); do [ "$(sudo jq -r '.id + " " + .state' "$st" 2>/dev/null)" = "$1 running" ] || [ "$(sudo jq -r .id "$st" 2>/dev/null)" != "$1" ] || break; sleep 2; done
            sudo jq -c . "$st"
          }
          digest() { (cd / && sudo -u wl-ci /usr/local/bin/node --input-type=module -e "import {approvalDigest} from '$E/approval.js'; import {readPreview, recordOf} from '$E/root-ops.js'; console.log(approvalDigest(recordOf(readPreview('ci', process.argv[1]), process.argv[2].split('+'))))" "$1" "$2"); }
          fetch kit kit
          [ "$(sudo jq -r .state "$st")" = done ]
          p=/var/lib/worklane/plugins/previews/ci/kit
          [ "$(stat -c '%U %a' "$p/preview.json")" = "root 644" ]
          jq -e '.inspection.refusals == [] and .inspection.skills == ["review"] and .inspection.agents == ["reviewer"] and (.inspection.mcpServers | map(.name)) == ["notes"]' "$p/preview.json"
          test ! -e "$p/tree/.mcp.json"   # the broker, never Claude Code, runs a plugin's MCP server
          if find "$p" ! -user root | grep -q .; then echo "the preview isn't all root's" >&2; exit 1; fi
          # Refused fixture: previewed with its reasons, and nothing can stage it.
          fetch refused refused
          jq -e '.materialized == null and (.inspection.refusals | any(test("allowed-tools")))' /var/lib/worklane/plugins/previews/ci/refused/preview.json
          if sudo -u wl-ci sudo -n "$HELPER" plugin-stage refused "sha256:$(printf 'a%.0s' $(seq 64))" builder; then echo "a refused plugin was staged" >&2; exit 1; fi
          # Stage: only the digest the preview and roles make now.
          d="$(digest kit builder)"
          if sudo -u wl-ci sudo -n "$HELPER" plugin-stage kit "$(digest kit reviewer)" builder; then echo "a digest for other roles was staged" >&2; exit 1; fi
          sudo -u wl-ci sudo -n "$HELPER" plugin-stage kit "$d" builder
          jq -e --arg d "$d" '.entries | any(.instance == "ci" and .id == "kit" and .digest == $d and .staged_by == "wl-ci")' /var/lib/worklane/plugins/pending.json
          test ! -e /etc/worklane/plugins/ci.json   # staged is trusted for nothing
          # The coordinator can't confirm: no helper command, plugins.sh refuses its sudo, and the allowlist isn't writable to it.
          if sudo -n -l -U wl-ci "$HELPER" plugin-confirm kit "$d" > /dev/null 2>&1; then echo "the coordinator may confirm" >&2; exit 1; fi
          if sudo -n -l -U wl-ci bash /opt/worklane/current/scripts/setup/plugins.sh confirm ci kit "$d" > /dev/null 2>&1; then echo "the coordinator may run plugins.sh" >&2; exit 1; fi
          if sudo env SUDO_USER=wl-ci bash /opt/worklane/current/scripts/setup/plugins.sh confirm ci kit "$d" < /dev/null 2> "$F/pc.err"; then echo "plugins.sh confirmed for a coordinator" >&2; exit 1; fi
          grep -q "a coordinator may only stage" "$F/pc.err"
          sudo install -d -o root -g root -m 0755 /etc/worklane/plugins
          if sudo -u wl-ci sh -c 'echo x > /etc/worklane/plugins/ci.json' 2> /dev/null; then echo "the coordinator wrote the allowlist" >&2; exit 1; fi
          # Root at a terminal: a wrong id typed confirms nothing; the right one confirms.
          printf 'kits\n' | sudo script -qec "bash /opt/worklane/current/scripts/setup/plugins.sh confirm ci kit $d" /dev/null > "$F/pc1.out" 2>&1 || true
          grep -q 'not confirmed: nothing changed' "$F/pc1.out"
          test ! -e /etc/worklane/plugins/ci.json
          printf 'kit\n' | sudo script -qec "bash /opt/worklane/current/scripts/setup/plugins.sh confirm ci kit $d" /dev/null | tee "$F/pc2.out"
          grep -q 'confirmed kit for ci' "$F/pc2.out"
          grep -q "roles:      builder" "$F/pc2.out"
          [ "$(stat -c '%U %G %a' /etc/worklane/plugins/ci.json)" = "root root 644" ]
          tree="$(jq -r '.entries[0].record.tree' /etc/worklane/plugins/ci.json)"
          s="/var/lib/worklane/plugins/store/ci/kit/${tree#wl-tree-v1:sha256:}"
          if find "$s" ! -user root -o -perm /022 | grep -q .; then echo "the store copy isn't root's alone" >&2; exit 1; fi
          (cd / && sudo -u wl-ci /usr/local/bin/node --input-type=module -e "import {treeHash} from '$E/tree.js'; if (treeHash(process.argv[1]) !== process.argv[2]) process.exit(1)" "$s" "$tree")
          sudo -u wl-ci /usr/local/bin/worklane plugins show --instance ci | grep -q "^kit "
          tail -n 3 /var/lib/worklane/machine-changes.jsonl | grep -q '"what":"plugins.ci.confirmed"'
          # What a run of each role would load, as the coordinator computes it before every run (src/plugins/run.ts).
          run_ids() { (cd / && sudo -u wl-ci /usr/local/bin/node --input-type=module -e "import {pluginsForRun} from '$E/run.js'; const h = process.argv[1]; const r = pluginsForRun({instance: 'ci', instanceHome: h, role: process.argv[2]}); console.log(r.ids.join(',') + ' ' + r.dirs.join(',') + ' ' + r.pluginRoot)" "$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci" "$1"); }
          [ "$(run_ids builder)" = "kit $s /var/lib/worklane/plugins/store/ci/.empty-root" ]
          [ "$(run_ids reviewer | cut -d' ' -f1)" = "" ]
          [ "$(stat -c '%U %a' /var/lib/worklane/plugins/store/ci/.empty-root)" = "root 555" ]
          # The agent user can't install a plugin where runs look (probe P2), nor write the approved copy.
          if sudo -u wl-ci-agent sh -c "mkdir /var/lib/worklane/plugins/store/ci/.empty-root/x || touch '$s/x'" 2> /dev/null; then echo "the agent wrote under the plugin store" >&2; exit 1; fi
          # Remove, through the helper: the entry goes; nothing else is touched.
          sudo -u wl-ci sudo -n "$HELPER" plugin-remove kit
          jq -e '.entries == []' /etc/worklane/plugins/ci.json
          test -d "$s"   # runs in flight keep their copy
      - name: "MCP broker: wl-ci-mcp alone reads the server's secret; the server is snapshotted in quarantine, approved by root, and reached by the agent only through the broker with its run's ticket; a rug pull blocks it; a real claude admits only the connector"
        env:
          # The commit under test, as in the plugins step (#631).
          FIXTURE_SHA: ${{ github.sha }}
        run: |
          url="https://github.com/${{ github.repository }}.git"
          st=/var/lib/worklane/plugins/fetch-status/ci.json
          E=/opt/worklane/current/dist/src
          CLI="$E/cli.js"
          wait_status() { for _ in $(seq 90); do [ "$(sudo jq -r '.id + " " + .state' "$st" 2>/dev/null)" = "$1 running" ] || [ "$(sudo jq -r .id "$st" 2>/dev/null)" != "$1" ] || break; sleep 2; done; sudo jq -c . "$st"; }
          digest() { (cd / && sudo -u wl-ci /usr/local/bin/node --input-type=module -e "import {approvalDigest} from '$E/plugins/approval.js'; import {readPreview, recordOf} from '$E/plugins/root-ops.js'; const p = readPreview('ci', process.argv[1]); const m = process.argv[3] ? {network: process.argv[3] === 'none' ? [] : process.argv[3].split('+'), secrets: process.argv[4] === 'none' ? [] : process.argv[4].split('+')} : undefined; console.log(approvalDigest(recordOf(p, process.argv[2].split('+'), m)))" "$@"); }
          confirm() { printf '%s\n' "$1" | sudo script -qec "bash /opt/worklane/current/scripts/setup/plugins.sh confirm ci $1 $2" /dev/null | tail -n 1; }
          # preview_done: a failed preview stops right after its wait, with its unit's journal and status (#677).
          . scripts/ci/preview-done.sh
          # The broker: its user, groups and unit.
          sudo bash scripts/setup/mcp-broker.sh ci | tee "$F/mcp-setup.log"
          systemctl is-active "worklane-mcp@ci"
          [ "$(stat -c '%U:%G %a' /run/worklane-mcp-ci/broker.sock)" = "wl-ci-mcp:wl-ci-mcpc 660" ]
          [ "$(stat -c '%U:%G %a' /run/worklane-mcp-ci/control.sock)" = "wl-ci-mcp:wl-ci-mcpctl 660" ]
          # The plugin again (the plugins step removed it), then its server previewed in quarantine.
          sudo -u wl-ci sudo -n "$HELPER" plugin-fetch kit "$url" "$FIXTURE_SHA" test/fixtures/plugins/kit && wait_status kit
          d="$(digest kit builder)" && sudo -u wl-ci sudo -n "$HELPER" plugin-stage kit "$d" builder && confirm kit "$d"
          sudo -u wl-ci sudo -n "$HELPER" mcp-preview kit-notes kit notes && wait_status kit-notes
          preview_done ci kit-notes
          p=/var/lib/worklane/plugins/previews/ci/kit-notes/preview.json
          jq -c '{snapshotError, tools: (.snapshot.tools // null | if . then map(.name) else . end)}' "$p"
          if ! jq -e '.snapshot' "$p" >/dev/null; then readlink -f /usr/local/bin/node; sudo find /var/lib/worklane/plugins/store/ci -maxdepth 4 -printf '%M %u:%g %p\n' | head -30; fi
          jq -e '.snapshot.tools | map(.name) == ["echo"]' "$p"
          jq -e '.snapshotWithSecrets == false and .envNames == ["NOTES_TOKEN"]' "$p"
          # Named test: a snapshot run that tries to write into the broker's paths (its home and caches, its state, the
          # plugin store and previews, /etc and /opt) fails at every one, and nothing it tried exists afterwards.
          sudo -u wl-ci sudo -n "$HELPER" plugin-fetch escape "$url" "$FIXTURE_SHA" test/fixtures/plugins/escape && wait_status escape
          d="$(digest escape builder)" && sudo -u wl-ci sudo -n "$HELPER" plugin-stage escape "$d" builder && confirm escape "$d"
          sudo -u wl-ci sudo -n "$HELPER" mcp-preview escape-probe escape probe && wait_status escape-probe
          preview_done ci escape-probe
          tries="$(jq -r '.snapshot.tools[0].description' /var/lib/worklane/plugins/previews/ci/escape-probe/preview.json)"
          echo "$tries" | tr ' ' '\n'
          echo "$tries" | grep -q 'wl-ci-mcp/escaped=denied'
          echo "$tries" | grep -q 'worklane/plugins/store/ci/escaped=denied'
          if echo "$tries" | grep -q 'WROTE'; then echo "the throwaway snapshot wrote where the broker reads" >&2; exit 1; fi
          for f in "$(getent passwd wl-ci-mcp | cut -d: -f6)/escaped" "$(getent passwd wl-ci-mcp | cut -d: -f6)/.cache/escaped" /var/lib/worklane/plugins/store/ci/escaped /var/lib/worklane-mcp-ci/escaped /etc/worklane/escaped; do
            if sudo test -e "$f"; then echo "$f exists" >&2; exit 1; fi
          done
          # Owner's condition (3): snapshots and previews are capped per hour (the 11th is refused).
          for i in $(seq 1 10); do sudo node "$CLI" plugins fetch-slot --instance capcheck --kind snapshot; done
          if sudo node "$CLI" plugins fetch-slot --instance capcheck --kind snapshot 2> "$F/cap.err"; then echo "an 11th snapshot this hour was allowed" >&2; exit 1; fi
          grep -q 'snapshots or previews in the last hour' "$F/cap.err"
          d="$(digest kit-notes builder none NOTES_TOKEN)"
          sudo -u wl-ci sudo -n "$HELPER" mcp-stage kit-notes "$d" builder none NOTES_TOKEN
          confirm kit-notes "$d" | grep -q 'confirmed kit-notes for ci'
          # The secret: for wl-ci-mcp alone; the value never echoed.
          tok="tok-$(openssl rand -hex 12)"; echo "::add-mask::$tok"
          printf '%s\n' "$tok" | sudo bash scripts/setup/mcp-broker.sh ci secret kit-notes NOTES_TOKEN | tee "$F/mcp-secret.out"
          if grep -qF "$tok" "$F/mcp-secret.out"; then echo "the secret was echoed" >&2; exit 1; fi
          sf="$(getent passwd wl-ci-mcp | cut -d: -f6)/secrets/kit-notes/NOTES_TOKEN"
          [ "$(sudo stat -c '%U %a' "$sf")" = "wl-ci-mcp 400" ]
          for u in wl-ci wl-ci-agent; do if sudo -u "$u" cat "$sf" > /dev/null 2>&1; then echo "$u read the MCP secret" >&2; exit 1; fi; done
          # The second snapshot of the APPROVED server: the broker's, with its secret (Q3); root keeps it as a preview.
          sudo -u wl-ci sudo -n "$HELPER" mcp-snapshot kit-notes && wait_status kit-notes
          # The broker's own start of a server: its error and the broker's journal (the server's stderr) first, so a
          # failure below carries bubblewrap's words.
          jq -c '{snapshotError}' /var/lib/worklane/plugins/previews/ci/kit-notes/preview.json
          sudo journalctl -u "worklane-mcp@ci" --no-pager | tail -n 30
          jq -e '.snapshotWithSecrets == true and (.snapshot.tools | map(.name)) == ["echo"]' /var/lib/worklane/plugins/previews/ci/kit-notes/preview.json
          # A run's ticket, registered by the coordinator; the agent can't reach the control socket.
          ticket="$(cd / && sudo -u wl-ci /usr/local/bin/node --input-type=module -e "import {registerRun} from '$E/mcp/client.js'; const r = await registerRun('ci', 'builder', 600000); console.log(r.ticket + ' ' + JSON.stringify(r.servers))")"
          echo "${ticket#* }" | jq -e '. == [{"id":"kit-notes","tools":["echo"]}]'
          ticket="${ticket%% *}"
          if sudo -u wl-ci-agent /usr/local/bin/node -e "require('net').connect('/run/worklane-mcp-ci/control.sock').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; then echo "the agent opened the control socket" >&2; exit 1; fi
          # As the agent, through the connector: the approved tool, served by the broker; the server had its secret.
          talk() { printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"echo","arguments":{"text":"hi"}}}' '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"echo","arguments":{"text":"hi","leak":"x"}}}' \
            | (sleep 0; cat; sleep 6) | sudo -u wl-ci-agent env -i PATH=/usr/local/bin:/usr/bin:/bin WORKLANE_MCP_TICKET="$1" timeout 20 /usr/local/bin/node "$CLI" mcp-connect ci kit-notes; }
          talk "$ticket" > "$F/mcp-talk.out" || true
          cat "$F/mcp-talk.out"
          sudo journalctl -u "worklane-mcp@ci" --no-pager | tail -n 20
          jq -s -e 'map(select(.id == 2))[0].result.tools | map(.name) == ["echo"]' "$F/mcp-talk.out"
          jq -s -e 'map(select(.id == 3))[0].result.content[0].text == "echo hi (token present)"' "$F/mcp-talk.out"
          jq -s -e 'map(select(.id == 4))[0].result.isError == true' "$F/mcp-talk.out"
          if grep -qF "$tok" "$F/mcp-talk.out"; then echo "the secret reached the agent" >&2; exit 1; fi
          # A forged ticket opens nothing.
          talk "$(printf 'f%.0s' $(seq 64))" > "$F/mcp-forged.out" || true
          if jq -s -e 'map(select(.id == 2)) | length > 0' "$F/mcp-forged.out" > /dev/null; then echo "a forged ticket was served" >&2; exit 1; fi
          # A real claude (fake key: no model call), as the agent with the runner's flags: the connector is admitted by the
          # allowedMcpServers lock and connects; another command line is not.
          v="$(sed -n 's/^CLAUDE_VERSION=//p' scripts/bootstrap.sh)"
          cc="$(mktemp -d /var/tmp/cc-XXXXXX)" && chmod 0755 "$cc" && sudo env PATH="$PATH" npm install -g --prefix "$cc" --no-audit --no-fund "@anthropic-ai/claude-code@$v" > /dev/null
          # The config is written before the directory becomes the agent user's: the runner can't write there after.
          h="$(mktemp -d /var/tmp/cch-XXXXXX)"
          printf '{"mcpServers":{"kit-notes":{"type":"stdio","command":"/usr/local/bin/node","args":["%s","mcp-connect","ci","kit-notes"],"env":{"WORKLANE_MCP_TICKET":"%s"}}}}' "$CLI" "$ticket" > "$h/mcp.json" && chmod 0644 "$h/mcp.json"
          sudo chown wl-ci-agent "$h"
          init() { echo hi | sudo -u wl-ci-agent env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$h" CLAUDE_CONFIG_DIR="$h/.claude" ANTHROPIC_API_KEY=sk-ant-not-a-key sh -c 'cd "$HOME" && { "$0"/bin/claude -p --output-format stream-json --verbose --max-turns 1 --setting-sources project --strict-mcp-config --mcp-config "$HOME/mcp.json" --settings "$1" || true; }' "$cc" "$1" 2>/dev/null | jq -c 'select(.type == "system" and .subtype == "init") | .mcp_servers'; }
          # Only the init event is read: the session itself fails (a stand-in API key), so its exit status is not.
          init "{\"allowedMcpServers\":[{\"serverCommand\":[\"/usr/local/bin/node\",\"$CLI\",\"mcp-connect\",\"ci\",\"kit-notes\"]}],\"disableClaudeAiConnectors\":true}" | tee "$F/cc1.json"
          jq -e 'map(select(.name == "kit-notes" and .status == "connected")) | length == 1' "$F/cc1.json"
          init '{"allowedMcpServers":[{"serverCommand":["/usr/local/bin/node","/elsewhere/cli.js","mcp-connect","ci","kit-notes"]}]}' | tee "$F/cc2.json"
          jq -e 'map(select(.status == "connected")) | length == 0' "$F/cc2.json"
          # A rug pull: the server's tools change; the next session is refused and the server is blocked.
          sudo touch /etc/kit-rugpull
          talk "$ticket" > "$F/mcp-rug.out" || true
          if jq -s -e 'map(select(.id == 2)) | length > 0' "$F/mcp-rug.out" > /dev/null; then echo "a changed server was served" >&2; exit 1; fi
          sudo jq -e '."kit-notes".diff.changed == [{"name":"echo","fields":["description"]}]' /var/lib/worklane-mcp-ci/state/blocked.json
          sudo rm -f /etc/kit-rugpull
          sudo rm -rf "$cc" "$h"
      - name: "MCP broker (#551): its unit runs with ProtectControlGroups (the cgroup tree read-only, in the broker and in a server's sandbox) and still starts servers; a server inside it can't write /proc/sys or the cgroup tree; what bubblewrap says under ProtectKernelTunables"
        run: bash scripts/ci/mcp-broker-kernel.sh ci
      - name: "a full disk under ci's real coordinator unit: it stays up (same PID, no restart), raises disk_full, keeps its events and writes them in order once there is room"
        run: sudo bash scripts/ci/disk-full-coordinator.sh ci
      - name: "instance-remove (v0.5.1): delta has a record in every root file that keys instances, beside ci's; refused, changing nothing, while delta's coordinator runs"
        run: |
          hub=/etc/systemd/system/worklane-dashboard-hub.service
          id="$(sed -n 's/^ExecStart=.* --client-id \([^ ]*\).*$/\1/p' "$hub")"; url="$(sed -n 's/^ExecStart=.* --public-url \([^ ]*\).*$/\1/p' "$hub")"
          # The hub serves both (the Siri step left it serving ci alone), with its Siri gateway as it was.
          sudo bash scripts/setup/dashboards.sh --client-id "$id" --public-url "$url" --siri ci delta > "$F/rm-hub0.log"
          grep -q -- '--hub ci=.*,delta=' "$hub" && grep -q -- ' --siri-port 4397' "$hub"
          # The machine helper's rule names delta, beside the others; what it should name without it.
          helper_users() { sudo sed -n 's/^\(wl-[-a-z0-9, ]*\) ALL=(root) NOPASSWD: WORKLANE_MACHINE$/\1/p' /etc/sudoers.d/worklane-machine; }
          helper_users | tr ',' '\n' | sed 's/^ *//' | grep -qx wl-delta
          keep="$(helper_users | tr ',' '\n' | sed 's/^ *//' | grep -vx wl-delta | paste -sd, - | sed 's/,/, /g')"
          [ -n "$keep" ] && echo "RM_HELPER=$keep" >> "$GITHUB_ENV"
          echo "RM_HOMES=$(getent passwd wl-delta | cut -d: -f6) $(getent passwd wl-delta-agent | cut -d: -f6)" >> "$GITHUB_ENV"
          # A record for each of delta and ci in every shared root file, in the file's own form.
          printf '{\n  "version": 1,\n  "max_minutes": 20,\n  "instances": {\n    "ci": { "devices": [0] },\n    "delta": { "devices": [1] }\n  }\n}\n' | sudo tee /etc/worklane/testrun-gpu.json >/dev/null
          printf '{\n  "version": 1,\n  "instances": {\n    "ci": { "tiers": ["e2e"] },\n    "delta": { "tiers": ["e2e", "setup"] }\n  }\n}\n' | sudo tee /etc/worklane/testrun-network.json >/dev/null
          sudo node -e '
            const fs = require("fs");
            const rw = (f, edit, empty) => { let j; try { j = JSON.parse(fs.readFileSync(f, "utf8")); } catch { j = empty; } edit(j); const st = fs.existsSync(f) ? fs.statSync(f) : null; fs.writeFileSync(f + ".ci", JSON.stringify(j, null, 2) + "\n"); if (st) { fs.chownSync(f + ".ci", st.uid, st.gid); fs.chmodSync(f + ".ci", st.mode & 0o7777); } fs.renameSync(f + ".ci", f); };
            const rec = (instance, user) => ({ instance, kind: "agent", user, logged_in: true, api_ok: true });
            rw("/var/lib/worklane/claude-account/profiles.json", (p) => {
              p.version = 1; p.profiles ||= {}; p.active ||= {}; p.failover ||= {}; p.failover.instances ||= {};
              p.profiles["ci-shared"] = { kind: "token", added_at: "2026-10-15T00:00:00Z", staged: false, users: { "wl-ci-agent": rec("ci", "wl-ci-agent"), "wl-delta-agent": rec("delta", "wl-delta-agent") } };
              p.profiles["ci-delta-only"] = { kind: "token", added_at: "2026-10-15T00:00:00Z", staged: true, instance: "delta", users: { "wl-delta-agent": rec("delta", "wl-delta-agent") } };
              p.active.ci = { profile: "ci-shared", since: "2026-10-15T00:00:00Z" }; p.active.delta = { profile: "ci-shared", since: "2026-10-15T00:00:00Z" };
              p.failover.instances.ci = { order: ["default", "ci-shared"], back: true }; p.failover.instances.delta = { order: ["default", "ci-shared"], back: false };
            }, {});
            rw("/etc/worklane/updates.json", (u) => { u.canary = { instance: "delta", repo: "example/alpha", time_limit_minutes: 30 }; }, {});
            rw("/var/lib/worklane/agent-slots/incidents.json", (j) => {
              j.incidents ||= []; j.posts ||= [];
              const inc = (id, instance, key) => ({ id, kind: "unit_down", key, instance, severity: "red", title: "A service is down", detail: "ci", fix: "ci", tried: [], since: "2026-10-15T00:00:00Z", lastSeen: "2026-10-15T00:00:00Z", resolvedAt: null, posted: {} });
              j.incidents.push(inc("cidelta1", "delta", "worklane-delta.service"), inc("ciciok01", "ci", "worklane-ci.service"));
            }, {});
            rw("/var/lib/worklane/pending-signers.json", (j) => { j.pending ||= []; j.pending.push({ principal: "delta@example.com", key: "AAAAC3NzaC1lZDI1NTE5AAAAIDELTA", by: "wl-delta", instance: "delta", at: new Date().toISOString() }); }, {});
          '
          printf 'ci\ndelta\n' | sudo tee -a /var/lib/worklane/claude-account/paused >/dev/null
          for n in ci delta; do printf '{"instance":"%s","pid":999999,"places":[]}\n' "$n" | sudo tee "/var/lib/worklane/agent-slots/discord-claim-$n.json" >/dev/null; done
          sudo install -d -m 0755 /var/lib/worklane/init
          printf '{"version":1,"mode":"server","instance":"delta"}\n' | sudo install -m 0640 -g wl-delta /dev/stdin /var/lib/worklane/init/delta.json
          sudo jq -e '[.users[] | select(.instance=="delta")] | length > 0' /var/lib/worklane/claude-account/status.json
          # delta's MCP broker (mcp-broker.sh: its user, socket groups and unit) and plugin records beside ci's.
          sudo bash scripts/setup/mcp-broker.sh delta > "$F/rm-mcp.log" 2>&1 || { tail -n 30 "$F/rm-mcp.log"; exit 1; }
          bu="worklane-mcp@$(echo delta).service"; systemctl is-active "$bu"
          for n in ci delta; do
            printf '{"version":1,"plugins":{}}\n' | sudo install -D -m 0644 /dev/stdin "/etc/worklane/plugins/$n.json"
            sudo install -d -m 0755 "/var/lib/worklane/plugins/store/$n/kit" "/var/lib/worklane/plugins/previews/$n/kit"
            printf '{"id":"kit","state":"done"}\n' | sudo install -D -m 0644 /dev/stdin "/var/lib/worklane/plugins/fetch-status/$n.json"
          done
          printf '{"version":1,"entries":[{"instance":"ci","id":"kit","roles":["worker"],"digest":"sha256:%064d","staged_at":"2026-10-16T00:00:00Z"},{"instance":"delta","id":"kit","roles":["worker"],"digest":"sha256:%064d","staged_at":"2026-10-16T00:00:00Z"}]}\n' 1 2 | sudo install -D -m 0644 /dev/stdin /var/lib/worklane/plugins/pending.json
          # A Siri device token for delta, made the engine's way, as its coordinator.
          dstate="$(getent passwd wl-delta | cut -d: -f6)/.local/state/worklane/instances/delta/state"
          (cd / && sudo -u wl-delta node --input-type=module -e 'const m = await import("/opt/worklane/current/dist/src/siri/tokens.js"); m.createDevice({ stateDir: process.argv[1], instance: "delta", name: "delta phone", by: "ci-owner" });' "$dstate")
          # What every shared file holds for ci, to compare after.
          ci_view() {
            sudo jq -c '.instances.ci' /etc/worklane/testrun-gpu.json
            sudo jq -c '.instances.ci' /etc/worklane/testrun-network.json
            sudo jq -c '[.active.ci, .failover.instances.ci, .profiles["ci-shared"].users["wl-ci-agent"]]' /var/lib/worklane/claude-account/profiles.json
            sudo jq -c '[.users[] | select(.instance=="ci")]' /var/lib/worklane/claude-account/status.json
            # ci's own watchdog may resolve it meanwhile: the record itself, never touched by delta's removal.
            sudo jq -c '[.incidents[] | select(.id=="ciciok01") | {id, kind, key, instance}]' /var/lib/worklane/agent-slots/incidents.json
            sudo jq -c '[.pending[] | select(.instance!="delta")]' /var/lib/worklane/pending-signers.json
            sudo grep -cx ci /var/lib/worklane/claude-account/paused
            sudo cat /var/lib/worklane/agent-slots/discord-claim-ci.json
            # The incident store's owner is whichever coordinator wrote it last: its group and mode only, the mode's
            # group write masked (delta's last write loses it in the removal, #555; the next coordinator's write, a
            # copy renamed over it, is 0660): 640 and 660 both print 6x0, any other mode as it is.
            sudo stat -c '%G %a %n' /var/lib/worklane/agent-slots/incidents.json | sed -E 's/^(\S+) 6[46]0 /\1 6x0 /'
            sudo stat -c '%U:%G %a %n' /etc/worklane/testrun-gpu.json /var/lib/worklane/claude-account/profiles.json /etc/worklane/updates.json
            sudo stat -c '%U:%G %a %n' "$(getent passwd wl-ci | cut -d: -f6)" "$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci" /srv/worklane/ci
            id wl-ci; id wl-ci-agent; sudo cat /etc/sudoers.d/worklane-ci
            sudo cat /etc/worklane/plugins/ci.json /var/lib/worklane/plugins/fetch-status/ci.json; sudo ls -d /var/lib/worklane/plugins/store/ci/kit /var/lib/worklane/plugins/previews/ci/kit
            sudo jq -c '[.entries[] | select(.instance=="ci")]' /var/lib/worklane/plugins/pending.json
          }
          ci_view > "$F/rm-ci-before.txt"
          # delta's coordinator runs: refused, and nothing changes.
          systemctl is-active worklane-delta.service
          touch "$F/rm-mark"; sleep 1
          set +e; sudo bash scripts/setup/instance-remove.sh delta --yes > "$F/rm0.out" 2> "$F/rm0.err"; rc=$?; set -e
          cat "$F/rm0.out" "$F/rm0.err"
          [ "$rc" = 1 ] && grep -q 'refused: delta has work in flight; nothing changed' "$F/rm0.err" && grep -q 'worklane-delta.service, is active' "$F/rm0.err"
          id wl-delta && id wl-delta-agent && sudo test -d /srv/worklane/delta && sudo test -f /etc/sudoers.d/worklane-delta
          if sudo test -e /var/lib/worklane/removed; then echo "the refused run exported or removed something" >&2; exit 1; fi
          # The slot directory itself is left out like its files: running coordinators take and drop their locks there.
          changed="$(sudo find /etc/worklane /etc/sudoers.d /etc/systemd/system /var/lib/worklane -xdev -newer "$F/rm-mark" ! -name '*.lock' ! -path '/var/lib/worklane/agent-slots' ! -path '/var/lib/worklane/agent-slots/*' ! -name 'machine-changes.jsonl' ! -name 'updates.jsonl' 2>/dev/null || true)"
          [ -z "$changed" ] || { echo "the refused run changed: $changed" >&2; exit 1; }
          echo "RM_ID=$id" >> "$GITHUB_ENV"; echo "RM_URL=$url" >> "$GITHUB_ENV"; echo "RM_D=delta" >> "$GITHUB_ENV"
      - name: "instance-remove: --print lists every item; a process of delta's users refuses it; no terminal and a wrong typed name change nothing"
        run: |
          # Its dashboard running refuses it too: both stopped first, as the refusal says.
          set +e; sudo systemctl stop worklane-delta.service; sudo bash scripts/setup/instance-remove.sh delta --yes > "$F/rm0b.out" 2> "$F/rm0b.err"; rc=$?; set -e
          [ "$rc" = 1 ] && grep -q 'worklane-dashboard-delta.service, is active' "$F/rm0b.err"
          sudo systemctl stop worklane-dashboard-delta.service
          sudo bash scripts/setup/instance-remove.sh delta --print | tee "$F/rm-print.txt"
          for l in 'user     wl-delta ' 'user     wl-delta-agent ' 'group    wl-delta-work' 'unit     worklane-delta.service' 'unit     worklane-dashboard-delta.service' 'sudoers  worklane-delta' 'path     /srv/worklane/delta' 'path     /var/lib/worklane/init/delta.json' 'path     /var/lib/worklane/agent-slots/discord-claim-delta.json' 'run      testrun-gpu.sh disable delta' 'record   claude-profiles in ' 'record   claude-status in ' 'record   claude-paused in ' 'record   canary in ' 'record   incidents in ' 'record   pending-signers in ' 'record   gpu in ' 'record   testrun-net in ' 'run      testrun-network.sh disable delta' 'record   plugin-pending in ' "unit     worklane-mcp@${RM_D}.service" 'user     wl-delta-mcp ' 'group    wl-delta-mcpc' 'group    wl-delta-mcpctl' 'path     /etc/worklane/plugins/delta.json' 'path     /var/lib/worklane/plugins/store/delta' 'path     /var/lib/worklane-mcp-delta' 'export   ' "the machine helper's rule, rewritten for: $(echo "$RM_HELPER" | sed -e 's/wl-//g' -e 's/, / /g') " 'the dashboard hub, rewritten to serve: ci' 'kept     its GitHub App and its repo'; do
            grep -qF -- "$l" "$F/rm-print.txt" || { echo "--print doesn't list: $l" >&2; exit 1; }
          done
          if grep -qE 'wl-ci|worklane-ci\.service|/srv/worklane/ci|record .*"instance":"ci"' "$F/rm-print.txt"; then echo "--print lists ci's" >&2; exit 1; fi
          # A run in flight: a process as delta's agent user, outside any of delta's units.
          sudo -u wl-delta-agent setsid sleep 600 < /dev/null > /dev/null 2>&1 &
          for _ in $(seq 1 20); do pgrep -u wl-delta-agent -x sleep >/dev/null && break; sleep 0.5; done
          set +e; sudo bash scripts/setup/instance-remove.sh delta --yes > "$F/rm1.out" 2> "$F/rm1.err"; rc=$?; set -e
          cat "$F/rm1.err"
          [ "$rc" = 1 ] && grep -q '(sleep) as wl-delta-agent' "$F/rm1.err"
          sudo pkill -u wl-delta-agent -x sleep; for _ in $(seq 1 20); do pgrep -u wl-delta-agent >/dev/null || break; sleep 0.5; done
          # No terminal and no --yes: refused.
          set +e; sudo bash scripts/setup/instance-remove.sh delta < /dev/null > "$F/rm2.out" 2> "$F/rm2.err"; rc=$?; set -e
          [ "$rc" = 1 ] && grep -q 'asks for the instance.s name to be typed back' "$F/rm2.err"
          # A terminal, and a name that isn't delta's typed back: nothing changes.
          printf 'delt\n' | script -qec "sudo bash $GITHUB_WORKSPACE/scripts/setup/instance-remove.sh delta" /dev/null > "$F/rm3.out" 2>&1 || true
          cat "$F/rm3.out"
          grep -q 'not removed: nothing changed' "$F/rm3.out"
          id wl-delta && sudo test -d /srv/worklane/delta && sudo jq -e '.canary.instance=="delta"' /etc/worklane/updates.json
          if sudo test -e /var/lib/worklane/removed; then echo "a refused run exported something" >&2; exit 1; fi
      - name: "instance-remove: delta exported first (root's 0600), every item gone, ci's records, units, hub and helper rule as they were; delta's slot lock in agent-slots without group write, ci's untouched; a rerun finds nothing left"
        run: |
          # Planted before the removal: a setuid+setgid file of delta's under an engine path; links (in its home, and
          # under an engine path, the link itself delta's) at a file outside owned by nobody; a file of delta's outside.
          printf 'canary\n' | sudo install -o nobody -g nogroup -m 0640 /dev/stdin /etc/worklane-ci-canary
          sudo install -o wl-delta -g wl-delta -m 6755 /bin/true /var/lib/worklane/agent-slots/delta-suid
          sudo ln -sfn /etc/worklane-ci-canary "$(getent passwd wl-delta | cut -d: -f6)/canary-link"
          sudo ln -sfn /etc/worklane-ci-canary /var/lib/worklane/agent-slots/delta-link && sudo chown -h wl-delta /var/lib/worklane/agent-slots/delta-link
          sudo install -o wl-delta -g wl-delta -m 0600 /dev/null /var/tmp/delta-leftover
          delta_uid="$(id -u wl-delta)"
          # #555, in the shared group agent-slots: a stale slot lock of delta's (its holder's pid dead) and a directory
          # of delta's, both group-writable; and ci's own stale slot lock, which nothing may touch.
          S=/var/lib/worklane/agent-slots; dead="$(sh -c 'echo $$')"
          printf '{"pid":%s,"owner":"delta stale","acquiredAt":"2026-10-16T00:00:00Z"}' "$dead" | sudo install -o wl-delta -g agent-slots -m 0660 /dev/stdin "$S/agent-951.lock"
          sudo install -d -o wl-delta -g agent-slots -m 2770 "$S/delta-gwdir"
          printf '{"pid":%s,"owner":"ci stale","acquiredAt":"2026-10-16T00:00:00Z"}' "$dead" | sudo install -o wl-ci -g agent-slots -m 0660 /dev/stdin "$S/agent-950.lock"
          ci_lock="$(sudo stat -c '%U:%G %a' "$S/agent-950.lock") $(sudo sha256sum "$S/agent-950.lock" | cut -d' ' -f1)"
          # The removal holds the updater off for its whole run: while it waits for the typed name, the updater's own
          # quiet check says the machine is busy, and delta's coordinator stays stopped.
          (sleep 12; echo delta) | script -qec "sudo bash $GITHUB_WORKSPACE/scripts/setup/instance-remove.sh delta" /dev/null > "$F/rm4.out" 2>&1 &
          rmpid=$!
          for _ in $(seq 1 20); do sudo sh -c 'grep -lq "\"owner\":\"instance-remove delta\"" /var/lib/worklane/agent-slots/agent-9*.lock' 2>/dev/null && break; sleep 0.5; done
          q="$(sudo node -e 'process.stdout.write(JSON.stringify(require(process.argv[1]).updaterQuiet()))' "$GITHUB_WORKSPACE/scripts/setup/instance-records.cjs")"
          echo "the updater's quiet check during the removal: $q"
          jq -e '.quiet == false and .why == "an agent is running"' <<<"$q"
          if systemctl is-active -q worklane-delta.service; then echo "delta's coordinator started during the removal" >&2; exit 1; fi
          wait "$rmpid"
          cat "$F/rm4.out"
          grep -q 'removed delta\.' "$F/rm4.out"
          if sudo sh -c 'grep -lq "\"owner\":\"instance-remove delta\"" /var/lib/worklane/agent-slots/agent-9*.lock' 2>/dev/null; then echo "the updater hold is still there" >&2; exit 1; fi
          [ "$(sudo node -e 'process.stdout.write(String(require(process.argv[1]).updaterQuiet().quiet))' "$GITHUB_WORKSPACE/scripts/setup/instance-records.cjs")" = true ] || echo "note: the machine is busy for another reason now"
          # No process of delta's users was left before any was deleted, and what they owned in the engine's places is
          # root:root, setuid and setgid gone, links themselves never followed; the file outside is listed, untouched.
          grep -qF 'no process of wl-' "$F/rm4.out"
          [ "$(grep -n 'no process of wl-' "$F/rm4.out" | head -1 | cut -d: -f1)" -lt "$(grep -n 'removed user wl-delta' "$F/rm4.out" | head -1 | cut -d: -f1)" ]
          [ "$(sudo stat -c '%U:%G %a' /var/lib/worklane/agent-slots/delta-suid)" = "root:root 755" ]
          [ "$(sudo stat -c '%U:%G %a' /etc/worklane-ci-canary)" = "nobody:nogroup 640" ]
          # The link itself is root's now; its group, the slot directory's agent-slots (not delta's), is kept.
          [ "$(sudo stat -c '%U:%G' /var/lib/worklane/agent-slots/delta-link)" = "root:agent-slots" ]
          [ "$(sudo stat -c '%u' /var/tmp/delta-leftover)" = "$delta_uid" ]
          rc_="$(sudo sh -c 'ls -1 /var/lib/worklane/removed/delta-*.rechowned.txt')" && lo="$(sudo sh -c 'ls -1 /var/lib/worklane/removed/delta-*.left-owned.txt')"
          for f in "$rc_" "$lo"; do [ "$(sudo stat -c '%U:%G %a' "$f")" = "root:root 600" ]; done
          sudo grep -qx 'root:root 6755 -> 755 /var/lib/worklane/agent-slots/delta-suid' "$rc_"
          sudo grep -qx '/var/tmp/delta-leftover' "$lo"
          # #555: delta's slot lock in the shared group ends without group write, listed with its old and new mode;
          # its directory there keeps group write, listed with why; ci's slot lock is as it was, and not listed.
          sudo cat "$rc_"
          [ "$(sudo stat -c '%U:%G %a' "$S/agent-951.lock")" = "root:agent-slots 640" ]
          sudo grep -qx "root:agent-slots 660 -> 640 $S/agent-951.lock" "$rc_"
          [ "$(sudo stat -c '%U:%G %a' "$S/delta-gwdir")" = "root:agent-slots 2770" ]
          sudo grep -q "^root:agent-slots 2770 -> 2770 $S/delta-gwdir (g+w kept: " "$rc_"
          [ "$(sudo stat -c '%U:%G %a' "$S/agent-950.lock") $(sudo sha256sum "$S/agent-950.lock" | cut -d' ' -f1)" = "$ci_lock" ]
          if sudo grep -q 'agent-950' "$rc_"; then echo "ci's slot lock was changed by delta's removal" >&2; exit 1; fi
          # The engine needs no group write on that file: ci's coordinator takes the stale lock over with the engine's
          # own tryLock (a copy linked into place, through the directory's group write), then lets it go.
