name: gitleaks
on:
  push:
  pull_request:
# As ci.yml: a new push to a PR cancels its run in progress; a push's runs (main's among them) are never cancelled.
concurrency:
  group: gitleaks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  scan:
    # A push to main runs on the self-hosted runner while vars.CI_SELF_HOSTED is 'on' (docs/ci-runners.md); everything
    # else, pull requests and forks included, on GitHub's. Same check name either way. test/self-hosted-guard.test.ts
    # keeps the routed jobs to the ones that need no root, Chrome, Docker, loopback, gh, jq or secrets.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-main"]') || 'ubuntu-latest' }}
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI is MIT; we run the pinned, checksum-verified binary
      # directly rather than the gitleaks-action wrapper.
      - name: install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: scan full history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
