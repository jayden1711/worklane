name: ci
# The fast checks, on every pull request and every push to main: test, desktop, agentshield, push-gate, denylist,
# and dco on PRs (scan is gitleaks.yml's). They are what the main ruleset requires. The slow checks (the bootstrap
# on each OS, the real systemd and real users jobs) are ci-slow.yml's: on main they run in batches, on main's newest
# commit, one batch at a time (ci-batch.yml), and on a PR only when it touches what they exercise. The engine
# updater requires both sets green on the exact main commit it installs (UPDATE_DEFAULT_CHECKS in
# scripts/setup/lib.sh; test/update-checks.test.ts keeps them in step), so it installs only batched commits.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
# A new push to a PR cancels that PR's run in progress. Main's runs never share a group (one per run), so none is
# ever cancelled, or replaced while pending: the updater refuses a main commit with a cancelled check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # The unit tests (npm test: build, then dist/test/**/*.test.js) in 4 shards per Node version, split by
  # scripts/ci/shard.mjs on the measured per-file durations in test/timings.json. Each shard builds for itself
  # (cheaper on the wall clock than one build job the shards wait for), the dashboard UI too, before its tests.
  # Shard 4 also runs the typecheck: shard 1 gets the longest file, so 4 has room. The checks the ruleset,
  # .worklane/config.yaml and the updater require are the summary jobs below, test (ubuntu-latest, 22) and (ubuntu-latest, 24), green only
  # when all 4 of their shards are; the shards themselves are required by nothing (test/update-checks.test.ts).
  # On a pull request the shards run only the test files its change can affect (scripts/ci/affected.mjs: the
  # import graph; the whole suite when it can't tell, or a shared or config file changed), split the same way; a
  # shard with none of them passes. A push to main, and a PR labelled full-ci, run every file (docs/test-runs.md,
  # "Test selection").
  # Ubuntu only (the owner's choice): the OS adapters stay in place, but only Linux runs in CI.
  test-shard-22:
    name: test shard ${{ matrix.shard }}/4 (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22']
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps: &test-shard-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit: HEAD^1 is the base it merges into, what affected.mjs diffs.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Before any file the merge hold doesn't cover runs (#746 rounds 20 and 21): install with no package scripts
      # (prepare, postinstall); check the pinned packages' lockfile entries and installed files before either runs;
      # build with the locked typescript straight from node_modules (no npm script); run the desktop backstop alone,
      # then the other lint tests. Only after that: npm run build (what prepare did), the dashboard UI, machine.sh and
      # this shard's tests. test/desktop-removed.test.ts holds these first steps and their order.
      - run: npm ci --ignore-scripts
      - name: the pinned packages, before any of them runs
        run: node scripts/ci/check-pins.mjs
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: the desktop backstop, before anything unheld runs
        run: node --import ./dist/test/isolate.js --test dist/test/desktop-removed.test.js
      - name: the other lint tests, before anything unheld runs
        shell: bash
        run: |
          mapfile -t files < <(grep -lx '// lint-test' test/*.test.ts | grep -vx 'test/desktop-removed.test.ts' | sed -e 's#^test/#dist/test/#' -e 's#\.ts$#.js#')
          [ "${#files[@]}" -gt 0 ] || { echo "no lint tests found" >&2; exit 1; }
          node --import ./dist/test/isolate.js --test "${files[@]}"
      - name: install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$RUNNER_OS" in
            Linux)   f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz";   sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            macOS)   f="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"; sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            Windows) f="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip";     sum=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${sum}  ${f}" | sha256sum -c -
          case "$f" in *.zip) unzip -q "$f" gitleaks.exe ;; *) tar -xzf "$f" gitleaks ;; esac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
        if: matrix.shard == 4
      - run: npm run build
      # The comment policy (#330) on the comments this PR adds, with the base's config: a no-op printing "off" until
      # .worklane/config.yaml sets comment_policy.enabled. Shard 4 only, beside the typecheck; HEAD^1 is the base.
      - name: comment policy (new comments in this PR)
        if: matrix.shard == 4 && github.event_name == 'pull_request'
        run: node scripts/check-comments.mjs --base HEAD^1 --head HEAD
      # Before the tests, in every shard: the web-UI tests (real Chrome against dist/web) run only on a built UI,
      # and CI_REQUIRE_WEB=1 makes a missing UI or Chrome fail them instead of skipping (test/browser-helpers.ts).
      # About a second (vite), cheaper than one build shared as an artifact.
      - name: build the dashboard UI
        run: npm run build:web
      # A project command run as another user starts in bubblewrap (#713), installed as every machine installs it
      # (machine.sh, as ci-slow's jobs do). The tests that run one for real (separate-users' git check as nobody, the
      # isolation tests) then run on every PR; PROJECT_SANDBOX_REQUIRED=1 below makes a missing sandbox fail them.
      # The read-only agent home's pins and way tests (#798) stand in for root and a second user in a user namespace
      # (`unshare --user --map-root-user --map-auto --mount`, nothing real touched). This runner gets what that needs:
      # subordinate ids for its user, and an AppArmor rule that lets /usr/bin/unshare (only) create user namespaces;
      # the machine-wide restriction stays on. PROJECT_SANDBOX_REQUIRED=1 makes those tests fail here, never skip.
      - name: bubblewrap (machine.sh), startable by another user; user namespaces for the stand-in tests
        shell: bash
        run: |
          sudo apt-get update -q && sudo bash scripts/setup/machine.sh
          sudo -n -u nobody /usr/bin/bwrap --dev-bind / / --unshare-user --unshare-pid --die-with-parent --proc /proc -- /bin/sh -c :
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends uidmap
          me="$(id -un)"
          grep -q "^$me:" /etc/subuid || sudo usermod --add-subuids 1000000-1065535 "$me"
          grep -q "^$me:" /etc/subgid || sudo usermod --add-subgids 1000000-1065535 "$me"
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile ci-unshare /usr/bin/unshare flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/ci-unshare > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/ci-unshare
          fi
          unshare --user --map-root-user --map-auto --mount /bin/sh -c 'mount -t tmpfs none /mnt && echo "user namespace: ok"'
      - name: this shard's tests
        shell: bash
        env:
          PROJECT_SANDBOX_REQUIRED: '1'
          CI_REQUIRE_WEB: '1'
          SHARD: ${{ matrix.shard }}
          EVENT: ${{ github.event_name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          # The full-ci label runs everything here too.
          if [ "$FULL_CI" = true ]; then EVENT=full-ci; fi
          node scripts/ci/affected.mjs --event "$EVENT" --base HEAD^1 --explain > "$RUNNER_TEMP/selected"
          node scripts/ci/shard.mjs --plan 4 --only "$RUNNER_TEMP/selected"
          mapfile -t files < <(node scripts/ci/shard.mjs "$SHARD/4" --only "$RUNNER_TEMP/selected")
          if [ "${#files[@]}" -eq 0 ]; then
            [ "$EVENT" = pull_request ] || { echo "shard $SHARD/4 has no test files" >&2; exit 1; }
            echo "shard $SHARD/4: none of the selected test files"
            exit 0
          fi
          node --import ./dist/test/isolate.js --test "${files[@]}"

  test-shard-24:
    name: test shard ${{ matrix.shard }}/4 (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['24']
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps: *test-shard-steps

  # The required checks, under the names they have always had: green only when every shard of that Node version
  # succeeded. always(): a failed, cancelled or skipped shard makes this job fail, never skip (a skipped required
  # check would count as passing).
  test-22:
    name: test (ubuntu-latest, 22)
    needs: test-shard-22
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: all 4 shards succeeded
        env:
          RESULT: ${{ needs.test-shard-22.result }}
        run: |
          echo "test shard 1..4/4 (ubuntu-latest, 22): $RESULT"
          [ "$RESULT" = success ]

  test-24:
    name: test (ubuntu-latest, 24)
    needs: test-shard-24
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: all 4 shards succeeded
        env:
          RESULT: ${{ needs.test-shard-24.result }}
        run: |
          echo "test shard 1..4/4 (ubuntu-latest, 24): $RESULT"
          [ "$RESULT" = success ]

  # Kept for one release after #744 removed what it tested, as a job that only succeeds: same job id, same check
  # name. An install whose updater is v0.5.2's or older requires a successful "desktop" run on every commit it
  # installs (it has no retired-check rule), and so does the release channel's check of a release's base commit.
  # With no run it would wait forever. No `if`, `needs` or `name`: a skipped run is refused by that updater, and
  # the check must keep the job id as its name. The release after the one that ships this removes the job and the
  # check together (test/desktop-removed.test.ts holds this shape).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  agentshield:
    # Scan the hooks, permissions and settings a fresh install generates.
    # A push to main runs on the self-hosted runner while vars.CI_SELF_HOSTED is 'on' (docs/ci-runners.md); everything
    # else, pull requests and forks included, on GitHub's. Same check name either way. test/self-hosted-guard.test.ts
    # keeps the routed jobs to the ones that need no root, Chrome, Docker, loopback, gh, jq or secrets.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-main"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: |
          cp -r examples/basic "$RUNNER_TEMP/example" && git -C "$RUNNER_TEMP/example" init -q
          node dist/src/cli.js install --root "$RUNNER_TEMP/example"
          node dist/src/cli.js doctor --root "$RUNNER_TEMP/example" --agentshield --json > doctor.json || true
          node -e 'const c=require("./doctor.json").find(x=>x.name==="agentshield");console.log(c.level, c.detail);process.exit(c.level==="fail"?1:0)'

  push-gate:
    # The same gate the pre-push hook runs, over exactly the commits this event brings.
    # A push to main runs on the self-hosted runner while vars.CI_SELF_HOSTED is 'on' (docs/ci-runners.md); everything
    # else, pull requests and forks included, on GitHub's. Same check name either way. test/self-hosted-guard.test.ts
    # keeps the routed jobs to the ones that need no root, Chrome, Docker, loopback, gh, jq or secrets.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-main"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gate the commits
        # A PR's own commits only: merge-base(base, head)..head, the PR head rather than the test merge,
        # so commits already on main are not rescanned. A push scans what it brought, as before.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            BASE="$(git merge-base "$PR_BASE" "$PR_HEAD")"
            node scripts/push-gate.mjs --range "${BASE}..${PR_HEAD}"
          else
            node scripts/push-gate.mjs --range "${BEFORE}..${GITHUB_SHA}"
          fi

  denylist:
    # No project-specific details in the engine repo (see scripts/check-denylist.mjs).
    # A push to main runs on the self-hosted runner while vars.CI_SELF_HOSTED is 'on' (docs/ci-runners.md); everything
    # else, pull requests and forks included, on GitHub's. Same check name either way. test/self-hosted-guard.test.ts
    # keeps the routed jobs to the ones that need no root, Chrome, Docker, loopback, gh, jq or secrets.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-main"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-denylist.mjs

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-dco.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
