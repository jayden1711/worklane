name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # The core must work on all three OSes (see docs/design.md, "OS adapters").
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$RUNNER_OS" in
            Linux)   f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz";   sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            macOS)   f="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"; sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            Windows) f="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip";     sum=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${sum}  ${f}" | sha256sum -c -
          case "$f" in *.zip) unzip -q "$f" gitleaks.exe ;; *) tar -xzf "$f" gitleaks ;; esac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm test
      - name: build the dashboard UI
        if: runner.os == 'Linux'
        run: npm run build:web

  desktop:
    # The optional desktop window (desktop/, Tauri): its URL and navigation guards, against the locked crates.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --manifest-path desktop/Cargo.toml

  agentshield:
    # Scan the hooks, permissions and settings a fresh install generates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: |
          cp -r examples/basic "$RUNNER_TEMP/example" && git -C "$RUNNER_TEMP/example" init -q
          node dist/src/cli.js install --root "$RUNNER_TEMP/example"
          node dist/src/cli.js doctor --root "$RUNNER_TEMP/example" --agentshield --json > doctor.json || true
          node -e 'const c=require("./doctor.json").find(x=>x.name==="agentshield");console.log(c.level, c.detail);process.exit(c.level==="fail"?1:0)'

  push-gate:
    # The same gate the pre-push hook runs, over exactly the commits this event brings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gate the commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/push-gate.mjs --range "${BASE}..${GITHUB_SHA}"

  hardened-macos:
    # The macOS hardened setup run for real, with sudo, on a disposable runner: machine, two instances,
    # the root helper, a launchd daemon as the coordinator user, then the isolation checks.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: machine and two instances
        run: |
          sudo bash scripts/setup/macos/machine.sh
          sudo bash scripts/setup/macos/instance.sh ci
          sudo bash scripts/setup/macos/instance.sh ci2
          # Again: every step is safe to repeat.
          sudo bash scripts/setup/macos/instance.sh ci
          id wl-ci; id wl-ci-agent
      - name: the root helper and its exact sudoers commands
        run: |
          sudo bash scripts/setup/machine-helper.sh ci ci2
          sudo -u wl-ci sudo -n /usr/local/libexec/worklane-machine set-slots 3
          grep -q '"max_agents":3' /etc/worklane/slots.json
          if sudo -u wl-ci sudo -n /usr/local/libexec/worklane-machine set-slots 17; then echo "set-slots 17 was allowed" >&2; exit 1; fi
          if sudo -u wl-ci-agent sudo -n /usr/local/libexec/worklane-machine set-slots 3; then echo "an agent changed the cap" >&2; exit 1; fi
          tail -1 /var/lib/worklane/machine-changes.jsonl
      - name: a launchd daemon as the coordinator user, with its limits
        run: |
          bash scripts/setup/macos/service.sh ci --print | sed 1d > ci.plist
          plutil -lint ci.plist
          # A stand-in program: the real one needs the engine installed (engine.sh).
          plutil -replace ProgramArguments -json '["/bin/sleep","600"]' ci.plist
          sudo install -d -o root -g wheel -m 0755 /var/log/worklane /var/tmp/worklane
          sudo install -o wl-ci -g wl-ci -m 0640 /dev/null /var/log/worklane/ci.log
          sudo install -d -o wl-ci -g wl-ci-work -m 1770 /var/tmp/worklane/ci
          sudo install -o root -g wheel -m 0644 ci.plist /Library/LaunchDaemons/com.worklane.coordinator.ci.plist
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.worklane.coordinator.ci.plist
          sleep 3
          sudo launchctl print system/com.worklane.coordinator.ci | tee daemon.txt | sed -n '/state = /p;/pid = /p'
          grep -q 'state = running' daemon.txt
          pid="$(sed -n 's/^[[:space:]]*pid = //p' daemon.txt | head -1)"
          ps -o user=,nice= -p "$pid" | tee ps.txt
          grep -qE '^wl-ci +10$' ps.txt
      - name: stand-in secrets where engine.sh and credentials.sh put them
        run: |
          sudo -H -u wl-ci bash -c 'd="$HOME/Library/Application Support/worklane/instances/ci"; umask 077; mkdir -p "$d"; echo "stand-in: not a secret" > "$d/credentials.yaml"'
      - name: isolation checks
        run: sudo bash scripts/setup/macos/check.sh ci ci2
      - name: the daemon stops
        if: always()
        run: sudo launchctl bootout system/com.worklane.coordinator.ci || true

  denylist:
    # No project-specific details in the engine repo (see scripts/check-denylist.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-denylist.mjs

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-dco.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
