name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # The core must work on all three OSes (see docs/design.md, "OS adapters").
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$RUNNER_OS" in
            Linux)   f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz";   sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            macOS)   f="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"; sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            Windows) f="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip";     sum=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${sum}  ${f}" | sha256sum -c -
          case "$f" in *.zip) unzip -q "$f" gitleaks.exe ;; *) tar -xzf "$f" gitleaks ;; esac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm test
      - name: build the dashboard UI
        if: runner.os == 'Linux'
        run: npm run build:web

  desktop:
    # The optional desktop window (desktop/, Tauri): its URL and navigation guards, against the locked crates.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked --manifest-path desktop/Cargo.toml

  bootstrap:
    # A fresh install, end to end (scripts/bootstrap.sh): on a clean runner, this commit's engine packed as a
    # release ships it, set up in examples/basic, ending at doctor green; run twice, the second changing nothing;
    # then the demo from the installed package. No GitHub: a stand-in gh that refuses, and no token.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pack this commit's engine (dist/ and the web UI built, as in a release)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build && npm run build:web
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          ls "$RUNNER_TEMP"/*.tgz
      - name: the Docker image (the same bootstrap, with the pinned release engine)
        if: runner.os == 'Linux'
        run: |
          docker build -t worklane-trial .
          docker run --rm worklane-trial worklane --version
          docker run --rm worklane-trial sh -c 'gitleaks version && claude --version && node --version'
      - name: no GitHub from here on
        run: |
          mkdir -p "$RUNNER_TEMP/fake"
          printf '#!/bin/sh\necho "gh: GitHub is not reachable in this job" >&2\nexit 1\n' > "$RUNNER_TEMP/fake/gh"
          chmod +x "$RUNNER_TEMP/fake/gh"
          echo "$RUNNER_TEMP/fake" >> "$GITHUB_PATH"
      - name: bootstrap, twice
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          cp -r examples/basic "$RUNNER_TEMP/example" && git -C "$RUNNER_TEMP/example" init -q
          tgz="$(ls "$RUNNER_TEMP"/*.tgz)"
          bash scripts/bootstrap.sh --dry-run --engine "$tgz" "$RUNNER_TEMP/example"
          bash scripts/bootstrap.sh --engine "$tgz" "$RUNNER_TEMP/example"
          bash scripts/bootstrap.sh --engine "$tgz" "$RUNNER_TEMP/example" | tee "$RUNNER_TEMP/second.log"
          # The second run installs nothing and keeps the repo's config.
          if grep -E 'added [0-9]+ package|would download' "$RUNNER_TEMP/second.log"; then echo "the second run installed something" >&2; exit 1; fi
          grep -q 'kept .worklane/' "$RUNNER_TEMP/second.log"
      - name: the demo, from the installed package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          worklane --version
          worklane demo "$RUNNER_TEMP/demo"

  windows-host:
    # Windows hardened mode's Windows side (scripts/setup/windows/), as far as a hosted runner can go: it has no nested
    # virtualization, so no WSL2. The installer's dry run and pin check under both Windows PowerShell 5.1 and
    # PowerShell 7, and the Windows doctor and the engine's doctor in native single-user mode.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: installer dry run, Windows PowerShell 5.1
        shell: powershell
        run: |
          $out = & .\scripts\setup\windows\install.ps1 -Instance demo -Repo owner/repo -DryRun | Out-String
          $out
          if ($out -notmatch 'would run: wsl\.exe --import Worklane') { throw 'no import step in the plan' }
      - name: installer dry run, PowerShell 7
        shell: pwsh
        run: |
          $out = & ./scripts/setup/windows/install.ps1 -Instance demo -Repo owner/repo -DryRun | Out-String
          if ($out -notmatch "would register scheduled task 'Worklane WSL keep-alive'") { throw 'no keep-alive in the plan' }
      - name: a distro image that isn't the pinned one is refused
        shell: powershell
        run: |
          # The refusal is written to stderr, which this shell would otherwise turn into a stopping error.
          $ErrorActionPreference = 'Continue'
          Set-Content -Path "$env:RUNNER_TEMP\fake.wsl" -Value 'not the image'
          & powershell -NoProfile -File .\scripts\setup\windows\install.ps1 -Instance demo -Repo owner/repo -DryRun -DistroFile "$env:RUNNER_TEMP\fake.wsl" *> "$env:RUNNER_TEMP\pin.log"
          if ($LASTEXITCODE -eq 0) { throw 'a mismatching image was accepted' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\pin.log" -Pattern 'checksum mismatch' -Quiet)) { Get-Content "$env:RUNNER_TEMP\pin.log"; throw 'no checksum message' }
          $global:LASTEXITCODE = 0
      - name: single-user mode, the Windows doctor and the engine's
        shell: powershell
        run: |
          .\scripts\setup\windows\doctor.ps1
          if ($LASTEXITCODE -ne 0) { throw 'the Windows doctor failed on a single-user host' }
          node dist/src/cli.js doctor --root examples/basic --json | Out-File "$env:RUNNER_TEMP\doctor.json"
          $os = (Get-Content -Raw "$env:RUNNER_TEMP\doctor.json" | ConvertFrom-Json) | Where-Object name -EQ 'os'
          $os.detail
          if ($os.detail -notmatch '^Windows host, native single-user') { throw 'the engine doctor did not report single-user mode' }
          # Only the os line is checked here (the example repo has no hooks installed, so doctor itself exits 1).
          $global:LASTEXITCODE = 0

  wsl2-isolation:
    # WSL2 hardened mode for real: needs a self-hosted Windows runner with WSL2 and the Worklane distro installed by
    # scripts/setup/windows/install.ps1 (and an instance, e.g. "ci"). Off until the owner registers one with the labels
    # self-hosted, windows, wsl2 and sets the repo variable WSL2_RUNNER=true.
    if: vars.WSL2_RUNNER == 'true'
    runs-on: [self-hosted, windows, wsl2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the Windows doctor, hardened required
        shell: powershell
        run: |
          .\scripts\setup\windows\doctor.ps1 -Hardened -Instance ${{ vars.WSL2_INSTANCE || 'ci' }}
          if ($LASTEXITCODE -ne 0) { throw 'not hardened' }
      - name: inside the distro, nothing reaches Windows
        shell: powershell
        run: |
          $env:WSL_UTF8 = '1'
          Get-Content -Raw scripts\setup\windows\isolation-check.sh | wsl.exe -d Worklane -u root -- bash -c "tr -d '\r' > /tmp/isolation-check.sh && bash /tmp/isolation-check.sh wl-${{ vars.WSL2_INSTANCE || 'ci' }}-work"
          if ($LASTEXITCODE -ne 0) { throw 'the distro is not isolated from Windows' }

  agentshield:
    # Scan the hooks, permissions and settings a fresh install generates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: |
          cp -r examples/basic "$RUNNER_TEMP/example" && git -C "$RUNNER_TEMP/example" init -q
          node dist/src/cli.js install --root "$RUNNER_TEMP/example"
          node dist/src/cli.js doctor --root "$RUNNER_TEMP/example" --agentshield --json > doctor.json || true
          node -e 'const c=require("./doctor.json").find(x=>x.name==="agentshield");console.log(c.level, c.detail);process.exit(c.level==="fail"?1:0)'

  push-gate:
    # The same gate the pre-push hook runs, over exactly the commits this event brings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gate the commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/push-gate.mjs --range "${BASE}..${GITHUB_SHA}"

  denylist:
    # No project-specific details in the engine repo (see scripts/check-denylist.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-denylist.mjs

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-dco.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
