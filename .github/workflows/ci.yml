name: ci
# The fast checks, on every pull request and every push to main: test, desktop, agentshield, push-gate, denylist,
# and dco on PRs (scan is gitleaks.yml's). They are what the main ruleset requires. The slow checks (the bootstrap
# on each OS, the real systemd and real users jobs) are ci-slow.yml's: on main they run in batches, on main's newest
# commit, one batch at a time (ci-batch.yml), and on a PR only when it touches what they exercise. The engine
# updater requires both sets green on the exact main commit it installs (UPDATE_DEFAULT_CHECKS in
# scripts/setup/lib.sh; test/update-checks.test.ts keeps them in step), so it installs only batched commits.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
# A new push to a PR cancels that PR's run in progress. Main's runs never share a group (one per run), so none is
# ever cancelled, or replaced while pending: the updater refuses a main commit with a cancelled check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # The unit tests (npm test: build, then dist/test/**/*.test.js) in 4 shards per Node version, split by
  # scripts/ci/shard.mjs on the measured per-file durations in test/timings.json. Each shard builds for itself
  # (cheaper on the wall clock than one build job the shards wait for), the dashboard UI too, before its tests.
  # Shard 4 also runs the typecheck: shard 1 gets the longest file, so 4 has room. The checks the ruleset,
  # .worklane/config.yaml and the updater require are the summary jobs below, test (ubuntu-latest, 22) and (ubuntu-latest, 24), green only
  # when all 4 of their shards are; the shards themselves are required by nothing (test/update-checks.test.ts).
  # On a pull request the shards run only the test files its change can affect (scripts/ci/affected.mjs: the
  # import graph; the whole suite when it can't tell, or a shared or config file changed), split the same way; a
  # shard with none of them passes. A push to main, and a PR labelled full-ci, run every file (docs/test-runs.md,
  # "Test selection").
  # Ubuntu only (the owner's choice): the OS adapters stay in place, but only Linux runs in CI.
  test-shard-22:
    name: test shard ${{ matrix.shard }}/4 (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22']
        shard: [1, 2, 3, 4]
    # WHY: ubuntu-latest became ubuntu-26.04 (image 20261101), where visudo, nested user namespaces and git fetch
    # fixtures fail the suite; pinned to 24.04 until the suite is ported. matrix.os stays the check name's label.
    # On the self-hosted tests runner (docs/ci-runners.md, "The tests runner") while vars.CI_SELF_HOSTED_TESTS is 'on':
    # pushes to main, and pull requests into main from this repo's own branches, never a fork's (GitHub's runners,
    # as before, for those and for everything else). There the shard runs in a container of its own (the runner's
    # rootless Docker): root inside it for the setup steps below, and a loopback of its own for the tests' servers,
    # none of the machine's. Same check names either way. test/self-hosted-guard.test.ts holds both expressions.
    # The container's /tmp is a volume of its own (one per job; the runner's reset prunes it), on the daemon's own
    # file system: the image's root is overlay, where native file locks fail closed (src/os/index.ts). --init: the
    # runner makes `tail -f /dev/null` its process 1, which reaps no orphan, so a stopped process tree's children
    # would stay as zombies the tests see as still running; Docker's init reaps them, as systemd does on a VM.
    runs-on: ${{ vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-tests"]') || vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","trusted-tests"]') || 'ubuntu-24.04' }}
    container: ${{ vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('{"image":"buildpack-deps:noble-scm@sha256:94ed690dd634b8b2f531eaa742fde9b1264077cd8ea695a3b960bd104ae4c481","options":"--privileged --init --shm-size=2g","env":{"WORKLANE_CI_CONTAINER":"1"},"volumes":["/tmp"]}') || vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('{"image":"buildpack-deps:noble-scm@sha256:94ed690dd634b8b2f531eaa742fde9b1264077cd8ea695a3b960bd104ae4c481","options":"--privileged --init --shm-size=2g","env":{"WORKLANE_CI_CONTAINER":"1"},"volumes":["/tmp"]}') || '' }}
    steps: &test-shard-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request checks out its merge commit: HEAD^1 is the base it merges into, what affected.mjs diffs.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # In the self-hosted runner's container only (WORKLANE_CI_CONTAINER, the container's own env): what GitHub's
      # image has and this one lacks. sudo; a user like GitHub's runner (uid 1001, passwordless sudo, subordinate ids
      # inside the container's own range), whom the tests run as, never root; Chrome for Testing, pinned and checked,
      # as google-chrome, with the libraries its deb.deps names. On GitHub's runners it does nothing.
      # It comes first, before the install: it runs only this file's own commands, no file from the checkout, and every
      # step after it that runs a test file (the backstop and the lint tests too) runs it as that user, never as root.
      - name: the self-hosted container's own setup (nothing on GitHub's runners)
        shell: bash
        env:
          CHROME_VERSION: 157.0.8103.38
          CHROME_SHA256: 8cdeb344e9b2cefe59f4aea8d1d93d5d93054c03cde217665c16fc1f62e72a66
        run: |
          [ "${WORKLANE_CI_CONTAINER:-}" = 1 ] || { echo "GitHub's runner: nothing to set up"; exit 0; }
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -q
          # The rest is what GitHub's image has and tests use, so none of them skips here: jq (the Discord seam's
          # checks), git-lfs (the commit scan's large-file cases), python3 with pip (the pip fetch), strace and
          # fakeroot (the guard's runner tables).
          apt-get install -y -q --no-install-recommends sudo unzip uidmap jq git-lfs python3 python3-pip strace fakeroot
          # No subordinate ids from useradd: it would give 165536 and up, outside the container's own ids (rootless
          # Docker maps 0 to 65536), where newuidmap is refused. The range below is inside them. Supplementary groups,
          # as GitHub's runner user has (adm, users): the write helpers' group cases need one.
          id runner > /dev/null 2>&1 || useradd -m -u 1001 -s /bin/bash -G adm,users -K SUB_UID_COUNT=0 -K SUB_GID_COUNT=0 runner
          printf 'runner ALL=(ALL) NOPASSWD:ALL\n' > /etc/sudoers.d/.runner.tmp
          chmod 0440 /etc/sudoers.d/.runner.tmp
          visudo -cf /etc/sudoers.d/.runner.tmp
          mv /etc/sudoers.d/.runner.tmp /etc/sudoers.d/runner
          # The container's uids are 0 to 65536 (rootless Docker's range): nested user namespaces map from inside it.
          for u in root runner; do
            grep -q "^$u:" /etc/subuid || usermod --add-subuids 2000-59999 "$u"
            grep -q "^$u:" /etc/subgid || usermod --add-subgids 2000-59999 "$u"
          done
          f=chrome-linux64.zip
          # Inline, not the repo's fetch helper: this step runs as root in the self-hosted container, so nothing from the checkout.
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -o "/tmp/$f" "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/$f"
          echo "${CHROME_SHA256}  /tmp/$f" | sha256sum -c -
          unzip -q "/tmp/$f" -d /opt && rm -f "/tmp/$f"
          # Each deb.deps line is "a (>= v) | b | c": the first alternative this release can install, or its t64
          # rename (libasound2 is libasound2t64 on 24.04); a line with none fails the step.
          pkgs=()
          while IFS= read -r line; do
            [ -n "${line//[[:space:]]/}" ] || continue
            pick=""
            IFS='|' read -ra alts <<< "$line"
            for a in "${alts[@]}"; do
              a="$(sed -e 's/(.*)//' -e 's/[[:space:]]//g' <<< "$a")"
              for c in "$a" "${a}t64"; do
                # Read whole, not piped to grep -q: under pipefail an early grep exit fails the pipeline.
                policy="$(apt-cache policy "$c" 2>/dev/null || true)"
                if [[ "$policy" =~ $'\n'"  Candidate: "[^\(] ]]; then pick="$c"; break 2; fi
              done
            done
            [ -n "$pick" ] || { echo "Chrome's deb.deps: nothing installable for: $line" >&2; exit 1; }
            pkgs+=("$pick")
          done < /opt/chrome-linux64/deb.deps
          apt-get install -y -q --no-install-recommends "${pkgs[@]}"
          ln -sf /opt/chrome-linux64/chrome /usr/local/bin/google-chrome
          google-chrome --version
      # Before any file the merge hold doesn't cover runs (#746 rounds 20 and 21): install with no package scripts
      # (prepare, postinstall); check the pinned packages' lockfile entries and installed files before either runs;
      # build with the locked typescript straight from node_modules (no npm script); check the pins again on what tsc
      # emitted (#1007: a JSON import makes it write a package.json under dist/); run the desktop backstop alone,
      # then the other lint tests. Only after that: npm run build (what prepare did), the dashboard UI, machine.sh and
      # this shard's tests. test/desktop-removed.test.ts holds these first steps and their order.
      - run: npm ci --ignore-scripts
      - name: the pinned packages, before any of them runs
        run: node scripts/ci/check-pins.mjs
      - run: node node_modules/typescript/bin/tsc -p tsconfig.json
      - name: the pinned packages again, after tsc emits
        run: node scripts/ci/check-pins.mjs
      - name: the desktop backstop, before anything unheld runs
        shell: bash
        run: |
          # In the self-hosted runner's container, as the runner user (above), never root, with this same script.
          if [ "${WORKLANE_CI_CONTAINER:-}" = 1 ] && [ "$(id -u)" = 0 ]; then
            chown -R runner:runner "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            HOME=/home/runner exec runuser -p -u runner -- bash --noprofile --norc -eo pipefail "$0"
          fi
          # As GitHub's runners run each step (the container's docker exec gives 0, the runner user's login 002).
          umask 0022
          node --import ./dist/test/isolate.js --test dist/test/desktop-removed.test.js
      - name: the other lint tests, before anything unheld runs
        shell: bash
        run: |
          # In the self-hosted runner's container, as the runner user (above), never root, with this same script.
          if [ "${WORKLANE_CI_CONTAINER:-}" = 1 ] && [ "$(id -u)" = 0 ]; then
            chown -R runner:runner "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            HOME=/home/runner exec runuser -p -u runner -- bash --noprofile --norc -eo pipefail "$0"
          fi
          # As GitHub's runners run each step (the container's docker exec gives 0, the runner user's login 002).
          umask 0022
          mapfile -t files < <(grep -lx '// lint-test' test/*.test.ts | grep -vx 'test/desktop-removed.test.ts' | sed -e 's#^test/#dist/test/#' -e 's#\.ts$#.js#')
          [ "${#files[@]}" -gt 0 ] || { echo "no lint tests found" >&2; exit 1; }
          node --import ./dist/test/isolate.js --test "${files[@]}"
      - name: install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$RUNNER_OS" in
            Linux)   f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz";   sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            macOS)   f="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"; sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            Windows) f="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip";     sum=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          # Inline, not the repo's fetch helper: in the self-hosted container this step runs as root, so nothing from the checkout.
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 5 --retry-max-time 120 -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${sum}  $f" | sha256sum -c -
          case "$f" in *.zip) unzip -q "$f" gitleaks.exe ;; *) tar -xzf "$f" gitleaks ;; esac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
        if: matrix.shard == 4
      - run: npm run build
      # The comment policy (#330) on the comments this PR adds, with the base's config: a no-op printing "off" until
      # .worklane/config.yaml sets comment_policy.enabled. Shard 4 only, beside the typecheck; HEAD^1 is the base.
      - name: comment policy (new comments in this PR)
        if: matrix.shard == 4 && github.event_name == 'pull_request'
        run: node scripts/check-comments.mjs --base HEAD^1 --head HEAD
      # Before the tests, in every shard: the web-UI tests (real Chrome against dist/web) run only on a built UI,
      # and CI_REQUIRE_WEB=1 makes a missing UI or Chrome fail them instead of skipping (test/browser-helpers.ts).
      # About a second (vite), cheaper than one build shared as an artifact.
      - name: build the dashboard UI
        run: npm run build:web
      # A project command run as another user starts in bubblewrap (#713), installed as every machine installs it
      # (machine.sh, as ci-slow's jobs do). The tests that run one for real (separate-users' git check as nobody, the
      # isolation tests) then run on every PR; PROJECT_SANDBOX_REQUIRED=1 below makes a missing sandbox fail them.
      # The read-only agent home's pins and way tests (#798) stand in for root and a second user in a user namespace
      # (`unshare --user --map-root-user --map-auto --mount`, nothing real touched). This runner gets what that needs:
      # subordinate ids for its user, and an AppArmor rule that lets /usr/bin/unshare (only) create user namespaces;
      # the machine-wide restriction stays on. PROJECT_SANDBOX_REQUIRED=1 makes those tests fail here, never skip.
      - name: bubblewrap (machine.sh), startable by another user; user namespaces for the stand-in tests
        shell: bash
        run: |
          if [ "${WORKLANE_CI_CONTAINER:-}" = 1 ]; then
            # The self-hosted runner's container: machine.sh's roots and packages. Its AppArmor half is the host's
            # (no container can load a profile); the checks below show whether what the tests need works in here.
            sudo install -d -o root -g root -m 0755 /srv/worklane /var/lib/worklane /etc/worklane
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends bubblewrap socat
            sudo -n -u nobody /usr/bin/bwrap --dev-bind / / --unshare-user --unshare-pid --die-with-parent --proc /proc -- /bin/sh -c :
            sudo -n -u runner unshare --user --map-root-user --map-auto --mount /bin/sh -c 'mount -t tmpfs none /mnt && echo "user namespace (runner): ok"'
            exit 0
          fi
          sudo apt-get update -q && sudo bash scripts/setup/machine.sh
          sudo -n -u nobody /usr/bin/bwrap --dev-bind / / --unshare-user --unshare-pid --die-with-parent --proc /proc -- /bin/sh -c :
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends uidmap
          me="$(id -un)"
          grep -q "^$me:" /etc/subuid || sudo usermod --add-subuids 1000000-1065535 "$me"
          grep -q "^$me:" /etc/subgid || sudo usermod --add-subgids 1000000-1065535 "$me"
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = 1 ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile ci-unshare /usr/bin/unshare flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/ci-unshare > /dev/null
            sudo apparmor_parser -r /etc/apparmor.d/ci-unshare
          fi
          unshare --user --map-root-user --map-auto --mount /bin/sh -c 'mount -t tmpfs none /mnt && echo "user namespace: ok"'
      - name: this shard's tests
        shell: bash
        env:
          PROJECT_SANDBOX_REQUIRED: '1'
          CI_REQUIRE_WEB: '1'
          SHARD: ${{ matrix.shard }}
          EVENT: ${{ github.event_name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          # In the self-hosted runner's container, as the runner user (above), never root, with this same script.
          if [ "${WORKLANE_CI_CONTAINER:-}" = 1 ] && [ "$(id -u)" = 0 ]; then
            chown -R runner:runner "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            HOME=/home/runner exec runuser -p -u runner -- bash --noprofile --norc -eo pipefail "$0"
          fi
          # As GitHub's runners run each step (the container's docker exec gives 0, the runner user's login 002).
          umask 0022
          # The full-ci label runs everything here too.
          if [ "$FULL_CI" = true ]; then EVENT=full-ci; fi
          node scripts/ci/affected.mjs --event "$EVENT" --base HEAD^1 --explain > "$RUNNER_TEMP/selected"
          node scripts/ci/shard.mjs --plan 4 --only "$RUNNER_TEMP/selected"
          mapfile -t files < <(node scripts/ci/shard.mjs "$SHARD/4" --only "$RUNNER_TEMP/selected")
          if [ "${#files[@]}" -eq 0 ]; then
            [ "$EVENT" = pull_request ] || { echo "shard $SHARD/4 has no test files" >&2; exit 1; }
            echo "shard $SHARD/4: none of the selected test files"
            exit 0
          fi
          node --import ./dist/test/isolate.js --test "${files[@]}"

  test-shard-24:
    name: test shard ${{ matrix.shard }}/4 (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['24']
        shard: [1, 2, 3, 4]
    # WHY: ubuntu-latest became ubuntu-26.04 (image 20261101), where visudo, nested user namespaces and git fetch
    # fixtures fail the suite; pinned to 24.04 until the suite is ported. matrix.os stays the check name's label.
    # On the self-hosted tests runner (docs/ci-runners.md, "The tests runner") while vars.CI_SELF_HOSTED_TESTS is 'on':
    # pushes to main, and pull requests into main from this repo's own branches, never a fork's (GitHub's runners,
    # as before, for those and for everything else). There the shard runs in a container of its own (the runner's
    # rootless Docker): root inside it for the setup steps below, and a loopback of its own for the tests' servers,
    # none of the machine's. Same check names either way. test/self-hosted-guard.test.ts holds both expressions.
    runs-on: ${{ vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-tests"]') || vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","trusted-tests"]') || 'ubuntu-24.04' }}
    container: ${{ vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('{"image":"buildpack-deps:noble-scm@sha256:94ed690dd634b8b2f531eaa742fde9b1264077cd8ea695a3b960bd104ae4c481","options":"--privileged --init --shm-size=2g","env":{"WORKLANE_CI_CONTAINER":"1"},"volumes":["/tmp"]}') || vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('{"image":"buildpack-deps:noble-scm@sha256:94ed690dd634b8b2f531eaa742fde9b1264077cd8ea695a3b960bd104ae4c481","options":"--privileged --init --shm-size=2g","env":{"WORKLANE_CI_CONTAINER":"1"},"volumes":["/tmp"]}') || '' }}
    steps: *test-shard-steps

  # The required checks, under the names they have always had: green only when every shard of that Node version
  # succeeded. always(): a failed, cancelled or skipped shard makes this job fail, never skip (a skipped required
  # check would count as passing).
  test-22:
    name: test (ubuntu-latest, 22)
    needs: test-shard-22
    if: ${{ always() }}
    # Beside its shards: the self-hosted tests runner on the same terms (above), GitHub's otherwise.
    runs-on: ${{ vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-tests"]') || vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","trusted-tests"]') || 'ubuntu-latest' }}
    steps:
      - name: all 4 shards succeeded
        env:
          RESULT: ${{ needs.test-shard-22.result }}
        run: |
          echo "test shard 1..4/4 (ubuntu-latest, 22): $RESULT"
          [ "$RESULT" = success ]

  test-24:
    name: test (ubuntu-latest, 24)
    needs: test-shard-24
    if: ${{ always() }}
    # Beside its shards: the self-hosted tests runner on the same terms (above), GitHub's otherwise.
    runs-on: ${{ vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-tests"]') || vars.CI_SELF_HOSTED_TESTS == 'on' && github.repository_id == '1409507019' && github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","trusted-tests"]') || 'ubuntu-latest' }}
    steps:
      - name: all 4 shards succeeded
        env:
          RESULT: ${{ needs.test-shard-24.result }}
        run: |
          echo "test shard 1..4/4 (ubuntu-latest, 24): $RESULT"
          [ "$RESULT" = success ]

  # Kept for one release after #744 removed what it tested, as a job that only succeeds: same job id, same check
  # name. An install whose updater is v0.5.2's or older requires a successful "desktop" run on every commit it
  # installs (it has no retired-check rule), and so does the release channel's check of a release's base commit.
  # With no run it would wait forever. No `if`, `needs` or `name`: a skipped run is refused by that updater, and
  # the check must keep the job id as its name. The release after the one that ships this removes the job and the
  # check together (test/desktop-removed.test.ts holds this shape).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - run: 'true'

  agentshield:
    # Scan the hooks, permissions and settings a fresh install generates.
    # A push to main runs on the self-hosted runner while vars.CI_SELF_HOSTED is 'on' (docs/ci-runners.md); everything
    # else, pull requests and forks included, on GitHub's. Same check name either way. test/self-hosted-guard.test.ts
    # keeps the routed jobs to the ones that need no root, Chrome, Docker, loopback, gh, jq or secrets.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-main"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: |
          cp -r examples/basic "$RUNNER_TEMP/example" && git -C "$RUNNER_TEMP/example" init -q
          node dist/src/cli.js install --root "$RUNNER_TEMP/example"
          node dist/src/cli.js doctor --root "$RUNNER_TEMP/example" --agentshield --json > doctor.json || true
          node -e 'const c=require("./doctor.json").find(x=>x.name==="agentshield");console.log(c.level, c.detail);process.exit(c.level==="fail"?1:0)'

  push-gate:
    # The same gate the pre-push hook runs, over exactly the commits this event brings.
    # A push to main runs on the self-hosted runner while vars.CI_SELF_HOSTED is 'on' (docs/ci-runners.md); everything
    # else, pull requests and forks included, on GitHub's. Same check name either way. test/self-hosted-guard.test.ts
    # keeps the routed jobs to the ones that need no root, Chrome, Docker, loopback, gh, jq or secrets.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-main"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          bash "$GITHUB_WORKSPACE/scripts/ci/fetch-pinned.sh" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}" 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$f"
          tar -xzf "$f" gitleaks && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gate the commits
        # A PR's own commits only: merge-base(base, head)..head, the PR head rather than the test merge,
        # so commits already on main are not rescanned. A push scans what it brought, as before.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            BASE="$(git merge-base "$PR_BASE" "$PR_HEAD")"
            node scripts/push-gate.mjs --range "${BASE}..${PR_HEAD}"
          else
            node scripts/push-gate.mjs --range "${BEFORE}..${GITHUB_SHA}"
          fi

  denylist:
    # No project-specific details in the engine repo (see scripts/check-denylist.mjs).
    # A push to main runs on the self-hosted runner while vars.CI_SELF_HOSTED is 'on' (docs/ci-runners.md); everything
    # else, pull requests and forks included, on GitHub's. Same check name either way. test/self-hosted-guard.test.ts
    # keeps the routed jobs to the ones that need no root, Chrome, Docker, loopback, gh, jq or secrets.
    runs-on: ${{ vars.CI_SELF_HOSTED == 'on' && github.repository_id == '1409507019' && github.ref == 'refs/heads/main' && github.event_name == 'push' && fromJSON('["self-hosted","trusted-main"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-denylist.mjs

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-dco.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
