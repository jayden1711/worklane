name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Ubuntu only (the owner's choice): the OS adapters stay in place, but only Linux runs in CI.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$RUNNER_OS" in
            Linux)   f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz";   sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
            macOS)   f="gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"; sum=b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 ;;
            Windows) f="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip";     sum=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${sum}  ${f}" | sha256sum -c -
          case "$f" in *.zip) unzip -q "$f" gitleaks.exe ;; *) tar -xzf "$f" gitleaks ;; esac
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm test
      - name: build the dashboard UI
        if: runner.os == 'Linux'
        run: npm run build:web

  desktop:
    # The optional desktop window (desktop/, Tauri): its URL and navigation guards, against the locked crates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's Linux build libraries (WebKitGTK)
        run: sudo apt-get update -q && sudo apt-get install -y -q libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo test --locked --manifest-path desktop/Cargo.toml

  bootstrap:
    # A fresh install in local mode, end to end (scripts/bootstrap.sh, then `worklane init --mode local`): on a clean
    # runner, this commit's engine packed as a release ships it, set up in a scratch copy of examples/basic, through
    # init's checklist and ending at doctor green, which shows that checklist and what local mode can't do; run twice,
    # the second changing nothing; on macOS, the coordinator as a launchd service (worklane up / down); then the demo
    # from the installed package. No GitHub: stand-in gh and claude (scripts/ci/stand-ins), and no token. macOS is
    # not a required check (the owner decides).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The Mac runner's own Node is older than 22.13; the bootstrap would take it from Homebrew, which is slow here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: runner.os == 'macOS'
        with:
          node-version: '24'
      - name: pack this commit's engine (dist/ and the web UI built, as in a release)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build && npm run build:web
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          ls "$RUNNER_TEMP"/*.tgz
      - name: the Docker image (the same bootstrap, with the pinned release engine)
        if: runner.os == 'Linux'
        run: |
          docker build -t worklane-trial .
          docker run --rm worklane-trial worklane --version
          docker run --rm worklane-trial sh -c 'gitleaks version && claude --version && node --version'
      - name: no GitHub from here on (a stand-in gh, signed in, that reaches nothing; a stand-in claude, signed in)
        run: echo "$GITHUB_WORKSPACE/scripts/ci/stand-ins" >> "$GITHUB_PATH"
      - name: bootstrap in local mode, twice
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          ex="$RUNNER_TEMP/example"
          cp -r examples/basic "$ex" && git -C "$ex" init -q
          git -C "$ex" remote add origin https://github.com/example-org/example-shop.git
          tgz="$(ls "$RUNNER_TEMP"/*.tgz)"
          bash scripts/bootstrap.sh --dry-run --mode local --engine "$tgz" "$ex"
          bash scripts/bootstrap.sh --mode local --yes --engine "$tgz" "$ex" | tee "$RUNNER_TEMP/first.log"
          # Each step's result line ("   done: ...") can follow what the step printed doing it: count them, not neighbours.
          [ "$(grep -cE '^   done: ' "$RUNNER_TEMP/first.log")" = 5 ] || { echo "not every required step was done" >&2; exit 1; }
          grep -q 'all 6 steps done or skipped' "$RUNNER_TEMP/first.log"
          # The second run: no --mode and no terminal (local, said so); it installs nothing and redoes no step.
          bash scripts/bootstrap.sh --engine "$tgz" "$ex" < /dev/null | tee "$RUNNER_TEMP/second.log"
          if grep -E 'added [0-9]+ package|would download|installed [a-z]+ [0-9]|kept .worklane/' "$RUNNER_TEMP/second.log"; then echo "the second run did something again" >&2; exit 1; fi
          grep -q 'no --mode, and no terminal to ask on: local mode' "$RUNNER_TEMP/second.log"
          grep -q 'resuming: 6 of 6 steps done earlier' "$RUNNER_TEMP/second.log"
      - name: doctor shows the checklist, and what local mode can't do
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          worklane doctor --root "$RUNNER_TEMP/example" | tee "$RUNNER_TEMP/doctor.log"
          for id in tools claude github repo-config protection discord; do grep -Eq "^ok +setup $id: " "$RUNNER_TEMP/doctor.log"; done
          grep -Eq '^off +not in local mode: separate OS users: ' "$RUNNER_TEMP/doctor.log"
          grep -Eq '^off +not in local mode: root-run add-project: ' "$RUNNER_TEMP/doctor.log"
          # As a server would see it (its steps aren't done here, so it fails; only the list matters): nothing missing.
          worklane doctor --root "$RUNNER_TEMP/example" --mode server > "$RUNNER_TEMP/doctor-server.log" || true
          grep -q '^FAIL  setup github: ' "$RUNNER_TEMP/doctor-server.log"
          if grep -E '^off ' "$RUNNER_TEMP/doctor-server.log"; then echo "server mode lists something it can't do" >&2; exit 1; fi
      - name: the coordinator as a launchd service (worklane up, then down)
        if: runner.os == 'macOS'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          label=dev.worklane.example-shop
          plist="$HOME/Library/LaunchAgents/$label.plist"
          worklane up --root "$RUNNER_TEMP/example"
          test -f "$plist"
          launchctl print "gui/$(id -u)/$label" | head -n 20
          worklane down --root "$RUNNER_TEMP/example"
          if [ -e "$plist" ]; then echo "down left $plist" >&2; exit 1; fi
          if launchctl print "gui/$(id -u)/$label" > /dev/null 2>&1; then echo "down left $label loaded" >&2; exit 1; fi
      - name: the demo, from the installed package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          worklane --version
          worklane demo "$RUNNER_TEMP/demo"

  testrun-real-systemd:
    # The test-run sandbox on a real host, no mocks: test-user.sh install (rootless Docker, the helper, its check),
    # then the coordinator's own sandbox host, as the coordinator user through its real sudoers rule, against real
    # systemd-run (the other jobs stand in for sudo and the helper). scripts/ci/testrun-real-systemd.mjs has the
    # assertions; its log shows systemd-run's raw summary, the text test/fixtures/systemd-run-255/ holds.
    name: test-run sandbox (real systemd)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash # -eo pipefail: a failed install isn't hidden by its tee
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - name: the host
        run: |
          systemd-run --version | head -1
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          nproc
      - name: a coordinator user and the full-run lock (what instance.sh and the machine script make)
        run: |
          # Two instances, so each test user's check also proves it can't reach the other's state.
          for u in wl-ci wl-ci2; do
            sudo useradd --create-home --shell /bin/bash "$u"
            sudo chmod 0750 "$(getent passwd "$u" | cut -d: -f6)"
          done
          sudo install -o root -g root -m 0644 /dev/null /run/lock/worklane-full-run.lock
      - name: a coordinator checkout's pre-push hook refuses the default branch (checkout.sh's hook step)
        run: |
          # A remote with a main, cloned as checkout.sh clones (origin/HEAD set), then the hook step checkout.sh runs.
          t="$(mktemp -d)"
          id=(-c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false)
          git init -q --bare -b main "$t/remote.git"
          git init -q -b main "$t/seed" && git -C "$t/seed" "${id[@]}" commit -q --allow-empty -m init && git -C "$t/seed" push -q "$t/remote.git" main
          git clone -q "$t/remote.git" "$t/checkout"
          git -C "$t/checkout" "${id[@]}" commit -q --allow-empty -m change
          (cd "$t/checkout" && node "$GITHUB_WORKSPACE/dist/src/cli.js" install --root . --git-hooks-only)
          sudo chown -R root:root "$t/checkout/.git/hooks" && sudo chmod 0755 "$t/checkout/.git/hooks"
          if [ -w "$t/checkout/.git/hooks/pre-push" ]; then echo "the hook is writable by the checkout's user" >&2; exit 1; fi
          for spec in HEAD:main HEAD:refs/heads/main +HEAD:main; do
            if git -C "$t/checkout" push origin "$spec" 2> "$RUNNER_TEMP/push.log"; then echo "pushed $spec through the hook" >&2; exit 1; fi
            grep -q 'refusing to push refs/heads/main, the default branch' "$RUNNER_TEMP/push.log"
          done
          [ "$(git -C "$t/remote.git" rev-parse main)" = "$(git -C "$t/seed" rev-parse HEAD)" ] || { echo "main moved" >&2; exit 1; }
          git -C "$t/checkout" push -q origin HEAD:refs/heads/worklane/issue-1
          echo "main refused, a task branch pushed"
      - name: test-user.sh install, in full
        run: |
          n="$(nproc)"
          sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/install.log"
          tail -n 5 "$RUNNER_TEMP/install.log" | grep -qx 'OK: all checks passed'
          # An older install's Docker unit, still running: install must restart it into the new layout by itself.
          u=/etc/systemd/system/worklane-test-ci-docker.service
          sudo sed -i -e '/^DelegateSubgroup=/d' -e 's/^Delegate=.*/Delegate=yes/' "$u"
          sudo systemctl daemon-reload && sudo systemctl restart worklane-test-ci-docker.service
          if sudo bash scripts/setup/test-user.sh check ci > "$RUNNER_TEMP/old.log"; then echo "check passed on the old layout" >&2; exit 1; fi
          grep -q '^FAIL Docker' "$RUNNER_TEMP/old.log"
          # With a run in progress, install refuses to restart Docker under it, and says why.
          sudo sed -i -e '/^DelegateSubgroup=/d' "$u"; sudo install -d -o root -g root -m 0700 /var/lib/worklane-test/ci/runs/fast-inprogress
          if sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G > "$RUNNER_TEMP/busy.log" 2>&1; then echo "install restarted Docker under a run" >&2; exit 1; fi
          grep -q 'test runs of ci are in progress' "$RUNNER_TEMP/busy.log"
          sudo rmdir /var/lib/worklane-test/ci/runs/fast-inprogress
          # No run in progress: the re-run restarts Docker and check passes, with no manual restart.
          sudo bash scripts/setup/test-user.sh install ci --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/reinstall.log"
          grep -q '^restarted worklane-test-ci-docker.service' "$RUNNER_TEMP/reinstall.log"
          tail -n 5 "$RUNNER_TEMP/reinstall.log" | grep -qx 'OK: all checks passed'
          # A second instance's test user, then both checks again: each must be shut out of the other's state.
          sudo bash scripts/setup/test-user.sh install ci2 --cpus "$((n - 2))-$((n - 1))" --memory-max 2G | tee "$RUNNER_TEMP/install2.log"
          tail -n 5 "$RUNNER_TEMP/install2.log" | grep -qx 'OK: all checks passed'
          for i in ci ci2; do
            sudo bash scripts/setup/test-user.sh check "$i" | tee "$RUNNER_TEMP/check-$i.log"
            grep -q "PASS wl-test-$i can't reach /var/lib/worklane-test/$([ "$i" = ci ] && echo ci2 || echo ci)" "$RUNNER_TEMP/check-$i.log"
            tail -n 1 "$RUNNER_TEMP/check-$i.log" | grep -qx 'OK: all checks passed'
          done
      - name: the database image, pinned to the digest it has today
        run: |
          docker pull -q postgres:17-alpine
          echo "DB_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' postgres:17-alpine)" >> "$GITHUB_ENV"
      - name: the coordinator's sandbox host, as wl-ci, against real systemd-run
        run: |
          # What wl-ci runs, world-readable: the build, its one dependency, node, the driver and the fixtures.
          t="$(mktemp -d /tmp/wl-ci-XXXXXX)"
          mkdir -p "$t/node_modules" "$t/fixtures"
          cp -r dist package.json "$t/"
          cp -r node_modules/zod "$t/node_modules/"
          cp "$(command -v node)" "$t/node"
          cp scripts/ci/testrun-real-systemd.mjs "$t/"
          cp test/fixtures/systemd-run-255/* "$t/fixtures/"
          chmod -R a+rX "$t"
          echo "T=$t" >> "$GITHUB_ENV"
          sudo install -o wl-ci -g wl-ci -m 0644 /dev/null "$t/ids"
          sudo install -o wl-ci -g wl-ci -m 0644 /dev/null "$t/ids.db"
          sudo -u wl-ci env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-ci | cut -d: -f6)" LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec "$1/node" "$1/testrun-real-systemd.mjs" "$1/dist" ci "$2" "$1/fixtures" "$1/ids"' _ "$t" "$DB_IMAGE"
      - name: the database container's processes are in a cgroup of their own, inside worklane-test.slice
        run: |
          c="$(cat "$T/ids.db")"
          [ -n "$c" ] || { echo "the driver named no container" >&2; exit 1; }
          pid="$(sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker inspect --format '{{.State.Pid}}' "$c")"
          echo "container $c, main pid $pid"
          cat "/proc/$pid/cgroup"
          cg="$(sed -n 's/^0:://p' "/proc/$pid/cgroup")"
          unit="$(systemctl show worklane-test-ci-docker.service -p ControlGroup --value)"
          echo "the container's cgroup: $cg"
          echo "its controllers: $(cat "/sys/fs/cgroup$cg/cgroup.controllers")"
          case "$cg" in /worklane.slice/worklane-test.slice/*) ;; *) echo "not inside /worklane.slice/worklane-test.slice/" >&2; exit 1 ;; esac
          case "$cg" in "$unit"/daemon | "$unit"/daemon/*) echo "in the daemon's own cgroup, not one of its own" >&2; exit 1 ;; "$unit"/*) ;; *) echo "not inside $unit" >&2; exit 1 ;; esac
          for k in cpu io memory pids; do grep -qw "$k" "/sys/fs/cgroup$cg/cgroup.controllers" || { echo "no $k controller in its cgroup" >&2; exit 1; }; done
          echo "CG=$cg" >> "$GITHUB_ENV"
      - name: the run's Postgres has the max_connections db-start was given (250), asked inside the database
        run: |
          c="$(cat "$T/ids.db")"
          got="$(sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker exec "$c" psql -U postgres -d test -tAc 'SHOW max_connections')"
          echo "SHOW max_connections in $c: $got"
          [ "$got" = 250 ] || { echo "expected 250" >&2; exit 1; }
      - name: wipe, as wl-ci
        run: |
          sudo -u wl-ci env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$(getent passwd wl-ci | cut -d: -f6)" LANG=C.UTF-8 \
            sh -c 'cd "$HOME" && exec "$1/node" "$1/testrun-real-systemd.mjs" --wipe "$1/dist" ci "$1/ids"' _ "$T"
      - name: nothing left of the run, seen as root
        run: |
          if [ -e "/sys/fs/cgroup$CG" ]; then echo "the container's cgroup $CG is still there" >&2; exit 1; fi
          echo "the container's cgroup $CG is gone"
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            if sudo test -e "/var/lib/worklane-test/ci/runs/$id"; then echo "run $id's directory is still there" >&2; exit 1; fi
            if [ -n "$(systemctl list-units --all --plain --no-legend "worklane-test-ci-$id-*")" ]; then echo "run $id has units left" >&2; exit 1; fi
          done < "$T/ids"
          sudo -u wl-test-ci env HOME=/var/lib/worklane-test/ci/docker-home DOCKER_HOST=unix:///run/worklane-test-ci-docker/docker.sock \
            /opt/worklane-test/docker/docker ps -aq --filter label=worklane.test-run > "$RUNNER_TEMP/left"
          if [ -s "$RUNNER_TEMP/left" ]; then echo "containers left:" >&2; cat "$RUNNER_TEMP/left" >&2; exit 1; fi
          echo "nothing left"
      - name: the sandbox's units and Docker, on failure
        if: failure()
        run: |
          sudo systemctl --no-pager status worklane-test.slice worklane-test-ci-docker.service || true
          sudo journalctl --no-pager -n 100 -u worklane-test-ci-docker.service || true
          sudo journalctl --no-pager -n 50 _SYSTEMD_UNIT=init.scope -g worklane-test || true

  add-project-real-systemd:
    # scripts/setup/add-project.sh end to end on a real host, as root, against a fake GitHub (test/fake-github.ts, the
    # manifest flow's, served by scripts/ci/fake-github.mjs): a first run stops at the App step (no hub yet) naming its
    # retry; the App by hand (credentials.sh github-app), then the rerun goes on from there with a stand-in Claude
    # token: the checkout cloned through the App's credential helper, the coordinator's service active, the machine
    # helper and the dashboards. A third run, through the machine helper as the coordinator, skips every step.
    name: add-project (real systemd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GH_FAKE: http://127.0.0.1:8999
      HELPER: /usr/local/libexec/worklane-machine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && npm run build:web
      - name: the machine (machine.sh) and this commit's engine, root-owned, as engine.sh installs it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q acl
          sudo install -m 0755 "$(command -v node)" /usr/local/bin/node
          sudo bash scripts/setup/machine.sh
          sha="$(git rev-parse HEAD)"
          # The runner's /opt is open to all (0777); on a server it is root's 0755, and the machine helper refuses to run
          # add-project.sh from under a directory anyone may write.
          sudo chmod 0755 /opt
          sudo install -d -m 0755 /opt/worklane
          sudo cp -a "$GITHUB_WORKSPACE" "/opt/worklane/$sha"
          sudo chown -R root:root "/opt/worklane/$sha" && sudo chmod -R a+rX,go-w "/opt/worklane/$sha"
          sudo ln -sfn "/opt/worklane/$sha" /opt/worklane/current
          sudo chmod 0755 "/opt/worklane/$sha/dist/src/cli.js"
          sudo ln -sfn /opt/worklane/current/dist/src/cli.js /usr/local/bin/worklane
          worklane --version
      - name: a fake GitHub, with the repo (examples/basic) behind the App's installation token
        run: |
          f="$RUNNER_TEMP/fake" && mkdir -p "$f/git/example"
          git init -q --bare -b main "$f/git/example/alpha.git"
          cp -r examples/basic "$f/seed"
          # Its .worklane/ for example/alpha, within the default policy add-project writes ($20/day, 2 workers).
          sed -i -e 's|^  repo: example-org/example-shop |  repo: example/alpha |' "$f/seed/.worklane/config.yaml"
          sed -i -e 's|^daily_budget_usd: 40 |daily_budget_usd: 20 |' -e 's|count: 1, max: 4,|count: 1, max: 2,|' "$f/seed/.worklane/agents.yaml"
          grep -q '^  repo: example/alpha ' "$f/seed/.worklane/config.yaml" && grep -q '^daily_budget_usd: 20 ' "$f/seed/.worklane/agents.yaml" && grep -q 'max: 2,' "$f/seed/.worklane/agents.yaml"
          git -C "$f/seed" init -q -b main && git -C "$f/seed" add -A
          git -C "$f/seed" -c user.email=ci@example.com -c user.name=ci -c commit.gpgsign=false commit -q -m init
          git -C "$f/seed" push -q "$f/git/example/alpha.git" main
          nohup node scripts/ci/fake-github.mjs "$GITHUB_WORKSPACE/dist" 8999 "$f/git" example/alpha "$f/requests.log" > "$f/server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf "$GH_FAKE/repos/example/alpha" >/dev/null && break; sleep 1; done
          curl -sf "$GH_FAKE/repos/example/alpha"
          # The App's key, as one would download it (the fake checks the JWT's App id, not its signature).
          openssl genrsa -traditional -out "$f/app.pem" 2048 2>/dev/null || openssl genrsa -out "$f/app.pem" 2048
          echo "F=$f" >> "$GITHUB_ENV"
          # The fake is reached through these, as the engine reads them: kept through sudo, and set for the units.
          printf 'Defaults env_keep += "WORKLANE_GITHUB_API WORKLANE_GITHUB_WEB"\n' > "$f/sudoers" && sudo visudo -cf "$f/sudoers" && sudo install -m 0440 "$f/sudoers" /etc/sudoers.d/ci-fake-github
          for u in worklane-ci worklane-dashboard-ci worklane-dashboard-hub; do
            sudo install -d "/etc/systemd/system/$u.service.d"
            printf '[Service]\nEnvironment=WORKLANE_GITHUB_API=%s WORKLANE_GITHUB_WEB=%s\n' "$GH_FAKE" "$GH_FAKE" | sudo tee "/etc/systemd/system/$u.service.d/fake-github.conf" >/dev/null
          done
          # The dashboard sign-in App's secrets (credentials.sh dashboard-signin), for the hub dashboards.sh starts.
          printf 'cisigninclientsecret0123456789\n' | sudo bash scripts/setup/credentials.sh dashboard-signin
      - name: first run, no hub yet; stops at the App step and names the retry
        run: |
          # The stand-in token: in a file of the runner's only, masked in case anything prints it; never in the env.
          t="sk-ant-oat01-$(openssl rand -hex 24)"; echo "::add-mask::$t"; (umask 077; printf '%s\n' "$t" > "$F/claude-token"); unset t
          set +e
          sudo env WORKLANE_GITHUB_API="$GH_FAKE" WORKLANE_GITHUB_WEB="$GH_FAKE" bash scripts/setup/add-project.sh ci example/alpha --client-id Iv1.cisignin0001 --public-url https://hub.example.test < /dev/null > "$F/run1.jsonl" 2> "$F/run1.err"
          rc=$?
          set -e
          cat "$F/run1.jsonl"; tail -n 20 "$F/run1.err"
          [ "$rc" = 1 ] || { echo "expected exit 1, got $rc" >&2; exit 1; }
          jq -e 'select(.step=="instance" and .state=="done")' "$F/run1.jsonl" >/dev/null
          last="$(tail -n 1 "$F/run1.jsonl")"
          jq -e '.step=="app" and .state=="failed" and (.detail|test("no dashboard hub")) and (.retry|test("add-project.sh ci example/alpha .*credentials.sh ci github-app"))' <<<"$last"
          id wl-ci && id wl-ci-agent
      - name: the App by hand (the manual way), then the rerun goes on from the App step to the end
        run: |
          echo n | sudo env WORKLANE_GITHUB_API="$GH_FAKE" bash scripts/setup/credentials.sh ci github-app 91 4242 "$F/app.pem" example/alpha
          cat "$F/claude-token" | sudo env WORKLANE_GITHUB_API="$GH_FAKE" WORKLANE_GITHUB_WEB="$GH_FAKE" bash scripts/setup/add-project.sh ci example/alpha --client-id Iv1.cisignin0001 --public-url https://hub.example.test > "$F/run2.jsonl" 2> "$F/run2.err" || { cat "$F/run2.jsonl"; tail -n 60 "$F/run2.err"; exit 1; }
          cat "$F/run2.jsonl"
          for s in instance app; do jq -se --arg s "$s" 'map(select(.step==$s and .state=="done")) | length == 1' "$F/run2.jsonl"; done
          [ "$(jq -sc 'map(select(.state=="started") | .step)' "$F/run2.jsonl")" = '["instance","app","claude-token","checkout","policy","service","test-user","machine-helper","dashboards"]' ]
          jq -se 'map(select(.state=="failed")) | length == 0' "$F/run2.jsonl"
          jq -se 'map(select(.step=="claude-token" and .state=="ask" and .ask.kind=="paste_secret")) | length == 1' "$F/run2.jsonl"
          jq -se 'map(select(.step=="policy" and .state=="done" and (.detail|startswith("auto_merge off, $20/day, 2 workers")))) | length == 1' "$F/run2.jsonl"
          if grep -qFf "$F/claude-token" "$F/run1.jsonl" "$F/run1.err" "$F/run2.jsonl" "$F/run2.err"; then echo "the token was echoed" >&2; exit 1; fi
      - name: the instance, the token for the agent only, the checkout through the App, the services, the helper
        run: |
          sudo test -f "$(getent passwd wl-ci | cut -d: -f6)/.local/state/worklane/instances/ci/instance.yaml"
          c="$(getent passwd wl-ci-agent | cut -d: -f6)/.claude/.credentials.json"
          [ "$(sudo stat -c '%U %a' "$c")" = "wl-ci-agent 600" ]
          sudo grep -qFf "$F/claude-token" "$c"
          if sudo -u wl-ci test -r "$c"; then echo "the coordinator can read the agent's Claude login" >&2; exit 1; fi
          d=/srv/worklane/ci/alpha
          sudo test -f "$d/.worklane/config.yaml"
          [ "$(sudo git -C "$d" config --get remote.origin.url)" = "$GH_FAKE/example/alpha.git" ]
          sudo git -C "$d" config --get-all credential.helper | grep -qx '!/usr/local/bin/worklane git-credential --instance ci'
          grep -q '^git as x-access-token: POST /example/alpha.git/git-upload-pack$' "$F/requests.log"
          if grep '^git as ' "$F/requests.log" | grep -v '^git as x-access-token:'; then echo "git authenticated as someone else" >&2; exit 1; fi
          grep -q "^POST /app/installations/4242/access_tokens$" "$F/requests.log"
          for u in worklane-ci worklane-dashboard-ci worklane-dashboard-hub; do systemctl is-active "$u.service"; done
          sleep 15 && systemctl is-active worklane-ci.service
          sudo -n -l -U wl-ci "$HELPER" add-project beta example/beta
          if sudo -n -l -U wl-ci "$HELPER" add-project beta example/beta extra; then echo "the rule passes extra arguments" >&2; exit 1; fi
          if sudo -n -l -U wl-dash "$HELPER" add-project beta example/beta; then echo "wl-dash may add a project" >&2; exit 1; fi
      - name: through the machine helper, as the coordinator, every step is skipped as done
        run: |
          sudo -u wl-ci sudo -n "$HELPER" add-project ci example/alpha < /dev/null > "$F/run3.jsonl" 2> "$F/run3.err" || { cat "$F/run3.jsonl" "$F/run3.err"; exit 1; }
          cat "$F/run3.jsonl"
          jq -se 'length == 18 and (map(select(.state=="done")) | length == 9) and (map(select(.state=="ask" or .state=="failed")) | length == 0)' "$F/run3.jsonl"
          sudo grep -q '"what":"add-project".*"to":"ci example/alpha"' /var/lib/worklane/machine-changes.jsonl
          if sudo -u wl-ci sudo -n "$HELPER" add-project 'ci;id' example/alpha 2>/dev/null; then echo "a bad name ran" >&2; exit 1; fi
      - name: the units and the fake's log, on failure
        if: failure()
        run: |
          sudo systemctl --no-pager status worklane-ci.service worklane-dashboard-ci.service worklane-dashboard-hub.service || true
          sudo journalctl --no-pager -n 80 -u worklane-ci.service -u worklane-dashboard-ci.service -u worklane-dashboard-hub.service || true
          tail -n 80 "$F/requests.log" "$F/server.log" || true
          tail -n 80 "$F"/run*.err || true

  agentshield:
    # Scan the hooks, permissions and settings a fresh install generates.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: |
          cp -r examples/basic "$RUNNER_TEMP/example" && git -C "$RUNNER_TEMP/example" init -q
          node dist/src/cli.js install --root "$RUNNER_TEMP/example"
          node dist/src/cli.js doctor --root "$RUNNER_TEMP/example" --agentshield --json > doctor.json || true
          node -e 'const c=require("./doctor.json").find(x=>x.name==="agentshield");console.log(c.level, c.detail);process.exit(c.level==="fail"?1:0)'

  push-gate:
    # The same gate the pre-push hook runs, over exactly the commits this event brings.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: gate the commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/push-gate.mjs --range "${BASE}..${GITHUB_SHA}"

  denylist:
    # No project-specific details in the engine repo (see scripts/check-denylist.mjs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/check-denylist.mjs

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: node scripts/check-dco.mjs ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}
