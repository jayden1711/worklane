# TEMPORARY: probes whether the host's AppArmor profiles reach a privileged container's bwrap and unshare; removed
# before review.
name: proof (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: probe
        shell: bash
        run: |
          img=buildpack-deps:noble-scm@sha256:94ed690dd634b8b2f531eaa742fde9b1264077cd8ea695a3b960bd104ae4c481
          docker pull -q "$img"
          cat > "$RUNNER_TEMP/in.sh" <<'EOF'
          set -u
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq >/dev/null && apt-get install -y -qq --no-install-recommends sudo uidmap bubblewrap >/dev/null
          useradd -m -u 1001 runner
          usermod --add-subuids 2000-59999 --add-subgids 2000-59999 runner
          if sudo -n -u nobody /usr/bin/bwrap --dev-bind / / --unshare-user --unshare-pid --die-with-parent --proc /proc -- /bin/sh -c : 2>&1; then echo "RESULT bwrap(nobody): ok"; else echo "RESULT bwrap(nobody): FAIL"; fi
          if sudo -n -u runner unshare --user --map-root-user --map-auto --mount /bin/sh -c 'mount -t tmpfs none /mnt' 2>&1; then echo "RESULT unshare(runner): ok"; else echo "RESULT unshare(runner): FAIL"; fi
          EOF
          run() { echo "== $1"; docker run --rm --privileged -v "$RUNNER_TEMP/in.sh:/in.sh:ro" "$img" bash /in.sh 2>&1 | grep RESULT; }
          echo "restrict=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          run "A: no host profiles"
          sudo apt-get update -q >/dev/null && sudo bash scripts/setup/machine.sh > /dev/null
          sudo aa-status 2>/dev/null | grep -i -E 'bwrap|unshare' || true
          run "B: host machine.sh (bwrap profile)"
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' 'profile ci-unshare /usr/bin/unshare flags=(unconfined) {' '  userns,' '}' | sudo tee /etc/apparmor.d/ci-unshare > /dev/null
          sudo apparmor_parser -r /etc/apparmor.d/ci-unshare
          run "C: plus a host profile for /usr/bin/unshare"
