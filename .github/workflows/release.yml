name: release
# The npm release: a v* tag -> build -> test -> pack -> the tarball installed and run (npx, and init from it against
# a scratch repo) -> the tag's SSH signature checked -> `npm stage publish` with provenance. CI only STAGES a
# version: it goes live when the owner approves it on npmjs.com (or `npm stage approve`) with 2FA. CI never runs
# `npm publish` for real and never moves a dist-tag; npm's trusted publisher for this workflow allows staging only.
# It stages only on a v* tag whose version is package.json's, with the repo variable NPM_PUBLISH set to 'true'
# (the switch), through npm's trusted publishing (OIDC: no npm token, no secret), and only after
# scripts/verify-release-tag.mjs passed: the tag is signed by a key in .github/release-signers as committed on
# main, and points at the commit this run built. Anything else is a dry run (npm stage publish --dry-run).
# On a tag, every file in the tarball must also be byte for byte the one the signed commit holds
# (scripts/verify-release-tree.mjs, #458): a rebuild that differs from the signed tree is never staged.
# The checklist the owner follows for a release: docs/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # A change to the release path itself proves it here first (never publishing: that needs a tag).
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
      - package-lock.json
      - src/npx-engine.ts
      - src/init.ts
      - test/package-files.test.ts
      - test/release-workflow.test.ts
      - .github/release-signers
      - scripts/verify-release-tag.mjs
      - scripts/ci/npm-stage-dry-run.sh
      - test/verify-release-tag.test.ts
      - scripts/verify-release-tree.mjs
      - scripts/lib/release-tree.mjs
      - scripts/web-licenses.mjs
      - test/release-tree.test.ts
permissions:
  contents: read
env:
  # npm 11.15.0 is the first with `npm stage`; Node 22.14.0 the oldest staging supports (docs.npmjs.com/staged-publishing).
  NPM_VERSION: 11.21.0
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: a tag names package.json's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME but package.json says $v" >&2; exit 1; }
      - run: npm ci
      - name: install gitleaks (the test suite runs the secret scan)
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:web
      # After build:web, so the package tests see dist/web as it ships.
      - run: npm test
      - name: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack" --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const p = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))[0];
            const lines = [`## ${p.id}`, "", `${p.filename}: ${(p.size / 1024).toFixed(0)} KiB packed, ${(p.unpackedSize / 1024).toFixed(0)} KiB unpacked, ${p.entryCount} files`, "", "```"];
            for (const f of p.files) lines.push(`${String(f.size).padStart(9)}  ${f.path}`);
            lines.push("```");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.slice(0, 3).join("\n"));
          ' "$RUNNER_TEMP/pack.json"
      # Early, so a tree that isn't the signed one fails the build; the publish job checks the very tarball it stages.
      - name: on a tag, the tarball is the signed tree byte for byte (the rebuild reproduced it)
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-release-tree.mjs "$(ls "$RUNNER_TEMP"/pack/*.tgz)" --commit "$GITHUB_SHA"
      - name: the tarball, installed into an empty folder and run (no build, no install scripts)
        run: |
          tgz="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          t="$RUNNER_TEMP/try" && mkdir -p "$t" && cd "$t"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$tgz"
          npx worklane --version
          [ "$(npx worklane --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")" ]
          npx worklane init --help
          npx worklane init --help | grep -q '^usage: worklane init '
          test -f node_modules/@worklane/cli/dist/web/index.html
          test -f node_modules/@worklane/cli/scripts/setup/app-permissions.mjs
          if [ -e node_modules/@worklane/cli/dist/test ]; then echo "the package holds the tests" >&2; exit 1; fi
      - name: npm stage publish, a dry run (the pinned npm, as the publish job stages)
        run: |
          npm install -g "npm@${NPM_VERSION}"
          [ "$(npm --version)" = "$NPM_VERSION" ] || { echo "npm is $(npm --version), not the pinned $NPM_VERSION" >&2; exit 1; }
          bash scripts/ci/npm-stage-dry-run.sh "$(ls "$RUNNER_TEMP"/pack/*.tgz)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  npx-init:
    # `npx <the tarball> init` against a scratch repo, as someone with no checkout of the engine: npx runs it from its
    # cache, init installs the engine under the prefix and goes on from there. No GitHub: the stand-in gh and claude
    # (scripts/ci/stand-ins), as ci.yml's bootstrap job; gitleaks is missing, so init installs it (pinned, checked).
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack
      - name: npx init, local mode, twice
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: |
          tgz="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          t="$RUNNER_TEMP/npx"
          mkdir -p "$t" && cp -r examples/basic "$t/example" && git -C "$t/example" init -q
          # Its CI's check named: init finishes only with a CI chosen (#469; the refusal is add-project's job's).
          printf 'required_checks: [test]\n' >> "$t/example/.worklane/config.yaml"
          git -C "$t/example" remote add origin https://github.com/example-org/example-shop.git
          export PATH="$GITHUB_WORKSPACE/scripts/ci/stand-ins:$PATH"
          export npm_config_cache="$t/cache" WORKLANE_PREFIX="$t/prefix" WORKLANE_STATE_DIR="$t/state"
          # Not from the checkout: the scratch folder, with the engine nowhere but in the tarball.
          cd "$t"
          npx --yes --package "$tgz" -- worklane init --mode local --yes "$t/example" | tee "$t/first.log"
          grep -q "running from npx's cache" "$t/first.log"
          grep -q 'all 6 steps done or skipped' "$t/first.log"
          pkg="$t/prefix/lib/node_modules/@worklane/cli"
          test -f "$pkg/dist/src/cli.js" && test -f "$pkg/dist/src/hook-main.js" && test -f "$pkg/dist/web/index.html"
          # The hooks run the guard's own entry beside cli.js (src/install.ts HOOK_ENTRY, since #691).
          grep -q "$pkg/dist/src/hook-main.js" "$t/example/.claude/settings.json"
          if grep -q _npx "$t/example/.claude/settings.json"; then echo "the hooks call npx's cache" >&2; exit 1; fi
          "$t/prefix/bin/worklane" doctor --root "$t/example" | tee "$t/doctor.log"
          for id in tools claude github repo-config protection discord; do grep -Eq "^ok +setup $id: " "$t/doctor.log"; done
          # Again, with no --mode and no terminal: nothing reinstalled, every step done earlier.
          npx --yes --package "$tgz" -- worklane init "$t/example" < /dev/null | tee "$t/second.log"
          grep -q 'is installed at .*: handing over to it' "$t/second.log"
          grep -q 'resuming: 6 of 6 steps done earlier' "$t/second.log"

  publish:
    needs: [build, npx-init]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing and provenance: the run's OIDC token, instead of an npm token.
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      # The run's own commit, for the tag check's script; main's signers file is read from git, never from here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack
      # Before anything is staged: the tag object (checkout leaves the tag name on the bare commit) is signed by a
      # key in main's .github/release-signers and points at the commit this run built. Fails closed, naming why.
      - name: verify the release tag (SSH signature against main's release-signers; at this run's commit)
        id: verify
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          node scripts/verify-release-tag.mjs "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --signers-ref refs/remotes/origin/main
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      # The tarball to be staged, file by file against the signed commit (git blob ids, raw bytes): a file that differs
      # or isn't in it fails closed, listing each one (#458).
      - name: the tarball is the signed tree byte for byte
        id: tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node scripts/verify-release-tree.mjs "$(ls "$RUNNER_TEMP"/pack/*.tgz)" --commit "$GITHUB_SHA"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: install npm (pinned)
        run: |
          npm install -g "npm@${NPM_VERSION}"
          [ "$(npm --version)" = "$NPM_VERSION" ] || { echo "npm is $(npm --version), not the pinned $NPM_VERSION" >&2; exit 1; }
      - name: npm stage publish (with provenance, only on a verified v* tag with NPM_PUBLISH=true; otherwise a dry run)
        env:
          REAL: ${{ vars.NPM_PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/v') }}
          VERIFIED: ${{ steps.verify.outputs.commit }}
          SAME_TREE: ${{ steps.tree.outputs.commit }}
        run: |
          # npm 11.15.0 is the first with `npm stage`, and staging needs Node 22.14.0 or newer.
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>15||(b===15&&c>=0)))?0:1)' "$(npm --version)" \
            || { echo "npm $(npm --version) predates staged publishing (11.15.0)" >&2; exit 1; }
          node -e 'const [a,b,c]=process.versions.node.split(".").map(Number); process.exit(a>22||(a===22&&(b>14||(b===14&&c>=0)))?0:1)' \
            || { echo "Node $(node --version) is older than staged publishing needs (22.14.0)" >&2; exit 1; }
          tgz="$(ls "$RUNNER_TEMP"/pack/*.tgz)"
          if [ "$REAL" != true ]; then
            echo "a dry run: staging needs a v* tag and the repo variable NPM_PUBLISH=true (now: ${GITHUB_REF})"
            bash scripts/ci/npm-stage-dry-run.sh "$tgz"
            exit 0
          fi
          # Only behind the tag check, for this very commit.
          [ "$VERIFIED" = "$GITHUB_SHA" ] || { echo "the release tag check did not pass for ${GITHUB_SHA}: nothing staged" >&2; exit 1; }
          [ "$SAME_TREE" = "$GITHUB_SHA" ] || { echo "the tarball is not the signed tree at ${GITHUB_SHA}: nothing staged" >&2; exit 1; }
          # Trusted publishing only: never a token from anywhere.
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "no OIDC token for this run (id-token: write)" >&2; exit 1; }
          [ -z "${NODE_AUTH_TOKEN:-}${NPM_TOKEN:-}" ] || { echo "an npm token is set: this workflow stages through OIDC only" >&2; exit 1; }
          # Staged, not published: it goes live only when the owner approves it on npmjs.com with 2FA.
          npm stage publish "$tgz" --provenance --access public
