name: clock shift
# The unit tests on a shifted clock, once a week (#687): 45 days, then 400 days, later than today, so a test whose
# result depends on today's date fails here well before its date comes. Every Node process of the run loads
# test/clock-shift.ts through NODE_OPTIONS (test processes, and the Node processes they start), at the same shift.
# Optional: required by nothing (not the ruleset, not .worklane/config.yaml, not the updater), and no check of ci.yml
# changes. Also on a pull request that changes the shift itself or this file, and by hand.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - test/clock-shift.ts
      - .github/workflows/clock-shift.yml
concurrency:
  group: clock-shift-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  clock-shift:
    name: unit tests on a shifted clock
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # As ci.yml's test shards: some tests run gitleaks.
      - name: install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm run build
      - run: npm run build:web
      # Each run finishes and names what failed (scripts/ci/clock-shift-run.mjs, #848): every test file runs in a
      # `node --test` of its own, without --test-force-exit, so every test it registers runs. A test that hangs is
      # cancelled after 10 minutes (--test-timeout), and a file still running after 25 minutes (a hang, or a handle
      # left open after its tests) is killed and named. A step that still runs too long stops on its own, and the next
      # step runs anyway. test/clock-shift.test.ts runs these lines on fixtures.
      - name: the tests, 45 days later
        timeout-minutes: 75
        shell: bash
        env:
          CI_REQUIRE_WEB: '1'
          TEST_CLOCK_SHIFT: '+45d'
        run: NODE_OPTIONS="--import=$PWD/dist/test/clock-shift.js" node scripts/ci/clock-shift-run.mjs --test-timeout=600000 --file-timeout=1500000 dist/test
      - name: the tests, 400 days later
        if: ${{ !cancelled() }}
        timeout-minutes: 75
        shell: bash
        env:
          CI_REQUIRE_WEB: '1'
          TEST_CLOCK_SHIFT: '+400d'
        run: NODE_OPTIONS="--import=$PWD/dist/test/clock-shift.js" node scripts/ci/clock-shift-run.mjs --test-timeout=600000 --file-timeout=1500000 dist/test
