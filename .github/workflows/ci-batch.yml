name: ci batch
# The slow checks on main, in batches, and the bisect of a red batch (scripts/ci/batch.mjs has the logic): it starts
# ci-slow.yml on main's newest commit when that commit has had no batch and none is queued or running (one batch at
# a time; while one runs, newer commits wait for the look when it ends); when the newest finished batch is red, it
# runs the failing job on the first-parent commits since the last green batch, one at a time (binary search), and
# names the culprit in an issue and on its PR.
# It looks:
#   - whenever the fast checks (ci.yml) finish on a push to main, so a new main commit gets its batch without waiting
#     for the schedule: GitHub runs schedules late or not at all (once in 75 minutes, when the schedule was the only
#     start on main), and the engine updater installs only batched commits;
#   - whenever a ci-slow.yml batch or bisect run ends, so the next batch starts on main's newest commit and a bisect
#     moves on at once;
#   - every 30 minutes, as a backstop.
# Each run is short (the job never waits on a batch): its check lands on main's newest commit, and an in-progress
# check there reads as pending to the updater and to a merge.
#
# This run's own check (ci batch) lands on main's newest commit, as every scheduled and workflow_run run's does; the
# script never fails it (an error is an annotation), since the engine updater refuses a commit with any red check.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [ci slow, ci]
    types: [completed]
permissions:
  contents: read
jobs:
  batch:
    name: ci batch
    # INVARIANT: a run that a pull request's workflow run started does nothing (workflow_run can't filter by event,
    # so every PR's ci.yml and ci-slow.yml run ends here too). Only a batch or bisect run (ci-slow.yml by
    # workflow_dispatch, which only someone with write access can start) and ci.yml's run on a push to this
    # repository's default branch get past this line. Nothing from the triggering run is ever checked out or run.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.event == 'workflow_dispatch'
      || (github.event.workflow_run.name == 'ci'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == github.event.repository.default_branch
          && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # start ci-slow.yml runs
      contents: write # make and delete the ci-bisect/<sha> branches a bisect step runs on
      issues: write # the culprit's issue
      pull-requests: write # the comment on the culprit's PR
    steps:
      # main's own copy of the script, whatever started this run (never a pull request's code).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/ci/batch.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
