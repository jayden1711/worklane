name: soak
# The soak test (docs/soak.md, test/soak.test.ts): the real coordinator works for hours with stand-in agents (no
# spend, no credentials, nothing pushed anywhere but a local remote), and src/soak.ts fails the run on a leak (heap, RSS,
# open file handles), a stuck run, leaked slots, event-log or WAL growth, tick drift, or too little work.
# Never on a pull request (every PR runs the short smoke of the same test in the unit tests). Weekly, and by hand.
# Optional: required by nothing (not the ruleset, not .worklane/config.yaml, not the updater).
# GitHub-hosted runners stop a job at 6 hours, so a run here is at most 5.5 h (330 min). A continuous 8 h soak needs the
# trusted self-hosted runner, which this workflow doesn't ask for (docs/soak.md says why).
on:
  schedule:
    - cron: '41 2 * * 6'
  workflow_dispatch:
    inputs:
      hours:
        description: 'How long to soak, in hours (1 to 5.5; GitHub-hosted runners stop a job at 6 h)'
        required: false
        default: '5.5'
concurrency:
  # Per branch (R1181j N2): a dispatch from another branch never replaces main's pending scheduled run.
  group: soak-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    # The soak's own time plus the build and the report; GitHub stops a hosted job at 360 min whatever this says.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # Node's exact path, recorded right after setup-node, before any code from the checkout or a package runs: the soak
      # step runs this node, not whatever is first on PATH or under the tool cache (#1181 R1181l 1).
      - name: record node
        id: node
        shell: bash
        run: echo "path=$(command -v node)" >> "$GITHUB_OUTPUT"
      # As ci.yml's test shards: the coordinator scans each change with gitleaks. Before npm ci (only the two pinned
      # actions run before it), with no BASH_ENV (#1181 R1181l 2).
      - name: install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          BASH_ENV: ''
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          bash -p "$GITHUB_WORKSPACE/scripts/ci/fetch-pinned.sh" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}" 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$f"
          tar -xzf "$f" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # As ci.yml's shards (#746 round 20): no package script runs, and the build is the locked tsc, not an npm script.
      - run: npm ci --ignore-scripts
      - run: ${{ steps.node.outputs.path }} node_modules/typescript/bin/tsc -p tsconfig.json
      - name: soak
        shell: bash
        # Hours from the input (5.5 on the schedule), from 1 to 5.5: a longer one would be cut off by GitHub with no
        # verdict, a shorter one is no soak. The process is capped at 4 GiB of heap, so a leak fails it rather than the
        # runner. Green only on a verdict with no failure, for the hours asked: a skipped or renamed test exits 0 and
        # writes none. test/soak.test.ts pins this step's run, as written, and its keys (no if:, no continue-on-error).
        # The knobs are set here, and NODE_OPTIONS and BASH_ENV cleared, whatever an earlier step wrote to GITHUB_ENV; node
        # is setup-node's, from the tool cache, whatever an earlier step put on GITHUB_PATH (#1181 review R1181h 4). The
        # report folder is emptied first and node runs without NODE_TEST_CONTEXT (R1181j 4: that variable made node --test
        # run nothing and exit 0, and a verdict an earlier step left was then the one read). rm, awk, timeout and env are
        # called by their absolute paths, so nothing an earlier step put on GITHUB_PATH stands in for them (R1181l 1).
        env:
          HOURS: ${{ inputs.hours || '5.5' }}
          SOAK_REPORT_DIR: ${{ runner.temp }}/soak
          SOAK_SAMPLE_S: '60'
          SOAK_ISSUE_EVERY_S: '30'
          SOAK_TICK_MS: '1000'
          NODE_OPTIONS: ''
          BASH_ENV: ''
          NODE_BIN: ${{ steps.node.outputs.path }}
        run: |
          /bin/rm -rf -- "$SOAK_REPORT_DIR"
          if ! [[ "$HOURS" =~ ^[0-9]+(\.[0-9]+)?$ ]] || ! /usr/bin/awk -v h="$HOURS" 'BEGIN { exit !(h >= 1 && h <= 5.5) }'; then
            echo "hours must be a number from 1 to 5.5 (got: $HOURS): a shorter run is no soak"; exit 2
          fi
          node_bin="$NODE_BIN"
          case "$node_bin" in "$RUNNER_TOOL_CACHE"/*) ;; *) echo "node is $node_bin, not setup-node's (under $RUNNER_TOOL_CACHE)"; exit 3 ;; esac
          SOAK_HOURS="$HOURS" /usr/bin/timeout --signal=INT "$(/usr/bin/awk -v h="$HOURS" 'BEGIN { printf "%d", h * 3600 + 900 }')" \
            /usr/bin/env -u NODE_TEST_CONTEXT "$node_bin" --max-old-space-size=4096 --expose-gc --import ./dist/test/isolate.js --test --test-name-pattern='^soak: the real coordinator' dist/test/soak.test.js
          "$node_bin" -e 'const v = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (!Array.isArray(v.failures) || v.failures.length || v.asked !== Number(process.argv[2])) { console.error(`soak failed: ${JSON.stringify(v.failures)} (asked ${v.asked} h of ${process.argv[2]})`); process.exit(1); }' "$SOAK_REPORT_DIR/soak-verdict.json" "$HOURS"
      - name: report
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SOAK_REPORT_DIR: ${{ runner.temp }}/soak
        run: |
          if [ -f "$SOAK_REPORT_DIR/soak-verdict.json" ]; then
            { echo '## Soak'; echo '```json'; cat "$SOAK_REPORT_DIR/soak-verdict.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Soak: no verdict (the run ended before it wrote one)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: soak-report
          path: ${{ runner.temp }}/soak
          if-no-files-found: warn
          retention-days: 30
