# Roster. Workers build; the evaluator independently reproduces and judges. Models are aliases or full IDs.
daily_budget_usd: 40        # usage guard on estimated cost, whichever runtime is used
# Worker attempts at one issue before it is blocked (default 8). Before each retry a short read-only reflection run
# (model_routing.reflection, haiku by default) says what failed and what to change; the same failure 3 times in a
# row starts the task again in a fresh worktree on the escalated model, and 3 more blocks it.
# max_attempts: 8
# One issue's budget, all its runs together: agent run time and tokens in and out. An incident at 85% of either;
# the task is stopped at 100%. Unset: no such cap.
# budget: { task_minutes: 240, task_tokens: 50000000 }
roles:
  workers:   { enabled: true, count: 1, max: 4, model: sonnet, hard_issues_model: opus }
  evaluator: { enabled: true, model: opus }
  # PR mode: when a required check fails on a PR the harness opened, a fix run on that branch
  # (with the failing job's log; needs the App's Actions: read). Off: the owner is asked instead.
  ci_repair: { enabled: false, model: sonnet, max_fixes_per_pr: 2 }
# A change to the agents' own instructions (.claude/skills/**, AGENTS.md, roles/*.md here) is
# evaluated before it lands: its eval cases (a skill's evals/cases.md; evals/AGENTS.md and
# evals/roles/<role>.md in this folder) at the base and at the head, 3 samples per case. A role
# is also judged on its held-out cases (written from its contract by a separate agent, kept in
# the coordinator's state where no agent reads them), and that score decides. A lower score, a
# cap hit, no cases or no held-out cases: the PR waits for you, with the per-case diff. The
# judge answers yes/no per rubric item and is never the model under test (defaults: the
# workers' model under test, the evaluator's as judge).
instruction_evals: { enabled: true, cap_usd: 10, samples: 3 }
# Which model each kind of run uses, decided in code. Defaults: builds (worker, investigator, conflict fix)
# on workers.model; an issue labelled size:L, money-path, review:L3 or high-risk, or a build that already
# failed escalate_after times, on hard_issues_model (else opus); planning, research and eval answers on
# sonnet, as are the stage-label judge and decision-thread questions; intake replies and decision summaries on haiku;
# intake triage on the researcher's model (else the workers'). Override any key here; the instance's policy.yaml
# settings.model_cap caps every model at a tier.
# model_routing: { build: sonnet, build_high_risk: opus, escalate_after: 2, planner: sonnet, research: sonnet,
#                  intake_triage: sonnet, intake_replier: haiku, intake_summary: haiku, intake_thread: sonnet,
#                  stage_judge: sonnet, eval_answer: sonnet, reflection: haiku }
# Tiered evaluation, decided in code: changes at cheap_levels (L0: docs-only, tests-only, comment-only) are
# judged by cheap_model, the rest by the evaluator's model; a failed or uncertain cheap verdict is judged once
# more by the evaluator's model. An instance can override it in policy.yaml settings.eval_routing.
eval_routing: { cheap_model: sonnet, cheap_levels: [L0], escalate: true }
