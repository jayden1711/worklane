# Risk-based review levels, computed by code. The highest matching rule wins;
# a failed or uncertain evaluator verdict bumps the level up one.
version: 1
# money_path_source: { file: path/to/your/money-path-list }
levels:
  L0_auto:      { when: [docs-only, tests-only, comments, copy], max_lines: 200 }
  L1_evaluator: { when: [ui, app-non-money], max_lines: 400, max_files: 10 }
  L2_notify:    { when: [app-non-money-large, dependency, test-machinery] }
  L3_human:     { when: [money-path, migration, auth, secrets, deploy-config, release-config, harness-config, guardrail-config, deletes-data], over_lines: 800 }

# PR mode: which ready PRs the harness merges itself (a merge commit of the exact evaluated
# commit), only where the instance policy's auto_merge is on. Everything else waits for you:
# - high-risk: any L3_human category above, ci-config, and wait_categories below
#   (add your own in `categories`, e.g. { pricing: [src/billing/**] }, and list them here)
# - design-level: the evaluator's design_change flag, dependency manifests, a new top-level module
# - big: over max_lines changed lines or max_files files
# - doubt: evaluator confidence below high, an uncertain verdict, a CI fix run, someone else's
#   push to the branch, or a push limit hit
merge:
  auto: true
  max_lines: 800
  max_files: 20
  wait_categories: []
  # Categories you stopped waiting on through gradual delegation (below). L3 categories, ci-config and
  # dependency can never be listed here: the config is refused.
  loosened: []
# Every agent PR body starts with a one-paragraph intent and a risk class (docs-only / logic / protected),
# computed from the changed paths: protected is anything above that always waits for you. The worker can raise
# it, never lower it. Over max_pr_lines changed lines (lockfiles and `generated` files not counted) a change goes
# back to the worker to be split, unless it is mechanical: only renames, moves and formatting (whitespace ignored,
# the added lines are exactly the removed ones).
max_pr_lines: 600
# generated: ['**/*.min.js', '**/dist/**', ...]   # the default list; yours replaces it
# Docs-only PRs (only *.md and docs/**): the harness's merge call waits on just these of required_checks
# (e.g. [lint, scan]). Empty: no fast path. GitHub's branch protection still requires every required check:
# make the heavy jobs skip on docs-only changes with a job-level `if:` (a skipped job satisfies a required check;
# a workflow-level paths filter leaves it pending, and the merge waits).
docs_only_checks: []
# Gradual delegation, suggest-only: when a category in wait_categories has min_clean PRs in a row approved
# unchanged (none reverted, main never red after one, no later fix), you're asked whether to stop waiting on
# it, with the evidence. A loosened category that goes wrong is proposed for waiting again. Never automatic.
delegation:
  enabled: false
  min_clean: 10
