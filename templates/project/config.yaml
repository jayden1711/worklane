# Project settings. Validated at startup; unknown keys are errors.
version: 1
project:
  name: {{name}}
  repo: {{repo}}            # owner/repo on GitHub
  default_branch: main
mode: local                 # local | shared
backlog: github             # github | file
runner: local               # where agents run: local | ci | remote-machine
agent_runtime:
  kind: cli                 # cli: installed `claude` with your own auth | sdk: Agent SDK + ANTHROPIC_API_KEY
  max_concurrency: 2        # this harness's cap; the machine-wide slot cap still applies
  run_windows: []           # e.g. [{ from: "08:00", to: "23:00" }]; empty = any time
land_mode: pr               # direct (fast-forward to the default branch) | pr
# PR mode: PRs open as drafts and are marked ready (label merge-ready) once every check
# listed here passed on the exact commit the evaluator approved. Names as GitHub shows
# them, e.g. ["test", "build (ubuntu-latest)"]. Empty: nothing is ever marked ready.
required_checks: []
# Files two tasks at once would both change and conflict on: such tasks never run together (the second
# waits; other ready work takes the slot). Leave it out for the defaults (lockfiles, registries and
# changelogs, shared test helpers); [] turns holds off.
# hotspots: ["**/package-lock.json", "src/plugins/registry.ts", "test/helpers.ts"]
# PR mode: when GitHub reports one of its PRs as conflicting, the harness merges the base in, a worker
# resolves the conflicted hunks, and the usual checks and evaluator follow (it never merges a fix that
# strays outside the hunks or that the evaluator isn't sure keeps both sides; those wait for you).
# conflicts: { fix: true, max_fixes_per_pr: 1 }
# Before an auto-merge, if main moved and touched what the PR touches (or imports), the fast tier
# (tests.yaml runner.changed) runs on the combination in a scratch worktree; nothing is pushed to the PR.
# combined_check: true
# When a writer rejects a PR, revises or rejects a held plan, requests changes in a review, or corrects the
# chat (a question starting "correction:"), a read-only agent proposes the strongest durable fix (a guard in
# code > a lint/test/CI check > a skill or AGENTS.md rule > a style line) as an issue labelled `correction`,
# built into a PR you review. A repeat is grouped with the earlier fix, never proposed twice.
# corrections: { enabled: true, max_per_day: 10 }
# The gardener: every every_days days at `at` (local; it starts within 3 hours of it), one read-only run (at
# most max_usd) looks for dead code, duplicated logic, rule violations linters miss, files that keep
# conflicting, slow and flaky checks. Findings go to one "Gardener log" issue; a fix (a small cleanup or a lint
# rule) is filed only for a pattern seen 3+ times, at most max_prs per run, never in a high-risk path.
# gardener: { enabled: false, every_days: 7, at: "03:00", max_usd: 5, max_prs: 1 }
os: auto                  # auto | macos | linux | windows-wsl
owners:
  default: your-github-handle   # owns anything no area matches
  writers: [your-github-handle] # only issues opened or approved by these accounts are actionable
  areas: []
  # - { name: web, owner: someone, paths: ["web/**"], labels: [ui] }
reports:
  times: ["08:00", "18:00"]
  to: [your-github-handle]
